<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dashboard mockups</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--c:#aee3ff;--dim:#4f7ea0;--dim2:#2c4a5e;--bright:#eafaff;--accent:#8fd0ff;
        --glow:rgba(120,190,255,.32);--red:#ff3b2f;--deep:#c11208;--gold:#ffd27a;
        --amber:#ffb648;--green:#7dffb0;--panel:#0a1720;--line:#173040}
  html,body{height:100%}
  body{background:#000;color:var(--c);font-family:"IBM Plex Mono",monospace;font-size:14px;overflow:hidden}
  .scan{position:fixed;inset:0;z-index:200;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;z-index:199;pointer-events:none;box-shadow:inset 0 0 24vh 8vh rgba(0,0,0,.66)}
  .stage{position:absolute;inset:0;padding:2.4vh 2vw;overflow:hidden}
  .tag{position:fixed;left:10px;bottom:6px;z-index:300;color:#5a6b78;font-size:11px;letter-spacing:.16em}
  .hdr{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.32em;color:var(--dim);
    margin-bottom:1rem}
  .hdr b{color:var(--bright);font-weight:400}
  h1{font-family:"Major Mono Display",monospace;font-weight:400;text-transform:lowercase;letter-spacing:.04em;
    color:var(--bright);text-shadow:0 0 22px var(--glow)}
  a{color:inherit;text-decoration:none}
  .full{position:absolute;inset:0;padding:2.6vh 2.4vw;display:flex;flex-direction:column}

  /* generic reusable bits */
  .meter{height:6px;background:var(--dim2);position:relative;overflow:hidden}
  .meter i{position:absolute;inset:0;background:linear-gradient(90deg,#1a3a4d,var(--accent));box-shadow:0 0 10px var(--glow)}
  .navlist a{display:block;padding:.16rem 0;color:var(--c)}.navlist a::before{content:"> ";color:var(--dim)}
  .navlist a:hover{color:var(--bright)}

  /* ============ 1  system monitor (htop) ============ */
  .m1{display:grid;grid-template-rows:auto auto 1fr auto;gap:1rem;height:100%}
  .m1 .gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
  .m1 .g{border:1px solid var(--line);padding:.5rem .7rem;background:var(--panel)}
  .m1 .g .lab{font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .m1 .g .val{font-size:1.4rem;color:var(--bright)}
  .m1 .bars{font-size:11px;line-height:1.5;color:var(--dim)}
  .m1 .bars b{color:var(--green);font-weight:400}
  .m1 table{width:100%;border-collapse:collapse;font-size:12px}
  .m1 th{text-align:left;color:var(--dim);font-weight:400;border-bottom:1px solid var(--line);padding:.3rem 0}
  .m1 td{padding:.28rem 0;border-bottom:1px solid rgba(23,48,64,.4)}
  .m1 td.n{color:var(--accent);font-variant-numeric:tabular-nums}
  .m1 .me td{color:var(--bright)}
  .m1 .foot{display:flex;gap:1.4rem;font-size:11px;color:var(--dim)}
  .m1 .foot b{color:var(--c);font-weight:400}

  /* ============ 2  tmux tiled panes ============ */
  .m2{position:absolute;inset:2.6vh 1.4vw 1.6vh;display:flex;flex-direction:column;border:1px solid var(--accent)}
  .m2 .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:0}
  .m2 .pane{border:1px solid var(--line);position:relative;padding:1.5rem 1.1rem 1rem;overflow:hidden}
  .m2 .pane .tt{position:absolute;top:.5rem;left:.9rem;padding:0 .3rem;
    font-size:10px;letter-spacing:.2em;color:var(--accent)}
  .m2 .pane.big{grid-row:1/3}
  .m2 h1{font-size:2.6rem;line-height:1}
  .m2 .sub{color:var(--dim);margin-top:.6rem}
  .m2 .statusbar{flex:none;height:2.2vh;min-height:1.4rem;background:var(--accent);color:#02121c;
    display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;font-size:11px;letter-spacing:.1em}
  .m2 .big-pts{font-size:2rem;color:var(--bright)}
  .m2 .lb div{display:flex;justify-content:space-between;padding:.12rem 0;font-size:12px}
  .m2 .lb b{color:var(--accent);font-weight:400}

  /* ============ 3  IRC client ============ */
  .m3{display:grid;grid-template-columns:12rem 1fr 11rem;height:100%;gap:0;border:1px solid var(--line)}
  .m3 .col{border-right:1px solid var(--line);padding:.8rem;overflow:hidden}
  .m3 .col:last-child{border-right:none}
  .m3 .ch{color:var(--dim);padding:.12rem 0}.m3 .ch.on{color:var(--bright)}
  .m3 .ch.on::before{content:"# ";color:var(--accent)}.m3 .ch::before{content:"# ";color:var(--dim2)}
  .m3 .log p{margin:.18rem 0;font-size:12px;line-height:1.4}
  .m3 .log .t{color:var(--dim2)}.m3 .log .nk{color:var(--accent)}.m3 .log .sys{color:var(--gold)}
  .m3 .nick{padding:.12rem 0;color:var(--c)}.m3 .nick .op{color:var(--green)}
  .m3 .head{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:.5rem}
  .m3 .input{grid-column:2/3;border-top:1px solid var(--line);padding:.5rem .8rem;color:var(--dim)}

  /* ============ 4  mail client (mutt) ============ */
  .m4{display:grid;grid-template-columns:11rem 1fr;height:100%;border:1px solid var(--line)}
  .m4 .folders{border-right:1px solid var(--line);padding:.8rem}
  .m4 .folders div{padding:.2rem 0;color:var(--dim)}.m4 .folders .on{color:var(--bright)}
  .m4 .folders .on::before{content:"> "}.m4 .folders .ct{float:right;color:var(--accent)}
  .m4 .idx{padding:0}
  .m4 .idxhead{background:var(--accent);color:#02121c;padding:.3rem .8rem;font-size:11px;letter-spacing:.14em;
    display:grid;grid-template-columns:2rem 1fr 6rem 5rem}
  .m4 .row{padding:.3rem .8rem;display:grid;grid-template-columns:2rem 1fr 6rem 5rem;font-size:12px;
    border-bottom:1px solid rgba(23,48,64,.4);color:var(--c)}
  .m4 .row.sel{background:var(--panel);color:var(--bright)}
  .m4 .row .n{text-align:right;color:var(--accent)}
  .m4 .bar{margin-top:auto;background:var(--panel);padding:.3rem .8rem;font-size:11px;color:var(--dim)}

  /* ============ 5  file manager (mc) ============ */
  .m5{position:absolute;inset:1.6vh 1.6vw 3vh;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
  .m5 .panel{border:2px solid var(--accent);background:rgba(6,20,30,.6);padding:0;display:flex;flex-direction:column}
  .m5 .panel .tt{background:var(--accent);color:#02121c;text-align:center;font-size:11px;letter-spacing:.16em;padding:.2rem}
  .m5 .panel ul{list-style:none;padding:.5rem .8rem;flex:1}
  .m5 .panel li{padding:.18rem 0;color:var(--c)}.m5 .panel li .sz{float:right;color:var(--dim)}
  .m5 .panel li.dir{color:var(--bright)}.m5 .panel li.dir::before{content:"/"}
  .m5 .fkeys{position:absolute;left:1.6vw;right:1.6vw;bottom:.6vh;display:flex;gap:.4rem;font-size:11px}
  .m5 .fkeys span{flex:1;color:var(--dim)}.m5 .fkeys b{background:var(--accent);color:#02121c;padding:0 .3rem;font-weight:400}

  /* ============ 6  editor (vim) ============ */
  .m6{height:100%;display:flex;flex-direction:column;font-size:13px}
  .m6 .split{display:grid;grid-template-columns:1fr 1fr;flex:1;gap:0;border:1px solid var(--line)}
  .m6 .buf{border-right:1px solid var(--line);overflow:hidden}
  .m6 .buf:last-child{border-right:none}
  .m6 .ln{display:flex}.m6 .ln .no{width:2.4rem;text-align:right;padding-right:.8rem;color:var(--dim2);
    background:rgba(10,23,32,.5);flex:none}
  .m6 .ln .tx{padding-left:.8rem;color:var(--c);white-space:pre}
  .m6 .kw{color:var(--accent)}.m6 .st{color:var(--green)}.m6 .cm{color:var(--dim)}
  .m6 .bufname{background:var(--panel);color:var(--dim);font-size:10px;letter-spacing:.16em;padding:.2rem .8rem;
    border-bottom:1px solid var(--line)}
  .m6 .modeline{background:var(--accent);color:#02121c;display:flex;justify-content:space-between;
    padding:.2rem .8rem;font-size:11px;letter-spacing:.1em}
  .m6 .cmd{padding:.2rem .4rem;color:var(--c)}

  /* ============ 7  kernel log (dmesg) ============ */
  .m7{height:100%;font-size:12.5px;line-height:1.62;overflow:hidden}
  .m7 .l{white-space:pre-wrap}
  .m7 .ts{color:var(--dim2)}.m7 .ok{color:var(--green)}.m7 .k{color:var(--accent)}
  .m7 .big{color:var(--bright)}.m7 .warn{color:var(--amber)}
  .m7 .cur{display:inline-block;width:.6em;height:1em;background:var(--c);vertical-align:-.1em;
    animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ 8  status board (nagios) ============ */
  .m8{display:grid;grid-template-rows:auto auto 1fr;gap:1rem;height:100%}
  .m8 .banner{border:1px solid var(--green);color:var(--green);padding:.6rem 1rem;letter-spacing:.2em;
    display:flex;justify-content:space-between;align-items:center}
  .m8 .banner .big{font-size:1.5rem;color:var(--bright)}
  .m8 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
  .m8 .tile{border:1px solid var(--line);padding:.7rem;background:var(--panel);position:relative}
  .m8 .tile .dot{width:.6rem;height:.6rem;border-radius:50%;position:absolute;top:.7rem;right:.7rem}
  .m8 .tile.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .m8 .tile.warn{border-color:var(--amber)}.m8 .tile.warn .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .m8 .tile .k{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .m8 .tile .v{font-size:1.15rem;color:var(--bright);margin-top:.2rem}
  .m8 .tile .s{font-size:10px;color:var(--dim)}
  .m8 .lbwrap{border:1px solid var(--line);padding:.8rem 1rem;overflow:hidden}
  .m8 .lbwrap .row{display:flex;justify-content:space-between;padding:.16rem 0;border-bottom:1px solid rgba(23,48,64,.4)}
  .m8 .lbwrap .row b{color:var(--accent);font-weight:400}

  /* ============ 9  ledger / accounting ============ */
  .m9{height:100%;display:flex;flex-direction:column;font-size:13px}
  .m9 .ttl{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px double var(--dim2);
    padding-bottom:.5rem;margin-bottom:.8rem}
  .m9 .ttl h1{font-size:1.8rem}
  .m9 table{width:100%;border-collapse:collapse}
  .m9 th{text-align:left;color:var(--dim);font-weight:400;font-size:10px;letter-spacing:.16em;
    border-bottom:1px solid var(--dim2);padding:.3rem .4rem}
  .m9 td{padding:.26rem .4rem;border-bottom:1px dotted var(--line)}
  .m9 td.dr{text-align:right;color:var(--red)}.m9 td.cr{text-align:right;color:var(--green)}
  .m9 td.bal{text-align:right;color:var(--bright);font-variant-numeric:tabular-nums}
  .m9 .totrow td{border-top:2px double var(--dim2);border-bottom:none;color:var(--bright);padding-top:.5rem}
  .m9 .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
    border-top:1px solid var(--line);padding-top:.5rem}

  /* ============ 10  radar / ops ============ */
  .m10{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;
    padding:2vh 2vw}
  .m10 .side{display:flex;flex-direction:column;gap:1.1rem}
  .m10 .side.r{text-align:right}
  .m10 .read .k{font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .m10 .read .v{font-size:1.5rem;color:var(--bright)}
  .m10 .radar{aspect-ratio:1;position:relative;margin:0 auto;width:min(46vh,100%)}
  .m10 .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(143,208,255,.42),transparent 32%);animation:spin 3.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .m10 .blip{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);transform:translate(-50%,-50%)}
  .m10 .rlabel{position:absolute;transform:translate(-50%,-50%);font-size:10px;color:var(--accent);
    text-shadow:0 0 6px var(--glow)}

  /* ============ 11  cockpit / MFD ============ */
  .m11{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr auto;gap:1rem;height:100%}
  .m11 .wide{grid-column:1/-1}
  .m11 .annun{display:flex;gap:.6rem}
  .m11 .annun span{flex:1;text-align:center;border:1px solid var(--line);padding:.35rem;font-size:10px;
    letter-spacing:.14em;color:var(--dim)}
  .m11 .annun span.lit{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 12px rgba(125,255,176,.18)}
  .m11 .annun span.alert{border-color:var(--amber);color:var(--amber)}
  .m11 .gauge{border:1px solid var(--line);background:var(--panel);padding:1rem;text-align:center;position:relative;
    display:flex;flex-direction:column;justify-content:center}
  .m11 .gauge .k{font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .m11 .gauge .arc{margin:.6rem auto}
  .m11 .gauge .v{font-size:1.8rem;color:var(--bright)}
  .m11 .seg{display:flex;gap:3px;justify-content:center;margin-top:.5rem}
  .m11 .seg i{width:10px;height:16px;background:var(--dim2)}.m11 .seg i.on{background:var(--accent);box-shadow:0 0 6px var(--glow)}
  .m11 .strip{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);border-top:1px solid var(--line);
    padding-top:.5rem}.m11 .strip b{color:var(--c);font-weight:400}

  /* ============ 12  ASCII banner hero ============ */
  .m12{height:100%;display:flex;flex-direction:column;justify-content:center}
  .m12 pre{color:var(--bright);text-shadow:0 0 20px var(--glow);font-size:min(2.1vw,20px);line-height:1.05;
    letter-spacing:0}
  .m12 .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:1.6rem}
  .m12 .row .nav a{margin-right:1.3rem;color:var(--c)}.m12 .row .nav a::before{content:"[";color:var(--dim)}
  .m12 .row .nav a::after{content:"]";color:var(--dim)}
  .m12 .stat{text-align:right}.m12 .stat .p{font-size:2rem;color:var(--bright)}
  .m12 .stat .s{color:var(--dim);font-size:11px;letter-spacing:.16em}

  /* ============ 13  punch card / JCL ============ */
  .m13{position:absolute;inset:2vh 2vw;border:1px solid var(--dim2);background:
    repeating-linear-gradient(90deg,transparent 0 calc(100%/40 - 1px),rgba(23,48,64,.5) calc(100%/40 - 1px) calc(100%/40));
    padding:0}
  .m13 .holes{display:flex;justify-content:space-between;padding:.5rem 1rem;border-bottom:1px solid var(--dim2)}
  .m13 .holes i{width:10px;height:7px;background:#000;border:1px solid var(--dim2)}
  .m13 .body{padding:1.2rem 1.4rem;font-size:13px;line-height:1.7}
  .m13 .body .seq{color:var(--dim2);margin-right:1rem}
  .m13 .body .jcl{color:var(--accent)}.m13 .body .v{color:var(--bright)}
  .m13 .body .cmt{color:var(--dim)}
  .m13 .corner{position:absolute;top:0;right:0;border-width:0 22px 22px 0;border-style:solid;
    border-color:transparent #000 transparent transparent}

  /* ============ 14  framed window grid ============ */
  .m14{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:auto 1fr auto;gap:1rem;height:100%}
  .m14 .win{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .m14 .win .bar{background:var(--accent);color:#02121c;font-size:10px;letter-spacing:.16em;padding:.22rem .5rem;
    display:flex;justify-content:space-between}
  .m14 .win .bar .x{opacity:.7}
  .m14 .win .body{padding:.7rem .8rem;flex:1}
  .m14 .hero-win{grid-row:1/3}
  .m14 .hero-win h1{font-size:2.4rem;line-height:1.02}
  .m14 .hero-win .sub{color:var(--dim);margin-top:.6rem}
  .m14 .big{font-size:1.9rem;color:var(--bright)}
  .m14 .lb div{display:flex;justify-content:space-between;padding:.12rem 0;font-size:12px}.m14 .lb b{color:var(--accent);font-weight:400}
  .m14 .wide{grid-column:1/-1}

  /* ============ 15  oscilloscope / signal ============ */
  .m15{position:absolute;inset:0;padding:2.4vh 2vw;display:flex;flex-direction:column}
  .m15 .scope{flex:1;border:1px solid var(--line);position:relative;background:
    linear-gradient(rgba(23,48,64,.35) 1px,transparent 1px) 0 0/100% 2.2rem,
    linear-gradient(90deg,rgba(23,48,64,.35) 1px,transparent 1px) 0 0/2.6rem 100%,var(--panel);overflow:hidden}
  .m15 .scope svg{position:absolute;inset:0;width:100%;height:100%}
  .m15 .readout{position:absolute;top:.7rem;left:.9rem;font-size:11px;color:var(--dim);line-height:1.6}
  .m15 .readout b{color:var(--bright);font-weight:400}
  .m15 .readout .a{color:var(--accent)}
  .m15 .strip{display:flex;justify-content:space-between;margin-top:.8rem;font-size:11px;color:var(--dim)}
  .m15 .strip b{color:var(--c);font-weight:400}
</style></head>
<body>
<div class="stage" id="stage"></div><div class="vig"></div><div class="scan"></div><div class="tag" id="tag"></div>
<script>
/* ---- shared placeholder data (so every design reads as one real dashboard) -- */
const U={name:"seraph",rank:"Disciple",pts:"4,205",coins:"300",flavor:"mirror mirror on the wall."};
const CK={time:"05:34:12",date:"Thursday, July 30",tz:"EDT",reset:"0h 26m"};
const NAV=["Games","Profile","Hermione","Settings","Log out"];
// leaderboard: rank, vessel, points, online?
const LB=[["1","valentine","9,180",1],["2","noor","6,742",0],["3","seraph","4,205",1],
          ["4","ramona","3,110",1],["5","ranker","1,800",0],["6","wren","1,204",0]];
const hdr=(r)=>`<div class="hdr"><span>angelOS v0.2</span><span>${r||""}</span></div>`;
const money=(n)=>n;

/* 1 ---------------------------------------------------- system monitor */
function d1(){
  const load=[["points","65%",.65],["devotion","82%",.82],["streak","40%",.4],["focus","91%",.91]];
  return `<div class="m1">
    ${hdr("htop // vessel seraph &nbsp; uptime 0d")}
    <div class="gauges">${load.map(([k,v,f])=>`<div class="g"><div class="lab">${k.toUpperCase()}</div>
      <div class="val">${v}</div><div class="meter"><i style="width:${f*100}%"></i></div></div>`).join("")}</div>
    <div>
      <div class="bars">Load average <b>4,205</b> pts &nbsp; ${U.rank} &nbsp;|&nbsp; angelcoins <b>${U.coins}</b>
        &nbsp; clock <b>${CK.time}</b> ${CK.tz} &nbsp; reset in ${CK.reset}</div>
      <table>
        <tr><th>PID</th><th>VESSEL</th><th>RANK</th><th>PTS</th><th>STATE</th></tr>
        ${LB.map(([r,n,p,on])=>`<tr class="${n===U.name?'me':''}"><td>${1000+ +r*7}</td><td>${n}</td>
          <td>Disciple</td><td class="n">${p}</td><td>${on?'<span style="color:var(--green)">R</span>':'S'}</td></tr>`).join("")}
      </table>
    </div>
    <div class="foot"><span>F1 <b>Games</b></span><span>F2 <b>Profile</b></span><span>F3 <b>Hermione</b></span>
      <span>F9 <b>Settings</b></span><span>F10 <b>Log out</b></span></div>
  </div>`;
}

/* 2 ---------------------------------------------------- tmux tiled panes */
function d2(){
  return `<div class="m2">
    <div class="grid">
      <div class="pane big"><span class="tt">0: welcome</span>
        <h1>welcome,<br>${U.name}</h1><div class="sub">${U.flavor}</div>
        <div style="margin-top:1.4rem"><span class="big-pts">${U.pts}</span>
          <span style="color:var(--dim)"> pts &nbsp; ${U.rank}</span></div>
        <div style="color:var(--dim);margin-top:.5rem">&#10022; ${U.coins} angelcoins</div></div>
      <div class="pane"><span class="tt">1: clock</span>
        <div style="font-size:2rem;color:var(--accent)">${CK.time}</div>
        <div style="color:var(--dim)">${CK.date} ${CK.tz}<br>reset in ${CK.reset}</div></div>
      <div class="pane"><span class="tt">2: leaderboard</span>
        <div class="lb">${LB.slice(0,5).map(([r,n,p])=>`<div><span>${r} ${n}</span><b>${p}</b></div>`).join("")}</div></div>
    </div>
    <div class="statusbar"><span>[angelOS] 0:welcome 1:clock 2:board</span><span>${U.name}@angeldom.me</span></div>
  </div>`;
}

/* 3 ---------------------------------------------------- IRC client */
function d3(){
  const chans=["welcome","games","leaderboard","confession","the-wall"];
  const log=[["05:31","valentine","took the throne again. 9,180."],
    ["05:32","--","seraph has joined #welcome","sys"],
    ["05:33","noor","gm angel"],["05:33","seraph","gm"],
    ["05:34","hermione","kneel.","op"]];
  return `<div class="m3">
    <div class="col"><div class="head">CHANNELS</div>

}

/* 15 ---------------------------------------------------- oscilloscope */
function d15(){
  // a points-over-time trace
  const pts=[];
  for(let x=0;x<=100;x++){const y=50-32*Math.sin(x/9)*Math.exp(-x/140)-x*0.18;pts.push(`${x},${Math.max(4,Math.min(96,y))}`);}
  return `<div class="m15">
    ${hdr("angelOS scope // CH1 points")}
    <div class="scope">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="0.6"
          vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 3px var(--glow))"/>
      </svg>
      <div class="readout">CH1 <b>points</b> <span class="a">4,205</span><br>
        VESSEL <b>${U.name}</b> · ${U.rank}<br>
        TRIG ${CK.time} ${CK.tz}<br>RESET ${CK.reset}</div>
    </div>
    <div class="strip"><span>1: <b>Games</b></span><span>2: <b>Profile</b></span><span>3: <b>Hermione</b></span>
      <span>4: <b>Settings</b></span><span>0: <b>Log out</b></span>
      <span>✦ <b>${U.coins}</b>c</span><span>LEADER <b>valentine</b></span></div>
  </div>`;
}

const DS=[d1,d2,d3,d4,d5,d6,d7,d8,d9,d10,d11,d12,d13,d14,d15];

  "1  system monitor: gauges, a process table for the board, an F-key footer",

  "3  IRC client: channel list, message log, the leaderboard as the nick list",
  "4  mail client: folders on the left, the dashboard as a message index",
  "5  file manager: two panels, the vessel and the games dir, an F-key bar",
  "6  editor: the record and the leaderboard in split buffers, a modeline",
  "7  kernel log: the whole dashboard as a dmesg boot stream",
  "8  status board: a grid of green/amber tiles, one alert for approvals",
  "9  ledger: points as double-entry credits with a running balance",
  "10 radar: a sweeping scope, online vessels as blips, perimeter readouts",
  "11 cockpit MFD: annunciator lights, segmented gauges, a data strip",

  "13 punch card: mainframe JCL on card ruling with sprocket holes",
