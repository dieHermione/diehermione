<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slots mockups v2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--c:#aee3ff;--dim:#4f7ea0;--dim2:#2c4a5e;--bright:#eafaff;--accent:#8fd0ff;
        --glow:rgba(120,190,255,.32);--red:#ff3b2f;--gold:#ffd27a}
  html,body{height:100%}
  body{background:#000;color:var(--c);font-family:"IBM Plex Mono",monospace;font-size:14px;overflow:hidden}
  .scan{position:fixed;inset:0;z-index:200;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;z-index:199;pointer-events:none;box-shadow:inset 0 0 24vh 8vh rgba(0,0,0,.7)}
  .stage{position:absolute;inset:0;padding:3vh 3vw;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#444;font-size:10px;letter-spacing:.2em}
  .hdr{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.35em;color:var(--dim);margin-bottom:1.4rem}
</style></head>
<body>
<div class="stage" id="stage"></div><div class="vig"></div><div class="scan"></div><div class="tag" id="tag"></div>
<script>
const SYM=["✦","☾","✚","♆","☠","❦"];
const PAY=[["✦ ✦ ✦","×25"],["☾ ☾ ☾","×12"],["✚ ✚ ✚","×8"],["♆ ♆ ♆","×6"],["❦ ❦ ❦","×4"],
           ["any two","×2"],["☠ anywhere","void"]];
const BET=10, WON=250, VAULT=337;
const HIST=[["✦✦✦","+250"],["☾✚♆","−10"],["❦❦♆","+20"],["☠✦✦","void"],["✚✚☾","+20"],["♆☾❦","−10"]];

/* 1. MECHANICAL — lever on the side, coin tray at the foot */
function d1(){return `<style>
 .m{height:calc(100% - 3rem);display:flex;align-items:center;justify-content:center;gap:7rem}
 .cab{position:relative;width:520px;border:2px solid var(--c);padding:1.6rem 1.8rem 1.2rem;
   background:linear-gradient(180deg,rgba(120,190,255,.07),transparent 45%);box-shadow:0 0 50px var(--glow)}
 .cab .crown{text-align:center;font-size:10px;letter-spacing:.5em;color:var(--dim);
   border-bottom:1px solid var(--dim2);padding-bottom:.6rem;margin-bottom:1.2rem}
 .reelwin{display:flex;gap:.7rem;justify-content:center;padding:1rem;border:1px solid var(--dim2);
   background:rgba(0,0,0,.6);position:relative}
 .reelwin::after{content:"";position:absolute;left:.6rem;right:.6rem;top:50%;height:2px;
   background:var(--red);transform:translateY(-50%);box-shadow:0 0 14px rgba(255,59,47,.7)}
 .rl{width:104px;border:1px solid var(--dim2);display:flex;flex-direction:column;align-items:center;
   justify-content:center;padding:.5rem 0;gap:.1rem;background:linear-gradient(180deg,rgba(120,190,255,.05),transparent 55%)}
 .rl .s{font-size:1.9rem;color:var(--dim2);line-height:1.15}
 .rl .s.main{font-size:3.2rem;color:var(--bright);text-shadow:0 0 22px var(--glow)}
 .rl.win2{border-color:var(--red);box-shadow:0 0 24px rgba(255,59,47,.4)}
 .rl.win2 .s.main{color:#fff;text-shadow:0 0 26px rgba(255,59,47,.8)}
 .tray{margin-top:1.2rem;border:1px solid var(--dim2);border-top:none;height:52px;
   background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(120,190,255,.05));
   display:flex;align-items:center;justify-content:center;gap:.5rem;color:var(--gold);font-size:1.3rem}
 .traylbl{text-align:center;font-size:8px;letter-spacing:.3em;color:var(--dim2);margin-top:.3rem}
 /* the lever: a stalk and a ball, pulled down */
 .lever{position:absolute;right:-70px;top:32%;width:60px;height:180px}
 .lever .stalk{position:absolute;left:26px;top:44px;width:7px;height:120px;
   background:linear-gradient(180deg,#7d8b96,#3a444c);border-radius:4px}
 .lever .ball{position:absolute;left:12px;top:14px;width:36px;height:36px;border-radius:50%;
   background:radial-gradient(circle at 36% 30%,#ff8a80,var(--red) 55%,#7a1a13);
   box-shadow:0 0 26px rgba(255,59,47,.6)}
 .lever .mount{position:absolute;left:18px;bottom:0;width:24px;height:16px;background:#2b333a;border:1px solid #47525a}
 .side{width:250px;font-size:11px}
 .side h4{font-size:9px;letter-spacing:.3em;color:var(--dim);border-bottom:1px solid var(--dim2);
   padding-bottom:.35rem;margin-bottom:.5rem}
 .kv{display:flex;justify-content:space-between;padding:.16rem 0;color:var(--dim)}
 .kv b{color:var(--bright);font-weight:400}.kv.win b{color:var(--gold)}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS</span><span>PAYS ANGELCOINS</span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="m">
  <div class="cab">
   <div class="crown">THE MACHINE</div>
   <div class="reelwin">
    ${[0,1,2].map(()=>`<div class="rl win2"><div class="s">♆</div><div class="s main">✦</div><div class="s">☾</div></div>`).join("")}
   </div>
   <div class="tray">&#10022; &#10022; &#10022; &#10022; &#10022;</div>
   <div class="traylbl">PAYOUT TRAY</div>
   <div class="lever"><div class="ball"></div><div class="stalk"></div><div class="mount"></div></div>
  </div>
  <div class="side">
   <h4>PAY TABLE</h4>
   ${PAY.map(([a,b])=>`<div class="kv ${b==="×25"?"win":""}"><span>${a}</span><b>${b}</b></div>`).join("")}
   <h4 style="margin-top:.8rem">THIS PULL</h4>
   <div class="kv"><span>bet</span><b>${BET} &#10022;</b></div>
   <div class="kv win"><span>paid</span><b>+${WON} &#10022;</b></div>
  </div>
 </div>`;}

/* 2. VERTICAL COLUMN — reels stacked, read top to bottom */
function d2(){return `<style>
 .v{height:calc(100% - 3rem);display:flex;align-items:center;justify-content:center;gap:3.4rem}
 .col{width:210px;border:2px solid var(--c);box-shadow:0 0 40px var(--glow);background:rgba(0,0,0,.7)}
 .cell{height:118px;display:flex;align-items:center;justify-content:center;gap:1.4rem;
   border-bottom:1px solid var(--dim2);position:relative}
 .cell:last-child{border-bottom:none}
 .cell .s{font-size:3.4rem;color:var(--bright);text-shadow:0 0 24px var(--glow);line-height:1}
 .cell.hit{background:rgba(255,59,47,.1)}
 .cell.hit .s{color:#fff;text-shadow:0 0 26px rgba(255,59,47,.8)}
 .cell .idx{position:absolute;left:.6rem;top:.5rem;font-size:8px;letter-spacing:.24em;color:var(--dim2)}
 .cell .gh{font-size:1.4rem;color:var(--dim2);opacity:.5}
 .payline{position:absolute;left:-14px;right:-14px;top:50%;height:2px;background:var(--red);
   transform:translateY(-50%);box-shadow:0 0 14px rgba(255,59,47,.7)}
 .side2{width:280px}
 .side2 .big{font-size:3rem;color:var(--gold);line-height:1;text-shadow:0 0 26px rgba(255,210,122,.5)}
 .side2 .k{font-size:9px;letter-spacing:.34em;color:var(--dim);margin-top:.3rem}
 .side2 h4{font-size:9px;letter-spacing:.3em;color:var(--dim);border-bottom:1px solid var(--dim2);
   padding-bottom:.35rem;margin:1.2rem 0 .5rem}
 .kv{display:flex;justify-content:space-between;font-size:11px;padding:.16rem 0;color:var(--dim)}
 .kv b{color:var(--bright);font-weight:400}
 .pull{border:1.5px solid var(--c);text-align:center;padding:.8rem;letter-spacing:.34em;
   text-transform:uppercase;color:var(--bright);margin-top:1.2rem;box-shadow:0 0 20px var(--glow)}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS &mdash; COLUMN</span><span>PAYS ANGELCOINS</span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="v">
  <div class="col" style="position:relative">
   ${[0,1,2].map(i=>`<div class="cell hit"><span class="idx">REEL ${i+1}</span>
     <span class="gh">♆</span><span class="s">✦</span><span class="gh">☾</span></div>`).join("")}
   <div class="payline" style="top:50%"></div>
  </div>
  <div class="side2">
   <div class="big">+${WON} &#10022;</div><div class="k">THREE OF A KIND</div>
   <h4>PAY TABLE</h4>
   ${PAY.map(([a,b])=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`).join("")}
   <div class="pull">pull &middot; ${BET} &#10022;</div>
  </div>
 </div>`;}

/* 3. SPLIT FLAP — reels as flip-board characters */
function d3(){
 const flap=(ch,hit)=>`<span class="fl ${hit?"hit":""}"><i>${ch}</i></span>`;
 return `<style>
 .sf{height:calc(100% - 3rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem}
 .rack{display:flex;gap:1rem;padding:1.4rem 1.8rem;border:1px solid var(--dim2);background:rgba(0,0,0,.6)}
 .fl{display:block}
 .fl i{display:grid;place-items:center;width:120px;height:150px;font-style:normal;font-size:4.4rem;
   background:linear-gradient(180deg,#16202a 0 49%,#0c141b 49% 100%);border:1px solid var(--dim2);
   color:var(--bright);position:relative;box-shadow:inset 0 -1px 0 rgba(0,0,0,.9)}
 .fl i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.85)}
 .fl.hit i{border-color:var(--red);color:#fff;box-shadow:0 0 26px rgba(255,59,47,.4),inset 0 -1px 0 rgba(0,0,0,.9)}
 .lbls{display:flex;gap:1rem;font-size:8px;letter-spacing:.26em;color:var(--dim2)}
 .lbls span{width:120px;text-align:center}
 .row3{display:flex;gap:3rem;align-items:center}
 .pay{text-align:center}.pay .n{font-size:2.8rem;color:var(--gold);line-height:1}
 .pay .k{font-size:9px;letter-spacing:.34em;color:var(--dim);margin-top:.3rem}
 .tbl{display:flex;gap:1.4rem;font-size:10px;color:var(--dim);letter-spacing:.1em}
 .tbl b{color:var(--bright);font-weight:400}
 .go{border:1.5px solid var(--c);padding:.7rem 2.4rem;letter-spacing:.34em;text-transform:uppercase;color:var(--bright)}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS &mdash; SPLIT FLAP</span><span>PAYS ANGELCOINS</span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="sf">
  <div class="rack">${[0,1,2].map(()=>flap("✦",true)).join("")}</div>
  <div class="lbls"><span>REEL 1</span><span>REEL 2</span><span>REEL 3</span></div>
  <div class="tbl">${PAY.slice(0,5).map(([a,b])=>`<span>${a} <b>${b}</b></span>`).join("")}</div>
  <div class="row3">
   <div class="pay"><div class="n">${BET} &#10022;</div><div class="k">STAKED</div></div>
   <div class="go">pull</div>
   <div class="pay"><div class="n">+${WON} &#10022;</div><div class="k">RETURNED</div></div>
  </div>
 </div>`;}

/* 4. STRIP — horizontal, in the same language as the chosen wheel */
function d4(){
 const strip=(c)=>{const o=[];for(let i=0;i<9;i++)o.push(SYM[(c+i-4+SYM.length*3)%SYM.length]);return o;};
 return `<style>
 .st{height:calc(100% - 3rem);display:flex;flex-direction:column;justify-content:center;gap:1.4rem}
 .lane{position:relative;border-top:1px solid var(--dim2);border-bottom:1px solid var(--dim2);
   padding:.9rem 0;overflow:hidden}
 .lane .lbl{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:8px;
   letter-spacing:.26em;color:var(--dim2);background:#000;padding-right:.8rem;z-index:4}
 .cells{display:flex;align-items:center;justify-content:center;gap:0}
 .cell4{min-width:118px;text-align:center;font-size:2.6rem;color:var(--dim2);
   border-right:1px solid rgba(120,190,255,.1);padding:.3rem 0}
 .cell4.b1{filter:blur(2px);opacity:.5}.cell4.b2{filter:blur(4.5px);opacity:.3}
 .cell4.hit{color:var(--bright);font-size:3.6rem;text-shadow:0 0 28px var(--glow)}
 .marker{position:absolute;left:50%;top:0;bottom:0;width:120px;transform:translateX(-50%);
   border-left:2px solid var(--red);border-right:2px solid var(--red);
   box-shadow:0 0 26px rgba(255,59,47,.3);pointer-events:none}
 .fade{position:absolute;top:0;bottom:0;width:20%;z-index:3}
 .fade.l{left:0;background:linear-gradient(90deg,#000,transparent)}
 .fade.r{right:0;background:linear-gradient(270deg,#000,transparent)}
 .foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2rem;margin-top:.6rem}
 .odds{font-size:10px;line-height:1.9;color:var(--dim)}.odds b{color:var(--bright);font-weight:400}
 .pay{text-align:center}.pay .n{font-size:3rem;color:var(--gold);line-height:1;text-shadow:0 0 24px rgba(255,210,122,.4)}
 .pay .k{font-size:9px;letter-spacing:.36em;color:var(--dim);margin-top:.3rem}
 .go{border:1.5px solid var(--c);text-align:center;padding:.8rem;letter-spacing:.34em;
   text-transform:uppercase;color:var(--bright);box-shadow:0 0 20px var(--glow)}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS &mdash; STRIP</span><span>PAYS ANGELCOINS</span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="st">
  ${[0,1,2].map(r=>`<div class="lane"><span class="lbl">R${r+1}</span>
    <div class="cells">${strip(0).map((s,i)=>{const d=Math.abs(i-4);
      return `<span class="cell4 ${d===0?"hit":d<2?"":d<3?"b1":"b2"}">${s}</span>`;}).join("")}</div>
    <div class="fade l"></div><div class="fade r"></div><div class="marker"></div></div>`).join("")}
  <div class="foot">
   <div class="odds">${PAY.slice(0,4).map(([a,b])=>`${a} <b>${b}</b>`).join("<br>")}</div>
   <div class="pay"><div class="n">+${WON} &#10022;</div><div class="k">THREE OF A KIND</div></div>
   <div class="go">pull &middot; ${BET} &#10022;</div>
  </div>
 </div>`;}

/* 5. DRUMS — mechanical barrels with a paper readout */
function d5(){return `<style>
 .dr{height:calc(100% - 3rem);display:grid;grid-template-columns:1fr 300px;gap:2.4rem;align-items:center}
 .frame{border:2px solid var(--dim2);padding:1.6rem;background:rgba(0,0,0,.6)}
 .barrels{display:flex;gap:1.2rem;justify-content:center;perspective:700px}
 .barrel{width:130px;height:190px;position:relative;transform-style:preserve-3d}
 .barrel .face{position:absolute;inset:0;border:1px solid var(--dim2);
   background:linear-gradient(180deg,#0a1219 0%,#16222d 22%,#1d2c39 50%,#16222d 78%,#0a1219 100%);
   display:grid;place-items:center;font-size:3.4rem;color:var(--bright);text-shadow:0 0 22px var(--glow)}
 .barrel.hit .face{border-color:var(--red);color:#fff;box-shadow:0 0 26px rgba(255,59,47,.35)}
 .barrel .ring{position:absolute;left:-4px;right:-4px;height:6px;background:#2a333c;border:1px solid #3d4954}
 .barrel .ring.t{top:-3px}.barrel .ring.b{bottom:-3px}
 .shaft{height:8px;background:linear-gradient(180deg,#39434c,#161c22);margin:1.2rem 2rem 0;border-radius:4px}
 .readout{border:1px solid var(--dim2);padding:1rem;background:rgba(120,190,255,.03);font-size:11px;line-height:2}
 .readout .l{display:flex;justify-content:space-between;color:var(--dim);border-bottom:1px dotted var(--dim2)}
 .readout .l b{color:var(--bright);font-weight:400}
 .readout .l.win b{color:var(--gold)}
 .readout h4{font-size:9px;letter-spacing:.3em;color:var(--dim);margin-bottom:.4rem}
 .lvr{border:1.5px solid var(--c);text-align:center;padding:.8rem;letter-spacing:.34em;
   text-transform:uppercase;color:var(--bright);margin-top:1rem}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS &mdash; DRUMS</span><span>PAYS ANGELCOINS</span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="dr">
  <div class="frame">
   <div class="barrels">${[0,1,2].map(()=>`<div class="barrel hit">
     <div class="ring t"></div><div class="face">✦</div><div class="ring b"></div></div>`).join("")}</div>
   <div class="shaft"></div>
  </div>
  <div>
   <div class="readout">
    <h4>READOUT</h4>
    <div class="l"><span>stake</span><b>${BET} &#10022;</b></div>
    <div class="l"><span>result</span><b>✦ ✦ ✦</b></div>
    <div class="l"><span>multiplier</span><b>×25</b></div>
    <div class="l win"><span>paid</span><b>+${WON} &#10022;</b></div>
    <div class="l"><span>vault</span><b>${VAULT} &#10022;</b></div>
    <h4 style="margin-top:.8rem">LAST SIX</h4>
    ${HIST.map(([a,b])=>`<div class="l"><span>${a}</span><b>${b}</b></div>`).join("")}
   </div>
   <div class="lvr">pull</div>
  </div>
 </div>`;}

/* 6. VOID — three glyphs, almost no chrome */
function d6(){return `<style>
 .vd{height:calc(100% - 3rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6rem;
   background:radial-gradient(45% 45% at 50% 45%,rgba(255,210,122,.06),transparent 70%)}
 .three{display:flex;gap:5rem;align-items:center}
 .three .s{font-size:8rem;line-height:1;color:var(--bright);text-shadow:0 0 50px var(--glow)}
 .three .s.hit{color:var(--gold);text-shadow:0 0 60px rgba(255,210,122,.7)}
 .rule{width:min(620px,70%);height:1px;background:linear-gradient(90deg,transparent,var(--dim2),transparent)}
 .won{font-size:2.4rem;color:var(--gold);text-shadow:0 0 26px rgba(255,210,122,.5)}
 .meta{display:flex;gap:3rem;font-size:9px;letter-spacing:.34em;color:var(--dim)}
 .meta b{color:var(--bright);font-weight:400}
 .go6{font-size:10px;letter-spacing:.4em;color:var(--dim);border-bottom:1px solid var(--dim2);padding-bottom:.3rem}
 </style>
 <div class="hdr"><span>ANGELDOM // SLOTS</span><span></span><span>VAULT ${VAULT} &#10022;</span></div>
 <div class="vd">
  <div class="three"><span class="s hit">✦</span><span class="s hit">✦</span><span class="s hit">✦</span></div>
  <div class="rule"></div>
  <div class="won">+${WON} &#10022;</div>
  <div class="meta"><span>STAKE <b>${BET} &#10022;</b></span><span>MULTIPLIER <b>×25</b></span>
    <span>VAULT <b>${VAULT + WON} &#10022;</b></span></div>
  <div class="go6">PULL</div>
 </div>`;}

const DS=[d1,d2,d3,d4,d5,d6];
const NM=["1 · mechanical + lever","2 · vertical column","3 · split flap","4 · strip","5 · drums","6 · void"];
const n=Math.min(6,Math.max(1,parseInt(new URLSearchParams(location.search).get("d")||"1",10)));
document.getElementById("stage").innerHTML=DS[n-1]();
document.getElementById("tag").textContent=NM[n-1];
</script></body></html>
