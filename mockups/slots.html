<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slots mockups v3</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Third attempt, terminal restriction lifted. Six machines rather than six
     dark panels. Symbols are still placeholder glyphs; custom art comes later,
     so each design also has to show what it will look like with art dropped in.
     The currency is angelcoins throughout. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px}
  .stage{position:absolute;inset:0;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#888;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;mix-blend-mode:difference}
</style></head>
<body>
<div class="stage" id="stage"></div><div class="tag" id="tag"></div>
<script>
const SYM = ["✦","☾","✚","❖","♛","♣"];
/* the reels as they landed: middle row is the payline, and it hit three moons */
const REELS = [["✦","☾","❖"],["♛","☾","✚"],["✚","☾","♣"]];
const REELS5 = [["✦","☾","❖"],["♛","☾","✚"],["✚","☾","♣"],["❖","☾","✦"],["♣","♛","☾"]];
const PAY = [["✦ ✦ ✦","250"],["☾ ☾ ☾","120"],["✚ ✚ ✚","80"],["❖ ❖ ❖","60"],
             ["♛ ♛ ♛","40"],["♣ ♣ ♣","25"],["any two","6"]];
const BAL = "1,284", BET = "10", WIN = "120";

/* One reel bank, restyled per design. `o` sets the window colours, the symbol
   colour, the size, and how many reels. */
function reels(o){
  const set = (o.count === 5 ? REELS5 : REELS);
  return `<div class="rk" style="--w:${o.w||118}px;--h:${o.h||96}px;--face:${o.face};
      --edge:${o.edge};--sym:${o.sym};--hit:${o.hit}">
    ${set.map((col, i) => `<div class="reel">
      ${col.map((s, r) => `<div class="cell${r === 1 ? " pay" : ""}">${s}</div>`).join("")}
    </div>`).join("")}
  </div>`;
}
const REEL_CSS = `
 .rk{display:flex;gap:10px}
 .reel{display:flex;flex-direction:column;background:var(--face);
   box-shadow:inset 0 14px 22px -8px rgba(0,0,0,.55),inset 0 -14px 22px -8px rgba(0,0,0,.55)}
 .cell{width:var(--w);height:var(--h);display:grid;place-items:center;
   font-size:calc(var(--h) * .5);color:var(--sym);line-height:1;
   border-bottom:1px solid var(--edge)}
 .cell:last-child{border-bottom:none}
 .cell.pay{color:var(--hit);text-shadow:0 0 18px currentColor}`;

/* ============================================================
   1. VEGAS CABINET. Chrome, cherry red, a marquee of bulbs and
   a real lever down the right side.
   ============================================================ */
function d1(){return `<style>${REEL_CSS}
 .g1{position:absolute;inset:0;display:grid;place-items:center;
   background:radial-gradient(70% 70% at 50% 30%,#3a1016,#170609 60%,#080304)}
 .cab{position:relative;width:min(760px,66vw);padding:0 0 22px;
   background:linear-gradient(180deg,#c9161f,#8d0d16 40%,#5c070d);
   border-radius:34px 34px 14px 14px;
   box-shadow:0 40px 90px rgba(0,0,0,.9),inset 0 2px 0 rgba(255,180,180,.5),
     inset 0 -8px 20px rgba(0,0,0,.6)}
 .cab .marquee{position:relative;padding:1.4rem 2rem 1.1rem;text-align:center;
   border-radius:34px 34px 0 0;background:linear-gradient(180deg,#ffd24a,#e0a015 60%,#b57a06)}
 .cab .marquee h1{font-family:"Bebas Neue",sans-serif;font-size:3.2rem;letter-spacing:.14em;
   color:#7c0a12;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.5)}
 .cab .marquee .sub{font-size:9px;font-weight:700;letter-spacing:.44em;color:#8d6a08;
   text-transform:uppercase;margin-top:.2rem}
 /* a ring of bulbs around the marquee */
 .bulbs{position:absolute;inset:8px;border-radius:28px 28px 0 0;pointer-events:none}
 .bulbs i{position:absolute;width:11px;height:11px;border-radius:50%;
   background:radial-gradient(circle at 35% 32%,#fffbe6,#ffd84a 55%,#c58f06);
   box-shadow:0 0 12px rgba(255,220,90,.9)}
 .cab .chrome{height:14px;margin:0 20px;border-radius:0 0 8px 8px;
   background:linear-gradient(180deg,#f4f6f8,#aeb5bc 45%,#6f767d)}
 /* the glass hugs the reels; a fixed margin left black dead space either side */
 .cab .glass{width:fit-content;margin:20px auto 0;padding:18px;border-radius:10px;background:#0a0709;
   box-shadow:inset 0 0 0 4px #d9a017,inset 0 0 34px rgba(0,0,0,.9)}
 .cab .rowline{display:flex;justify-content:center}
 .cab .meters{display:flex;justify-content:space-between;margin:18px 26px 0;gap:12px}
 .meter{flex:1;padding:.6rem .8rem;border-radius:6px;background:#170608;
   box-shadow:inset 0 0 0 2px #d9a017;text-align:center}
 .meter .k{font-size:8px;font-weight:700;letter-spacing:.3em;color:#d9a017;text-transform:uppercase}
 .meter .v{font-family:"Bebas Neue",sans-serif;font-size:2rem;letter-spacing:.06em;color:#ffe07a;line-height:1.1;
   text-shadow:0 0 16px rgba(255,200,60,.7)}
 .cab .spin{display:block;margin:16px auto 0;padding:.85rem 3.4rem;border:none;border-radius:999px;
   font-family:"Bebas Neue",sans-serif;font-size:1.7rem;letter-spacing:.2em;cursor:pointer;
   background:linear-gradient(180deg,#fff0a8,#e8b41c 45%,#a97a05);color:#5c070d;
   box-shadow:0 6px 0 #6d4a03,0 12px 24px rgba(0,0,0,.7)}
 /* the lever, hanging off the right cheek of the cabinet */
 .lever{position:absolute;right:-46px;top:210px}
 .lever .rod{width:11px;height:150px;margin:0 auto;border-radius:6px;
   background:linear-gradient(90deg,#6f767d,#f4f6f8 40%,#8a9199)}
 .lever .ball{width:44px;height:44px;border-radius:50%;margin:-6px auto 0;
   background:radial-gradient(circle at 34% 30%,#ff9a9a,#d31824 50%,#6d060d);
   box-shadow:0 8px 18px rgba(0,0,0,.8)}
 .lever .mount{width:30px;height:22px;border-radius:6px;margin:-4px auto 0;
   background:linear-gradient(180deg,#aeb5bc,#5c6268)}
 </style>
 <div class="g1"><div class="cab">
  <div class="marquee"><div class="bulbs">${Array.from({length:26},(_,i)=>{
    const t=i/25; const x=t*100;
    return `<i style="left:${x}%;top:${x<6||x>94?"50%":"-2px"}"></i>`;}).join("")}</div>
   <h1>ANGELDOM</h1><div class="sub">three reels &middot; one payline</div></div>
  <div class="chrome"></div>
  <div class="glass"><div class="rowline">${reels({face:"#f6f1e4",edge:"#ccc2a8",sym:"#3a2d18",hit:"#c9161f",w:132,h:104})}</div></div>
  <div class="meters">
   <div class="meter"><div class="k">Angelcoins</div><div class="v">${BAL}</div></div>
   <div class="meter"><div class="k">Bet</div><div class="v">${BET}</div></div>
   <div class="meter"><div class="k">Win</div><div class="v">${WIN}</div></div>
  </div>
  <button class="spin">SPIN</button>
  <div class="lever"><div class="ball"></div><div class="rod"></div><div class="mount"></div></div>
 </div></div>`;}

/* ============================================================
   2. ANTIQUE FRUIT MACHINE. Cast iron and enamel on a wooden
   counter, brass fittings, hand-painted paytable.
   ============================================================ */
function d2(){return `<style>${REEL_CSS}
 .g2{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
   gap:2.6rem;padding:4vh 5vw;color:#f2e6cd;font-family:"Playfair Display",serif;
   background:radial-gradient(70% 70% at 50% 40%,#4a3520,#241708 60%,#100a04)}
 .iron{position:relative;padding:22px 20px 26px;border-radius:80px 80px 10px 10px;
   background:linear-gradient(170deg,#3d4348,#20252a 45%,#31373c);
   box-shadow:0 40px 80px rgba(0,0,0,.9),inset 0 3px 0 rgba(190,205,215,.35),
     inset 0 -8px 20px rgba(0,0,0,.7)}
 .iron::before{content:"";position:absolute;inset:11px;border-radius:70px 70px 6px 6px;
   border:2px solid rgba(200,165,90,.5)}
 .iron .crest{text-align:center;font-family:Cinzel,serif;font-size:1.35rem;letter-spacing:.14em;
   color:#e2c179;margin-bottom:.9rem;text-shadow:0 1px 0 #000}
 .iron .window{position:relative;padding:12px;border-radius:6px;background:#1a1109;
   box-shadow:inset 0 0 0 4px #a5822f,inset 0 0 30px rgba(0,0,0,.9)}
 /* the payline crosses the middle row: 12px padding + one 92px cell + half of the next */
 .iron .payline{position:absolute;left:6px;right:6px;top:150px;height:2px;background:#c9302c;opacity:.85}
 .iron .coinslot{width:78px;height:9px;border-radius:5px;margin:16px auto 0;background:#0b0906;
   box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(200,165,90,.5)}
 .iron .tray{margin:14px 14px 0;height:34px;border-radius:4px;
   background:linear-gradient(180deg,#0d0b08,#241a0d);box-shadow:inset 0 5px 12px rgba(0,0,0,.9)}
 .g2 .plate{padding:1.3rem 1.4rem;background:linear-gradient(170deg,#f5ead0,#d9c69c);
   color:#3a2c14;box-shadow:0 14px 34px rgba(0,0,0,.6),inset 0 0 0 2px #a5822f}
 .g2 .plate h3{font-family:Cinzel,serif;font-size:1rem;letter-spacing:.2em;text-align:center;
   border-bottom:1px solid #a5822f;padding-bottom:.4rem;margin-bottom:.6rem}
 .g2 .plate .r{display:flex;justify-content:space-between;font-size:1.05rem;padding:.18rem 0}
 .g2 .plate .r b{font-weight:700}
 .g2 .big{font-family:Cinzel,serif;font-size:2.4rem;color:#e2c179;line-height:1.1}
 .g2 .lbl{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
   color:#a2917a;margin-top:1.2rem}
 .g2 .pull{margin-top:1.4rem;padding:.75rem 2rem;border:2px solid #a5822f;background:transparent;
   color:#f2e6cd;font-family:Cinzel,serif;font-size:1rem;letter-spacing:.24em;cursor:pointer}
 .g2 .pull:hover{background:rgba(200,165,90,.16)}
 </style>
 <div class="g2">
  <div>
   <div class="lbl">Credit</div><div class="big">${BAL} angelcoins</div>
   <div class="lbl">Stake</div><div class="big">${BET}</div>
   <div class="lbl">Last pay</div><div class="big" style="color:#f0d9a0">${WIN}</div>
   <button class="pull">PULL</button>
  </div>
  <div class="iron">
   <div class="crest">FORTUNA MACHINA</div>
   <div class="window">${reels({face:"#efe4c9",edge:"#c3b48d",sym:"#332512",hit:"#a5251f",w:112,h:92})}
     <div class="payline"></div></div>
   <div class="coinslot"></div><div class="tray"></div>
  </div>
  <div class="plate"><h3>AWARDS</h3>
   ${PAY.map(([c,v])=>`<div class="r"><span>${c}</span><b>${v}</b></div>`).join("")}
   <div class="r" style="border-top:1px solid #a5822f;margin-top:.4rem;padding-top:.4rem">
     <span>per coin staked</span><b>&times;1</b></div></div>
 </div>`;}

/* ============================================================
   3. PACHISLOT. Loud, bright, packed: LED trim, a jackpot
   ladder, chunky rubber buttons under each reel.
   ============================================================ */
function d3(){return `<style>${REEL_CSS}
 .g3{position:absolute;inset:0;padding:3vh 3vw;color:#fff;
   display:grid;grid-template-columns:230px auto 230px;gap:1.4rem;align-items:center;
   justify-content:center;
   background:linear-gradient(180deg,#1b0736,#3d0a5e 45%,#7a0f6a)}
 .g3::before{content:"";position:absolute;inset:0;pointer-events:none;
   background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,255,255,.05) 0 6deg,transparent 6deg 12deg)}
 .g3 > *{position:relative;z-index:2}
 .g3 .cabinet{padding:16px;border-radius:18px;
   background:linear-gradient(180deg,#ffd93b,#ff8a1e 40%,#e5145f);
   box-shadow:0 0 0 6px #12052a,0 0 60px rgba(255,120,200,.5),0 30px 60px rgba(0,0,0,.8)}
 .g3 .topper{text-align:center;font-family:"Bebas Neue",sans-serif;font-size:2.6rem;letter-spacing:.1em;
   color:#12052a;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.6)}
 .g3 .toppersub{text-align:center;font-size:9px;font-weight:800;letter-spacing:.34em;
   color:#5c1a06;text-transform:uppercase;margin:.1rem 0 .7rem}
 .g3 .rk{justify-content:center}
 .g3 .win{padding:12px;border-radius:10px;background:#0b0320;
   box-shadow:inset 0 0 0 3px #ffd93b,inset 0 0 30px rgba(0,0,0,.9)}
 .g3 .btns{display:flex;gap:10px;margin-top:12px}
 .g3 .btns button{flex:1;height:44px;border:none;border-radius:8px;cursor:pointer;
   font-family:"Bebas Neue",sans-serif;font-size:1.3rem;letter-spacing:.14em;color:#12052a;
   background:linear-gradient(180deg,#8ef7ff,#22b7d6);box-shadow:0 5px 0 #10627a}
 .g3 .btns button:nth-child(2){background:linear-gradient(180deg,#ffe98e,#f0b41c);box-shadow:0 5px 0 #8a6205}
 .g3 .btns button:nth-child(3){background:linear-gradient(180deg,#ffb0d8,#e5145f);box-shadow:0 5px 0 #7a082f;color:#fff}
 .g3 .side{padding:1rem;border-radius:14px;background:rgba(10,2,28,.72);
   box-shadow:inset 0 0 0 2px rgba(255,217,59,.55)}
 .g3 .side h3{font-family:"Bebas Neue",sans-serif;font-size:1.4rem;letter-spacing:.12em;
   color:#ffd93b;text-align:center;margin-bottom:.5rem}
 .g3 .r{display:flex;justify-content:space-between;font-size:12px;font-weight:600;padding:.24rem 0;
   border-bottom:1px dashed rgba(255,217,59,.3)}
 .g3 .r b{color:#8ef7ff}
 .g3 .ladder{display:flex;flex-direction:column-reverse;gap:5px;margin-top:.6rem}
 .g3 .rung{padding:.3rem .5rem;border-radius:5px;font-size:11px;font-weight:800;
   background:rgba(255,255,255,.09);display:flex;justify-content:space-between}
 .g3 .rung.on{background:linear-gradient(90deg,#ffd93b,#ff6b9d);color:#12052a;
   box-shadow:0 0 18px rgba(255,180,80,.75)}
 .g3 .huge{font-family:"Bebas Neue",sans-serif;font-size:3.4rem;line-height:1;color:#ffd93b;
   text-align:center;text-shadow:0 0 22px rgba(255,200,60,.9)}
 .g3 .hk{font-size:9px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;
   text-align:center;color:#ffb0d8}
 </style>
 <div class="g3">
  <div class="side"><h3>PAYS</h3>
   ${PAY.map(([c,v])=>`<div class="r"><span>${c}</span><b>${v}</b></div>`).join("")}</div>
  <div class="cabinet">
   <div class="topper">FORTUNE ANGEL</div><div class="toppersub">777 &middot; big bonus rush</div>
   <div class="win">${reels({face:"#fffdf2",edge:"#d8cfae",sym:"#2b0b3f",hit:"#e5145f",w:124,h:100})}</div>
   <div class="btns"><button>STOP 1</button><button>STOP 2</button><button>STOP 3</button></div>
  </div>
  <div class="side">
   <div class="hk">Angelcoins</div><div class="huge">${BAL}</div>
   <div class="hk" style="margin-top:.6rem">Bet ${BET} &middot; Won ${WIN}</div>
   <h3 style="margin-top:.8rem">BONUS</h3>
   <div class="ladder">
    <div class="rung"><span>GRAND</span><span>5000</span></div>
    <div class="rung"><span>MAJOR</span><span>1500</span></div>
    <div class="rung on"><span>MINOR</span><span>400</span></div>
    <div class="rung"><span>MINI</span><span>120</span></div>
   </div>
  </div>
 </div>`;}

/* ============================================================
   4. CIRRUS. The site's own sky theme: glass, clouds, Quicksand.
   A slot machine that looks like weather.
   ============================================================ */
function d4(){return `<style>${REEL_CSS}
 .g4{position:absolute;inset:0;padding:4vh 4vw;font-family:Quicksand,sans-serif;color:#0d4a63;
   display:grid;place-items:center;background:linear-gradient(180deg,#8fd8f2,#63bde3 62%,#52aed8)}
 .cl{position:absolute;border-radius:50%;filter:blur(6px);pointer-events:none;
   background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,0) 72%)}
 .g4 .card{position:relative;z-index:2;width:min(880px,80vw);padding:2rem 2.2rem 1.8rem;
   border-radius:28px;background:rgba(255,255,255,.84);
   box-shadow:0 24px 70px rgba(10,70,100,.35)}
 .g4 h1{font-size:2.4rem;font-weight:700;text-align:center;line-height:1}
 .g4 .sub{text-align:center;font-size:.85rem;font-weight:600;color:#3f8fb0;margin-bottom:1.3rem}
 /* the well hugs the reels, or the empty side reads as a missing reel */
 .g4 .win{width:fit-content;margin:0 auto;display:flex;padding:14px;border-radius:20px;
   background:linear-gradient(180deg,#eaf8ff,#cdeafa);
   box-shadow:inset 0 3px 10px rgba(20,90,120,.2)}
 .g4 .rk{gap:12px}
 .g4 .reel{border-radius:16px;overflow:hidden}
 .g4 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:1.2rem}
 .g4 .st{border-radius:16px;padding:.8rem;text-align:center;background:rgba(53,182,230,.14)}
 .g4 .st .k{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3f8fb0}
 .g4 .st .v{font-size:1.9rem;font-weight:700;line-height:1.1;color:#0d4a63}
 .g4 .row{display:flex;gap:12px;align-items:center;margin-top:1.2rem}
 .g4 .spin{flex:1;padding:.95rem;border:none;border-radius:999px;cursor:pointer;
   font-family:inherit;font-size:1.1rem;font-weight:700;color:#fff;background:#35b6e6;
   box-shadow:0 8px 18px rgba(20,120,170,.4)}
 .g4 .bet{padding:.95rem 1.4rem;border:2px solid #35b6e6;border-radius:999px;background:transparent;
   font-family:inherit;font-size:1rem;font-weight:700;color:#1a7ba3;cursor:pointer}
 .g4 .pay{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1.1rem}
 .g4 .pay span{font-size:.78rem;font-weight:600;color:#3f7f9c;background:rgba(53,182,230,.12);
   border-radius:999px;padding:.24rem .7rem}
 .g4 .pay b{color:#0d4a63}
 </style>
 <div class="g4">
  <div class="cl" style="top:9%;left:5%;width:340px;height:106px"></div>
  <div class="cl" style="top:70%;left:64%;width:280px;height:92px"></div>
  <div class="cl" style="top:24%;left:78%;width:210px;height:70px"></div>
  <div class="card">
   <h1>Fortune</h1><div class="sub">three reels, one line, angelcoins only</div>
   <div class="win">${reels({face:"#ffffff",edge:"#d9eef8",sym:"#2a7ea3",hit:"#ff7fb5",w:140,h:108})}</div>
   <div class="stats">
    <div class="st"><div class="k">Angelcoins</div><div class="v">${BAL}</div></div>
    <div class="st"><div class="k">Bet</div><div class="v">${BET}</div></div>
    <div class="st"><div class="k">Last win</div><div class="v">${WIN}</div></div>
   </div>
   <div class="row"><button class="bet">Bet &minus;</button>
     <button class="spin">Spin</button><button class="bet">Bet +</button></div>
   <div class="pay">${PAY.map(([c,v])=>`<span>${c} <b>${v}</b></span>`).join("")}</div>
  </div>
 </div>`;}

/* ============================================================
   5. RELIQUARY. Five reels behind an altarpiece: gold leaf,
   arches, candles, the payline read as scripture.
   ============================================================ */
function d5(){return `<style>${REEL_CSS}
 .g5{position:absolute;inset:0;padding:3vh 4vw;color:#f0e2bd;font-family:Cinzel,serif;
   display:grid;place-items:center;background:#0a0806;
   background-image:radial-gradient(60% 60% at 50% 34%,rgba(220,170,70,.24),transparent 68%),
     radial-gradient(40% 40% at 12% 84%,rgba(190,60,40,.16),transparent 70%)}
 .altar{position:relative;width:min(1040px,88vw);padding:1.6rem 1.8rem 1.5rem;
   background:linear-gradient(170deg,#2a2018,#150f0a 55%,#241a11);
   border-radius:180px 180px 8px 8px;
   box-shadow:0 40px 90px rgba(0,0,0,.95),inset 0 0 0 3px rgba(212,168,80,.6),
     inset 0 0 70px rgba(220,170,70,.14)}
 .altar::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:14px;
   width:64%;height:120px;border-radius:170px 170px 0 0;
   border:2px solid rgba(212,168,80,.4);border-bottom:none}
 .altar h1{text-align:center;font-size:1.6rem;letter-spacing:.3em;color:#e9cd85;
   margin:2.4rem 0 .3rem;text-shadow:0 0 22px rgba(220,170,70,.6)}
 .altar .verse{text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;
   font-size:1.05rem;color:#9d8a63;margin-bottom:1.1rem}
 .altar .niches{display:flex;justify-content:center;padding:14px;
   background:#0b0805;box-shadow:inset 0 0 0 3px rgba(212,168,80,.55),inset 0 0 40px rgba(0,0,0,.95)}
 .altar .rk{gap:8px}
 .altar .reel{border-radius:40px 40px 4px 4px;overflow:hidden}
