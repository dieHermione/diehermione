<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>slots mockups v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Fourth attempt.
     Looking back at the third, all six were the same design: a cabinet in the
     middle of the screen with three reels in a window and panels either side.
     Vegas, antique, pachislot, cirrus, reliquary, gacha were six paint jobs on
     one idea, which is the same thing the chess batch was rejected for.

     So this batch varies the *idea*. Only one of the six is a cabinet. The
     others are: reels that fill the whole screen with no machine at all, a
     horizontal strip like the wheel we already chose, three cards dealt onto a
     table, the drum seen from directly above, and a printed scratch card.
     Currency is angelcoins throughout; symbols are still placeholders. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px}
  .stage{position:absolute;inset:0;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#888;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;mix-blend-mode:difference}
  /* the caption has to stay readable over six very different backgrounds,
     so it gets its own backing rather than a blend mode */
  .idea{position:fixed;left:10px;bottom:8px;z-index:300;max-width:52ch;
    font-family:"IBM Plex Mono",monospace;font-size:9px;line-height:1.7;
    letter-spacing:.06em;color:#aeb6bf;background:rgba(0,0,0,.62);
    padding:.5rem .7rem;border-left:1px solid rgba(255,255,255,.18)}
</style></head>
<body>
<div class="stage" id="stage"></div><div class="idea" id="idea"></div><div class="tag" id="tag"></div>
<script>
const SYM = ["✦","☾","✚","❖","♛","♣"];
const HIT = "☾";                       // the middle row landed three moons
const PAY = [["✦ ✦ ✦","250"],["☾ ☾ ☾","120"],["✚ ✚ ✚","80"],["❖ ❖ ❖","60"],
             ["♛ ♛ ♛","40"],["♣ ♣ ♣","25"],["any two","6"]];
const BAL = "1,284", BET = "10", WIN = "120";
const rnd = (n) => SYM[n % SYM.length];

/* ============================================================
   1. FULL BLEED. No machine. Three columns of symbols fill the
   screen edge to edge; the payline is a hairline across them.
   ============================================================ */
function d1(){
 const col = (i) => Array.from({length:7},(_,r)=>r===3?HIT:rnd(i*3+r));
 return `<style>
 .g1{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);
   background:#07070a;color:#fff}
 .g1 .col{position:relative;display:flex;flex-direction:column;justify-content:center;
   align-items:center;border-right:1px solid rgba(255,255,255,.06)}
 .g1 .col:last-child{border-right:none}
 .g1 .s{font-size:clamp(3rem,7vw,6rem);line-height:1.35;color:#2a2d36}
 .g1 .s.on{color:#fff;text-shadow:0 0 60px rgba(255,255,255,.55)}
 /* the top and bottom of each column fade out, so the reel reads as endless */
 .g1 .col::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(180deg,#07070a 0%,transparent 26%,transparent 74%,#07070a 100%)}
 .g1 .line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.5);z-index:5}
 .g1 .line::before,.g1 .line::after{content:"";position:absolute;top:-5px;
   border:5px solid transparent}
 .g1 .line::before{left:0;border-left-color:#fff}
 .g1 .line::after{right:0;border-right-color:#fff}
 .g1 .hud{position:absolute;inset:0;z-index:6;pointer-events:none;
   display:flex;flex-direction:column;justify-content:space-between;padding:3vh 3vw 9vh}
 .g1 .row{display:flex;justify-content:space-between;align-items:flex-start}
 .g1 .k{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:#6a6f7a}
 .g1 .v{font-size:2.2rem;font-weight:200;letter-spacing:-.02em}
 .g1 .win{font-size:4.4rem;font-weight:200;letter-spacing:-.03em;text-align:center}
 .g1 .spin{pointer-events:auto;border:1px solid rgba(255,255,255,.5);background:transparent;
   color:#fff;font-family:inherit;font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;
   padding:.9rem 3rem;cursor:pointer}
 </style>
 <div class="g1">
  ${[0,1,2].map(i=>`<div class="col">${col(i).map((s,r)=>
    `<div class="s ${r===3?"on":""}">${s}</div>`).join("")}</div>`).join("")}
  <div class="line"></div>
  <div class="hud">
   <div class="row">
    <div><div class="k">angelcoins</div><div class="v">${BAL}</div></div>
    <div style="text-align:right"><div class="k">bet</div><div class="v">${BET}</div></div>
   </div>
   <div class="row" style="align-items:flex-end">
    <div><div class="k">three moons</div><div class="win">+${WIN}</div></div>
    <button class="spin">spin</button>
   </div>
  </div>
 </div>`;}

/* ============================================================
   2. HORIZONTAL STRIP. One reel, running left to right past a
   fixed marker, the way the wheel we already chose does.
   ============================================================ */
function d2(){
 const strip = Array.from({length:13},(_,i)=>i===6?HIT:rnd(i));
 return `<style>
 .g2{position:absolute;inset:0;background:#0a0c10;color:#dfe6ee;
   display:flex;flex-direction:column;justify-content:center;gap:3rem;padding:0 4vw;
   font-family:"IBM Plex Mono",monospace}
 .g2 .hd{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.4em;color:#5b6672}
 .g2 .hd b{color:#fff;font-weight:400}
 .g2 .band{position:relative;height:220px;display:flex;align-items:center;overflow:hidden;
   border-top:1px solid #1e2530;border-bottom:1px solid #1e2530}
 .g2 .band::before,.g2 .band::after{content:"";position:absolute;top:0;bottom:0;width:22%;z-index:3;pointer-events:none}
 .g2 .band::before{left:0;background:linear-gradient(90deg,#0a0c10,transparent)}
 .g2 .band::after{right:0;background:linear-gradient(270deg,#0a0c10,transparent)}
 .g2 .cell{flex:0 0 128px;text-align:center;font-size:3.2rem;color:#333c49}
 .g2 .cell.on{color:#fff;text-shadow:0 0 40px rgba(180,220,255,.6)}
 .g2 .mark{position:absolute;left:50%;top:0;bottom:0;width:128px;transform:translateX(-50%);
   border-left:1px solid #7fd3ff;border-right:1px solid #7fd3ff;z-index:4;
   box-shadow:0 0 40px rgba(127,211,255,.28) inset}
 .g2 .mark i{position:absolute;left:50%;transform:translateX(-50%);border:9px solid transparent}
 .g2 .mark i.t{top:-1px;border-top-color:#7fd3ff}
 .g2 .mark i.b{bottom:-1px;border-bottom-color:#7fd3ff}
 .g2 .ft{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2rem}
 .g2 .k{font-size:9px;letter-spacing:.34em;color:#5b6672;text-transform:uppercase}
 .g2 .v{font-size:2rem;color:#fff}
 .g2 .pay{font-size:10px;line-height:2;color:#5b6672;text-align:right}
 .g2 .pay b{color:#dfe6ee;font-weight:400}
 .g2 .spin{border:1px solid #7fd3ff;background:transparent;color:#fff;font-family:inherit;
   font-size:.74rem;letter-spacing:.4em;text-transform:uppercase;padding:.9rem 3rem;cursor:pointer}
 </style>
 <div class="g2">
  <div class="hd"><span>ANGELDOM // STRIP</span><span>ONE REEL, PASSING</span><span>VAULT <b>${BAL}</b></span></div>
  <div class="band">
   ${strip.map((s,i)=>`<div class="cell ${i===6?"on":""}">${s}</div>`).join("")}
   <div class="mark"><i class="t"></i><i class="b"></i></div>
  </div>
  <div class="ft">
   <div><div class="k">bet</div><div class="v">${BET} &#10022;</div>
     <div class="k" style="margin-top:.8rem">won</div><div class="v">+${WIN} &#10022;</div></div>
   <button class="spin">run</button>
   <div class="pay">${PAY.slice(0,5).map(([c,v])=>`${c} <b>${v}</b>`).join("<br>")}</div>
  </div>
 </div>`;}

/* ============================================================
   3. DEALT. Not reels at all: three cards turned face up on a
   table, one after another.
   ============================================================ */
function d3(){
 const cards=[["✦","turned"],[HIT,"turned"],[HIT,"turning"]];
 return `<style>
 .g3{position:absolute;inset:0;display:grid;place-items:center;
   background:radial-gradient(64% 64% at 50% 44%,#1f4030,#0e2119 58%,#060d0a);
   font-family:"Cormorant Garamond",serif;color:#efe6cd}
 .g3 .felt{position:absolute;inset:0;pointer-events:none;
   background:repeating-linear-gradient(38deg,rgba(0,0,0,.16) 0 3px,transparent 3px 7px)}
 .g3 .table{position:relative;z-index:2;text-align:center}
 .g3 h1{font-family:Cinzel,serif;font-size:1.3rem;letter-spacing:.4em;color:#cbb27a;margin-bottom:2.4rem}
 .g3 .hand{display:flex;gap:2.2rem;justify-content:center;align-items:flex-end}
 .g3 .card{width:190px;height:270px;border-radius:12px;position:relative;
   background:linear-gradient(160deg,#fdf8ec,#e3d9c0);
   box-shadow:0 26px 44px rgba(0,0,0,.66),inset 0 0 0 1px rgba(120,90,40,.35);
   display:grid;place-items:center;font-size:5rem;color:#2c2415}
 .g3 .card:nth-child(1){transform:rotate(-4deg)}
 .g3 .card:nth-child(2){transform:rotate(1.5deg) translateY(-14px)}
 /* the third is still coming over: caught on its edge, back showing */
 .g3 .card:nth-child(3){transform:rotate(16deg) translateY(-30px) perspective(700px) rotateY(58deg);
   background:linear-gradient(160deg,#6d1f24,#3d0f13);color:transparent;
   box-shadow:0 30px 50px rgba(0,0,0,.75),inset 0 0 0 1px rgba(210,170,90,.4)}
 .g3 .card:nth-child(3)::after{content:"";position:absolute;inset:16px;border-radius:6px;
   border:1px solid rgba(210,170,90,.45)}
 .g3 .card .pip{position:absolute;top:10px;left:14px;font-size:.8rem;color:#8c7a4e;font-family:Cinzel,serif}
 .g3 .deck{position:absolute;left:-190px;bottom:-6px;width:150px;height:214px;border-radius:10px;
   background:linear-gradient(160deg,#6d1f24,#3d0f13);box-shadow:0 18px 30px rgba(0,0,0,.7)}
 .g3 .deck::before{content:"";position:absolute;inset:-6px -4px 6px 4px;border-radius:10px;
   background:linear-gradient(160deg,#5d1a1f,#320c10);z-index:-1}
 .g3 .ft{display:flex;justify-content:center;gap:3.4rem;margin-top:2.6rem;align-items:baseline}
 .g3 .k{font-family:Inter,sans-serif;font-size:8px;letter-spacing:.34em;
   text-transform:uppercase;color:#9c8f6d}
 .g3 .v{font-size:2rem;color:#f4e9c9}
 .g3 .deal{font-family:Cinzel,serif;font-size:.92rem;letter-spacing:.28em;padding:.7rem 2.4rem;
   border:1px solid #cbb27a;color:#221a06;background:linear-gradient(180deg,#f0dda8,#c9a95f);cursor:pointer}
 </style>
 <div class="g3"><div class="felt"></div>
  <div class="table">
   <h1>THREE CARDS</h1>
   <div class="hand"><div class="deck"></div>
    ${cards.map(([s],i)=>`<div class="card"><span class="pip">${String(i+1).padStart(2,"0")}</span>${s}</div>`).join("")}
   </div>
   <div class="ft">
    <div><div class="k">angelcoins</div><div class="v">${BAL}</div></div>
    <div><div class="k">stake</div><div class="v">${BET}</div></div>
    <div><div class="k">paid</div><div class="v">+${WIN}</div></div>
    <button class="deal">DEAL</button>
   </div>
  </div>
 </div>`;}

/* ============================================================
   4. FROM ABOVE. Looking straight down into the drum: three
   concentric rings, and the win is where the spokes line up.
   ============================================================ */
function d4(){
 const ring = (r, count, lit) => Array.from({length:count},(_,i)=>{
   const a = (i / count) * 360;
   return `<g transform="rotate(${a} 300 300)">
     <line x1="300" y1="${300-r+26}" x2="300" y2="${300-r-26}" stroke="#243041" stroke-width="1"/>
     <text x="300" y="${300-r+8}" text-anchor="middle" font-size="${r>150?26:22}"
       fill="${i===lit?"#eafaff":"#39485c"}"
       style="${i===lit?"filter:drop-shadow(0 0 12px rgba(150,210,255,.9))":""}"
       transform="rotate(${-a} 300 ${300-r})">${i===lit?HIT:rnd(i+r)}</text></g>`;}).join("");
 return `<style>
 .g4{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
   gap:2rem;padding:0 5vw;background:#070a0f;color:#c9d6e4;font-family:"IBM Plex Mono",monospace}
 .g4 .k{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#4d5a6b}
 .g4 .v{font-size:2.4rem;color:#eafaff;line-height:1.2}
 .g4 .pay{font-size:10px;line-height:2.1;color:#4d5a6b;text-align:right}
 .g4 .pay b{color:#c9d6e4;font-weight:400}
 .g4 .drop{border:1px solid #7fd3ff;background:transparent;color:#eafaff;font-family:inherit;
   font-size:.72rem;letter-spacing:.36em;text-transform:uppercase;padding:.85rem 2.2rem;
   cursor:pointer;margin-top:1.4rem}
 </style>
 <div class="g4">
  <div><div class="k">angelcoins</div><div class="v">${BAL}</div>
    <div class="k" style="margin-top:1.2rem">stake</div><div class="v">${BET}</div>
    <button class="drop">drop a coin</button></div>
  <svg width="600" height="600" viewBox="0 0 600 600">
   <defs><radialGradient id="well" cx=".5" cy=".5" r=".5">
     <stop offset="0" stop-color="#0d1622"/><stop offset=".72" stop-color="#070b12"/>
     <stop offset="1" stop-color="#03050a"/></radialGradient></defs>
   <circle cx="300" cy="300" r="292" fill="url(#well)" stroke="#1b2634"/>
   <!-- the alignment the payline used to be: a wedge from the hub outward -->
   <path d="M300 300 L272 20 A292 292 0 0 1 328 20 Z" fill="rgba(127,211,255,.10)"/>
   <circle cx="300" cy="300" r="232" fill="none" stroke="#1b2634"/>
   <circle cx="300" cy="300" r="164" fill="none" stroke="#1b2634"/>
   <circle cx="300" cy="300" r="96" fill="none" stroke="#1b2634"/>
   ${ring(258,16,0)}${ring(196,13,0)}${ring(132,10,0)}
   <circle cx="300" cy="300" r="52" fill="#0b111a" stroke="#7fd3ff" stroke-width="1.4"/>
   <text x="300" y="294" text-anchor="middle" font-family="IBM Plex Mono,monospace"
     font-size="9" letter-spacing="3" fill="#4d5a6b">WON</text>
   <text x="300" y="320" text-anchor="middle" font-family="IBM Plex Mono,monospace"
     font-size="22" fill="#eafaff">${WIN}</text>
  </svg>
  <div class="pay">${PAY.map(([c,v])=>`${c} <b>${v}</b>`).join("<br>")}
    <div style="margin-top:1rem;color:#39485c">three rings, read outward<br>along the lit wedge</div></div>
 </div>`;}

/* ============================================================
   5. SCRATCH CARD. A printed card with three panels; two are
   scratched off and the third is half done.
   ============================================================ */
function d5(){
 return `<style>
 .g5{position:absolute;inset:0;display:grid;place-items:center;
   background:linear-gradient(160deg,#d9d3c6,#b9b1a0);font-family:Inter,sans-serif;color:#2b2820}
 .g5 .desk{position:absolute;inset:0;pointer-events:none;
   background:repeating-linear-gradient(94deg,rgba(0,0,0,.03) 0 2px,transparent 2px 9px)}
 .g5 .card{position:relative;z-index:2;width:min(760px,80vw);padding:2rem 2.2rem 1.6rem;
   background:linear-gradient(170deg,#fffdf6,#f0ebdd);border-radius:6px;
   box-shadow:0 30px 60px rgba(60,50,35,.45);transform:rotate(-1.2deg)}
 .g5 .card::before{content:"";position:absolute;inset:10px;border:1px dashed #c6bda3;border-radius:3px}
 .g5 h1{font-family:"Bebas Neue",sans-serif;font-size:2.6rem;letter-spacing:.1em;color:#a3202b;line-height:1}
 .g5 .sub{font-size:9px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
   color:#8a8270;margin-bottom:1.4rem}
 .g5 .panels{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
 .g5 .p{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-size:3.6rem;
   background:#fffdf6;box-shadow:inset 0 0 0 2px #ddd4bb;color:#2b2820;position:relative;overflow:hidden}
 /* the third is still under the foil, half rubbed away */
 .g5 .p.foil::after{content:"";position:absolute;inset:0;
   background:linear-gradient(126deg,#b9bcc2,#8d9299 40%,#cfd3d8 62%,#7e838a);
   clip-path:polygon(0 0,100% 0,100% 44%,72% 58%,88% 74%,42% 68%,18% 88%,0 72%)}
 .g5 .p.foil::before{content:"";position:absolute;inset:0;z-index:2;
   background:repeating-linear-gradient(58deg,rgba(255,255,255,.35) 0 2px,transparent 2px 6px);
   clip-path:polygon(0 0,100% 0,100% 44%,72% 58%,88% 74%,42% 68%,18% 88%,0 72%)}
 .g5 .crumb{position:absolute;border-radius:50%;background:#9aa0a7;z-index:3}
 .g5 .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:1.4rem}
 .g5 .k{font-size:8px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#8a8270}
 .g5 .v{font-family:"Bebas Neue",sans-serif;font-size:2.2rem;line-height:1;color:#2b2820}
 .g5 .pay{font-size:9.5px;line-height:1.85;color:#6c6555}
 .g5 .pay b{color:#a3202b}
 .g5 .serial{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.2em;color:#a49b83}
 .g5 .buy{font-family:"Bebas Neue",sans-serif;font-size:1.3rem;letter-spacing:.14em;
   border:none;background:#a3202b;color:#fffdf6;padding:.5rem 2rem;cursor:pointer;border-radius:3px}
 </style>
 <div class="g5"><div class="desk"></div>
  <div class="card">
   <h1>ANGELCOIN INSTANT</h1>
   <div class="sub">match three &middot; one card, one chance</div>
   <div class="panels">
    <div class="p">${HIT}</div>
    <div class="p">${HIT}</div>
    <div class="p foil">${HIT}
      ${Array.from({length:9},(_,i)=>`<i class="crumb" style="width:${3+i%3}px;height:${3+i%3}px;
        left:${8+i*10}%;top:${72+(i%4)*6}%"></i>`).join("")}</div>
   </div>
   <div class="ft">
    <div><div class="k">this card pays</div><div class="v">${WIN} ANGELCOINS</div>
      <div class="serial" style="margin-top:.5rem">NO. 0042-7719 &nbsp; VOID IF DEFACED</div></div>
    <div class="pay">${PAY.slice(0,4).map(([c,v])=>`${c} <b>${v}</b>`).join("<br>")}</div>
    <div style="text-align:right"><div class="k">balance ${BAL}</div>
      <button class="buy" style="margin-top:.5rem">BUY ANOTHER &middot; ${BET}</button></div>
   </div>
  </div>
 </div>`;}

/* ============================================================
   6. THE ONE CABINET. Kept from the last batch, because one of
   six being an actual machine is right; the other five are not.
   ============================================================ */
function d6(){
 const REELS=[["✦",HIT,"❖"],["♛",HIT,"✚"],["✚",HIT,"♣"]];
 return `<style>
 .g6{position:absolute;inset:0;display:grid;place-items:center;
   background:radial-gradient(70% 70% at 50% 30%,#3a1016,#170609 60%,#080304)}
 .cab{position:relative;width:min(700px,62vw);padding:0 0 22px;
   background:linear-gradient(180deg,#c9161f,#8d0d16 40%,#5c070d);border-radius:34px 34px 14px 14px;
   box-shadow:0 40px 90px rgba(0,0,0,.9),inset 0 2px 0 rgba(255,180,180,.5),
     inset 0 -8px 20px rgba(0,0,0,.6)}
 .cab .marquee{position:relative;padding:1.3rem 2rem 1rem;text-align:center;
   border-radius:34px 34px 0 0;background:linear-gradient(180deg,#ffd24a,#e0a015 60%,#b57a06)}
 .cab .marquee h1{font-family:"Bebas Neue",sans-serif;font-size:3rem;letter-spacing:.14em;
   color:#7c0a12;line-height:1;text-shadow:0 2px 0 rgba(255,255,255,.5)}
 .bulbs{position:absolute;inset:8px;border-radius:28px 28px 0 0;pointer-events:none}
 .bulbs i{position:absolute;width:11px;height:11px;border-radius:50%;
   background:radial-gradient(circle at 35% 32%,#fffbe6,#ffd84a 55%,#c58f06);
   box-shadow:0 0 12px rgba(255,220,90,.9)}
 .cab .glass{width:fit-content;margin:20px auto 0;padding:18px;border-radius:10px;background:#0a0709;
   box-shadow:inset 0 0 0 4px #d9a017,inset 0 0 34px rgba(0,0,0,.9);display:flex;gap:10px}
 .cab .reel{display:flex;flex-direction:column;background:#f6f1e4;
   box-shadow:inset 0 14px 22px -8px rgba(0,0,0,.55),inset 0 -14px 22px -8px rgba(0,0,0,.55)}
 .cab .cell{width:124px;height:98px;display:grid;place-items:center;font-size:3rem;color:#3a2d18;
   border-bottom:1px solid #ccc2a8}
 .cab .cell:last-child{border-bottom:none}
 .cab .cell.pay{color:#c9161f;text-shadow:0 0 18px rgba(201,22,31,.5)}
 .cab .meters{display:flex;justify-content:space-between;margin:18px 26px 0;gap:12px}
 .meter{flex:1;padding:.6rem .8rem;border-radius:6px;background:#170608;
   box-shadow:inset 0 0 0 2px #d9a017;text-align:center}
 .meter .k{font-size:8px;font-weight:700;letter-spacing:.3em;color:#d9a017;text-transform:uppercase}
