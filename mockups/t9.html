<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>t9 mockups v5</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* Fifth attempt, built from the reference photo of a Motorola RAZR V3.
     The first four all invented a phone. This one copies that one: the real
     proportions (open it is roughly one to two and a half), the speaker slots
     and two visible screws above the wordmark, the black screen surround, the
     chrome hinge with its raised centre catch, the flat etched keypad plate
     where the keys are wide shallow chevrons separated by engraved hairlines
     rather than gaps, the number left and the letters small to its right, the
     round D-pad with a green centre and four icon soft keys at its corners,
     and the slotted speaker grille in the chin.

     All six are that same phone. They differ in how it is presented: flat on,
     at an angle, closed, and in the three colourways it actually shipped in,
     plus the blue electroluminescent backlight it had at night. */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--c:#aee3ff;--dim:#4f7ea0;--dim2:#2c4a5e;--bright:#eafaff;--red:#ff3b2f}
  html,body{height:100%}
  body{background:#07090b;color:var(--c);font-family:"IBM Plex Mono",monospace;font-size:14px;overflow:hidden}
  .stage{position:absolute;inset:0;padding:3vh 3vw;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#444;font-size:10px;letter-spacing:.2em}
  .hdr{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.35em;color:var(--dim);margin-bottom:1rem}
  .room{position:absolute;inset:0;z-index:-1;
    background:radial-gradient(56% 64% at 30% 52%,rgba(150,190,220,.14),transparent 72%)}
  .w{height:calc(100% - 2.6rem);display:flex;align-items:center;gap:3.4rem;padding-left:2vw}
  .w > svg, .w > div > svg{flex:0 0 auto;zoom:1.24;
    filter:drop-shadow(22px 34px 40px rgba(0,0,0,.85))}
  .side{width:min(420px,34%)}
  .side .lbl{font-size:9px;letter-spacing:.3em;color:var(--dim);margin-bottom:.6rem}
  .side .line{font-size:1.6rem;line-height:1.6;color:var(--dim2)}
  .side .line b{color:var(--bright);font-weight:400}
  .side .cur{display:inline-block;width:.5em;height:1.05em;background:var(--red);vertical-align:-3px}
  .side .kv{display:flex;justify-content:space-between;font-size:11px;padding:.24rem 0;
    border-bottom:1px dotted var(--dim2);color:var(--dim)}
  .side .kv b{color:var(--bright);font-weight:400}
  .side .cyc{display:flex;gap:.4rem;align-items:center;margin-top:1.1rem}
  .side .cyc i{border:1px solid var(--dim2);padding:.26rem .6rem;font-style:normal;font-size:1rem;color:var(--dim)}
  .side .cyc i.on{border-color:var(--red);color:#fff;background:rgba(255,59,47,.16)}
  .side .why{font-size:10px;line-height:1.9;color:var(--dim2);margin-top:1.4rem;
    border-left:1px solid var(--dim2);padding-left:.9rem}
</style></head>
<body>
<div class="room"></div>
<div class="stage" id="stage"></div><div class="tag" id="tag"></div>
<script>
const LINE="i belong to hermione", TYPED="i belong to herm";
// the V3's own key legends: number left, letters small to the right
const K=[["1",".-@"],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],
         ["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]];

const side = (why) => `<div class="side">
  <div class="lbl">LINE 3 OF 20</div>
  <div class="line"><b>${TYPED}</b><span class="cur"></span>${LINE.slice(TYPED.length)}</div>
  <div class="cyc"><span style="font-size:9px;letter-spacing:.3em;color:var(--dim)">KEY 6</span>
    <i class="on">m</i><i>n</i><i>o</i>
    <span style="font-size:9px;color:var(--dim2)">TAP AGAIN WITHIN 800ms</span></div>
  <div style="margin-top:1.4rem">
    <div class="kv"><span>keypresses</span><b>412</b></div>
    <div class="kv"><span>mistakes</span><b style="color:var(--red)">6</b></div>
    <div class="kv"><span>0</span><b>space</b></div>
    <div class="kv"><span>Back</span><b>delete</b></div>
  </div>
  <div class="why">${why}</div></div>`;
const hdr = (t) => `<div class="hdr"><span>angelOS v0.2 &nbsp;&mdash;&nbsp; T9 &nbsp;&mdash;&nbsp; ${t}</span>
  <span>PRESS 1-9 TO CYCLE</span><span>LINE 3 / 20</span></div>`;

/* ---------------------------------------------------------------
   One RAZR V3, drawn once and re-skinned. `sk` carries the metal,
   the screen and the backlight so the colourways are the same body.
   --------------------------------------------------------------- */
const SKINS = {
  silver: { id:"sv", a:"#7d858c", b:"#e6ebef", c:"#a9b1b8", d:"#f2f5f7", e:"#6b7278",
            plate1:"#e8edf1", plate2:"#b9c1c8", plate3:"#969ea5", edge:"#5a6167",
            etch:"rgba(70,80,88,.5)", legend:"#2c3339", sub:"#6b737b",
            lcdA:"#0d2b1c", lcdB:"#08170f", ink:"#8dffbd", inkDim:"#3f8a5d",
            glowc:"rgba(90,255,160,.55)", lit:null, name:"SILVER" },
  black:  { id:"bk", a:"#1d2024", b:"#5c646c", c:"#2c3136", d:"#727a82", e:"#15181b",
            plate1:"#4b535a", plate2:"#333a40", plate3:"#22282d", edge:"#0e1114",
            etch:"rgba(0,0,0,.6)", legend:"#e6ecf1", sub:"#98a2ab",
            lcdA:"#071c26", lcdB:"#030d13", ink:"#a9ecff", inkDim:"#3d8fb0",
            glowc:"rgba(90,210,255,.55)", lit:null, name:"BLACK" },
  pink:   { id:"pk", a:"#b8557f", b:"#ffd3e4", c:"#e78fb4", d:"#fff0f6", e:"#9c3f66",
            plate1:"#ffe7f1", plate2:"#f0b5cd", plate3:"#d992ae", edge:"#9c3f66",
            etch:"rgba(140,50,90,.45)", legend:"#5f1c38", sub:"#a8567c",
            lcdA:"#1a1030", lcdB:"#0d0819", ink:"#f3d4ff", inkDim:"#a06fd8",
            glowc:"rgba(220,150,255,.55)", lit:null, name:"PINK" },
};
SKINS.night = Object.assign({}, SKINS.silver, {
  id:"nt", name:"BACKLIT",
  plate1:"#2a3c48", plate2:"#1b2a34", plate3:"#132029", edge:"#0d1519",
  etch:"rgba(120,200,255,.35)", legend:"#bfe9ff", sub:"#6fb6dc",
  a:"#3a444c", b:"#7e8b95", c:"#4d5860", d:"#93a1ac", e:"#2a3238",
  lit:"rgba(120,200,255,.55)",
});

function defs(s){return `
 <linearGradient id="body-${s.id}" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="${s.a}"/><stop offset=".14" stop-color="${s.b}"/>
   <stop offset=".42" stop-color="${s.c}"/><stop offset=".70" stop-color="${s.d}"/>
   <stop offset="1" stop-color="${s.e}"/></linearGradient>
 <linearGradient id="edge-${s.id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${s.c}"/><stop offset="1" stop-color="${s.edge}"/></linearGradient>
 <linearGradient id="plate-${s.id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${s.plate1}"/><stop offset=".58" stop-color="${s.plate2}"/>
   <stop offset="1" stop-color="${s.plate3}"/></linearGradient>
 <linearGradient id="glass-${s.id}" x1="0" y1="0" x2=".6" y2="1">
   <stop offset="0" stop-color="rgba(255,255,255,.20)"/>
   <stop offset=".45" stop-color="rgba(255,255,255,.03)"/>
   <stop offset="1" stop-color="rgba(255,255,255,.10)"/></linearGradient>
 <linearGradient id="lcd-${s.id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="${s.lcdA}"/><stop offset="1" stop-color="${s.lcdB}"/></linearGradient>
 <linearGradient id="chrome-${s.id}" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#c8ced4"/>
   <stop offset=".62" stop-color="#79818a"/><stop offset="1" stop-color="#d6dce1"/></linearGradient>`;}

// the lid: speaker slots, two screws, MOTOROLA, and the screen in its surround
function lid(s){return `
 <path d="M10 26 Q10 8 28 8 L232 8 Q250 8 250 26 L250 300 L10 300 Z"
       fill="url(#body-${s.id})" stroke="${s.edge}" stroke-width="1.1"/>
 ${Array.from({length:9},(_,i)=>`<rect x="${88+i*9}" y="22" width="5" height="10" rx="2.5" fill="${s.edge}" opacity=".8"/>`).join("")}
 <circle cx="34" cy="27" r="4.6" fill="none" stroke="${s.edge}" stroke-width="1.2" opacity=".8"/>
 <circle cx="226" cy="27" r="4.6" fill="none" stroke="${s.edge}" stroke-width="1.2" opacity=".8"/>
 <text x="130" y="52" text-anchor="middle" font-family="Inter,sans-serif" font-size="11"
       font-weight="800" letter-spacing="2.4" fill="${s.legend}">MOTOROLA</text>
 <rect x="24" y="62" width="212" height="216" rx="7" fill="#0a0c0f" stroke="${s.edge}" stroke-width="1"/>
 <rect x="34" y="72" width="192" height="196" fill="url(#lcd-${s.id})"/>
 <text x="42" y="88" font-family="IBM Plex Mono,monospace" font-size="8" fill="${s.inkDim}">ANGELCOM</text>
 <text x="218" y="88" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="8" fill="${s.inkDim}">03/20</text>
 <text x="42" y="112" font-family="IBM Plex Mono,monospace" font-size="8.5" fill="${s.inkDim}">${LINE}</text>
 <text x="42" y="134" font-family="IBM Plex Mono,monospace" font-size="12" fill="${s.ink}"
       style="filter:drop-shadow(0 0 6px ${s.glowc})">${TYPED}</text>
 <rect x="${42+7.22*TYPED.length}" y="124" width="6" height="12" fill="${s.ink}"/>
 <rect x="34" y="72" width="192" height="196" fill="url(#glass-${s.id})"/>`;}

// hinge: a chrome bar with the raised centre catch the V3 has
function hinge(s){return `
 <rect x="16" y="302" width="228" height="22" rx="11" fill="url(#chrome-${s.id})" stroke="${s.edge}" stroke-width=".8"/>
 <rect x="96" y="298" width="68" height="16" rx="7" fill="url(#chrome-${s.id})" stroke="${s.edge}" stroke-width=".8"/>
 <rect x="108" y="303" width="44" height="4" rx="2" fill="${s.edge}" opacity=".55"/>`;}

// the base: nav cluster, the etched plate, and the chin speaker
function base(s){
  const kx = [58, 130, 202], ky = [470, 512, 554, 596];
  return `
 <path d="M10 326 L250 326 L250 636 Q250 654 232 654 L28 654 Q10 654 10 636 Z"
       fill="url(#body-${s.id})" stroke="${s.edge}" stroke-width="1.1"/>

 <!-- four icon soft keys at the corners of the D-pad -->
 ${[[44,362,"\u2295"],[216,362,"\u2709"],[44,418,"\u2706"],[216,418,"\u23FB"]].map(([x,y,ch],i)=>
   `<rect x="${x-21}" y="${y-13}" width="42" height="26" rx="13" fill="url(#plate-${s.id})" stroke="${s.etch}"/>
    <text x="${x}" y="${y+5}" text-anchor="middle" font-size="13"
      fill="${i===2?"#2f8f4a":i===3?"#c0392b":s.legend}">${ch}</text>`).join("")}

 <!-- the D-pad: silver ring, green centre -->
 <circle cx="130" cy="390" r="40" fill="url(#plate-${s.id})" stroke="${s.etch}" stroke-width="1.2"/>
 <circle cx="130" cy="390" r="27" fill="none" stroke="${s.etch}" stroke-width="1"/>
 <circle cx="130" cy="390" r="15" fill="url(#plate-${s.id})" stroke="${s.etch}"/>
 <circle cx="130" cy="390" r="8" fill="#4e8f5a" opacity=".85"/>
 ${[[130,368,"0"],[130,412,"180"],[104,390,"270"],[156,390,"90"]].map(([x,y,r])=>
   `<path d="M${x} ${y-4} l4 7 h-8 z" transform="rotate(${r} ${x} ${y})" fill="${s.sub}"/>`).join("")}

 <!-- the keypad is ONE plate; the keys are engraved into it -->
 <rect x="20" y="448" width="220" height="170" rx="6" fill="url(#plate-${s.id})" stroke="${s.etch}" stroke-width="1.1"/>
 ${ky.slice(1).map(y=>`<path d="M22 ${y-21} Q130 ${y-27} 238 ${y-21}" fill="none" stroke="${s.etch}" stroke-width=".9"/>`).join("")}
 ${[94,166].map(x=>`<line x1="${x}" y1="450" x2="${x}" y2="616" stroke="${s.etch}" stroke-width=".9"/>`).join("")}
 ${K.map(([n,l],i)=>{
   const x = kx[i%3], y = ky[Math.floor(i/3)], on = n === "6";
   return (on && s.lit ? `<rect x="${x-34}" y="${y-20}" width="68" height="40" fill="${s.lit}"/>` :
           on ? `<rect x="${x-34}" y="${y-20}" width="68" height="40" fill="rgba(120,200,255,.55)"/>` : "") +
     `<text x="${x-16}" y="${y+7}" text-anchor="middle" font-family="Inter,sans-serif"
        font-size="19" font-weight="500" fill="${on?"#08222f":s.legend}">${n}</text>` +
     (l ? `<text x="${x+30}" y="${y+2}" text-anchor="end" font-family="Inter,sans-serif"
        font-size="7.5" font-weight="700" letter-spacing=".6" fill="${on?"#0d3a52":s.sub}">${l}</text>` : "");
 }).join("")}

 <!-- chin speaker -->
 ${Array.from({length:7},(_,i)=>`<rect x="98" y="${626+i*3.4}" width="64" height="1.6" rx=".8" fill="${s.edge}" opacity=".55"/>`).join("")}`;}

const openPhone = (s, extra) => `
 <svg width="260" height="664" viewBox="0 0 260 664">
  <defs>${defs(s)}</defs>
  ${lid(s)}${hinge(s)}${base(s)}${extra || ""}
 </svg>`;

/* 1. flat on, silver: the canonical view */
function d1(){return hdr("RAZR V3 &middot; SILVER, OPEN")+`<div class="w">
 ${openPhone(SKINS.silver)}
 ${side("Built from the photo rather than invented: real proportions, the speaker slots and two screws over the wordmark, the chrome hinge with its raised catch, and a keypad that is one engraved plate rather than twelve separate keys.")}
</div>`;}

/* 2. the same phone at an angle, so the slab has thickness */
function d2(){return hdr("RAZR V3 &middot; THREE-QUARTER")+`<div class="w">
 <div style="transform:perspective(1700px) rotateY(-16deg) rotateX(5deg);transform-style:preserve-3d">
   ${openPhone(SKINS.silver)}
 </div>
 ${side("The same drawing, turned. The V3's whole selling point was how thin it is, which only reads when you can see the edge of it.")}
</div>`;}

/* 3. closed: the outer screen, the camera, the M */
function d3(){
 const s = SKINS.silver;
 return hdr("RAZR V3 &middot; CLOSED")+`<div class="w">
 <svg width="270" height="450" viewBox="0 0 270 450">
  <defs>${defs(s)}</defs>
  <path d="M14 34 Q14 12 36 12 L234 12 Q256 12 256 34 L256 412 Q256 436 234 436 L36 436 Q14 436 14 412 Z"
        fill="url(#body-${s.id})" stroke="${s.edge}" stroke-width="1.2"/>
  <!-- camera panel with its printed label -->
  <rect x="86" y="26" width="98" height="52" rx="5" fill="#14171a" stroke="${s.edge}"/>
  <circle cx="135" cy="44" r="9" fill="#05070a" stroke="#59626a"/>
  <circle cx="135" cy="44" r="4" fill="#1b3346"/>
  <text x="135" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="7"
        font-weight="700" letter-spacing=".8" fill="#8d979f">VGA ZOOM 4X</text>
  <!-- outer screen -->
  <rect x="88" y="96" width="94" height="80" rx="4" fill="#0a0c0f" stroke="${s.edge}"/>
  <rect x="94" y="102" width="82" height="68" fill="url(#lcd-${s.id})"/>
  <text x="100" y="118" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="${s.inkDim}">03/20</text>
  <text x="100" y="140" font-family="IBM Plex Mono,monospace" font-size="9" fill="${s.ink}"
        style="filter:drop-shadow(0 0 5px ${s.glowc})">herm_</text>
  <rect x="94" y="102" width="82" height="68" fill="url(#glass-${s.id})"/>
  <!-- the M -->
  <circle cx="135" cy="252" r="21" fill="none" stroke="${s.edge}" stroke-width="1.6" opacity=".75"/>
  <path d="M124 262 L124 244 L135 256 L146 244 L146 262" fill="none" stroke="${s.edge}"
        stroke-width="3.4" stroke-linejoin="round" opacity=".8"/>
  <!-- speaker and the battery-cover seam -->
  ${Array.from({length:5},(_,i)=>`<rect x="122" y="${300+i*3.4}" width="26" height="1.5" fill="${s.edge}" opacity=".5"/>`).join("")}
  <path d="M14 356 L256 356" stroke="${s.edge}" stroke-width="1" opacity=".65"/>
  <!-- side buttons -->
  <rect x="8" y="150" width="8" height="34" rx="4" fill="url(#edge-${s.id})"/>
  <rect x="254" y="150" width="8" height="24" rx="4" fill="url(#edge-${s.id})"/>
  <rect x="254" y="186" width="8" height="16" rx="4" fill="url(#edge-${s.id})"/>
 </svg>
 ${side("Shut, which is how it spends most of its life. The outer screen carries the last few letters, so a glance tells you where the line is without opening it.")}
</div>`;}

/* 4 and 5: the two other colourways it shipped in */
function d4(){return hdr("RAZR V3 &middot; BLACK")+`<div class="w">
 ${openPhone(SKINS.black)}
 ${side("The same body in the black anodising. The etched hairlines read as darker than the plate here rather than lighter, which is the one thing that has to flip with the colour.")}
</div>`;}
function d5(){return hdr("RAZR V3 &middot; PINK")+`<div class="w">
 ${openPhone(SKINS.pink)}
 ${side("And the pink one. Probably the right one for this site, but that is your call and not mine.")}
</div>`;}

/* 6. the blue electroluminescent backlight it had at night */
function d6(){return hdr("RAZR V3 &middot; BACKLIT")+`<div class="w">
 ${openPhone(SKINS.night, `<rect x="20" y="448" width="220" height="170" rx="6"
    fill="rgba(120,200,255,.10)" style="filter:blur(6px)"/>`)}
 ${side("The V3's keypad glowed blue through the etched legends. In a dark room the plate is the only thing you can see of the phone, which suits a game about typing lines at night.")}
</div>`;}

const DS=[d1,d2,d3,d4,d5,d6];
const NM=["1 · silver, open","2 · three-quarter","3 · closed",
  "4 · black","5 · pink","6 · backlit"];
const n=Math.min(DS.length,Math.max(1,parseInt(new URLSearchParams(location.search).get("d")||"1",10)));
document.getElementById("stage").innerHTML=DS[n-1]();
document.getElementById("tag").textContent=NM[n-1];
</script></body></html>
