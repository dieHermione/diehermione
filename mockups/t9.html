<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>t9 mockups v3</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet" />
<style>
  /* Third attempt. The first two batches were rejected for looking like
     calculators: flat grey rectangles with a grid of keys. Every design here is
     a specific real handset silhouette instead, built from moulded plastic and
     metal rather than boxes, and most sit at a slight angle so they read as an
     object in a room. Non-photorealistic, but unmistakably that phone. */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--c:#aee3ff;--dim:#4f7ea0;--dim2:#2c4a5e;--bright:#eafaff;--red:#ff3b2f}
  html,body{height:100%}
  body{background:#07090b;color:var(--c);font-family:"IBM Plex Mono",monospace;font-size:14px;overflow:hidden}
  .stage{position:absolute;inset:0;padding:3vh 3vw;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#444;font-size:10px;letter-spacing:.2em}
  .hdr{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.35em;color:var(--dim);margin-bottom:1rem}

  /* the desk the handset sits on: a pool of light, so it reads as an object */
  .room{position:absolute;inset:0;z-index:-1;
    background:radial-gradient(58% 62% at 32% 52%,rgba(150,190,220,.13),transparent 72%)}

  /* the penance line the player is copying, always beside the phone */
  .w{height:calc(100% - 2.6rem);display:flex;align-items:center;gap:4rem;padding-left:2vw}
  /* the handset is the game, so let it fill its half of the frame */
  .w > :first-child{zoom:1.38}
  .side{width:min(460px,36%)}
  .side .lbl{font-size:9px;letter-spacing:.3em;color:var(--dim);margin-bottom:.6rem}
  .side .line{font-size:1.7rem;line-height:1.6;color:var(--dim2)}
  .side .line b{color:var(--bright);font-weight:400}
  .side .cur{display:inline-block;width:.5em;height:1.05em;background:var(--red);vertical-align:-3px}
  .side .kv{display:flex;justify-content:space-between;font-size:11px;padding:.24rem 0;
    border-bottom:1px dotted var(--dim2);color:var(--dim)}
  .side .kv b{color:var(--bright);font-weight:400}
  .side .cyc{display:flex;gap:.4rem;align-items:center;margin-top:1.1rem}
  .side .cyc i{border:1px solid var(--dim2);padding:.26rem .6rem;font-style:normal;font-size:1rem;color:var(--dim)}
  .side .cyc i.on{border-color:var(--red);color:#fff;background:rgba(255,59,47,.16)}
</style></head>
<body>
<div class="room"></div>
<div class="stage" id="stage"></div><div class="tag" id="tag"></div>
<script>
const LINE="i belong to hermione", TYPED="i belong to herm";
const K=[["1",".,?!"],["2","abc"],["3","def"],["4","ghi"],["5","jkl"],["6","mno"],
         ["7","pqrs"],["8","tuv"],["9","wxyz"],["*",""],["0","space"],["#",""]];
const side = () => `<div class="side">
  <div class="lbl">LINE 3 OF 20</div>
  <div class="line"><b>${TYPED}</b><span class="cur"></span>${LINE.slice(TYPED.length)}</div>
  <div class="cyc"><span style="font-size:9px;letter-spacing:.3em;color:var(--dim)">KEY 6</span>
    <i class="on">m</i><i>n</i><i>o</i>
    <span style="font-size:9px;color:var(--dim2)">TAP AGAIN WITHIN 800ms</span></div>
  <div style="margin-top:1.5rem">
    <div class="kv"><span>keypresses</span><b>412</b></div>
    <div class="kv"><span>mistakes</span><b style="color:var(--red)">6</b></div>
    <div class="kv"><span>0</span><b>space</b></div>
    <div class="kv"><span>Back</span><b>delete</b></div>
  </div></div>`;
const hdr = (t) => `<div class="hdr"><span>ANGELDOM // T9 &nbsp;&mdash;&nbsp; ${t}</span>
  <span>PRESS 1-9 TO CYCLE</span><span>LINE 3 / 20</span></div>`;

/* ============================================================
   1. RAZR V3, open. Anodised aluminium, a real hinge with two
   barrels, and the flat electroluminescent keypad sheet cut by
   diagonal etched lines. Blue backlight bleeding through.
   ============================================================ */
function d1(){return `<style>
 .razr{width:296px;transform:perspective(1500px) rotateX(6deg) rotateY(-9deg);transform-style:preserve-3d;
   filter:drop-shadow(26px 40px 42px rgba(0,0,0,.85))}
 .razr .half{background:
     linear-gradient(96deg,#6e767c 0%,#c2cad0 14%,#9aa3aa 38%,#c8d0d6 62%,#7d868c 88%,#585f65 100%);
   border:1px solid #4a5157;position:relative}
 .razr .lid{border-radius:12px 12px 4px 4px;padding:14px 13px 16px}
 .razr .base{border-radius:4px 4px 15px 15px;padding:12px 13px 16px;margin-top:8px}
 /* the hinge: two knuckles either side of a recessed barrel */
 .razr .hinge{height:11px;display:flex;align-items:center;gap:4px;margin:-4px 16px -4px}
 .razr .hinge .barrel{flex:1;height:11px;border-radius:6px;
   background:linear-gradient(180deg,#e6ecf0,#8b949b 45%,#3b4147);box-shadow:inset 0 -1px 2px rgba(0,0,0,.6)}
 .razr .hinge .knob{width:16px;height:13px;border-radius:7px;
   background:linear-gradient(180deg,#d4dbe0,#6a7278);box-shadow:0 1px 3px rgba(0,0,0,.6)}
 .razr .glass{background:#0c1013;border-radius:5px;padding:9px 9px 11px;
   box-shadow:inset 0 2px 7px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.35)}
 .razr .brandrow{display:flex;justify-content:space-between;font-family:Inter,sans-serif;font-size:6.5px;
   letter-spacing:.34em;color:#7c8790;margin-bottom:7px}
 .lcd{background:linear-gradient(180deg,#0d2b1c,#08170f);border:1px solid #16311f;padding:9px 8px;min-height:118px;
   box-shadow:inset 0 0 20px rgba(0,255,150,.07)}
 .lcd .st{display:flex;justify-content:space-between;font-size:7px;color:#3f8a5d;letter-spacing:.14em;margin-bottom:6px}
 .lcd .tgt{font-size:8.5px;color:#2f6e48;line-height:1.65}
 .lcd .txt{font-size:12px;color:#8dffbd;line-height:1.5;text-shadow:0 0 8px rgba(90,255,160,.5);word-break:break-word}
 .lcd .cur{display:inline-block;width:5px;height:12px;background:#8dffbd;vertical-align:-2px}
 /* nav cluster: the Razr's flat oval rocker with a chrome ring */
 .razr .nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:11px 0 12px}
 .razr .soft{font-family:Inter,sans-serif;font-size:7px;letter-spacing:.2em;color:#3f464c}
 .razr .rocker{width:82px;height:30px;border-radius:16px;
   background:linear-gradient(180deg,#e9eff3,#9aa3aa 40%,#6c757c);
   box-shadow:0 1px 0 rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.5);
   display:grid;place-items:center}
 .razr .rocker .ok{width:26px;height:16px;border-radius:9px;background:linear-gradient(180deg,#5b646b,#2f363b);
   box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
 /* the pad is ONE etched sheet: no gaps between keys, only hairline cuts */
 .sheet{position:relative;border-radius:4px;overflow:hidden;
   background:linear-gradient(180deg,#dfe6eb,#b3bcc3 55%,#8f989f);
   box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 5px rgba(0,0,0,.45)}
 .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:repeating-linear-gradient(72deg,rgba(60,70,78,.55) 0 1px,transparent 1px 44px)}
 .sheet .grid{display:grid;grid-template-columns:repeat(3,1fr)}
 .sheet .k{padding:9px 2px 8px;text-align:center;position:relative;
   border-right:1px solid rgba(70,80,88,.45);border-bottom:1px solid rgba(70,80,88,.45)}
 .sheet .k:nth-child(3n){border-right:none}
 .sheet .k:nth-child(n+10){border-bottom:none}
 .sheet .k .n{font-family:Inter,sans-serif;font-size:15px;font-weight:600;color:#2a3138;line-height:1}
 .sheet .k .l{font-family:Inter,sans-serif;font-size:6px;font-weight:600;color:#5d6870;
   letter-spacing:.16em;margin-top:2px;text-transform:uppercase}
 .sheet .k.lit{background:radial-gradient(circle at 50% 45%,rgba(120,200,255,.85),rgba(120,200,255,.15) 70%)}
 .sheet .k.lit .n,.sheet .k.lit .l{color:#06222f}
 </style>${hdr("MOTOROLA RAZR V3")}<div class="w">
  <div class="razr">
   <div class="half lid"><div class="glass">
     <div class="brandrow"><span>ANGELCOM</span><span>V3</span></div>
     <div class="lcd"><div class="st"><span>&#9646;&#9646;&#9646;&#9647;</span><span>03/20</span></div>
       <div class="tgt">${LINE}</div><div class="txt">${TYPED}<span class="cur"></span></div></div>
   </div></div>
   <div class="hinge"><span class="knob"></span><span class="barrel"></span><span class="knob"></span></div>
   <div class="half base">
     <div class="nav"><span class="soft">BACK</span><span class="rocker"><span class="ok"></span></span><span class="soft">MENU</span></div>
     <div class="sheet"><div class="grid">${K.map(([n,l],i)=>
       `<div class="k ${n==="6"?"lit":""}"><div class="n">${n}</div><div class="l">${l||"&nbsp;"}</div></div>`).join("")}</div></div>
   </div>
  </div>${side()}</div>`;}

/* ============================================================
   2. NOKIA 3310. A brick with shoulders: the body tapers, the
   keys sit in curved rows, and the navi-key is the big soft
   rounded lozenge everyone remembers.
   ============================================================ */
function d2(){return `<style>
 .n33{width:250px;padding:16px 15px 22px;position:relative;
   border-radius:44px 44px 30px 30px / 30px 30px 22px 22px;
   background:linear-gradient(150deg,#5d6a78,#39434e 30%,#2a323b 62%,#454f5b);
   box-shadow:0 34px 54px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,255,255,.16),
     inset 0 -3px 8px rgba(0,0,0,.6);
   transform:perspective(1400px) rotateX(7deg) rotateY(7deg)}
 .n33 .earpiece{width:56px;height:6px;border-radius:4px;margin:0 auto 12px;
   background:#171c22;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
 .n33 .brand{font-family:Inter,sans-serif;font-size:8px;font-weight:700;letter-spacing:.42em;
   color:#9fb0c1;text-align:center;margin-bottom:9px}
 .n33 .screen{background:#9fb08a;border-radius:5px;padding:8px 8px 9px;
   border:2px solid #1b2128;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
 .n33 .screen .st{display:flex;justify-content:space-between;font-size:7px;color:#4a5540;letter-spacing:.12em}
 .n33 .screen .tgt{font-size:8.5px;color:#68724f;line-height:1.6;margin-top:4px}
 .n33 .screen .txt{font-size:12px;color:#1d2418;line-height:1.5;word-break:break-word}
 .n33 .screen .cur{display:inline-block;width:5px;height:11px;background:#1d2418;vertical-align:-2px}
 /* the navi row: two soft keys flanking the lozenge */
 .n33 .navrow{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 12px}
 .n33 .sk{width:44px;height:17px;border-radius:9px 9px 3px 3px;
   background:linear-gradient(180deg,#748496,#3c4550);box-shadow:0 2px 3px rgba(0,0,0,.55)}
 .n33 .navi{width:86px;height:26px;border-radius:14px;
   background:linear-gradient(180deg,#8b9bad,#4d5764 60%,#39424c);
   box-shadow:0 3px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35);
   display:grid;place-items:center;font-family:Inter,sans-serif;font-size:8px;
   font-weight:700;letter-spacing:.2em;color:#cbd7e2}
 /* key rows arc outward, the way the 3310's rubber mat does */
 .n33 .rows{display:flex;flex-direction:column;gap:6px}
 .n33 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
 .n33 .row:nth-child(1){transform:rotate(-.6deg)}
 .n33 .row:nth-child(3){transform:rotate(.4deg)}
 .n33 .row:nth-child(4){transform:rotate(.9deg)}
 .n33 .kk{padding:7px 0 6px;text-align:center;border-radius:14px/9px;
   background:linear-gradient(180deg,#8090a2,#4a5460 55%,#39424c);
   box-shadow:0 3px 4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4)}
 .n33 .kk .n{font-family:Inter,sans-serif;font-size:14px;font-weight:700;color:#e8eff5;line-height:1}
 .n33 .kk .l{font-family:Inter,sans-serif;font-size:6px;font-weight:600;letter-spacing:.14em;
   color:#aebbc8;margin-top:1px;text-transform:uppercase}
 .n33 .kk.lit{background:linear-gradient(180deg,#cfe4f6,#7fa9cc);box-shadow:0 0 16px rgba(140,200,255,.6)}
 .n33 .kk.lit .n,.n33 .kk.lit .l{color:#16222c}
 </style>${hdr("NOKIA-STYLE BRICK")}<div class="w">
  <div class="n33">
   <div class="earpiece"></div>
   <div class="brand">ANGELCOM</div>
   <div class="screen"><div class="st"><span>&#9646;&#9646;&#9646;</span><span>03/20</span></div>
     <div class="tgt">${LINE}</div><div class="txt">${TYPED}<span class="cur"></span></div></div>
   <div class="navrow"><span class="sk"></span><span class="navi">MENU</span><span class="sk"></span></div>
   <div class="rows">
    ${[0,3,6,9].map(o=>`<div class="row">${K.slice(o,o+3).map(([n,l])=>
      `<div class="kk ${n==="6"?"lit":""}"><div class="n">${n}</div><div class="l">${l||"&nbsp;"}</div></div>`).join("")}</div>`).join("")}
   </div>
  </div>${side()}</div>`;}

/* ============================================================
   3. Y2K GLOSS FLIP, half-folded and shot from above so the two
   halves sit at different angles. Bubblegum lacquer, chrome
   trim, a charm on a strap.
   ============================================================ */
function d3(){return `<style>
 .flipwrap{width:330px;perspective:1200px;filter:drop-shadow(20px 44px 40px rgba(0,0,0,.8))}
 .flip{transform-style:preserve-3d;transform:rotateX(16deg) rotateZ(-7deg)}
 .lidp,.basep{border-radius:22px;position:relative;
   background:linear-gradient(140deg,#ffd7ea 0%,#ff8fc0 26%,#e55a97 60%,#ff9fc8 88%);
   box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -6px 14px rgba(150,20,80,.4),
     0 6px 14px rgba(0,0,0,.5)}
 /* the lacquer highlight that makes it read as glossy plastic */
 .lidp::before,.basep::before{content:"";position:absolute;left:8%;right:34%;top:5%;height:34%;
   border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),transparent);
   filter:blur(5px);pointer-events:none}
 .lidp{padding:16px 15px 20px;transform:rotateX(-24deg);transform-origin:bottom center}
 .basep{padding:16px 15px 20px;margin-top:9px}
 .chrome{height:9px;margin:0 26px;border-radius:5px;
   background:linear-gradient(180deg,#ffffff,#c9ced6 40%,#7f858d);box-shadow:0 2px 4px rgba(0,0,0,.55)}
 .lidp .glass{background:#101014;border-radius:12px;padding:10px 10px 12px;
   box-shadow:inset 0 3px 9px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.6)}
 .lcd3{background:linear-gradient(180deg,#1a1030,#0d0819);border-radius:6px;padding:9px 8px;min-height:104px;
   box-shadow:inset 0 0 22px rgba(200,120,255,.16)}
 .lcd3 .st{display:flex;justify-content:space-between;font-size:7px;color:#a06fd8;letter-spacing:.14em;margin-bottom:6px}
 .lcd3 .tgt{font-size:8.5px;color:#7a5aa8;line-height:1.65}
 .lcd3 .txt{font-size:12px;color:#f3d4ff;line-height:1.5;text-shadow:0 0 9px rgba(220,150,255,.7);word-break:break-word}
 .lcd3 .cur{display:inline-block;width:5px;height:12px;background:#f3d4ff;vertical-align:-2px}
 .dpad{width:74px;height:74px;border-radius:50%;margin:10px auto 12px;position:relative;
   background:conic-gradient(from 45deg,#fff0f7,#f0a8cd,#fff0f7,#e78ab8,#fff0f7);
   box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 -3px 6px rgba(160,40,100,.45)}
 .dpad::after{content:"";position:absolute;inset:24px;border-radius:50%;
   background:linear-gradient(180deg,#fff,#d5dbe2);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
 .padg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
 .padg .kk{border-radius:11px;padding:8px 0 7px;text-align:center;
   background:linear-gradient(180deg,#fffdfe,#ffe2ef 55%,#f6bcd8);
   box-shadow:0 3px 5px rgba(140,20,80,.45),inset 0 1px 0 #fff}
 .padg .kk .n{font-family:Inter,sans-serif;font-size:15px;font-weight:600;color:#8d2559;line-height:1}
 .padg .kk .l{font-family:Inter,sans-serif;font-size:6px;font-weight:600;letter-spacing:.14em;
   color:#c06192;margin-top:1px;text-transform:uppercase}
 .padg .kk.lit{background:linear-gradient(180deg,#fff,#b9e4ff);box-shadow:0 0 18px rgba(140,210,255,.85)}
 .padg .kk.lit .n{color:#0d3a55}.padg .kk.lit .l{color:#3d6f8c}
 /* a charm on a wrist strap, hanging off the hinge corner */
 .charm{position:absolute;right:-30px;top:150px;width:2px;height:56px;
   background:linear-gradient(180deg,#d9dee4,#8d949c);transform:rotate(9deg)}
 .charm::after{content:"";position:absolute;left:-9px;bottom:-17px;width:20px;height:20px;
   border-radius:50% 50% 50% 0;transform:rotate(-45deg);
   background:radial-gradient(circle at 34% 30%,#fff,#ff5fa2 55%,#c01d68);
   box-shadow:0 3px 6px rgba(0,0,0,.6)}
 </style>${hdr("Y2K GLOSS FLIP")}<div class="w">
  <div class="flipwrap"><div class="flip">
   <div class="lidp"><div class="glass">
     <div class="lcd3"><div class="st"><span>ANGELCOM</span><span>03/20</span></div>
       <div class="tgt">${LINE}</div><div class="txt">${TYPED}<span class="cur"></span></div></div>
   </div></div>
   <div class="chrome"></div>
   <div class="basep">
     <div class="dpad"></div>
     <div class="padg">${K.map(([n,l])=>
       `<div class="kk ${n==="6"?"lit":""}"><div class="n">${n}</div><div class="l">${l||"&nbsp;"}</div></div>`).join("")}</div>
     <div class="charm"></div>
   </div>
  </div></div>${side()}</div>`;}

/* ============================================================
   4. VERTICAL SLIDER, pushed open. Two shells with a visible
   slide seam and a shadow where the top half overhangs the pad.
   Gunmetal with a piano-black fascia.
   ============================================================ */
function d4(){return `<style>
 .sl{width:268px;position:relative;transform:perspective(1500px) rotateX(8deg) rotateY(-11deg);
   filter:drop-shadow(28px 42px 40px rgba(0,0,0,.85))}
 .sl .top{position:relative;z-index:3;border-radius:20px 20px 8px 8px;padding:15px 14px 17px;
   background:linear-gradient(120deg,#31363c,#14181c 40%,#23282e 70%,#0e1114);
   border:1px solid #454b52;
   box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 22px rgba(0,0,0,.75)}
 .sl .grille{width:48px;height:5px;border-radius:3px;margin:0 auto 11px;background:#05070a;
   box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12)}
 .sl .glass{background:#05070a;border-radius:8px;padding:9px 9px 11px;
   box-shadow:inset 0 2px 8px #000,0 1px 0 rgba(255,255,255,.18)}
 .lcd4{background:linear-gradient(180deg,#071c26,#030d13);border-radius:4px;padding:9px 8px;min-height:112px;
   box-shadow:inset 0 0 24px rgba(0,190,255,.12)}
 .lcd4 .st{display:flex;justify-content:space-between;font-size:7px;color:#3d8fb0;letter-spacing:.14em;margin-bottom:6px}
 .lcd4 .tgt{font-size:8.5px;color:#2b6b85;line-height:1.65}
 .lcd4 .txt{font-size:12px;color:#a9ecff;line-height:1.5;text-shadow:0 0 9px rgba(90,210,255,.6);word-break:break-word}
 .lcd4 .cur{display:inline-block;width:5px;height:12px;background:#a9ecff;vertical-align:-2px}
 .sl .navs{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
 .sl .navs .sk{width:38px;height:12px;border-radius:6px;background:linear-gradient(180deg,#4b525a,#22272c)}
 .sl .ring{width:52px;height:52px;border-radius:50%;
   background:conic-gradient(from 210deg,#5c646d,#aab3bc,#4a5158,#98a1aa,#5c646d);
   box-shadow:0 3px 7px rgba(0,0,0,.7);display:grid;place-items:center}
 .sl .ring::after{content:"";width:24px;height:24px;border-radius:50%;
   background:linear-gradient(180deg,#2b3137,#13171b);box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
 /* the lower shell peeks out below and is overhung by the top */
 .sl .bot{position:relative;z-index:1;margin-top:-8px;padding:20px 12px 15px;
   border-radius:0 0 22px 22px;
   background:linear-gradient(120deg,#2a2f35,#171b20 55%,#0c0f12);border:1px solid #3c4249;border-top:none}
 .sl .bot::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;
   background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
 .sl .padg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 6px}
 .sl .kk{padding:7px 0 6px;text-align:center;border-radius:3px;
   background:linear-gradient(180deg,#3a4048,#1e2328);box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14)}
 .sl .kk .n{font-family:Inter,sans-serif;font-size:14px;font-weight:500;color:#e7edf3;line-height:1}
 .sl .kk .l{font-family:Inter,sans-serif;font-size:6px;letter-spacing:.16em;color:#8d97a1;margin-top:2px;text-transform:uppercase}
 .sl .kk.lit{background:linear-gradient(180deg,#8fd6ff,#3c93c9);box-shadow:0 0 18px rgba(120,200,255,.8)}
 .sl .kk.lit .n,.sl .kk.lit .l{color:#04202e}
 </style>${hdr("SLIDER, PUSHED OPEN")}<div class="w">
  <div class="sl">
   <div class="top">

   <div class="bot"><div class="padg">${K.map(([n,l])=>

/* ============================================================

   instead of a D-pad, and the keys splayed in a fan so the
   thumb reaches the far corners.
   ============================================================ */
function d5(){return `<style>
 .se{width:224px;padding:14px 13px 20px;position:relative;
   border-radius:26px 26px 34px 34px / 22px 22px 40px 40px;
   background:linear-gradient(155deg,#f2f5f7,#c3cbd2 30%,#98a1a9 58%,#dfe5ea 80%,#8d959d);
   box-shadow:0 32px 50px rgba(0,0,0,.85),inset 0 2px 0 #fff,inset 0 -4px 10px rgba(0,0,0,.35);
   transform:perspective(1300px) rotateX(9deg) rotateY(8deg)}
 .se .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
 .se .spk{width:40px;height:5px;border-radius:3px;background:#5c646b;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
 .se .lg{font-family:Inter,sans-serif;font-size:7px;font-weight:700;letter-spacing:.34em;color:#69727a}
 .se .glass{background:#0b0e11;border-radius:6px;padding:8px;box-shadow:inset 0 2px 6px #000,0 1px 0 #fff}
 .lcd5{background:linear-gradient(180deg,#12203a,#080e1c);border-radius:3px;padding:8px 7px;min-height:96px;
   box-shadow:inset 0 0 18px rgba(90,150,255,.14)}
 .lcd5 .st{display:flex;justify-content:space-between;font-size:6.5px;color:#5f86c4;letter-spacing:.14em;margin-bottom:5px}
 .lcd5 .tgt{font-size:8px;color:#4a68a0;line-height:1.6}
 .lcd5 .txt{font-size:11.5px;color:#cfe0ff;line-height:1.5;text-shadow:0 0 8px rgba(140,180,255,.6);word-break:break-word}
 .lcd5 .cur{display:inline-block;width:5px;height:11px;background:#cfe0ff;vertical-align:-2px}
 /* joystick nub with two crescent soft keys either side */
 .se .jsrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 11px}
 .se .cres{width:44px;height:20px;border-radius:22px 22px 6px 6px;
   background:linear-gradient(180deg,#e9eef2,#9099a1);box-shadow:0 2px 4px rgba(0,0,0,.5)}
 .se .cres.r{border-radius:22px 22px 6px 6px;transform:scaleX(-1)}
 .se .js{width:26px;height:26px;border-radius:50%;
   background:radial-gradient(circle at 36% 30%,#ffffff,#aeb7bf 45%,#565e66 100%);
   box-shadow:0 3px 6px rgba(0,0,0,.7),inset 0 -2px 3px rgba(0,0,0,.4)}
 /* fanned rows: each row is rotated a touch more than the last */
 .se .fan{display:flex;flex-direction:column;gap:5px}
 .se .row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
 .se .row:nth-child(1){transform:rotate(-1.6deg)}
 .se .row:nth-child(2){transform:rotate(-.5deg)}
 .se .row:nth-child(3){transform:rotate(.6deg)}
 .se .row:nth-child(4){transform:rotate(1.7deg)}
 .se .kk{padding:6px 0 5px;text-align:center;border-radius:9px 9px 5px 5px;
   background:linear-gradient(180deg,#fbfdfe,#d3dae0 60%,#aab3bb);
   box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 #fff}
 .se .kk .n{font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#2f363d;line-height:1}
 .se .kk .l{font-family:Inter,sans-serif;font-size:5.5px;font-weight:600;letter-spacing:.14em;
   color:#767f88;margin-top:1px;text-transform:uppercase}
 .se .kk.lit{background:linear-gradient(180deg,#e6f5ff,#8cc4ea);box-shadow:0 0 16px rgba(130,200,250,.85)}
 .se .kk.lit .n,.se .kk.lit .l{color:#0b3247}
 </style>${hdr("POCKET CANDYBAR, JOYSTICK")}<div class="w">
  <div class="se">
   <div class="top"><span class="spk"></span><span class="lg">ANGELCOM</span></div>
   <div class="glass"><div class="lcd5"><div class="st"><span>&#9646;&#9646;&#9647;&#9647;</span><span>03/20</span></div>
     <div class="tgt">${LINE}</div><div class="txt">${TYPED}<span class="cur"></span></div></div></div>
   <div class="jsrow"><span class="cres"></span><span class="js"></span><span class="cres r"></span></div>
   <div class="fan">${[0,3,6,9].map(o=>`<div class="row">${K.slice(o,o+3).map(([n,l])=>
     `<div class="kk ${n==="6"?"lit":""}"><div class="n">${n}</div><div class="l">${l||"&nbsp;"}</div></div>`).join("")}</div>`).join("")}</div>
  </div>${side()}</div>`;}

/* ============================================================

   recessed screen behind a scratched bezel, oversized gloved

   box-shadow:0 4px 0 #0b0c0e,inset 0 1px 0 rgba(255,255,255,.22)}
 .rg .kk .n{font-family:Inter,sans-serif;font-size:16px;font-weight:700;color:#f4f7fa;line-height:1}
 .rg .kk .l{font-family:Inter,sans-serif;font-size:6px;font-weight:700;letter-spacing:.16em;
   color:#ffb44d;margin-top:2px;text-transform:uppercase}
 .rg .kk.lit{background:linear-gradient(180deg,#ffd88a,#e8901c);box-shadow:0 2px 0 #7c4d09,0 0 20px rgba(255,180,60,.75)}
 .rg .kk.lit .n{color:#2a1700}.rg .kk.lit .l{color:#5a3300}
 </style>${hdr("RUGGED SITE PHONE")}<div class="w">
  <div class="rg">
   <div class="screws"><i></i><i></i><i></i><i></i></div>
   <div class="plate">
     <div class="lcd6"><div class="st"><span>ANGELCOM IP68</span><span>03/20</span></div>
       <div class="tgt">${LINE}</div><div class="txt">${TYPED}<span class="cur"></span></div></div>
     <div class="bigrow"><span class="sk"></span><span class="ok"></span><span class="sk"></span></div>
     <div class="padg">${K.map(([n,l])=>
       `<div class="kk ${n==="6"?"lit":""}"><div class="n">${n}</div><div class="l">${l||"&nbsp;"}</div></div>`).join("")}</div>

const DS=[d1,d2,d3,d4,d5,d6];
const NM=["1 · motorola razr v3","2 · nokia brick","3 · y2k gloss flip",
  "4 · slider, pushed open","5 · pocket candybar","6 · rugged site phone"];
const n=Math.min(DS.length,Math.max(1,parseInt(new URLSearchParams(location.search).get("d")||"1",10)));

</script></body></html>
