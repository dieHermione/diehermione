<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chess mockups v3</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Third attempt. The terminal restriction is lifted for this batch: the first
     two were rejected for being ten versions of the same dark panel. Each design
     below is a different material world, and each one has to solve the same
     problem: Hermione gets STRIKE (delete an opponent's piece on her turn) and
     REWIND, and the opponent must never see that those controls exist. The
     dashed outline marks the block that is only ever rendered for her. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;font-family:Inter,system-ui,sans-serif;font-size:14px}
  .stage{position:absolute;inset:0;overflow:hidden}
  .tag{position:fixed;right:8px;bottom:6px;z-index:300;color:#888;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;mix-blend-mode:difference}
  .secret-note{position:fixed;left:10px;bottom:8px;z-index:300;font-family:"IBM Plex Mono",monospace;
    font-size:9px;letter-spacing:.16em;color:#888;mix-blend-mode:difference}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="secret-note">DASHED OUTLINE = HERMIONE ONLY, NEVER RENDERED FOR THE OPPONENT</div>
<div class="tag" id="tag"></div>
<script>
/* a mid-game position, white to move */
const POS=[
 "r..q.rk.",
 "pp..bppp",
 "..n.pn..",
 "..bp....",
 "...P.B..",
 "..N.PN..",
 "PPQ..PPP",
 "R...KB.R"];
const GLYPH={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const MOVES=[["1.","d4","Nf6"],["2.","c4","e6"],["3.","Nc3","Bb4"],["4.","Qc2","O-O"],
  ["5.","e3","d5"],["6.","Nf3","c5"],["7.","Bd2","Nc6"],["8.","a3","Bxc3"],
  ["9.","Bxc3","Ne4"],["10.","Bf4","Bd6"]];
const TAKEN_W="♟♟♞", TAKEN_B="♟♝";

/* One board renderer, restyled per design: two square colours, two piece
   colours, a square size, and optional coordinates. Solid glyphs throughout,
   recoloured by side, because outline glyphs vanish on a light square. */
function board(o){
  let html = `<div class="bd" style="--lt:${o.light};--dk:${o.dark};--pw:${o.white};--pb:${o.black};
    --sq:${o.sq||58}px">`;
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const ch = POS[r][f];
      const dark = (r + f) % 2 === 1;
      const isWhite = ch !== "." && ch === ch.toUpperCase();
      // the last move, f4 to h6, so every design shows a highlighted pair
      const mark = (r === 4 && f === 5) || (r === 2 && f === 5) ? " last" : "";
      html += `<div class="sq${dark ? " d" : ""}${mark}">`;
      if (ch !== ".") html += `<span class="pc ${isWhite ? "w" : "b"}">${GLYPH[ch.toLowerCase()]}</span>`;
      if (o.coord && f === 0) html += `<i class="rk">${8 - r}</i>`;
      if (o.coord && r === 7) html += `<i class="fl">${"abcdefgh"[f]}</i>`;
      html += `</div>`;
    }
  }
  return html + `</div>`;
}
const BOARD_CSS = `
 .bd{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq))}
 .sq{position:relative;background:var(--lt);display:grid;place-items:center}
 .sq.d{background:var(--dk)}
 .sq.last{box-shadow:inset 0 0 0 3px rgba(255,205,80,.8)}
 .pc{font-size:calc(var(--sq) * .74);line-height:1;user-select:none}
 .pc.w{color:var(--pw);text-shadow:0 1px 1px rgba(0,0,0,.4)}
 .pc.b{color:var(--pb);text-shadow:0 1px 1px rgba(255,255,255,.14)}
 .rk{position:absolute;left:3px;top:2px;font-size:9px;font-style:normal;opacity:.5}
 .fl{position:absolute;right:3px;bottom:1px;font-size:9px;font-style:normal;opacity:.5}`;

/* ============================================================
   1. MARBLE GALLERY. Cut stone, brass frame, museum labels.
   ============================================================ */
function d1(){return `<style>${BOARD_CSS}
 .g1{position:absolute;inset:0;display:grid;grid-template-columns:290px 1fr 290px;align-items:center;
   gap:2.2rem;padding:4vh 4vw;color:#3b3630;font-family:Cinzel,serif;
   background-image:radial-gradient(120% 90% at 20% 8%,rgba(255,255,255,.9),transparent 60%),
     repeating-linear-gradient(58deg,rgba(150,140,125,.10) 0 2px,transparent 2px 90px),
     linear-gradient(150deg,#efe9df,#ded5c7 45%,#cec3b2)}
 .g1 .frame{justify-self:center;padding:20px;
   background:linear-gradient(160deg,#d9b56a,#9c7a33 40%,#e6cd93 70%,#8e6d2c);
   box-shadow:0 30px 60px rgba(70,55,30,.45),inset 0 0 0 2px rgba(255,240,200,.5)}
 .g1 .frame .in{padding:10px;background:#efe9df;box-shadow:inset 0 0 0 1px #b8a37a}
 .g1 h1{font-size:2.4rem;font-weight:400;line-height:1}
 .g1 .sub{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.4em;
   text-transform:uppercase;color:#8a7d68;margin-top:.5rem}
 .plaque{margin-top:1.5rem;padding:.9rem 1rem;background:linear-gradient(160deg,#c8a45c,#8d6f2e);
   color:#2a2109;box-shadow:0 6px 14px rgba(70,55,30,.4)}
 .plaque .r{display:flex;justify-content:space-between;font-family:Inter,sans-serif;
   font-size:10px;letter-spacing:.14em;padding:.18rem 0;text-transform:uppercase}
 .g1 .moves{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:2;color:#5d5342}
 .g1 .moves b{color:#2c261c;font-weight:500}
 .g1 .cap{font-size:1.7rem;color:#6d6252;letter-spacing:.1em}
 .g1 .lbl{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.34em;color:#9a8d76;
   text-transform:uppercase;margin:1.3rem 0 .4rem}
 .hcx1{margin-top:1.3rem;padding:.9rem;border:1.5px dashed #a9702f;background:rgba(200,150,70,.16)}
 .hcx1 .t{font-family:Inter,sans-serif;font-size:8px;letter-spacing:.3em;color:#8a5a20;text-transform:uppercase}
 .hcx1 .b{display:flex;gap:.5rem;margin-top:.6rem}
 .hcx1 button{flex:1;font-family:Cinzel,serif;font-size:.8rem;padding:.5rem;cursor:pointer;
   border:1px solid #8d6f2e;background:linear-gradient(180deg,#f2e5c4,#d3b878);color:#42350f}
 </style>
 <div class="g1">
  <div>
   <h1>Hermione</h1><div class="sub">Archangel &middot; white</div>
   <div class="plaque">
     <div class="r"><span>Clock</span><span>08:42</span></div>
     <div class="r"><span>Captured</span><span>${TAKEN_B}</span></div>
     <div class="r"><span>Standing</span><span>+1.4</span></div>
   </div>
   <div class="hcx1"><div class="t">Curator's tools</div>
     <div class="b"><button>Strike</button><button>Rewind</button></div></div>
  </div>
  <div class="frame"><div class="in">${board({light:"#f2ece1",dark:"#b0a288",white:"#fbf8f2",black:"#3b342b",sq:62,coord:1})}</div></div>
  <div>
   <h1 style="text-align:right">seraph</h1>
   <div class="sub" style="text-align:right">Devoted &middot; black</div>
   <div class="lbl" style="text-align:right">Record of play</div>
   <div class="moves">${MOVES.map(([n,w,b])=>`<div>${n} <b>${w}</b> &nbsp; ${b}</div>`).join("")}</div>
   <div class="lbl" style="text-align:right">Taken</div>
   <div class="cap" style="text-align:right">${TAKEN_W}</div>
  </div>
 </div>`;}

/* ============================================================
   2. VICTORIAN PARLOUR. Green baize, mahogany, gaslight.
   ============================================================ */
function d2(){return `<style>${BOARD_CSS}
 .g2{position:absolute;inset:0;padding:4vh 5vw;color:#e8dcc4;font-family:"Playfair Display",serif;
   display:grid;grid-template-columns:1fr auto 1fr;gap:3rem;align-items:center;
   background:radial-gradient(70% 70% at 50% 34%,#33502f,#1d3020 55%,#0d1710)}
 .g2::after{content:"";position:absolute;inset:0;pointer-events:none;
   background:radial-gradient(58% 58% at 50% 40%,transparent 40%,rgba(0,0,0,.72))}
 .g2 > div{position:relative;z-index:2}
 .g2 .who{font-size:2.6rem;font-weight:400;font-style:italic;line-height:1;color:#f3e6c8}
 .g2 .rank{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.38em;text-transform:uppercase;
   color:#a99a72;margin-top:.6rem}
 .g2 .clock{font-size:3.4rem;color:#f7edd5;margin-top:1.1rem;line-height:1}
 .g2 .cap{font-size:1.9rem;color:#b8a97e;margin-top:.4rem}
 .g2 .tablewrap{position:relative;padding:26px;
   background:linear-gradient(160deg,#6b3f1e,#3e2210 55%,#5a331a);
   box-shadow:0 40px 80px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,205,150,.35)}
 .g2 .tablewrap::before{content:"";position:absolute;inset:14px;border:2px solid rgba(230,190,130,.35)}
 .g2 .ledger{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:2.05;color:#c6b58c;
   column-count:2;column-gap:1.4rem}
 .g2 .ledger b{color:#f7edd5;font-weight:500}
 .g2 .lbl{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.36em;color:#8f8259;
   text-transform:uppercase;margin:1.5rem 0 .5rem}
 .hcx2{margin-top:1.4rem;padding:1rem 1.1rem;border:1.5px dashed #c39a4a;background:rgba(200,150,60,.14)}
 .hcx2 .t{font-family:Inter,sans-serif;font-size:8px;letter-spacing:.3em;color:#d7b268;text-transform:uppercase}
 .hcx2 .b{display:flex;gap:.6rem;margin-top:.7rem}
 .hcx2 button{flex:1;font-family:"Playfair Display",serif;font-style:italic;font-size:1rem;padding:.5rem;
   cursor:pointer;border:1px solid #c39a4a;color:#3a2408;background:linear-gradient(180deg,#f0dba8,#c9a45e)}
 </style>
 <div class="g2">
  <div>
   <div class="who">Hermione</div><div class="rank">Archangel &middot; plays white</div>
   <div class="clock">08:42</div><div class="cap">${TAKEN_B}</div>
   <div class="hcx2"><div class="t">Privileges of the house</div>
     <div class="b"><button>Strike a piece</button><button>Rewind</button></div></div>
  </div>
  <div class="tablewrap">${board({light:"#e7d9b4",dark:"#7d5a34",white:"#fdf7e6",black:"#241a10",sq:62,coord:1})}</div>
  <div>
   <div class="who" style="text-align:right">seraph</div>
   <div class="rank" style="text-align:right">Devoted &middot; plays black</div>
   <div class="clock" style="text-align:right">07:15</div>
   <div class="cap" style="text-align:right">${TAKEN_W}</div>
   <div class="lbl" style="text-align:right">The ledger</div>
   <div class="ledger">${MOVES.map(([n,w,b])=>`<div>${n} <b>${w}</b> ${b}</div>`).join("")}</div>
  </div>
 </div>`;}

/* ============================================================
   3. ART DECO. Black lacquer, gold inlay, fan motifs, symmetry.
   ============================================================ */
function d3(){return `<style>${BOARD_CSS}
 .g3{position:absolute;inset:0;padding:3.4vh 4vw;color:#e8d69c;
   display:grid;grid-template-rows:auto 1fr;gap:1.4rem;background:#0b0b0d;
   background-image:repeating-linear-gradient(90deg,rgba(200,165,85,.10) 0 1px,transparent 1px 46px),
     radial-gradient(70% 60% at 50% 0%,rgba(200,165,85,.16),transparent 65%)}
 .g3 .top{display:flex;justify-content:space-between;align-items:flex-end;
   border-bottom:3px double #b99742;padding-bottom:.7rem}
 .g3 h1{font-family:"Bebas Neue",sans-serif;font-size:3.2rem;letter-spacing:.18em;line-height:.9;color:#f0dfa8}
 .g3 .tl{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.5em;color:#8d7635;text-transform:uppercase}
 .g3 .body{display:grid;grid-template-columns:1fr auto 1fr;gap:2.2rem;align-items:center}
 .g3 .fan{height:52px;margin-bottom:.9rem;background:
   conic-gradient(from 200deg at 50% 100%,transparent 0 8deg,#b99742 8deg 10deg,transparent 10deg 22deg,
   #b99742 22deg 24deg,transparent 24deg 36deg,#b99742 36deg 38deg,transparent 38deg 50deg,
   #b99742 50deg 52deg,transparent 52deg 64deg,#b99742 64deg 66deg,transparent 66deg 80deg)}
 .g3 .card{border:1px solid #6d5a26;padding:1.1rem 1.2rem;background:linear-gradient(180deg,#141317,#0b0b0d)}
 .g3 .nm{font-family:"Bebas Neue",sans-serif;font-size:2.1rem;letter-spacing:.16em;color:#f0dfa8;line-height:1}
 .g3 .rk2{font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.36em;color:#8d7635;text-transform:uppercase}
 .g3 .clk{font-family:"Bebas Neue",sans-serif;font-size:3.4rem;letter-spacing:.1em;color:#fff4cf;
   line-height:1;margin-top:.5rem}
 .g3 .cap{font-size:1.6rem;color:#8d7635}
 .g3 .brd{padding:14px;background:linear-gradient(160deg,#c8a44d,#7a6023);
   box-shadow:0 0 0 3px #0b0b0d,0 0 0 5px #c8a44d,0 30px 60px rgba(0,0,0,.9)}
 .g3 .mv{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.95;color:#a08c52;
   column-count:2;column-gap:1.2rem;margin-top:.9rem}
 .g3 .mv b{color:#f0dfa8;font-weight:500}
 .hcx3{margin-top:1rem;padding:.9rem 1rem;border:1.5px dashed #d8b657;
   background:repeating-linear-gradient(45deg,rgba(216,182,87,.12) 0 6px,transparent 6px 12px)}
 .hcx3 .t{font-family:Inter,sans-serif;font-size:8px;letter-spacing:.3em;color:#d8b657;text-transform:uppercase}
 .hcx3 .b{display:flex;gap:.5rem;margin-top:.7rem}
 .hcx3 button{flex:1;font-family:"Bebas Neue",sans-serif;font-size:1.1rem;letter-spacing:.16em;padding:.35rem;
   cursor:pointer;border:none;background:linear-gradient(180deg,#e7cd82,#a8873a);color:#171307}
 </style>
 <div class="g3">
  <div class="top"><h1>ANGELDOM CHESS CLUB</h1><span class="tl">Board One &middot; Round Nine</span></div>
  <div class="body">
   <div><div class="fan"></div>
    <div class="card"><div class="nm">HERMIONE</div><div class="rk2">Archangel &middot; white</div>
      <div class="clk">08:42</div><div class="cap">${TAKEN_B}</div></div>
    <div class="hcx3"><div class="t">House privileges</div>
      <div class="b"><button>STRIKE</button><button>REWIND</button></div></div>
   </div>
   <div class="brd">${board({light:"#efe3c0",dark:"#1c1b1f",white:"#fff8e2",black:"#c8a44d",sq:60})}</div>
   <div><div class="fan" style="transform:scaleX(-1)"></div>
    <div class="card"><div class="nm">SERAPH</div><div class="rk2">Devoted &middot; black</div>
      <div class="clk">07:15</div><div class="cap">${TAKEN_W}</div>
      <div class="mv">${MOVES.map(([n,w,b])=>`<div>${n} <b>${w}</b> ${b}</div>`).join("")}</div></div>
   </div>
  </div>
 </div>`;}

/* ============================================================
   4. BRUTALIST CONCRETE. Raw grey, enormous type, hard shadows.
   ============================================================ */
function d4(){return `<style>${BOARD_CSS}
 .g4{position:absolute;inset:0;color:#1a1a1a;display:grid;grid-template-columns:1fr 1fr;background:#b7b4ae;
   background-image:radial-gradient(90% 70% at 20% 0%,rgba(255,255,255,.5),transparent 60%),
     repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),
     radial-gradient(circle at 70% 60%,rgba(0,0,0,.08),transparent 40%)}
 .g4 .left{padding:5vh 3vw;display:flex;flex-direction:column;justify-content:space-between;
   border-right:10px solid #1a1a1a}
 .g4 h1{font-size:min(7vw,6.2rem);font-weight:800;letter-spacing:-.045em;line-height:.86;text-transform:uppercase}
 .g4 h1 small{display:block;font-size:.24em;font-weight:600;letter-spacing:.34em;margin-top:.7rem}
 .g4 .clockrow{display:flex;gap:2.6rem;margin-top:1.4rem}
 .g4 .clockrow div{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1}
 .g4 .clockrow span{display:block;font-size:9px;font-weight:700;letter-spacing:.3em;
   text-transform:uppercase;opacity:.6}
 .g4 .mv{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.9;column-count:2;
   column-gap:1.6rem;margin-top:1.2rem}
 .g4 .mv b{font-weight:600}
 .g4 .right{display:grid;place-items:center;padding:4vh 2vw}
 .g4 .slab{padding:22px;background:#1a1a1a;box-shadow:22px 22px 0 rgba(0,0,0,.35)}
 .hcx4{margin-top:1.2rem;border:3px dashed #1a1a1a;padding:1rem 1.1rem;background:#ffe03d}
 .hcx4 .t{font-size:9px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
 .hcx4 .b{display:flex;gap:.7rem;margin-top:.8rem}
 .hcx4 button{flex:1;font-family:inherit;font-size:1rem;font-weight:800;letter-spacing:.1em;
   text-transform:uppercase;padding:.7rem;cursor:pointer;border:3px solid #1a1a1a;background:#fff;color:#1a1a1a}
 .hcx4 button:last-child{background:#1a1a1a;color:#ffe03d}
 </style>
 <div class="g4">
  <div class="left">
   <div><h1>HERMIONE<small>ARCHANGEL / WHITE / TO MOVE</small></h1>
    <div class="clockrow"><div>08:42<span>white</span></div><div>07:15<span>black</span></div></div></div>
   <div>
    <div class="mv">${MOVES.map(([n,w,b])=>`<div>${n} <b>${w}</b> ${b}</div>`).join("")}</div>
    <div class="hcx4"><div class="t">Hermione only</div>
      <div class="b"><button>Strike</button><button>Rewind</button></div></div>
   </div>
  </div>
  <div class="right"><div class="slab">${board({light:"#e7e4dd",dark:"#5f5c57",white:"#ffffff",black:"#111111",sq:62})}</div></div>
 </div>`;}

/* ============================================================
   5. CIRRUS. The site's own sky theme: glass cards, drifting
   clouds, Quicksand. Chess as something gentle.
   ============================================================ */
function d5(){return `<style>${BOARD_CSS}
 .g5{position:absolute;inset:0;padding:4vh 4vw;font-family:Quicksand,sans-serif;color:#0d4a63;
   display:grid;grid-template-columns:1fr auto 1fr;gap:2.2rem;align-items:center;
   background:linear-gradient(180deg,#8fd8f2,#63bde3 62%,#52aed8)}
 .cl{position:absolute;border-radius:50%;filter:blur(6px);pointer-events:none;
   background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,0) 72%)}
 .g5 > div{position:relative;z-index:2}
 .g5 .glass{background:rgba(255,255,255,.82);border-radius:20px;padding:1.4rem 1.5rem;
   box-shadow:0 14px 40px rgba(10,70,100,.28)}
 .g5 .nm{font-size:2rem;font-weight:700;line-height:1}
 .g5 .rk2{font-size:.8rem;font-weight:600;color:#3f8fb0;margin-top:.2rem}
 .g5 .clk{font-size:3.1rem;font-weight:700;line-height:1;margin-top:.6rem;color:#1a7ba3}
 .g5 .cap{font-size:1.7rem;color:#5aa3c2}
 .g5 .mv{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:2;color:#3f7f9c;
   column-count:2;column-gap:1.2rem;margin-top:.8rem}
 .g5 .mv b{color:#0d4a63;font-weight:600}
 .g5 .brd{padding:16px;border-radius:22px;background:rgba(255,255,255,.9);
   box-shadow:0 24px 60px rgba(10,70,100,.35)}
 .g5 .brd .bd{border-radius:10px;overflow:hidden}
 .hcx5{margin-top:1rem;padding:1rem 1.1rem;border:2px dashed #ff8fbf;border-radius:16px;
   background:rgba(255,214,232,.78)}
 .hcx5 .t{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:#c03d78;text-transform:uppercase}
 .hcx5 .b{display:flex;gap:.6rem;margin-top:.7rem}
 .hcx5 button{flex:1;font-family:inherit;font-size:.92rem;font-weight:700;padding:.6rem;cursor:pointer;
   border:none;border-radius:999px;background:#ff7fb5;color:#fff;box-shadow:0 5px 12px rgba(200,50,120,.35)}
 .hcx5 button:last-child{background:#35b6e6;box-shadow:0 5px 12px rgba(20,120,170,.35)}
 </style>
 <div class="g5">
  <div class="cl" style="top:8%;left:4%;width:320px;height:100px"></div>
  <div class="cl" style="top:64%;left:66%;width:260px;height:86px"></div>
  <div class="cl" style="top:30%;left:80%;width:200px;height:66px"></div>
  <div>
   <div class="glass"><div class="nm">Hermione</div><div class="rk2">Archangel &middot; white</div>
     <div class="clk">08:42</div><div class="cap">${TAKEN_B}</div></div>
   <div class="hcx5"><div class="t">only Hermione sees this</div>
     <div class="b"><button>Strike</button><button>Rewind</button></div></div>
  </div>
  <div class="brd">${board({light:"#f2fbff",dark:"#7cc7e6",white:"#ffffff",black:"#124d68",sq:62})}</div>
