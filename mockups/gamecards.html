<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>game cards — 5 per game</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
/* Iteration surface: FIVE design options for one game at a time (?g=snake|
   penance|devotion|deathroll|elysium). Locked macOS window frame; bespoke
   interior per option. Text, where present, is real pool copy. Render one image
   per game; port the chosen option into views/games.html afterwards. */
* { box-sizing:border-box; margin:0; padding:0; }
:root { --dim:#4f7ea0; --dim2:#2c4a5e; --bright:#eafaff; --accent:#8fd0ff; }
html, body { height:100%; }
body { background:radial-gradient(120% 90% at 50% 0%, #0a1017, #05070b 70%); color:#aee3ff;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px; overflow:hidden; }
.scan { position:fixed; inset:0; z-index:200; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px); }
.stage { position:fixed; inset:0; padding:3.4vh 3vw; display:flex; flex-direction:column; }
.hdr { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.35em; color:var(--dim); text-transform:uppercase; }
.hdr b { color:var(--bright); font-weight:400; }
.row { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:1.5rem; }
.slot { display:flex; flex-direction:column; align-items:center; gap:.6rem; }
.slot .tag { font-size:.62rem; letter-spacing:.14em; color:var(--dim); text-transform:lowercase; }
.slot .tag b { color:var(--accent); font-weight:400; }

/* the macOS window frame */
.p { width:230px; height:300px; }
.frame-mac { position:relative; width:100%; height:100%; border:1px solid #26333f; border-radius:9px;
  overflow:hidden; background:#04060a; box-shadow:0 16px 38px rgba(0,0,0,.8); display:flex; flex-direction:column; }
.frame-mac .bar { display:flex; align-items:center; gap:.4rem; padding:.42rem .55rem; background:#0c1219; border-bottom:1px solid #1a2530; }
.frame-mac .bar i { width:8px; height:8px; border-radius:50%; }
.frame-mac .bar .r{background:#ff5f57}.frame-mac .bar .y{background:#febc2e}.frame-mac .bar .g{background:#28c840}
.frame-mac .bar .t { margin-left:.3rem; font-size:.58rem; color:#93a7ba; }
.frame-mac .win { position:relative; flex:1; min-height:0; overflow:hidden; background:var(--wb,#04060a); }
.frame-mac .win.fade::after { content:""; position:absolute; left:0; right:0; bottom:0; height:34%;
  background:linear-gradient(180deg, transparent, rgba(4,6,10,.92)); pointer-events:none; z-index:4; }
.frame-mac .lbl { position:absolute; bottom:7px; left:10px; z-index:6; font-size:1.02rem; font-weight:700;
  letter-spacing:.05em; color:#fff; text-shadow:0 0 12px var(--a); }

/* shared helpers */
.full { position:absolute; inset:0; }
.svg { position:absolute; inset:0; width:100%; height:100%; }
.mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1rem; }
.padc { position:absolute; inset:0; padding:.85rem .85rem 1.9rem; display:flex; flex-direction:column; }
.rl { white-space:nowrap; }

/* penance/devotion text tones */
.tred { color:#ff6a5c; } .tred-d { color:#8a3a34; }
.tblu { color:#9fc4e0; } .tblu-b { color:#eafaff; }
.cur { background:#ff3b2f; color:#120607; }

/* bars */
.bar5 { height:5px; background:#2a1010; } .bar5 b{ display:block; height:100%; background:#ff3b2f; }
</style>
</head>
<body>
<div class="scan"></div>
<div class="stage">
  <div class="hdr"><span>angelOS v0.2 <b>// card</b></span><span id="gname"></span><span>5 designs · pick one</span></div>
  <div class="row" id="row"></div>
</div>
<script>

    "I will not argue with Her judgement.","I exist to be corrected."],

    "There is nothing except for Her.","Her happiness is all that matters.","She is my guiding light.",

const A  = { snake:"#ff3b2f", penance:"#ff5a4a", devotion:"#8fd0ff", deathroll:"#ff3b2f", elysium:"#6fe0a6" };

             deathroll:"linear-gradient(#141014,#06060a)", elysium:"linear-gradient(#07160d,#04060a)" };

function wave() { const p=[]; for (let i=0;i<=52;i++){ const x=12+i*(190/52),t=i/52;
  const amp=40*Math.exp(-t*0.7)*(0.6+0.4*Math.sin(t*9)); p.push((x).toFixed(1)+","+(118+Math.sin(t*Math.PI*6.2)*amp).toFixed(1)); } return p; }
function spiral() { const p=[]; for (let i=0;i<=150;i++){ const t=i/150, ang=t*Math.PI*6, rad=8+t*58;
  p.push((107+rad*Math.cos(ang)).toFixed(1)+","+(126+rad*Math.sin(ang)).toFixed(1)); } return p.join(" "); }
function beads() { const N=10,done=6; return Array.from({length:N}).map((_,k)=>{ const ang=(-90+k*36)*Math.PI/180;
  const x=107+40*Math.cos(ang), y=66+42*Math.sin(ang); const c=k<done?"f":(k===done?"cur":"e");
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${k===done?5.5:4}" class="${c}"/>`; }).join(""); }
function stars(n) { let s=""; let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for (let i=0;i<n;i++){ s+=`<circle cx="${(rnd()*214).toFixed(0)}" cy="${(rnd()*236).toFixed(0)}" r="${(rnd()*0.9+0.3).toFixed(1)}" fill="#cdd8e0" opacity="${(rnd()*0.35+0.12).toFixed(2)}"/>`; } return s; }
function rings() { let s=""; for (let r=9;r<=92;r+=6){ const dx=(Math.sin(r)*2).toFixed(1); s+=`<circle cx="${(104+ +dx)}" cy="120" r="${r}" fill="none" stroke="#3f8f63" stroke-width="${r%12<6?1.7:1}" opacity="${(0.35+r/92*0.4).toFixed(2)}"/>`; } return s; }
function wreath() { let s=""; const cx=107,cy=122,R=52,degs=[22,42,62,82,102,122,142,160];
  for (const sgn of [1,-1]) for (const d of degs){ const th=sgn*d, rad=th*Math.PI/180;
    const x=(cx+R*Math.sin(rad)).toFixed(1), y=(cy-R*Math.cos(rad)).toFixed(1), rot=(th+sgn*90).toFixed(0);
    s+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="3.4" fill="#3f9f6a" opacity=".85" transform="rotate(${rot} ${x} ${y})"/>`; }
  return s; }
function croz() { const p=[]; for (let i=0;i<=60;i++){ const t=i/60, ang=t*Math.PI*3.2, rad=2+t*16;
  p.push((78+rad*Math.cos(ang)).toFixed(1)+","+(74-rad*Math.sin(ang)).toFixed(1)); } return p.join(" "); }

  row.appendChild(slot);
