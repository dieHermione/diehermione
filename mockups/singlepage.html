<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>single-page mockups — framed</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Nunito+Sans:wght@300;400;600&family=Italiana&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Karla:wght@300;400;500&family=Parisienne&family=Pinyon+Script&family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&family=Prata&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Archivo+Black&family=Archivo:wght@300;400;500&family=Quicksand:wght@300;400;500;600&family=Oswald:wght@300;400;500&family=Anton&family=Caveat:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<!--
  Three arrangements of the same single-page shell: the leopard border, ONE main
  panel that every section loads into, and a side nav. ?d=1..3 picks the design.

  They differ in the organising idea, not the spacing:
    1 COLUMN   nav and panel are two columns inside the frame, split by a hairline.
    2 DRAWER   the nav is furniture: a plate running under the frame's left edge.

  The nav is ALWAYS its own surface, tinted apart from the panel so the two
  never merge; what changes per design is its shape and where it sits.
  Everything is translucent over the glitter, which is uniform in luminance —
  no veil needed beyond a flat sliver to calm the sparkle.
    3 PLATE    the panel is an object floating on the pink, the nav a word rail.
    4 TABS     the panel is a folder and the nav its tabs, the active one merging in.
    5 STACK    the panel is the top sheet of a stack, the others showing behind.
    6 SPLIT    pink and white meet on one hard full-height line, no gap, no rule.
    7 OVERLAY  one white sheet fills the frame; the nav is printed in its margin.
    8 SPINE    the nav runs vertically up the left edge.
    9 DOCK     the nav is a column of separate tiles sitting on the pink.

  6 SPLIT is the chosen design. ?f=N swaps the type pairing on any of them.
  First batch:  1 cormorant+jost  2 bodoni+inter  3 fraunces+nunito
                4 italiana+montserrat  5 playfair+karla  6 parisienne+montserrat (KEPT)
  Second batch, each a different idea rather than another serif+sans:
                7 pinyon script (formal copperplate)  8 cinzel (inscriptional caps)
                9 prata+dm sans (modern editorial)   10 archivo black (heavy grotesque)
               11 quicksand only (one family, weight and size alone)
               12 oswald caps (condensed masthead).
  Third batch changes the SYSTEM rather than the face — scale, case, alignment,
  voice — because the first two kept the same scale and the same letterspaced
  small-cap labels and only swapped which face drew them:
               13 big (huge headline over small body)  14 lowercase (no small caps anywhere)
               15 poster (everything caps, tight)      16 italic (italic as the voice)
               17 centred (symmetry, no left edge)     18 airy (wide tracking, light).
  Fourth batch loosens the panel itself — ornament, colour, and how the data is
  ranked, not only the faces:
               19 ruled (banded masthead)      20 ornament (drop cap, tapered rules)
               21 ledger (dotted, figures right) 22 rose (type takes the colour)
               23 figures (the numbers lead)   24 annotated (printed, written on).
  Fifth batch keeps ONLY the border and rebuilds the page around it:
              25 bento (tiles, no single panel)   26 noir (dark field)
              27 poster (headline and a word row) 28 spread (magazine columns)
              29 sheet (one surface, nav a bar)   30 float (no surfaces at all).
  Sixth batch is built on the CORRECTED content — accounts are gone, so there
  is nothing to review and home is her two lines plus the way in. All six treat
  the page as a launcher:
              31 marquee (names set huge)      32 index (numbered contents list)
              33 deck (a fanned hand of cards) 34 counter (dark desk over tiles)
              35 letter (a note, games at foot) 36 wall (big tiles edge to edge).

  Self-contained: open straight off file://, no server. The frame is the
  rebuilt 9-slice sheet sitting next to this file.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* On #ed72ad white text is only 2.76:1, so everything on the pink is a
       near-black plum (6.49:1) with a softer plum for secondary (5.17:1).
       Panels are white, and carry the warm-grey scale instead. */
    --bg:#ed72ad; --plate:rgba(255,255,255,.80);
    --nav-plate:rgba(255,255,255,.50);   /* the nav is its own surface, tinted
                                            so it never merges with the panel */
    --r-lg:22px; --r-md:14px; --r-sm:10px;   /* nothing square unless it must be */
    --display:"Cormorant Garamond",Georgia,serif;   /* ?f= swaps these two */
    --ui:"Jost",system-ui,sans-serif;
    --on-pink:#26101b; --on-pink-2:#4a1930; --on-pink-3:#5e2440;
    --ink:#1d1419; --dim:#6f626a; --faint:#a4939c; --line:rgba(38,16,27,.11); --tint:rgba(255,255,255,.5);
    --fw:clamp(50px,5.9vw,100px);        /* frame thickness; drives everything */
    --pad:calc(var(--fw) + .9rem);       /* clears the fur's ragged inner edge */
  }
  html,body{height:100%}
  body{background:var(--bg) url("bg-glitter.jpg") center/cover no-repeat;color:var(--on-pink);font-family:var(--ui);
       font-weight:400;font-size:15px;overflow:hidden;letter-spacing:.01em}

  /* ---------- the border ----------
     One 9-slice sheet, rebuilt from the supplied kit of parts: every piece end
     squared off and butted, so the band is continuous. Slices land exactly on
     the corner/bar joints. `round` is required — stretch ovals the spots. */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:rgba(255,255,255,.10)}
  .frame{position:fixed;inset:0;z-index:90;pointer-events:none;
    border-style:solid;border-width:var(--fw);
    border-image:url("frame-leopard.webp") 184 round}

  /* ---------- the shell ---------- */
  .page{position:fixed;inset:0;z-index:10;padding:var(--pad);display:flex;min-height:0}

  /* nav */
  .nav{display:flex;flex-direction:column;flex:0 0 auto;min-height:0;
    --nav-ink:var(--ink); --nav-dim:#6b2c49; --nav-faint:#7a3a56;
    color:var(--nav-ink);background:var(--nav-plate);border-radius:var(--r-lg);
    padding:1.9rem 1.5rem;backdrop-filter:blur(14px) saturate(115%);
    -webkit-backdrop-filter:blur(14px) saturate(115%)}
  .brand{font-family:var(--display);font-size:1.5rem;font-weight:600;
    letter-spacing:.02em;line-height:1;margin-bottom:.15rem}
  .brand i{font-style:italic;font-weight:300;color:var(--nav-dim)}
  .tagline{font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--nav-faint);
    margin-bottom:2.4rem}
  .nav ul{list-style:none;display:flex;flex-direction:column;gap:.1rem}
  .nav button{appearance:none;background:none;border:0;cursor:pointer;width:100%;border-radius:var(--r-sm);
    text-align:left;color:var(--nav-dim);font-family:inherit;font-weight:300;font-size:.98rem;
    letter-spacing:.14em;text-transform:lowercase;padding:.44rem 0;position:relative;
    transition:color .18s ease,padding .18s ease}
  .nav button:hover{color:var(--nav-ink)}
  .nav button.on{color:var(--nav-ink)}
  .nav button.on::before{content:"";position:absolute;left:-1.1rem;top:50%;width:.52rem;height:1px;
    background:var(--nav-ink);transform:translateY(-50%)}
  .nav .sep{height:1px;background:currentColor;opacity:.22;margin:1.1rem 0}
  .who{margin-top:auto;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--nav-faint)}

  /* the one panel everything loads into */
  .panel{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;
    background:var(--plate);color:var(--ink);padding:2.5rem 2.7rem;border-radius:var(--r-lg);
    backdrop-filter:blur(16px) saturate(118%);-webkit-backdrop-filter:blur(16px) saturate(118%)}
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:#e2cdd6;border-radius:99px}
  .inner{max-width:52rem}
  .eyebrow{font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-bottom:1rem}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,4.4vw,3.5rem);
    line-height:1.04;letter-spacing:-.005em;margin-bottom:1.1rem}
  h1 em{font-style:italic;color:var(--dim)}
  .lede{font-size:1.02rem;line-height:1.75;color:var(--dim);max-width:40rem}
  .lede + .lede{margin-top:.9rem}
  .rule{height:1px;background:var(--line);margin:2.1rem 0;border-radius:1px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem}
  .cell{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.42);
    padding:1.1rem 1rem 1.25rem;min-height:6.2rem;display:flex;
    flex-direction:column;justify-content:flex-end;cursor:pointer;
    transition:background .18s ease,transform .18s ease}
  .cell:hover{background:rgba(255,255,255,.72);transform:translateY(-2px)}
  .cell b{font-family:var(--display);font-weight:400;font-size:1.32rem;letter-spacing:.01em}
  .cell span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:.3rem}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:baseline;gap:1.4rem;padding:.72rem 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 11rem;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  .row .v{font-size:1rem;color:var(--ink)}
  .row .v small{color:var(--dim);font-size:.82rem}

  .field{margin-bottom:1.5rem}
  .flabel{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin-bottom:.6rem}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.4);color:var(--dim);font-family:inherit;
    font-weight:300;font-size:.9rem;letter-spacing:.08em;padding:.42rem 1.15rem;cursor:pointer;
    border-radius:999px;transition:all .18s ease}
  .chip:hover{border-color:#c9a7b6;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  textarea{width:100%;max-width:34rem;min-height:5.4rem;background:var(--tint);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-weight:300;font-size:1rem;line-height:1.7;padding:.9rem 1rem;
    resize:vertical;border-radius:var(--r-md)}
  textarea:focus{outline:none;border-color:#c9a7b6}
  .go{margin-top:.4rem;border:1px solid var(--ink);background:none;color:var(--ink);font-family:inherit;
    font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;padding:.68rem 2.2rem;cursor:pointer;
    border-radius:999px;transition:all .18s ease}
  .go:hover{background:var(--ink);color:#fff}

  /* ---------- 1 · COLUMN — two columns inside the frame, split by a hairline ---------- */
  body[data-d="1"] .nav{width:13.5rem}
  body[data-d="1"] .panel{margin-left:2.4rem}

  /* ---------- 2 · DRAWER — the nav is furniture; its plate runs under the frame ---------- */
  body[data-d="2"] .page{padding-left:0}
  body[data-d="2"] .nav{width:calc(var(--fw) + 14rem);
    margin:calc(var(--pad) * -1) 0;padding:var(--pad) 2.2rem var(--pad) var(--pad);
    justify-content:center}
  body[data-d="2"] .nav .who{margin-top:3.2rem}
  body[data-d="2"] .panel{margin-left:2.6rem}
  body[data-d="2"] .nav{border-radius:0 var(--r-lg) var(--r-lg) 0}
  body[data-d="2"] .inner{padding-top:.5rem}

  /* ---------- 3 · PLATE — the panel is an object; the nav a rail of words ---------- */
  body[data-d="3"] .page{padding:calc(var(--pad) + .5rem)}
  body[data-d="3"] .nav{width:11rem;align-self:center;padding:1.7rem 1.3rem}
  body[data-d="3"] .brand{font-size:1.24rem}
  body[data-d="3"] .tagline{margin-bottom:1.8rem}
  body[data-d="3"] .nav button{font-size:.88rem;letter-spacing:.2em}
  body[data-d="3"] .panel{border:1px solid var(--line);
    box-shadow:0 1.2rem 3rem rgba(90,40,60,.13)}

  /* ---------- 4 · TABS — the panel is a folder, the nav its tabs ---------- */
  body[data-d="4"] .nav{width:12.5rem;padding:2.4rem 0 2.4rem 1.3rem;
    border-radius:var(--r-lg) 0 0 var(--r-lg)}
  body[data-d="4"] .nav ul{gap:.3rem}
  body[data-d="4"] .nav button{background:transparent;color:var(--dim);padding:.66rem 1.05rem;
    letter-spacing:.1em}
  body[data-d="4"] .nav button:hover{color:var(--ink)}
  body[data-d="4"] .nav button.on{color:var(--ink);background:var(--plate);position:relative;z-index:2;
    margin-right:-2px;padding-right:1.4rem}
  body[data-d="4"] .nav button.on::before{display:none}
  body[data-d="4"] .nav .brand,body[data-d="4"] .nav .tagline,body[data-d="4"] .nav .who{padding-left:.3rem}
  body[data-d="4"] .panel{margin-left:0;position:relative;z-index:1;border-radius:0 var(--r-lg) var(--r-lg) 0}
  body[data-d="4"] .nav button{border-radius:var(--r-md) 0 0 var(--r-md)}

  /* ---------- 5 · STACK — the panel is the top sheet of a stack ---------- */
  body[data-d="5"] .page{padding:calc(var(--pad) + .3rem)}
  body[data-d="5"] .nav{width:11.5rem;align-self:center;padding:1.7rem 1.3rem}
  body[data-d="5"] .panel{margin:1.5rem 1.5rem 0 1.2rem;border:1px solid var(--line);
    box-shadow:9px -9px 0 -1px rgba(255,255,255,.55), 9px -9px 0 0 var(--line),
               18px -18px 0 -1px rgba(255,255,255,.38), 18px -18px 0 0 var(--line)}

  /* ---------- 6 · SPLIT — pink meets white on one hard line, no gap ---------- */
  body[data-d="6"] .nav{width:15rem;padding:2.4rem 2rem;justify-content:center;
    border-radius:var(--r-lg) 0 0 var(--r-lg)}
  body[data-d="6"] .panel{margin-left:0;padding:3rem 3.2rem;border-radius:0 var(--r-lg) var(--r-lg) 0}

  /* ---------- 7 · OVERLAY — one white sheet fills the frame, nav printed in its margin ---------- */
  body[data-d="7"] .page{padding:var(--fw)}
  body[data-d="7"] .nav{width:13.5rem;border-radius:var(--r-lg) 0 0 var(--r-lg);
    padding:2.5rem 1.8rem 2.5rem 2.2rem;border-right:1px solid var(--line)}
  body[data-d="7"] .panel{margin-left:0;padding-left:3rem;border-radius:0 var(--r-lg) var(--r-lg) 0}

  /* ---------- 8 · SPINE — the nav runs up the left edge ---------- */
  body[data-d="8"] .nav{width:4.6rem;align-items:center;padding:1.4rem 0;border-radius:999px}
  body[data-d="8"] .nav .brand,body[data-d="8"] .nav .tagline,body[data-d="8"] .nav .who,
  body[data-d="8"] .nav ul{writing-mode:vertical-rl;transform:rotate(180deg)}
  body[data-d="8"] .nav .brand{font-size:1.25rem;margin:0 0 0 .1rem}
  body[data-d="8"] .nav .tagline{margin:0 0 1.6rem 0}
  body[data-d="8"] .nav ul{flex-direction:row;gap:1.5rem}
  body[data-d="8"] .nav button{width:auto;padding:0 .5rem;text-align:center}
  body[data-d="8"] .nav button.on::before{left:50%;top:auto;bottom:-.5rem;width:1px;height:.5rem;
    transform:translateX(-50%)}
  body[data-d="8"] .nav .sep{height:auto;width:1px;margin:0 1rem}
  body[data-d="8"] .nav .who{margin:auto 0 0 0}
  body[data-d="8"] .panel{margin-left:1.6rem}

  /* ---------- 9 · DOCK — the nav is a column of tiles on the pink ---------- */
  body[data-d="9"] .nav{width:12.5rem;padding:1.6rem 1.1rem;justify-content:center;align-self:center}
  body[data-d="9"] .nav ul{gap:.42rem}
  body[data-d="9"] .nav button{background:rgba(255,255,255,.78);color:var(--ink);border:1px solid var(--line);
    padding:.7rem 1.05rem;letter-spacing:.1em;border-radius:999px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  body[data-d="9"] .nav button:hover{color:var(--ink)}
  body[data-d="9"] .nav button.on{background:var(--ink);border-color:var(--ink);color:var(--plate)}
  body[data-d="9"] .nav button.on::before{display:none}
  body[data-d="9"] .nav .sep{background:transparent;margin:.5rem 0}

  /* ---------- typography sets ---------- */
  body[data-f="2"]{--display:"Bodoni Moda",Didot,serif; --ui:"Inter",system-ui,sans-serif}
  body[data-f="3"]{--display:"Fraunces",Georgia,serif;  --ui:"Nunito Sans",system-ui,sans-serif}
  body[data-f="4"]{--display:"Italiana",Georgia,serif;  --ui:"Montserrat",system-ui,sans-serif}
  body[data-f="5"]{--display:"Playfair Display",Georgia,serif; --ui:"Karla",system-ui,sans-serif}
  body[data-f="6"]{--display:"Parisienne",cursive;      --ui:"Montserrat",system-ui,sans-serif}
  /* the two display faces that set small need a nudge to hold their line */
  body[data-f="4"] h1{letter-spacing:.02em}
  body[data-f="4"] .brand{letter-spacing:.06em;font-weight:400}
  body[data-f="6"] h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.15}
  body[data-f="6"] .brand{font-size:1.9rem;font-weight:400}
  body[data-f="6"] .brand i{font-style:normal}

  /* ---------- second batch: different ideas, not different serifs ---------- */
  body[data-f="7"]{--display:"Pinyon Script",cursive;   --ui:"Montserrat",system-ui,sans-serif}
  body[data-f="8"]{--display:"Cinzel",Georgia,serif;    --ui:"Lato",system-ui,sans-serif}
  body[data-f="9"]{--display:"Prata",Georgia,serif;     --ui:"DM Sans",system-ui,sans-serif}
  body[data-f="10"]{--display:"Archivo Black",system-ui,sans-serif; --ui:"Archivo",system-ui,sans-serif}
  body[data-f="11"]{--display:"Quicksand",system-ui,sans-serif;     --ui:"Quicksand",system-ui,sans-serif}
  body[data-f="12"]{--display:"Oswald",system-ui,sans-serif;        --ui:"Karla",system-ui,sans-serif}
  /* 7 formal copperplate: a script needs room or the ascenders collide */
  body[data-f="7"] h1{font-size:clamp(2.5rem,5.2vw,4.2rem);line-height:1.12}
  body[data-f="7"] .brand{font-size:2rem;font-weight:400}
  body[data-f="7"] .brand i{font-style:normal}
  /* 8 inscriptional Roman: an all-caps face wants tracking and less size */
  body[data-f="8"] h1{font-size:clamp(1.7rem,3.3vw,2.6rem);letter-spacing:.06em;line-height:1.25}
  body[data-f="8"] .brand{font-size:1.15rem;letter-spacing:.14em;font-weight:600}
  body[data-f="8"] .brand i{font-style:normal}
  body[data-f="8"] .cell b{font-size:1.05rem;letter-spacing:.05em}
  /* 10 heavy grotesque: weight does the work, so pull the size back */
  body[data-f="10"] h1{font-size:clamp(1.9rem,3.7vw,2.9rem);letter-spacing:-.02em;line-height:1.08}
  body[data-f="10"] h1 em{font-style:normal;font-weight:400;font-family:var(--ui)}
  body[data-f="10"] .brand{font-size:1.2rem;letter-spacing:-.01em}
  body[data-f="10"] .brand i{font-style:normal}
  body[data-f="10"] .cell b{font-size:1.02rem}
  /* 11 one family throughout: no display/body split, only weight and size */
  body[data-f="11"] h1{font-weight:500;letter-spacing:-.01em}
  body[data-f="11"] .brand{font-weight:600;letter-spacing:.02em}
  body[data-f="11"] .cell b{font-weight:500;font-size:1.12rem}
  /* 12 condensed masthead: set the headline as caps, like a cover line */
  body[data-f="12"] h1{text-transform:uppercase;letter-spacing:.04em;font-weight:400;
    font-size:clamp(2rem,4vw,3.1rem);line-height:1.08}
  body[data-f="12"] h1 em{font-style:normal;font-weight:300}
  body[data-f="12"] .brand{text-transform:uppercase;letter-spacing:.1em;font-size:1.15rem;font-weight:500}
  body[data-f="12"] .brand i{font-style:normal;font-weight:300}

  /* ---------- third batch: the system changes, not just the face ---------- */
  /* 13 BIG — extreme scale contrast: a huge headline over very small everything */
  body[data-f="13"]{--display:"Bodoni Moda",Didot,serif; --ui:"Inter",system-ui,sans-serif;font-size:13.5px}
  body[data-f="13"] h1{font-size:clamp(3.2rem,7vw,5.4rem);line-height:.92;letter-spacing:-.02em;margin-bottom:1.4rem}
  body[data-f="13"] .eyebrow{font-size:.52rem;letter-spacing:.4em}
  body[data-f="13"] .lede{font-size:.92rem;max-width:32rem}
  /* 14 LOWERCASE — every letterspaced small-cap label dropped; nothing shouts */
  body[data-f="14"]{--display:"Fraunces",Georgia,serif; --ui:"Nunito Sans",system-ui,sans-serif}
  body[data-f="14"] .eyebrow,body[data-f="14"] .tagline,body[data-f="14"] .who,
  body[data-f="14"] .row .k,body[data-f="14"] .cell span,body[data-f="14"] .flabel,
  body[data-f="14"] .go,body[data-f="14"] .tag span{text-transform:lowercase;letter-spacing:.02em;font-size:.78rem}
  body[data-f="14"] h1{font-weight:300}
  /* 15 POSTER — the opposite: everything in caps, tight, graphic */
  body[data-f="15"]{--display:"Anton",system-ui,sans-serif; --ui:"Archivo",system-ui,sans-serif}
  body[data-f="15"] h1{text-transform:uppercase;font-size:clamp(2.2rem,4.6vw,3.6rem);
    letter-spacing:-.01em;line-height:.98;font-weight:400}
  body[data-f="15"] h1 em{font-style:normal;font-family:var(--ui);font-weight:300}
  body[data-f="15"] .brand{text-transform:uppercase;font-size:1.25rem;letter-spacing:.02em}
  body[data-f="15"] .brand i{font-style:normal;font-family:var(--ui);font-weight:300}

      <div class="tagline">angelOS</div>
      <ul id="nav"></ul>
      <div class="who">guest4</div>
    </nav>
    <main class="panel"><div class="inner" id="panel"></div></main>
  </div>
  <div class="veil"></div>
  <div class="frame"></div>
  <div class="tag" id="tag"></div>

<script>
  /* One panel, many sections: nav swaps what is inside it. No page ever loads. */
  const SECTIONS = [
    { id:"home", label:"home" },
    { id:"devotion", label:"devotion" },
    { id:"elysium", label:"elysium" },
    { sep:true },
    { id:"settings", label:"settings" },
    { id:"admin", label:"admin" },
  ];

  const GAMES = [
    ["Devotion","writing"],["Multitap","typing"],["Summary","reading"],
    ["Skill Check","timing"],["OT12","trivia"],["Snake","arcade"],
    ["Deathroll","two players"],["Dummy Parse","simulation"],
    ["Elysium","patience"],["Chess","two players"],
  ];

  const VIEW = {
    home: () => `
      <div class="eyebrow">Friday · the nineteenth</div>
      <h1>Welcome, <em>guest4</em>.</h1>
      <p class="lede">You keep nothing here. No account, no score, no record — a name for
        as long as you stay, and then not even that.</p>
      <p class="lede">So there is only this: pick something, and do it properly.</p>
      <div class="rule"></div>
      <div class="grid">${GAMES.map(([n,k]) => `<div class="cell"><b>${n}</b><span>${k}</span></div>`).join("")}</div>`,
    games: () => `
      <div class="eyebrow">Ten ways to pass the time</div>
      <h1>Games</h1>
      <p class="lede">Some are hers, some are yours, one of them needs her at the other end.</p>
      <div class="rule"></div>
      <div class="grid">${GAMES.map(([n,k]) => `<div class="cell"><b>${n}</b><span>${k}</span></div>`).join("")}</div>`,
    devotion: () => `
      <div class="eyebrow">Writing</div>
      <h1>Devotion</h1>
      <p class="lede">Write the lines you are given, over and over, until they are yours.</p>
      <div class="rule"></div>
      <div class="field"><div class="flabel">repetitions</div>
        <div class="chips"><button class="chip">25</button><button class="chip on">50</button><button class="chip">100</button></div></div>
      <div class="field"><div class="flabel">your lines · one per row</div>
        <textarea>Her will is Divine. I will obey.
She knows what is best for me.</textarea></div>
      <button class="go">Begin</button>`,
    elysium: () => `
      <div class="eyebrow">Planted today</div>
      <h1>Elysium</h1>
      <p class="lede">It is yours while you are here. Leave it three hours and the name goes,
        and the tree goes with it.</p>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Stage</span><span class="v">Seedling <small>· 1 of 6</small></span></div>
        <div class="row"><span class="k">Health</span><span class="v">100 <small>· untroubled</small></span></div>
        <div class="row"><span class="k">Soil moisture</span><span class="v">62</span></div>
        <div class="row"><span class="k">Season</span><span class="v">Autumn</span></div>
      </div>
      <div class="field" style="margin-top:2rem"><div class="flabel">tend</div>
        <div class="chips"><button class="chip">water</button><button class="chip">mist</button>
          <button class="chip">trim</button><button class="chip">fertilize</button><button class="chip">inspect</button></div></div>`,
    settings: () => `
      <div class="eyebrow">This session only</div>
      <h1>Settings</h1>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Master</span><span class="v">60</span></div>
        <div class="row"><span class="k">Music</span><span class="v">40</span></div>
        <div class="row"><span class="k">Ambience</span><span class="v">25</span></div>
        <div class="row"><span class="k">Typing</span><span class="v">70</span></div>
      </div>`,
    admin: () => `
      <div class="eyebrow">Hers</div>
      <h1>Admin</h1>
      <p class="lede">The finished runs guests leave behind, the editable pools, and the
        things only she can reach.</p>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Completed runs</span><span class="v">3 waiting <small>· devotion, multitap</small></span></div>
        <div class="row"><span class="k">Hover text</span><span class="v">11 cards</span></div>
        <div class="row"><span class="k">OT12 photos</span><span class="v">24 tagged</span></div>
      </div>`,
  };

  const NAMES = ["column","drawer","plate","tabs","stack","split","overlay","spine","dock"];
  const FONTS = ["cormorant + jost","bodoni + inter","fraunces + nunito",
                 "italiana + montserrat","playfair + karla","parisienne + montserrat",
                 "pinyon + montserrat","cinzel + lato","prata + dm sans",
                 "archivo black","quicksand only","oswald caps + karla",
                 "big · huge head, small body","lowercase · no small caps",
                 "poster · all caps, tight","italic · italic as the voice",
                 "centred · symmetric","airy · wide tracking, light",
                 "ruled · banded masthead","ornament · drop cap",
                 "ledger · dotted, figures right","rose · coloured type",
                 "figures · numbers lead","annotated · written on",
                 "BENTO · tiles, no panel","NOIR · dark field",
                 "POSTER · headline only","SPREAD · magazine columns",
                 "SHEET · one surface","FLOAT · no surfaces at all",
                 "MARQUEE · names are the page","INDEX · a contents list",
                 "DECK · a hand of cards","COUNTER · dark desk over tiles",
                 "LETTER · a note, games at foot","WALL · big tiles edge to edge"];
  const d = Math.min(NAMES.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("d") || "1", 10)));
  document.body.dataset.d = d;
  const f = Math.min(FONTS.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("f") || "1", 10)));
  document.body.dataset.f = f;
  document.getElementById("tag").innerHTML =
    "<b>" + d + "</b><span>" + NAMES[d - 1] + " · " + FONTS[f - 1] + "</span>";

  const navEl = document.getElementById("nav"), panelEl = document.getElementById("panel");
  let current = "home";
  function open(id) {
    current = id;
    panelEl.innerHTML = VIEW[id]();
    panelEl.parentElement.scrollTop = 0;
    navEl.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.s === id));
  }
  SECTIONS.forEach((s) => {
    const li = document.createElement("li");
    if (s.sep) { li.innerHTML = '<div class="sep"></div>'; navEl.append(li); return; }
    const b = document.createElement("button");
    b.dataset.s = s.id; b.textContent = s.label;
    b.addEventListener("click", () => open(s.id));
    li.append(b); navEl.append(li);
  });
  // the games grid opens a game in the same panel; home IS the games list now
  panelEl.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (cell && VIEW[cell.querySelector("b").textContent.toLowerCase()]) open(cell.querySelector("b").textContent.toLowerCase());
  });
  open("home");
</script>
</body>
</html>
