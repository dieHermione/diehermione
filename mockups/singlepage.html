<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>single-page mockups — framed</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
<!--
  Three arrangements of the same single-page shell: the leopard border, ONE main
  panel that every section loads into, and a side nav. ?d=1..3 picks the design.

  They differ in the organising idea, not the spacing:
    1 COLUMN   nav and panel are two columns inside the frame, split by a hairline.
    2 DRAWER   the nav is furniture: a plate running under the frame's left edge.

  Surfaces are translucent over a photographic background, so they pick up the
  sky at the top and the dark landscape at the foot. A graded veil sits under
  everything: without it, dark text on the navy lower half is about 1.8:1.
    3 PLATE    the panel is an object floating on the pink, the nav a word rail.
    4 TABS     the panel is a folder and the nav its tabs, the active one merging in.
    5 STACK    the panel is the top sheet of a stack, the others showing behind.
    6 SPLIT    pink and white meet on one hard full-height line, no gap, no rule.
    7 OVERLAY  one white sheet fills the frame; the nav is printed in its margin.
    8 SPINE    the nav runs vertically up the left edge.
    9 DOCK     the nav is a column of separate tiles sitting on the pink.

  Self-contained: open straight off file://, no server. The frame is the
  rebuilt 9-slice sheet sitting next to this file.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* On #ed72ad white text is only 2.76:1, so everything on the pink is a
       near-black plum (6.49:1) with a softer plum for secondary (5.17:1).
       Panels are white, and carry the warm-grey scale instead. */
    --bg:#ed72ad; --plate:rgba(255,255,255,.82);
    --r-lg:22px; --r-md:14px; --r-sm:10px;   /* nothing square unless it must be */
    --on-pink:#26101b; --on-pink-2:#4a1930; --on-pink-3:#5e2440;
    --ink:#1d1419; --dim:#6f626a; --faint:#a4939c; --line:rgba(38,16,27,.11); --tint:rgba(255,255,255,.5);
    --fw:clamp(50px,5.9vw,100px);        /* frame thickness; drives everything */
    --pad:calc(var(--fw) + .9rem);       /* clears the fur's ragged inner edge */
  }
  html,body{height:100%}
  body{background:var(--bg) url("bg-dusk.jpg") center/cover no-repeat fixed;color:var(--on-pink);font-family:"Jost",system-ui,sans-serif;
       font-weight:400;font-size:15px;overflow:hidden;letter-spacing:.01em}

  /* ---------- the border ----------
     One 9-slice sheet, rebuilt from the supplied kit of parts: every piece end
     squared off and butted, so the band is continuous. Slices land exactly on
     the corner/bar joints. `round` is required — stretch ovals the spots. */
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.16) 48%,
      rgba(255,255,255,.40) 74%,rgba(255,255,255,.56) 100%)}
  .frame{position:fixed;inset:0;z-index:90;pointer-events:none;
    border-style:solid;border-width:var(--fw);
    border-image:url("frame-leopard.webp") 184 round}

  /* ---------- the shell ---------- */
  .page{position:fixed;inset:0;z-index:10;padding:var(--pad);display:flex;min-height:0}

  /* nav */
  .nav{display:flex;flex-direction:column;flex:0 0 auto;min-height:0;
    --nav-ink:var(--on-pink); --nav-dim:var(--on-pink-2); --nav-faint:var(--on-pink-3);
    color:var(--nav-ink)}
  .nav.on-white{--nav-ink:var(--ink); --nav-dim:var(--dim); --nav-faint:var(--faint)}
  .brand{font-family:"Cormorant Garamond",serif;font-size:1.5rem;font-weight:600;
    letter-spacing:.02em;line-height:1;margin-bottom:.15rem}
  .brand i{font-style:italic;font-weight:300;color:var(--nav-dim)}
  .tagline{font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--nav-faint);
    margin-bottom:2.4rem}
  .nav ul{list-style:none;display:flex;flex-direction:column;gap:.1rem}
  .nav button{appearance:none;background:none;border:0;cursor:pointer;width:100%;border-radius:var(--r-sm);
    text-align:left;color:var(--nav-dim);font-family:inherit;font-weight:300;font-size:.98rem;
    letter-spacing:.14em;text-transform:lowercase;padding:.44rem 0;position:relative;
    transition:color .18s ease,padding .18s ease}
  .nav button:hover{color:var(--nav-ink)}
  .nav button.on{color:var(--nav-ink)}
  .nav button.on::before{content:"";position:absolute;left:-1.1rem;top:50%;width:.52rem;height:1px;
    background:var(--nav-ink);transform:translateY(-50%)}
  .nav .sep{height:1px;background:currentColor;opacity:.22;margin:1.1rem 0}
  .who{margin-top:auto;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--nav-faint)}

  /* the one panel everything loads into */
  .panel{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;
    background:var(--plate);color:var(--ink);padding:2.5rem 2.7rem;border-radius:var(--r-lg);
    backdrop-filter:blur(16px) saturate(118%);-webkit-backdrop-filter:blur(16px) saturate(118%)}
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:#e2cdd6;border-radius:99px}
  .inner{max-width:52rem}
  .eyebrow{font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-bottom:1rem}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(2.1rem,4.4vw,3.5rem);
    line-height:1.04;letter-spacing:-.005em;margin-bottom:1.1rem}
  h1 em{font-style:italic;color:var(--dim)}
  .lede{font-size:1.02rem;line-height:1.75;color:var(--dim);max-width:40rem}
  .lede + .lede{margin-top:.9rem}
  .rule{height:1px;background:var(--line);margin:2.1rem 0;border-radius:1px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem}
  .cell{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.42);
    padding:1.1rem 1rem 1.25rem;min-height:6.2rem;display:flex;
    flex-direction:column;justify-content:flex-end;cursor:pointer;
    transition:background .18s ease,transform .18s ease}
  .cell:hover{background:rgba(255,255,255,.72);transform:translateY(-2px)}
  .cell b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.32rem;letter-spacing:.01em}
  .cell span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:.3rem}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:baseline;gap:1.4rem;padding:.72rem 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 11rem;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  .row .v{font-size:1rem;color:var(--ink)}
  .row .v small{color:var(--dim);font-size:.82rem}

  .field{margin-bottom:1.5rem}
  .flabel{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin-bottom:.6rem}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.4);color:var(--dim);font-family:inherit;
    font-weight:300;font-size:.9rem;letter-spacing:.08em;padding:.42rem 1.15rem;cursor:pointer;
    border-radius:999px;transition:all .18s ease}
  .chip:hover{border-color:#c9a7b6;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  textarea{width:100%;max-width:34rem;min-height:5.4rem;background:var(--tint);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-weight:300;font-size:1rem;line-height:1.7;padding:.9rem 1rem;
    resize:vertical;border-radius:var(--r-md)}
  textarea:focus{outline:none;border-color:#c9a7b6}
  .go{margin-top:.4rem;border:1px solid var(--ink);background:none;color:var(--ink);font-family:inherit;
    font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;padding:.68rem 2.2rem;cursor:pointer;
    border-radius:999px;transition:all .18s ease}
  .go:hover{background:var(--ink);color:#fff}

  /* ---------- 1 · COLUMN — two columns inside the frame, split by a hairline ---------- */
  body[data-d="1"] .nav{width:12.5rem;padding-right:2rem;border-right:1px solid var(--line)}
  body[data-d="1"] .panel{margin-left:2.4rem}

  /* ---------- 2 · DRAWER — the nav is furniture; its plate runs under the frame ---------- */
  body[data-d="2"] .page{padding-left:0}
  body[data-d="2"] .nav{width:calc(var(--fw) + 14rem);background:var(--plate);
    margin:calc(var(--pad) * -1) 0;padding:var(--pad) 2.2rem var(--pad) var(--pad);
    justify-content:center;border-right:1px solid var(--line)}
  body[data-d="2"] .nav .who{margin-top:3.2rem}
  body[data-d="2"] .panel{margin-left:2.6rem}
  body[data-d="2"] .nav{border-radius:0 var(--r-lg) var(--r-lg) 0}
  body[data-d="2"] .inner{padding-top:.5rem}

  /* ---------- 3 · PLATE — the panel is an object; the nav a rail of words ---------- */
  body[data-d="3"] .page{padding:calc(var(--pad) + .5rem)}
  body[data-d="3"] .nav{width:9.5rem;padding-right:1.6rem}
  body[data-d="3"] .brand{font-size:1.24rem}
  body[data-d="3"] .tagline{margin-bottom:1.8rem}
  body[data-d="3"] .nav button{font-size:.88rem;letter-spacing:.2em}
  body[data-d="3"] .panel{border:1px solid var(--line);
    box-shadow:0 1.2rem 3rem rgba(90,40,60,.13)}

  /* ---------- 4 · TABS — the panel is a folder, the nav its tabs ---------- */
  body[data-d="4"] .nav{width:11.5rem;padding-top:3rem}
  body[data-d="4"] .nav ul{gap:.3rem}
  body[data-d="4"] .nav button{background:var(--plate);color:var(--dim);padding:.66rem 1.05rem;
    letter-spacing:.1em;box-shadow:inset -1px 0 0 var(--line)}
  body[data-d="4"] .nav button:hover{color:var(--ink)}
  body[data-d="4"] .nav button.on{color:var(--ink);box-shadow:none;position:relative;z-index:2;
    margin-right:-2px;padding-right:1.4rem}
  body[data-d="4"] .nav button.on::before{display:none}
  body[data-d="4"] .nav .brand,body[data-d="4"] .nav .tagline,body[data-d="4"] .nav .who{padding-left:1rem}
  body[data-d="4"] .panel{margin-left:0;position:relative;z-index:1;border-radius:0 var(--r-lg) var(--r-lg) 0}
  body[data-d="4"] .nav button{border-radius:var(--r-md) 0 0 var(--r-md)}

  /* ---------- 5 · STACK — the panel is the top sheet of a stack ---------- */
  body[data-d="5"] .page{padding:calc(var(--pad) + .3rem)}
  body[data-d="5"] .nav{width:10.5rem;padding-right:1.8rem}
  body[data-d="5"] .panel{margin:1.5rem 1.5rem 0 1.2rem;border:1px solid var(--line);
    box-shadow:9px -9px 0 -1px rgba(255,255,255,.55), 9px -9px 0 0 var(--line),
               18px -18px 0 -1px rgba(255,255,255,.38), 18px -18px 0 0 var(--line)}

  /* ---------- 6 · SPLIT — pink meets white on one hard line, no gap ---------- */
  body[data-d="6"] .nav{width:15rem;padding-right:2.4rem;justify-content:center}
  body[data-d="6"] .panel{margin-left:0;padding:3rem 3.2rem;border-radius:0 var(--r-lg) var(--r-lg) 0}

  /* ---------- 7 · OVERLAY — one white sheet fills the frame, nav printed in its margin ---------- */
  body[data-d="7"] .page{padding:var(--fw)}
  body[data-d="7"] .nav{width:13.5rem;background:var(--plate);border-radius:var(--r-lg) 0 0 var(--r-lg);
    backdrop-filter:blur(16px) saturate(118%);-webkit-backdrop-filter:blur(16px) saturate(118%);
    padding:2.5rem 1.8rem 2.5rem 2.6rem;border-right:1px solid var(--line)}
  body[data-d="7"] .panel{margin-left:0;padding-left:3rem;border-radius:0 var(--r-lg) var(--r-lg) 0}

  /* ---------- 8 · SPINE — the nav runs up the left edge ---------- */
  body[data-d="8"] .nav{width:4.4rem;align-items:center;padding:.4rem 0}
  body[data-d="8"] .nav .brand,body[data-d="8"] .nav .tagline,body[data-d="8"] .nav .who,
  body[data-d="8"] .nav ul{writing-mode:vertical-rl;transform:rotate(180deg)}
  body[data-d="8"] .nav .brand{font-size:1.25rem;margin:0 0 0 .1rem}
  body[data-d="8"] .nav .tagline{margin:0 0 1.6rem 0}
  body[data-d="8"] .nav ul{flex-direction:row;gap:1.5rem}
  body[data-d="8"] .nav button{width:auto;padding:0 .5rem;text-align:center}
  body[data-d="8"] .nav button.on::before{left:50%;top:auto;bottom:-.5rem;width:1px;height:.5rem;
    transform:translateX(-50%)}
  body[data-d="8"] .nav .sep{height:auto;width:1px;margin:0 1rem}
  body[data-d="8"] .nav .who{margin:auto 0 0 0}
  body[data-d="8"] .panel{margin-left:1.6rem}

  /* ---------- 9 · DOCK — the nav is a column of tiles on the pink ---------- */
  body[data-d="9"] .nav{width:12.5rem;padding-right:2rem;justify-content:center}
  body[data-d="9"] .nav ul{gap:.42rem}
  body[data-d="9"] .nav button{background:rgba(255,255,255,.62);color:var(--ink);border:1px solid var(--line);
    padding:.7rem 1.05rem;letter-spacing:.1em;border-radius:999px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  body[data-d="9"] .nav button:hover{color:var(--ink)}
  body[data-d="9"] .nav button.on{background:var(--ink);border-color:var(--ink);color:var(--plate)}
  body[data-d="9"] .nav button.on::before{display:none}
  body[data-d="9"] .nav .sep{background:transparent;margin:.5rem 0}

  .tag{position:fixed;z-index:95;right:calc(var(--pad) + .2rem);bottom:calc(var(--pad) * .92);
    font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--on-pink-3)}
</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <div class="brand">angel<i>domme</i></div>
      <div class="tagline">angelOS</div>
      <ul id="nav"></ul>
      <div class="who">guest4</div>
    </nav>
    <main class="panel"><div class="inner" id="panel"></div></main>
  </div>
  <div class="veil"></div>
  <div class="frame"></div>
  <div class="tag" id="tag"></div>

<script>
  /* One panel, many sections: nav swaps what is inside it. No page ever loads. */
  const SECTIONS = [
    { id:"home", label:"home" },
    { id:"games", label:"games" },
    { id:"devotion", label:"devotion" },
    { id:"elysium", label:"elysium" },
    { sep:true },
    { id:"settings", label:"settings" },
    { id:"admin", label:"admin" },
  ];

  const GAMES = [
    ["Devotion","writing"],["Multitap","typing"],["Summary","reading"],
    ["Skill Check","timing"],["OT12","trivia"],["Snake","arcade"],
    ["Deathroll","two players"],["Dummy Parse","simulation"],
    ["Elysium","patience"],["Chess","two players"],
  ];

  const VIEW = {
    home: () => `
      <div class="eyebrow">Friday · the nineteenth</div>
      <h1>Welcome, <em>guest4</em>.</h1>
      <p class="lede">There is nothing here that you have earned. Everything is given, and
        everything can be taken back.</p>
      <p class="lede">Choose something from the left. It will open here.</p>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Last here</span><span class="v">four days ago <small>· nothing was missed</small></span></div>
        <div class="row"><span class="k">Lines written</span><span class="v">1,240</span></div>
        <div class="row"><span class="k">The tree</span><span class="v">82 days tended <small>· thirsty</small></span></div>
      </div>`,
    games: () => `
      <div class="eyebrow">Ten ways to pass the time</div>
      <h1>Games</h1>
      <p class="lede">Some are hers, some are yours, one of them needs her at the other end.</p>
      <div class="rule"></div>
      <div class="grid">${GAMES.map(([n,k]) => `<div class="cell"><b>${n}</b><span>${k}</span></div>`).join("")}</div>`,
    devotion: () => `
      <div class="eyebrow">Writing</div>
      <h1>Devotion</h1>
      <p class="lede">Write the lines you are given, over and over, until they are yours.</p>
      <div class="rule"></div>
      <div class="field"><div class="flabel">repetitions</div>
        <div class="chips"><button class="chip">25</button><button class="chip on">50</button><button class="chip">100</button></div></div>
      <div class="field"><div class="flabel">your lines · one per row</div>
        <textarea>Her will is Divine. I will obey.
She knows what is best for me.</textarea></div>
      <button class="go">Begin</button>`,
    elysium: () => `
      <div class="eyebrow">Day 82</div>
      <h1>Elysium</h1>
      <p class="lede">It has been four days. The soil is dry and the lower leaves have begun to
        curl — nothing that cannot be undone, if you see to it now.</p>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Stage</span><span class="v">Sapling <small>· 3 of 6</small></span></div>
        <div class="row"><span class="k">Health</span><span class="v">71 <small>· slipping</small></span></div>
        <div class="row"><span class="k">Soil moisture</span><span class="v">18 <small>· dry</small></span></div>
        <div class="row"><span class="k">Season</span><span class="v">Autumn</span></div>
      </div>
      <div class="field" style="margin-top:2rem"><div class="flabel">tend</div>
        <div class="chips"><button class="chip">water</button><button class="chip">mist</button>
          <button class="chip">trim</button><button class="chip">fertilize</button><button class="chip">inspect</button></div></div>`,
    settings: () => `
      <div class="eyebrow">Yours alone</div>
      <h1>Settings</h1>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Master</span><span class="v">60</span></div>
        <div class="row"><span class="k">Music</span><span class="v">40</span></div>
        <div class="row"><span class="k">Ambience</span><span class="v">25</span></div>
        <div class="row"><span class="k">Typing</span><span class="v">70</span></div>
      </div>`,
    admin: () => `
      <div class="eyebrow">Hers</div>
      <h1>Admin</h1>
      <p class="lede">Finished series, the editable pools, and the things only she can reach.</p>
      <div class="rule"></div>
      <div class="rows">
        <div class="row"><span class="k">Completed</span><span class="v">3 waiting <small>· devotion, multitap</small></span></div>
        <div class="row"><span class="k">Hover text</span><span class="v">11 cards</span></div>
        <div class="row"><span class="k">OT12 photos</span><span class="v">24 tagged</span></div>
      </div>`,
  };

  const NAMES = ["column","drawer","plate","tabs","stack","split","overlay","spine","dock"];
  const ON_WHITE = { 2:1, 4:1, 7:1 };        // designs whose nav sits on a white surface
  const d = Math.min(NAMES.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("d") || "1", 10)));
  document.body.dataset.d = d;
  document.getElementById("tag").textContent = d + " · " + NAMES[d - 1];
  if (ON_WHITE[d]) document.querySelector(".nav").classList.add("on-white");

  const navEl = document.getElementById("nav"), panelEl = document.getElementById("panel");
  let current = "home";
  function open(id) {
    current = id;
    panelEl.innerHTML = VIEW[id]();
    panelEl.parentElement.scrollTop = 0;
    navEl.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.s === id));
  }
  SECTIONS.forEach((s) => {
    const li = document.createElement("li");
    if (s.sep) { li.innerHTML = '<div class="sep"></div>'; navEl.append(li); return; }
    const b = document.createElement("button");
    b.dataset.s = s.id; b.textContent = s.label;
    b.addEventListener("click", () => open(s.id));
    li.append(b); navEl.append(li);
  });
  // the games grid opens a game in the same panel, like the nav does
  panelEl.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (cell && VIEW[cell.querySelector("b").textContent.toLowerCase()]) open(cell.querySelector("b").textContent.toLowerCase());
  });
  open("home");
</script>
</body>
</html>
