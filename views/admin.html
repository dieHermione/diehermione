<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · angeldomme</title>

  <!--
    The admin panel. Everything in it is drawn by public/adminpanel.js (~790
    lines), which was written against the terminal palette and reads those
    variable names directly — 17 uses of --dim2, 15 of --c, and so on.

    Reskinned 2026-10-24 WITHOUT touching that file. The old names are simply
    re-pointed at the shell's values below, so every rule in adminpanel.js keeps
    applying and comes out in the new palette. Deleting the names instead would
    not have left it merely off-colour: an undefined custom property drops the
    WHOLE declaration, so the panel would have rendered unstyled.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell.css" />
  <script src="/me.js"></script>
  <!-- the effect editors drive these live; boot.js powers the decrypt preview -->
  <script src="/dashglitch.js"></script>
  <script src="/boot.js"></script>
  <script src="/audio.js"></script>
  <style>
    /* The terminal names, re-pointed at the shell's palette. adminpanel.js is
       untouched and does not know anything changed. */
    :root {
      --c: #171318;          /* was the house blue: now ink */
      --dim: #3f3741;
      --dim2: rgba(23, 19, 24, .2);   /* it is used as a border colour throughout */
      --bright: #171318;
      --accent: #171318;
      --bg: transparent;
      --glow: rgba(23, 19, 24, .12);
      --ok: #1f5134;
      --err: #8a1b2c;
    }
    .admin-head { margin-bottom: 1.6rem; }
    .admin-head h1 { text-align: left; margin-bottom: .3rem; }
    .admin-head .sub { color: var(--dim); line-height: 1.7; }
    #adminpanel { position: relative; }
    /* adminpanel.js sets inline monospace in a few places; keep it readable */
    #adminpanel { font-family: var(--ui); }
    #adminpanel input, #adminpanel textarea, #adminpanel select { font-family: var(--ui); }
  </style>
</head>
<body>
  <div class="page solo">
    <main class="panel">
      <a class="solo-back" href="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        dashboard
      </a>
      <div class="inner wide">
        <div class="admin-head">
          <div class="eyebrow" id="whoami">Hers</div>
          <h1>Admin</h1>
          <p class="sub">Finished series, the editable text pools, and the effect triggers.</p>
        </div>
        <div id="adminpanel"><p class="loading">loading</p></div>
      </div>
    </main>
  </div>

  <div class="veil"></div>
  <div class="frame"></div>

  <script src="/adminpanel.js"></script>
  <script>
    // Server-side the route 404/redirects non-admins; this is defence in depth
    // and also bounces a signed-out visitor to the login page.
    window.siteMe()
      .then((d) => {
        if (!d || !d.isAdmin) { window.location.href = "/dashboard"; return; }
        return window.AdminPanel.build(document.getElementById("adminpanel"));
      })
      .catch(() => (window.location.href = "/"));
  </script>
</body>
</html>
