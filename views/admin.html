<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <!-- the effect editors drive these live; boot.js powers the decrypt preview -->
  <script src="/dashglitch.js"></script>
  <script src="/boot.js"></script>
  <script src="/audio.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Same dual-tone palette the dashboard uses; adminpanel.js reads these vars. */
    :root { --c:#00acdb; --dim:rgba(0,172,219,0.62); --dim2:rgba(0,172,219,0.4); --bright:#eafaff; --accent:#00acdb;
      --bg:#000000; --glow:rgba(0,172,219,0.34); --ok:#eafaff; --err:#ff7a6d; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body { background: #000; color: var(--c); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; }
    .scan { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }

    /* full-width, full-height admin surface */
    .wrap { position: relative; z-index: 5; width: 100%; min-height: 100vh; padding: 3.2vh 3vw 6vh; }
    .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px;
      letter-spacing: .3em; color: var(--dim); text-transform: uppercase; padding-left: 3.4rem; }
    h1 { font-size: 1.4rem; color: var(--bright); letter-spacing: .06em; margin: 1.1rem 0 0.3rem 3.4rem; font-weight: 600; }
    .sub { color: var(--dim); margin: 0 0 1.6rem 3.4rem; line-height: 1.6; }
    #adminpanel { position: relative; }

    /* standard site back button: a chevron pinned top-left, no plate */
    .back { position: fixed; top: 1.3rem; left: 1.3rem; z-index: 1000; width: 2.6rem; height: 2.6rem;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; background: none;
      color: var(--c); opacity: .8; text-decoration: none; transition: transform .2s ease, opacity .2s ease; }
    .back:hover { transform: translateY(-2px); opacity: 1; }
    .back svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="scan"></div>
  <a class="back" href="/dashboard" aria-label="Back to dashboard" title="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="wrap">
    <div class="top"><span><span style="text-transform:none">angelOS v0.2</span> // admin controls</span><span id="whoami"></span></div>
    <h1>Admin controls</h1>
    <div class="sub">Approvals, applications, accounts, finished series, and the editable text pools and effect triggers.</div>
    <div id="adminpanel"><p style="color:var(--dim2)">Loading…</p></div>
  </div>

  <script src="/adminpanel.js"></script>
  <script>
    // Server-side the route 404/redirects non-admins; this is defence in depth
    // and also bounces a signed-out visitor to the login page.
    window.siteMe()
      .then((d) => {
        if (!d || !d.isAdmin) { window.location.href = "/dashboard"; return; }
        return window.AdminPanel.build(document.getElementById("adminpanel"));
      })
      .catch(() => (window.location.href = "/"));
  </script>
</body>
</html>
