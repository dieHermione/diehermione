<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <!-- the effect editors drive these live; boot.js powers the decrypt preview -->
  <script src="/glitch.js"></script>
  <script src="/dashglitch.js"></script>
  <script src="/boot.js"></script>
  <script src="/audio.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Same terminal palette the dashboard uses; the adm-* styles injected by
       adminpanel.js read these variables. */
    :root { --c:#aee3ff; --dim:#4f7ea0; --dim2:#37576f; --bright:#eafaff; --accent:#8fd0ff;
      --bg:#000000; --glow:rgba(120,190,255,0.32); --ok:#eafaff; --err:#ff7a6d; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { background: #000; color: var(--c); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; }
    .scan { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }
    .wrap { position: relative; z-index: 5; max-width: 820px; margin: 0 auto; padding: 4vh 5vw 8vh; }
    .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
    .top a { color: var(--dim); text-decoration: none; } .top a:hover { color: var(--c); }
    h1 { font-size: 1.4rem; color: var(--bright); letter-spacing: .06em; margin: 1.4rem 0 0.3rem; font-weight: 600; }
    .sub { color: var(--dim); margin-bottom: 1.6rem; line-height: 1.6; }
    #adminpanel { position: relative; }
  </style>
</head>
<body>
  <div class="scan"></div>
  <div class="wrap">
    <div class="top"><span>angelOS v0.2 // admin controls</span><a href="/dashboard">&larr; dashboard</a></div>
    <h1>Admin controls</h1>
    <div class="sub">Approvals, accounts, finished series, and the editable text pools and effect triggers.</div>
    <div id="adminpanel"><p style="color:var(--dim2)">Loading…</p></div>
  </div>

  <script src="/adminpanel.js"></script>
  <script>
    // Server-side the route 404/redirects non-admins; this is defence in depth
    // and also bounces a signed-out visitor to the login page.
    window.siteMe()
      .then((d) => {
        if (!d || !d.isAdmin) { window.location.href = "/dashboard"; return; }
        return window.AdminPanel.build(document.getElementById("adminpanel"));
      })
      .catch(() => (window.location.href = "/"));
  </script>
</body>
</html>
