<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T9 - angeldom.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="/me.js"></script>
<script src="/audio.js"></script>
<style>
  /* T9: multi-tap typing on a flat keypad. Design 1 (classic stack). There is
     NO instructional text anywhere — no tap cues, no key hints, no footer. The
     player has to remember the layout and the tap counts. Being obtuse is the
     point. Self-contained, no site.css. Dual-tone: blue #00acdb + white only. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  :root { --c:#00acdb; --w:#eafaff; --err:#ff5a4a; --glow:rgba(0,172,219,.30); --line:#0c2731; --panel:#060d13; }
  html, body { height: 100%; overflow: hidden; }
  body { background:#000; color:var(--c); font-family:"IBM Plex Mono",ui-monospace,monospace;
    -webkit-user-select:none; user-select:none; }
  .scan { position:fixed; inset:0; z-index:40; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }

  .stage { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; padding:3vh 4vw; }
  .hdr { display:flex; justify-content:space-between; font-size:11px; letter-spacing:.32em;
    text-transform:uppercase; flex-shrink:0; padding-left:2.8rem; }
  .hdr b { color:var(--w); font-weight:400; }

  /* the classic stack: line, then keypad, centred */
  .body { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1.6rem; }

  /* the example sentence to copy, shown plainly; long phrases scroll internally
     so the keypad always stays on screen */
  .example { font-size:clamp(1rem, 2.2vw, 1.4rem); letter-spacing:.02em; line-height:1.5;
    text-align:center; max-width:min(70ch, 88vw); max-height:26vh; overflow-y:auto; color:var(--c); }
  /* the box you type into: committed letters, then the pending multi-tap caret */
  .entry { width:min(70ch, 88vw); min-height:2.6rem; max-height:22vh; overflow-y:auto; padding:.6rem .9rem;
    border:1px solid var(--line); background:var(--panel); border-radius:6px;
    font-size:clamp(1rem, 2.2vw, 1.4rem); letter-spacing:.02em; line-height:1.4;
    text-align:left; color:var(--w); }
  .entry.wrong { border-color:var(--err); box-shadow:0 0 16px rgba(255,90,74,.35); }
  .entry .done { color:var(--w); }
  .entry .bad { color:var(--err); text-decoration:line-through; }
  .entry .cur { background:var(--w); color:#04060a; padding:0 .05em; }
  .entry .caret { border-left:2px solid var(--c); margin-left:1px; animation:bl 1s steps(1) infinite; }
  @keyframes bl { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:min(340px, 82vw); }
  .key { border:1px solid var(--line); background:var(--panel); border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:.55rem 0; min-height:60px; font-family:inherit; color:var(--c);
    transition:background .06s, border-color .06s, box-shadow .06s; }
  .key .kn { color:var(--w); font-size:1.2rem; line-height:1; }
  .key .kl { color:var(--c); font-size:.62rem; letter-spacing:.16em; margin-top:.34rem; min-height:.7em; }
  .key:active, .key.hit { border-color:var(--c); background:rgba(0,172,219,.16); box-shadow:0 0 16px var(--glow); }

  /* completion + start overlays */
  .center { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.2rem; background:rgba(0,0,0,.72); text-align:center; }
  .center h1 { font-size:clamp(1.6rem,4vw,2.6rem); color:var(--w); letter-spacing:.14em;
    text-transform:uppercase; text-shadow:0 0 26px var(--glow); }
  .center .stat { font-size:1rem; letter-spacing:.08em; }
  .center .stat b { color:var(--w); font-weight:400; }
  .btn { border:1.5px solid var(--c); background:transparent; color:var(--w); font-family:inherit;
    font-size:.82rem; letter-spacing:.24em; text-transform:uppercase; padding:.7rem 1.8rem; cursor:pointer; }
  .btn:hover { background:rgba(0,172,219,.14); box-shadow:0 0 18px var(--glow); }

  /* back chevron colour (nav.js injects .dash-back; it inherits currentColor) */
  body { color:var(--c); }
</style>
</head>
<body class="has-top-nav">
  <div class="stage">
    <div class="hdr"><span><span style="text-transform:none">angelOS</span> v0.2 &middot; multitap</span><span>line <b id="ln">1</b> / <b id="lt">1</b></span></div>
    <div class="body">
      <div class="example" id="example"></div>
      <div class="entry" id="entry"></div>
      <div class="pad" id="pad"></div>
    </div>
  </div>

  <div class="center" id="start">
    <h1>multitap</h1>
    <button class="btn" id="begin" type="button">begin</button>
  </div>

  <div class="center" id="done" hidden>
    <h1>done</h1>
    <div class="stat"><b id="d-err">0</b> mistakes &middot; <b id="d-time">0:00</b></div>
    <button class="btn" id="again" type="button">again</button>
  </div>

<div class="scan"></div>

  <script>
    // ---- content: lowercase lines, T9-friendly (mostly letters + spaces) ----
    // These are the fallback; the live, Hermione-editable set is fetched from
    // /api/multitap below and replaces this if it loads.
    let POOL = [
      "an angel is a spiritual, heavenly, or supernatural entity, usually humanoid with bird-like wings, often depicted as a messenger or intermediary between god (the transcendent) and humanity (the profane) in various traditions like the abrahamic religions. other roles include protectors and guides for humans, such as guardian angels, and servants of god. in western belief-systems the term is often used to distinguish benevolent from malevolent intermediary beings.",
    ];
    const RUN_LINES = 8;
    // No auto-commit timer. A pending letter is finalised when ANY other key is
    // pressed (or # to confirm the last one); * deletes. See press().

    // key -> the letters it cycles through. 0 is space; * deletes; # confirms.
    const MAP = {
      "1": [".", ",", "?", "!", "'", "-", "(", ")"],
      "2": ["a", "b", "c"], "3": ["d", "e", "f"], "4": ["g", "h", "i"],
      "5": ["j", "k", "l"], "6": ["m", "n", "o"], "7": ["p", "q", "r", "s"],
      "8": ["t", "u", "v"], "9": ["w", "x", "y", "z"], "0": [" "],
    };
    // the labels printed on the keypad face (a real keypad has these; they are
    // not instructions). * = delete, # = confirm are labelled so they're findable.
    const LABELS = {
      "1": ".,-()", "2": "abc", "3": "def", "4": "ghi", "5": "jkl", "6": "mno",
      "7": "pqrs", "8": "tuv", "9": "wxyz", "*": "⌫ del", "0": "␣", "#": "↵ ok",
    };
    const ORDER = ["1","2","3","4","5","6","7","8","9","*","0","#"];

    const $ = (id) => document.getElementById(id);
    const exampleEl = $("example"), entryEl = $("entry"), padEl = $("pad");

    let lines = [], idx = 0, target = "", typed = "";
    let pending = null;          // { key, count } — an uncommitted letter
    let mistakes = 0, startedAt = 0, playing = false;

    // ---- keypad markup ----
    padEl.innerHTML = ORDER.map((k) =>
      '<button class="key" data-k="' + k + '"><span class="kn">' + k +
      '</span><span class="kl">' + LABELS[k] + '</span></button>').join("");
    const keyEls = {};
    padEl.querySelectorAll(".key").forEach((el) => { keyEls[el.dataset.k] = el; });

    function shuffled(pool, n) {
      const a = pool.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a.slice(0, Math.min(n, a.length));
    }

    // the letter the pending tap currently shows (before it commits)
    function pendingChar() {
      if (!pending) return "";
      const set = MAP[pending.key];
      return set[pending.count % set.length];
    }

    function render() {
      exampleEl.textContent = target;
      const parts = [];
      // committed characters, coloured by whether they match the target so far
      for (let i = 0; i < typed.length; i++) {
        const ch = typed[i] === " " ? "&nbsp;" : escapeHtml(typed[i]);
        const cls = typed[i] === target[i] ? "done" : "bad";
        parts.push('<span class="' + cls + '">' + ch + "</span>");
      }
      // the caret: the pending (uncommitted) letter, or a blinking bar
      if (pending) {
        const pc = pendingChar();
        parts.push('<span class="cur">' + (pc === " " ? "&nbsp;" : escapeHtml(pc)) + "</span>");
      } else {
        parts.push('<span class="caret">&nbsp;</span>');
      }
      entryEl.innerHTML = parts.join("");
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    // Confirm the pending letter. Returns true only if it was committed correctly
    // AND the line is not yet finished (so the caller may start the next letter).
    // A WRONG letter sends the whole phrase back to the beginning.
    function confirmCurrent() {
      if (!pending) return true;                     // nothing to confirm
      const ch = pendingChar(), pos = typed.length;
      pending = null;
      if (pos >= target.length) return false;        // already full; ignore
      if (ch !== target[pos]) { mistakes++; typed += ch; resetPhrase(); return false; }
      typed += ch;
      if (typed.length >= target.length) { lineComplete(); return false; }
      return true;
    }
    function lineComplete() {
      entryEl.classList.remove("wrong");
      render();
      setTimeout(nextLine, 240);
    }
    function resetPhrase() {
      typed = ""; pending = null;                    // one wrong letter = start over
      render();
      entryEl.classList.add("wrong");
      setTimeout(() => entryEl.classList.remove("wrong"), 350);
    }
    function deleteOne() {
      if (pending) pending = null;                   // drop the uncommitted letter
      else if (typed.length) typed = typed.slice(0, -1);
      entryEl.classList.remove("wrong");
      render();
    }

    function flash(k) {
      const el = keyEls[k]; if (!el) return;
      el.classList.add("hit");
      setTimeout(() => el.classList.remove("hit"), 90);
    }

    function press(k) {
      if (!playing) return;
      flash(k);
      try { if (window.playType) window.playType(); } catch (e) {}
      if (k === "*") { deleteOne(); return; }                 // delete
      if (k === "#") { confirmCurrent(); render(); return; }  // confirm the last letter
      if (!MAP[k]) return;
      if (pending && pending.key === k) { pending.count++; render(); return; }  // same key cycles
      // any different key first CONFIRMS the current pending, then starts the new one
      if (!confirmCurrent()) return;                 // reset or completed — swallow this key
      pending = { key: k, count: 0 };
      render();
    }

    function nextLine() {
      idx++;
      if (idx >= lines.length) { finish(); return; }
      target = lines[idx]; typed = ""; pending = null;
      entryEl.classList.remove("wrong");
      $("ln").textContent = idx + 1;
      render();
    }

    function start() {
      lines = shuffled(POOL, RUN_LINES);
      idx = 0; target = lines[0]; typed = ""; pending = null;
      mistakes = 0; startedAt = Date.now(); playing = true;
      $("ln").textContent = 1; $("lt").textContent = lines.length;
      $("start").hidden = true; $("done").hidden = true;
      render();
    }

    function finish() {
      playing = false;
      const secs = Math.round((Date.now() - startedAt) / 1000);
      $("d-err").textContent = mistakes;
      $("d-time").textContent = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
      $("done").hidden = false;
    }

    // ---- input: MOUSE ONLY. The physical keyboard is deliberately ignored —
    // you tap the on-screen keypad, nothing else. (No keydown listener at all.)
    padEl.addEventListener("click", (e) => { const b = e.target.closest(".key"); if (b) press(b.dataset.k); });
    $("begin").addEventListener("click", start);
    $("again").addEventListener("click", start);

    window.siteMe().then(() => {}).catch(() => (window.location.href = "/"));
    // pull the live, editable sentence pool (falls back to POOL above on failure)
    fetch("/api/multitap").then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (d && Array.isArray(d.lines) && d.lines.length) POOL = d.lines;
    }).catch(() => {});
  </script>
  <script src="/nav.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
