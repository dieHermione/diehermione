<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elysium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Jost", -apple-system, sans-serif;
    color: #f1f6f0;
    /* local misty forest photograph */
    background: #0a120c url("/tree-background.jpg") center/cover no-repeat fixed;
    position: relative;
  }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(130% 100% at 50% 30%, transparent 45%, rgba(10,18,14,0.5) 100%),
      linear-gradient(180deg, rgba(10,18,14,0.3), transparent 30%, rgba(8,14,10,0.45)); }

  /* the tree */
  .stage { position: fixed; inset: 0; z-index: 3; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  .tree { width: min(340px, 56vw); margin-bottom: 9vh; transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite; filter: drop-shadow(0 22px 30px rgba(0,0,0,0.5)); }
  @keyframes sway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  .leaf { transform-origin: center; animation: rustle 4.5s ease-in-out infinite; }
  .leaf:nth-child(odd) { animation-delay: -1.4s; }
  @keyframes rustle { 0%,100% { transform: rotate(0); } 50% { transform: rotate(2.5deg); } }

  /* rain on the glass: drops strike the "window", cling, then trail down and fade */
  .glass { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .drop { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.6), rgba(205,225,235,0.14) 46%, rgba(120,150,160,0.05) 72%);
    box-shadow: inset 0 -1px 2px rgba(255,255,255,0.45), inset 0 1px 3px rgba(120,150,160,0.35), 0 1px 2px rgba(0,0,0,0.25);
    opacity: 0; animation: strike ease-out forwards; }
  @keyframes strike {
    0% { opacity: 0; transform: scale(0.25); }
    9% { opacity: 0.95; transform: scale(1.08); }
    16% { transform: scale(1); }
    60% { opacity: 0.9; transform: translateY(4px) scale(1); }
    100% { opacity: 0; transform: translateY(40px) scaleY(1.15); }
  }

  /* --- UI: text only, no backgrounds --- */
  .ui { position: fixed; z-index: 6; text-shadow: 0 2px 10px rgba(0,0,0,0.65); }
  .fade-up { opacity: 0; transform: translateY(14px); animation: fadeUp 1.1s ease forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  /* merged top-left menu: stats + today's care, clean sans, stacked */
  .menu { top: 2.2rem; left: 2.4rem; animation-delay: 0.4s; }
  .menu .stat { font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: #d7e2d7; margin-bottom: 1.1rem; }
  .menu .care { display: flex; flex-direction: column; gap: 0.6rem; }
  .menu .item { font-size: 1.02rem; font-weight: 300; letter-spacing: 0.05em; color: #eef5ee; display: flex; align-items: center; gap: 0.6rem; }
  .menu .item .mark { width: 0.9rem; font-size: 0.85rem; color: #bfe6c4; opacity: 0; }
  .menu .item.done .mark { opacity: 1; }
  .menu .item:not(.done) { color: #c7d3c7; }

  /* control buttons: clean underlined text */
  .controls { bottom: 2.4rem; left: 0; right: 0; display: flex; justify-content: center; gap: 2rem; pointer-events: none; animation-delay: 0.9s; }
  .ctl { pointer-events: auto; background: none; border: none; cursor: pointer; color: #f2f7f0;
    font-family: "Jost", sans-serif; font-weight: 300; font-size: 1.05rem; letter-spacing: 0.08em;
    text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; text-decoration-color: rgba(242,247,240,0.5);
    text-shadow: 0 2px 10px rgba(0,0,0,0.7); padding: 0.3rem 0.2rem;
    transition: transform 0.28s cubic-bezier(0.2,0.7,0.3,1), text-underline-offset 0.28s ease, text-decoration-color 0.28s ease; }
  .ctl:hover { transform: translateY(-6px); text-underline-offset: 10px; text-decoration-color: #f2f7f0; }
  .ctl:active { transform: translateY(-2px); }

  /* fleeting feedback line (no mechanics) */
  .toast { position: fixed; z-index: 7; left: 50%; bottom: 7.4rem; transform: translateX(-50%);
    font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.25rem; color: #f2f9f1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; }
  .toast.show { animation: floatUp 1.9s ease forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -32px); } }

  /* music player: text only */
  .player { bottom: 2.4rem; right: 2.4rem; display: flex; align-items: baseline; gap: 1.3rem; animation-delay: 1.1s; }
  .ptext { background: none; border: none; cursor: pointer; color: #eef5ee; font-family: "Jost", sans-serif;
    font-weight: 300; font-size: 0.92rem; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 5px;
    text-decoration-color: rgba(238,245,238,0.45); text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    transition: transform 0.2s ease, text-underline-offset 0.2s ease, text-decoration-color 0.2s ease; padding: 0.15rem 0; }
  .ptext:hover { text-underline-offset: 8px; text-decoration-color: #eef5ee; transform: translateY(-2px); }
  .ptext.off { text-decoration-line: line-through; opacity: 0.5; }
  .track { font-family: "Cormorant Garamond", serif; font-size: 1.15rem; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
  .track em { font-style: italic; color: #cfe0cf; font-size: 0.95rem; }

  /* intro / page load */
  .intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; background: rgba(6,12,8,0.66); backdrop-filter: blur(3px); cursor: pointer; transition: opacity 1.1s ease; }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro .sub { font-size: 0.8rem; letter-spacing: 0.4em; text-transform: uppercase; color: #bcccbc; }
  .intro .title { font-family: "Cormorant Garamond", serif; font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 400; letter-spacing: 0.05em; }
  .intro .enter { margin-top: 0.7rem; padding: 0.7rem 2.2rem; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  @media (max-width: 820px) {
    .player { bottom: 6.4rem; right: 0; left: 0; justify-content: center; }
    .controls { gap: 1.2rem; }
    .ctl { font-size: 0.92rem; }
  }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: 0.001s !important; } }
</style>
</head>
<body>
  <div class="veil"></div>

  <div class="stage">
    <svg class="tree" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-label="A young sapling">
      <defs>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4632"/><stop offset="1" stop-color="#2e2318"/></linearGradient>
        <linearGradient id="bark" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6b5238"/><stop offset="1" stop-color="#8a6b45"/></linearGradient>
        <radialGradient id="foliage" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#9fe08a"/><stop offset="0.6" stop-color="#5fae5a"/><stop offset="1" stop-color="#347a41"/></radialGradient>
      </defs>
      <ellipse cx="100" cy="244" rx="66" ry="15" fill="url(#soil)"/>
      <ellipse cx="100" cy="240" rx="60" ry="11" fill="#6b5236" opacity="0.7"/>
      <g stroke="#4f8a44" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M62 240 q-3 -12 -8 -16"/><path d="M70 241 q0 -14 3 -20"/><path d="M135 240 q3 -12 9 -15"/><path d="M128 241 q1 -13 -2 -19"/>
      </g>
      <path d="M96 240 q-2 -50 4 -84 q3 -18 0 -34" fill="none" stroke="url(#bark)" stroke-width="9" stroke-linecap="round"/>
      <path d="M100 150 q-16 -6 -30 -20" fill="none" stroke="url(#bark)" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 132 q16 -4 30 -16" fill="none" stroke="url(#bark)" stroke-width="5" stroke-linecap="round"/>
      <g>
        <ellipse class="leaf" cx="66" cy="126" rx="20" ry="12" fill="url(#foliage)" transform="rotate(-28 66 126)"/>
        <ellipse class="leaf" cx="134" cy="112" rx="21" ry="12" fill="url(#foliage)" transform="rotate(26 134 112)"/>
        <ellipse class="leaf" cx="86" cy="96" rx="24" ry="14" fill="url(#foliage)" transform="rotate(-12 86 96)"/>
        <ellipse class="leaf" cx="118" cy="86" rx="24" ry="14" fill="url(#foliage)" transform="rotate(14 118 86)"/>
        <ellipse class="leaf" cx="100" cy="70" rx="27" ry="16" fill="url(#foliage)"/>
        <ellipse class="leaf" cx="100" cy="58" rx="18" ry="11" fill="#a9e894" opacity="0.9"/>
      </g>
    </svg>
  </div>

  <div class="glass" id="glass"></div>

  <!-- merged menu: stats + today's care, top-left -->
  <div class="ui menu fade-up">
    <div class="stat">Sapling · 2 days · thriving</div>
    <div class="care">
      <div class="item done"><span class="mark">✓</span>Watered</div>
      <div class="item"><span class="mark">✓</span>Trimmed</div>
      <div class="item"><span class="mark">✓</span>Misted</div>
      <div class="item"><span class="mark">✓</span>Fed</div>
    </div>
  </div>

  <!-- controls: text buttons -->
  <div class="ui controls fade-up" id="controls">
    <button class="ctl" data-say="The soil drinks deep.">Water</button>
    <button class="ctl" data-say="A cleaner shape.">Trim</button>
    <button class="ctl" data-say="A fine mist settles.">Mist</button>
    <button class="ctl" data-say="Fed and nourished.">Fertilize</button>
    <button class="ctl" data-say="Leaves unfurling well.">Inspect</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- music player: text -->
  <div class="ui player fade-up">
    <button class="ptext" id="playBtn">Pause</button>
    <span class="track">Gymnopédie No. 1 <em>— Satie</em></span>
    <button class="ptext" id="musicMute">Music</button>
    <button class="ptext" id="soundMute">Ambience</button>
  </div>

  <audio id="music" src="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Gymnopedie%20No%201.mp3" loop preload="none"></audio>

  <div class="intro" id="intro">
    <div class="sub">a place to grow</div>
    <div class="title">Elysium</div>
    <div class="enter">Enter</div>
  </div>

<script>
  /* ---------- raindrops striking the glass ---------- */
  let dropsOn = true;
  (function () {
    const glass = document.getElementById("glass");
    function spawn() {
      if (dropsOn) {
        const d = document.createElement("div");
        d.className = "drop";
        const size = 6 + Math.random() * 24;
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = Math.random() * 100 + "%";
        d.style.top = Math.random() * 100 + "%";
        d.style.animationDuration = 2.4 + Math.random() * 2.8 + "s";
        glass.appendChild(d);
        setTimeout(() => d.remove(), 5600);
      }
      setTimeout(spawn, 110 + Math.random() * 220);
    }
    spawn();
  })();

  /* ---------- synthesised rain ambience ---------- */
  let audioCtx = null, rainGain = null, soundMuted = false;
  function startRain() {
    if (audioCtx) { audioCtx.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    const size = 2 * audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const hp = audioCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 320;
    const lp = audioCtx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500;
    rainGain = audioCtx.createGain(); rainGain.gain.value = soundMuted ? 0 : 0.17;
    const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.08; lfoGain.gain.value = 0.04;
    lfo.connect(lfoGain).connect(rainGain.gain);
    noise.connect(hp).connect(lp).connect(rainGain).connect(audioCtx.destination);
    noise.start(); lfo.start();
    audioCtx.resume();
  }

  /* ---------- music ---------- */
  const music = document.getElementById("music");
  const playBtn = document.getElementById("playBtn");
  function setPlaying(on) { playBtn.textContent = on ? "Pause" : "Play"; }
  playBtn.addEventListener("click", () => {
    if (music.paused) music.play().then(() => setPlaying(true)).catch(() => {});
    else { music.pause(); setPlaying(false); }
  });
  music.addEventListener("play", () => setPlaying(true));
  music.addEventListener("pause", () => setPlaying(false));

  /* ---------- mutes (default ON; struck through when muted) ---------- */
  let musicMuted = false;
  document.getElementById("musicMute").addEventListener("click", (e) => {
    musicMuted = !musicMuted; music.muted = musicMuted;
    e.currentTarget.classList.toggle("off", musicMuted);
  });
  document.getElementById("soundMute").addEventListener("click", (e) => {
    soundMuted = !soundMuted; dropsOn = !soundMuted;
    if (rainGain) rainGain.gain.value = soundMuted ? 0 : 0.17;
    e.currentTarget.classList.toggle("off", soundMuted);
  });

  /* ---------- control buttons: fleeting feedback ---------- */
  const toast = document.getElementById("toast");
  document.getElementById("controls").addEventListener("click", (e) => {
    const btn = e.target.closest(".ctl");
    if (!btn) return;
    toast.textContent = btn.dataset.say || "";
    toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
  });

  /* ---------- intro / page load (also the audio gesture) ---------- */
  const intro = document.getElementById("intro");
  function enter() {
    intro.classList.add("gone");
    startRain();
    music.volume = 0.55;
    music.play().then(() => setPlaying(true)).catch(() => {});
    setTimeout(() => intro.remove(), 1200);
  }
  intro.addEventListener("click", enter);
</script>
</body>
</html>
