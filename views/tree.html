<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Grove - angeldom.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Jost", -apple-system, sans-serif;
    color: #eef3ee;
    /* real forest photograph (Unsplash, Sebastian Unrau) */
    background: #0a120c url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=80") center/cover no-repeat fixed;
    position: relative;
  }
  /* mood + legibility overlay */
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(6,14,9,0.55) 100%),
      linear-gradient(180deg, rgba(8,16,10,0.35), rgba(6,12,8,0.15) 30%, rgba(6,12,8,0.55)); }

  /* falling rain streaks */
  .rain-fall { position: fixed; inset: -10% 0; z-index: 2; pointer-events: none; }
  .streak { position: absolute; top: -12%; width: 1px; height: 90px;
    background: linear-gradient(transparent, rgba(220,235,245,0.35)); animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(130vh); } }

  /* the tree */
  .stage { position: fixed; inset: 0; z-index: 3; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  .tree { width: min(360px, 60vw); margin-bottom: 8vh; transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.45)); }
  @keyframes sway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  .leaf { transform-origin: center; animation: rustle 4.5s ease-in-out infinite; }
  .leaf:nth-child(odd) { animation-delay: -1.4s; }
  @keyframes rustle { 0%,100% { transform: rotate(0); } 50% { transform: rotate(2.5deg); } }

  /* raindrops on the "glass" (screen) */
  .glass { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .drop { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(200,225,235,0.12) 45%, rgba(120,150,160,0.05) 70%);
    box-shadow: inset 0 -1px 2px rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.25);
    opacity: 0; animation: splat ease-out forwards; }
  @keyframes splat {
    0% { opacity: 0; transform: scale(0.3); }
    12% { opacity: 0.9; transform: scale(1); }
    70% { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(26px) scale(0.9); }
  }

  /* --- UI: minimalist frosted glass --- */
  .ui { position: fixed; z-index: 6; }
  .panel { background: rgba(16,26,20,0.34); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
  .fade-up { opacity: 0; transform: translateY(14px); animation: fadeUp 1s ease forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  .info { top: 2rem; left: 2rem; padding: 1.3rem 1.6rem; animation-delay: 0.4s; }
  .info .name { font-family: "Cormorant Garamond", serif; font-size: 1.9rem; font-weight: 500; letter-spacing: 0.01em; }
  .info .name em { font-style: italic; color: #cfe6cf; }
  .info .meta { margin-top: 0.5rem; display: flex; gap: 1.2rem; font-size: 0.82rem; font-weight: 300; letter-spacing: 0.04em; color: #cdd8cd; }
  .info .meta b { display: block; font-size: 1rem; font-weight: 500; color: #f2f7f0; letter-spacing: 0; }
  .health-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8fd6a0; box-shadow: 0 0 8px #8fd6a0; margin-right: 0.4rem; vertical-align: middle; }

  .dailies { top: 2rem; right: 2rem; padding: 1.2rem 1.5rem; width: 210px; animation-delay: 0.6s; }
  .dailies h3 { font-family: "Cormorant Garamond", serif; font-size: 1.15rem; font-weight: 500; margin-bottom: 0.7rem; letter-spacing: 0.02em; }
  .task { display: flex; align-items: center; gap: 0.6rem; padding: 0.32rem 0; font-size: 0.86rem; font-weight: 300; color: #dbe6db; }
  .task .box { width: 15px; height: 15px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.4); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
  .task.done .box { background: #8fd6a0; border-color: #8fd6a0; color: #14301c; }
  .task.done { color: #f0f6f0; }

  .controls { bottom: 2.2rem; left: 0; right: 0; display: flex; justify-content: center; gap: 0.9rem; pointer-events: none; animation-delay: 0.9s; }
  .ctl { pointer-events: auto; position: relative; overflow: hidden;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #eef5ee; border-radius: 16px; padding: 0.85rem 1.1rem 0.7rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem; cursor: pointer; min-width: 74px;
    font-family: "Jost", sans-serif; font-weight: 400; font-size: 0.78rem; letter-spacing: 0.06em;
    transition: transform 0.25s cubic-bezier(0.2,0.7,0.3,1), background 0.25s ease, box-shadow 0.25s ease; }
  .ctl svg { width: 22px; height: 22px; stroke: #eef5ee; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ctl:hover { transform: translateY(-6px); background: rgba(255,255,255,0.17); box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
  .ctl:active { transform: translateY(-2px); }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); transform: translate(-50%,-50%) scale(0); animation: ripple 0.6s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: translate(-50%,-50%) scale(9); opacity: 0; } }

  /* floating action feedback (visual only, no mechanics) */
  .toast { position: fixed; z-index: 7; left: 50%; bottom: 8.5rem; transform: translateX(-50%);
    font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.2rem; color: #eef7ee;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; }
  .toast.show { animation: floatUp 1.8s ease forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -34px); } }

  /* music player + mutes */
  .player { bottom: 2.2rem; right: 2rem; padding: 0.7rem 0.9rem; display: flex; align-items: center; gap: 0.75rem; animation-delay: 1.1s; }
  .iconbtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08); color: #eef5ee; display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease; }
  .iconbtn:hover { background: rgba(255,255,255,0.18); transform: scale(1.06); }
  .iconbtn svg { width: 17px; height: 17px; stroke: #eef5ee; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.play svg { fill: #eef5ee; stroke: none; }
  .iconbtn.muted { opacity: 0.5; }
  .track { min-width: 150px; }
  .track .t-title { font-family: "Cormorant Garamond", serif; font-size: 1rem; line-height: 1.1; }
  .track .t-artist { font-size: 0.68rem; font-weight: 300; letter-spacing: 0.05em; color: #c6d3c6; }
  .track .bar { margin-top: 0.4rem; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden; }
  .track .bar span { display: block; height: 100%; width: 0; background: #cfe6cf; }
  .mutes { display: flex; gap: 0.5rem; margin-left: 0.2rem; }

  /* intro / page-load */
  .intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4rem; background: rgba(6,12,8,0.72); backdrop-filter: blur(4px); cursor: pointer; transition: opacity 1.1s ease; }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro .title { font-family: "Cormorant Garamond", serif; font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 400; letter-spacing: 0.04em; }
  .intro .sub { font-size: 0.85rem; letter-spacing: 0.35em; text-transform: uppercase; color: #bcccbc; }
  .intro .enter { margin-top: 0.6rem; padding: 0.7rem 2.2rem; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* narrow screens: lift the player above the control row so they never collide */
  @media (max-width: 980px) {
    .player { bottom: 6.9rem; left: 0; right: 0; margin: 0 auto; width: max-content; }
    .controls { gap: 0.5rem; }
    .ctl { min-width: 60px; padding: 0.7rem 0.7rem 0.6rem; font-size: 0.72rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; } }
</style>
</head>
<body>
  <div class="veil"></div>
  <div class="rain-fall" id="rainFall"></div>

  <div class="stage">
    <svg class="tree" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-label="A young sapling">
      <defs>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5a4632"/><stop offset="1" stop-color="#2e2318"/>
        </linearGradient>
        <linearGradient id="bark" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#6b5238"/><stop offset="1" stop-color="#8a6b45"/>
        </linearGradient>
        <radialGradient id="foliage" cx="0.4" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#9fe08a"/><stop offset="0.6" stop-color="#5fae5a"/><stop offset="1" stop-color="#347a41"/>
        </radialGradient>
      </defs>
      <!-- soil mound -->
      <ellipse cx="100" cy="244" rx="66" ry="15" fill="url(#soil)"/>
      <ellipse cx="100" cy="240" rx="60" ry="11" fill="#6b5236" opacity="0.7"/>
      <!-- grass tufts -->
      <g stroke="#4f8a44" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M62 240 q-3 -12 -8 -16"/><path d="M70 241 q0 -14 3 -20"/>
        <path d="M135 240 q3 -12 9 -15"/><path d="M128 241 q1 -13 -2 -19"/>
      </g>
      <!-- trunk -->
      <path d="M96 240 q-2 -50 4 -84 q3 -18 0 -34" fill="none" stroke="url(#bark)" stroke-width="9" stroke-linecap="round"/>
      <!-- branches -->
      <path d="M100 150 q-16 -6 -30 -20" fill="none" stroke="url(#bark)" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 132 q16 -4 30 -16" fill="none" stroke="url(#bark)" stroke-width="5" stroke-linecap="round"/>
      <!-- leaves -->
      <g>
        <ellipse class="leaf" cx="66" cy="126" rx="20" ry="12" fill="url(#foliage)" transform="rotate(-28 66 126)"/>
        <ellipse class="leaf" cx="134" cy="112" rx="21" ry="12" fill="url(#foliage)" transform="rotate(26 134 112)"/>
        <ellipse class="leaf" cx="86" cy="96" rx="24" ry="14" fill="url(#foliage)" transform="rotate(-12 86 96)"/>
        <ellipse class="leaf" cx="118" cy="86" rx="24" ry="14" fill="url(#foliage)" transform="rotate(14 118 86)"/>
        <ellipse class="leaf" cx="100" cy="70" rx="27" ry="16" fill="url(#foliage)"/>
        <ellipse class="leaf" cx="100" cy="58" rx="18" ry="11" fill="#a9e894" opacity="0.9"/>
      </g>
    </svg>
  </div>

  <div class="glass" id="glass"></div>

  <!-- tree info -->
  <div class="ui info panel fade-up">
    <div class="name">Your <em>Sapling</em></div>
    <div class="meta">
      <div>Stage<b>Sapling</b></div>
      <div>Age<b>2 days</b></div>
      <div>Health<b><span class="health-dot"></span>Thriving</b></div>
    </div>
  </div>

  <!-- tree dailies (separate from site dailies) -->
  <div class="ui dailies panel fade-up">
    <h3>Today's care</h3>
    <div class="task done"><span class="box">✓</span> Watered</div>
    <div class="task"><span class="box"></span> Trimmed</div>
    <div class="task"><span class="box"></span> Misted</div>
    <div class="task"><span class="box"></span> Fed</div>
  </div>

  <!-- controls -->
  <div class="ui controls fade-up" id="controls">
    <button class="ctl" data-say="The soil drinks deep."><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>Water</button>
    <button class="ctl" data-say="A cleaner shape."><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5 20 18M8.5 16.5 20 6"/></svg>Trim</button>
    <button class="ctl" data-say="A fine mist settles."><svg viewBox="0 0 24 24"><path d="M4 8h8M6 12h8M4 16h9"/><circle cx="18" cy="7" r="2"/><path d="M18 10v9"/></svg>Mist</button>
    <button class="ctl" data-say="Fed and nourished."><svg viewBox="0 0 24 24"><path d="M12 20c5-1 8-5 8-10 0-1-.3-2-.7-3-4 0-8 3-8 8"/><path d="M12 20c-3-1-5-4-5-8 0 0 3 1 4 4"/><path d="M12 20V9"/></svg>Fertilize</button>
    <button class="ctl" data-say="Leaves unfurling well."><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20"/></svg>Inspect</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- music player + mutes -->
  <div class="ui player panel fade-up">
    <button class="iconbtn play" id="playBtn" title="Play / pause">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="track">
      <div class="t-title">Gymnopédie No. 1</div>
      <div class="t-artist">Erik Satie · royalty-free</div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <div class="mutes">
      <button class="iconbtn" id="musicMute" title="Mute music">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </button>
      <button class="iconbtn" id="soundMute" title="Mute rain & sounds">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9c1.2 1 1.2 5 0 6"/><path d="M18.5 7c2.4 2 2.4 8 0 10"/></svg>
      </button>
    </div>
  </div>

  <!-- rain audio is synthesised; music streams a royalty-free file -->
  <audio id="music" src="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Gymnopedie%20No%201.mp3" loop preload="none"></audio>

  <!-- intro / page load -->
  <div class="intro" id="intro">
    <div class="sub">angeldom · the grove</div>
    <div class="title">A place to grow</div>
    <div class="enter">Enter</div>
  </div>

<script>
  /* ---------- falling rain streaks ---------- */
  (function () {
    const fall = document.getElementById("rainFall");
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 90; i++) {
      const s = document.createElement("div");
      s.className = "streak";
      s.style.left = Math.random() * 100 + "%";
      const dur = 0.5 + Math.random() * 0.7;
      s.style.animationDuration = dur + "s";
      s.style.animationDelay = -Math.random() * dur + "s";
      s.style.height = 60 + Math.random() * 70 + "px";
      s.style.opacity = 0.3 + Math.random() * 0.5;
      frag.appendChild(s);
    }
    fall.appendChild(frag);
  })();

  /* ---------- raindrops on the screen ---------- */
  let dropsOn = true;
  (function () {
    const glass = document.getElementById("glass");
    function spawn() {
      if (dropsOn) {
        const d = document.createElement("div");
        d.className = "drop";
        const size = 6 + Math.random() * 22;
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = Math.random() * 100 + "%";
        d.style.top = Math.random() * 100 + "%";
        d.style.animationDuration = 2.2 + Math.random() * 2.6 + "s";
        glass.appendChild(d);
        setTimeout(() => d.remove(), 5200);
      }
      setTimeout(spawn, 180 + Math.random() * 320);
    }
    spawn();
  })();

  /* ---------- synthesised rain ambience ---------- */
  let audioCtx = null, rainGain = null, soundMuted = false;
  function startRain() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    const size = 2 * audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const hp = audioCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 350;
    const lp = audioCtx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
    rainGain = audioCtx.createGain(); rainGain.gain.value = soundMuted ? 0 : 0.09;
    // slow swell so it breathes like real rain
    const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.08; lfoGain.gain.value = 0.03;
    lfo.connect(lfoGain).connect(rainGain.gain);
    noise.connect(hp).connect(lp).connect(rainGain).connect(audioCtx.destination);
    noise.start(); lfo.start();
  }

  /* ---------- music ---------- */
  const music = document.getElementById("music");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const bar = document.getElementById("bar");
  let musicMuted = false;
  const PLAY = "M8 5v14l11-7z", PAUSE = "M7 5h3v14H7zM14 5h3v14h-3z";
  function setPlaying(on) {
    playIcon.setAttribute("d", on ? PAUSE : PLAY);
  }
  playBtn.addEventListener("click", () => {
    if (music.paused) { music.play().then(() => setPlaying(true)).catch(() => {}); }
    else { music.pause(); setPlaying(false); }
  });
  music.addEventListener("timeupdate", () => {
    if (music.duration) bar.style.width = (music.currentTime / music.duration) * 100 + "%";
  });
  music.addEventListener("play", () => setPlaying(true));
  music.addEventListener("pause", () => setPlaying(false));

  /* ---------- mutes ---------- */
  document.getElementById("musicMute").addEventListener("click", (e) => {
    musicMuted = !musicMuted;
    music.muted = musicMuted;
    e.currentTarget.classList.toggle("muted", musicMuted);
  });
  document.getElementById("soundMute").addEventListener("click", (e) => {
    soundMuted = !soundMuted;
    dropsOn = !soundMuted;
    if (rainGain) rainGain.gain.value = soundMuted ? 0 : 0.09;
    e.currentTarget.classList.toggle("muted", soundMuted);
  });

  /* ---------- control buttons: ripple + fleeting feedback (no mechanics) ---------- */
  const toast = document.getElementById("toast");
  let toastTimer = null;
  document.getElementById("controls").addEventListener("click", (e) => {
    const btn = e.target.closest(".ctl");
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const rip = document.createElement("span");
    rip.className = "ripple";
    rip.style.left = (e.clientX - r.left) + "px";
    rip.style.top = (e.clientY - r.top) + "px";
    rip.style.width = rip.style.height = "16px";
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 600);
    toast.textContent = btn.dataset.say || "";
    toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
    clearTimeout(toastTimer);
  });

  /* ---------- intro / page load ---------- */
  const intro = document.getElementById("intro");
  function enter() {
    intro.classList.add("gone");
    startRain();
    // ease the music in once the grove is entered
    music.volume = 0.55;
    music.play().then(() => setPlaying(true)).catch(() => {});
    setTimeout(() => intro.remove(), 1200);
    document.removeEventListener("click", enter);
  }
  intro.addEventListener("click", enter);
</script>
</body>
</html>
