<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Check - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <script src="/audio.js"></script>
  <style>
    /* Skill check, "pure dial" (design 1): one ring on black, a red good-zone
       arc, a white needle, the key you have to press drawn in the middle, four
       corner readouts and a row of hit/miss pips.

       The brief also asks for the size and position of each check to be
       random, which pulls against a dial that is always centred. Both are
       honoured: the dial stays the only thing on screen but drifts around the
       middle of it and changes size, so you cannot rest your eyes in one spot. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c: #00acdb; --dim: #006b88; --dim2: #004558; --bright: #eafaff;
      --accent: #00acdb; --glow: rgba(0,172,219,.34);
      --red: #ff3b2f; --deep: #c11208; --ok: #7dffb0; --err: #ff5a4a;
    }
    html, body { height: 100%; }
    body {
      background: #000; color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
      overflow: hidden;
    }
    .scan {
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px);
    }

    /* ---- the four corner readouts ---- */
    .rd { position: fixed; z-index: 20; font-size: 10px; letter-spacing: .3em; color: var(--dim); }
    .rd b { display: block; font-size: 2.4rem; letter-spacing: .02em; color: var(--bright);
            line-height: 1.1; margin-top: .25rem; font-weight: 400; }
    .rd.tl { top: 3vh; left: 3vw; }
    .rd.tr { top: 3vh; right: 3vw; text-align: right; }
    .rd.bl { bottom: 3vh; left: 3vw; }
    .rd.br { bottom: 3vh; right: 3vw; text-align: right; }
    .rd.bl b { color: var(--err); }

    /* ---- the pips ---- */
    .pips {
      position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); z-index: 20;
      display: flex; gap: 4px; max-width: 70vw; flex-wrap: wrap; justify-content: center;
    }
    .pip { width: 10px; height: 10px; border: 1px solid var(--dim2); }
    .pip.hit { background: var(--c); border-color: var(--c); box-shadow: 0 0 8px var(--glow); }
    .pip.miss { background: var(--deep); border-color: var(--red); }

    /* ---- the dial ---- */
    /* SVG elements have no `hidden` or `className` IDL property, so the state
       lives on a plain div wrapper and the svg is only ever drawn into. */
    #dialwrap { position: fixed; z-index: 10; pointer-events: none; }
    #dialwrap svg { display: block; }
    /* some checks jitter to make the read harder */
    @keyframes shk { 0%{transform:translate(0,0)} 25%{transform:translate(-2px,1px)}
      50%{transform:translate(2px,-1px)} 75%{transform:translate(-1px,-2px)} 100%{transform:translate(1px,2px)} }
    #dialwrap.shake { animation: shk .09s steps(2) infinite; }
    .key {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 2.6rem; letter-spacing: .1em; color: var(--bright);
      text-shadow: 0 0 26px var(--glow);
    }
    /* the caption is wider than the glyph, so centre the block, not just it */
    .key > div { text-align: center; }
    .key small { display: block; text-align: center; font-size: 9px;
                 letter-spacing: .34em; color: var(--dim); margin-top: .5rem; }
    #dialwrap.good .key { color: var(--ok); text-shadow: 0 0 30px rgba(125,255,176,.7); }
    #dialwrap.bad .key { color: var(--err); text-shadow: 0 0 30px rgba(255,90,74,.7); }

    /* ---- centre text between runs ---- */
    .mid {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
      text-align: center; padding: 2rem;
    }
    .mid h1 { font-size: 2.6rem; font-weight: 400; color: var(--bright);
              letter-spacing: .12em; text-shadow: 0 0 30px var(--glow); }
    .mid p { color: var(--dim); line-height: 2; margin-top: 1rem; max-width: 34rem; }
    .mid .keys { color: var(--c); }
    .btn {
      margin-top: 1.6rem; border: 1.5px solid var(--c); background: transparent;
      font-family: inherit; font-size: .82rem; letter-spacing: .34em; text-transform: uppercase;
      color: var(--bright); padding: .8rem 2.6rem; cursor: pointer; box-shadow: 0 0 22px var(--glow);
    }
    .btn:hover { background: rgba(0,172,219,.12); }
    .setup { max-width: 40rem; }
    .opt { display: flex; align-items: center; gap: 1.2rem; margin-top: 1rem; }
    .opt .ok { font-size: 9px; letter-spacing: .34em; color: var(--dim); width: 4.5rem; text-align: right; }
    .opt .row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--dim2); background: transparent; color: var(--dim);
      font-family: inherit; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase;
      padding: .42rem 1.1rem; cursor: pointer;
    }
    .chip:hover { color: var(--c); border-color: var(--dim); }
    .chip.on { border-color: var(--c); color: var(--bright); box-shadow: 0 0 14px var(--glow); }
    .repin { width: 7rem; font-family: inherit; text-align: center; letter-spacing: .05em; }
    .repin::placeholder { color: var(--dim2); }
    .repin:focus { outline: none; border-color: var(--c); color: var(--bright); box-shadow: 0 0 14px var(--glow); }
    .hint { font-size: .82rem; color: var(--dim2); margin-top: 1rem; }
    .verdict { font-size: 1.1rem; color: var(--c); margin-top: .6rem; }
    .verdict .g { color: var(--ok); } .verdict .b { color: var(--err); }
  </style>
</head>
<body class="has-top-nav">
  <div id="dialwrap" hidden><svg id="dial"></svg><div class="key" id="dialkey"></div></div>

  <div class="rd tl">IN A ROW<b id="r-rep">0 / 0</b></div>
  <div class="rd tr">BEST<b id="r-streak">0</b></div>
  <div class="rd bl">FAILED<b id="r-failed">0</b></div>
  <div class="rd br">MODE<b id="r-mode">simple</b></div>
  <div class="pips" id="pips"></div>

  <div class="mid" id="mid">
    <div class="setup">
      <h1>SKILL CHECK</h1>
      <p>A needle runs around the dial. Press the key drawn in the middle while the
        needle is inside the arc. Land your chosen number of checks <b>in a row</b> to finish.</p>

      <div class="opt">
        <span class="ok">MODE</span>
        <div class="row" id="opt-mode">
          <button class="chip on" type="button" data-mode="simple">simple</button>
          <button class="chip" type="button" data-mode="demanding">demanding</button>
        </div>
      </div>
      <div class="opt">
        <span class="ok">REPS</span>
        <div class="row" id="opt-reps">
          <button class="chip on" type="button" data-reps="20">20</button>
          <button class="chip" type="button" data-reps="40">40</button>
          <button class="chip" type="button" data-reps="60">60</button>
          <button class="chip" type="button" data-reps="80">80</button>
          <input class="chip repin" id="reps-custom" type="number" min="1" max="999" inputmode="numeric" placeholder="custom" />
        </div>
      </div>
      <p class="hint" id="hint">Simple: the space bar only. Demanding: any of ten keys.</p>

      <p id="verdict" class="verdict"></p>
      <button class="btn" id="start" type="button">begin</button>
    </div>
  </div>

<div class="scan"></div>

  <script>
    const SVG = "http://www.w3.org/2000/svg";
    const KEYS = [
      { code: "Space", label: "SPACE", match: (e) => e.code === "Space" },
      ...["1", "2", "3", "4", "5", "q", "e", "r", "g", "f"].map((k) => ({
        code: k, label: k.toUpperCase(), match: (e) => (e.key || "").toLowerCase() === k,
      })),
    ];

    // Chosen on the settings screen rather than fixed. The two modes differ in the
    // key set (simple = space, demanding = any of ten) AND the colour scheme:
    // simple wears the dashboard blue/white, demanding wears Penance's red/white.
    let reps = 20;
    let mode = "simple";                  // "simple" | "demanding"
    let keyMode = "space";                // derived from mode: simple->space, demanding->all

    const PALETTES = {
      simple:    { c: "#00acdb", glow: "rgba(0,172,219,.34)" },
      demanding: { c: "#c11208", glow: "rgba(193,18,8,.42)" },
    };
    let zoneColor = PALETTES.simple.c, zoneGlow = "rgba(0,172,219,.5)";
    function applyMode() {
      const p = PALETTES[mode] || PALETTES.simple;
      ["--c", "--dim", "--dim2", "--accent"].forEach((v) => document.body.style.setProperty(v, p.c));
      document.body.style.setProperty("--glow", p.glow);
      zoneColor = p.c;
      zoneGlow = mode === "demanding" ? "rgba(255,59,47,.5)" : "rgba(0,172,219,.5)";
    }

    const GAP_MIN = 900, GAP_MAX = 5000;       // max between checks halved from before
    // a touch faster than before
    const SWEEP_MIN = 850, SWEEP_MAX = 1450;   // ms for one trip around the dial
    // the needle starts at 0deg, so the zone has to begin far enough round that
    // there is time to react to it. Expressed in time, not degrees, because the
    // sweep varies. Larger now, so the zone opens farther ahead on average.
    const MIN_LEAD_MS = 520;

    const dial = document.getElementById("dial");
    const wrap = document.getElementById("dialwrap");
    const keyEl = document.getElementById("dialkey");
    const midEl = document.getElementById("mid");
    const pipsEl = document.getElementById("pips");

    let run = null;      // { rep, hits, failed, streak, results[] }
    let check = null;    // the live check
    let raf = null;
    let gapTimer = null;

    /* ---------- sound ---------- */
    // a short two-tone chirp on spawn, and a flat thud on a miss. These ride
    // the typing channel, the same as the other interface sounds.
    function beep(freq, ms, type, gainTo) {
      const bus = window.AudioBus;
      const ctx = bus && bus.ctx();
      const out = bus && bus.channel("typing");
      if (!ctx || !out) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(gainTo || 0.14, ctx.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + ms / 1000);
      osc.connect(g); g.connect(out);
      osc.start(); osc.stop(ctx.currentTime + ms / 1000 + 0.02);
    }
    const sndSpawn = () => { beep(880, 90, "square", .10); setTimeout(() => beep(1320, 70, "square", .08), 70); };
    const sndHit   = () => beep(1760, 120, "triangle", .16);
    const sndMiss  = () => beep(110, 260, "sawtooth", .12);

    /* ---------- the dial ---------- */
    function polar(cx, cy, r, deg) {
      const a = ((deg - 90) * Math.PI) / 180;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function arcPath(cx, cy, r, from, to) {
      const [x1, y1] = polar(cx, cy, r, from);
      const [x2, y2] = polar(cx, cy, r, to);
      return "M " + x1 + " " + y1 + " A " + r + " " + r + " 0 " +
        ((to - from) % 360 > 180 ? 1 : 0) + " 1 " + x2 + " " + y2;
    }

    function drawDial(c) {
      const S = c.size, cx = S / 2, cy = S / 2, r = S / 2 - 14;
      dial.setAttribute("viewBox", "0 0 " + S + " " + S);
      dial.setAttribute("width", S);
      dial.setAttribute("height", S);
      wrap.style.left = c.x + "px";
      wrap.style.top = c.y + "px";
      wrap.style.width = S + "px";
      wrap.style.height = S + "px";
      dial.replaceChildren();

      const ring = document.createElementNS(SVG, "circle");
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", r);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", "#2c4a5e");
      ring.setAttribute("stroke-width", "3");
      dial.append(ring);

      const zone = document.createElementNS(SVG, "path");
      zone.setAttribute("d", arcPath(cx, cy, r, c.zoneFrom, c.zoneFrom + c.zoneSize));
      zone.setAttribute("fill", "none");
      zone.setAttribute("stroke", zoneColor);
      zone.setAttribute("stroke-width", "11");
      zone.setAttribute("stroke-linecap", "butt");
      // a crisp arc: a big blur made the visible zone read several degrees wider
      // than the judged bounds, so presses near the glow felt wrongly graded
      zone.setAttribute("filter", "drop-shadow(0 0 3px " + zoneGlow + ")");
      dial.append(zone);
      c.zoneEl = zone;

      const needle = document.createElementNS(SVG, "line");
      needle.setAttribute("x1", cx); needle.setAttribute("y1", cy);
      needle.setAttribute("stroke", "#eafaff");
      needle.setAttribute("stroke-width", "3");
      needle.setAttribute("filter", "drop-shadow(0 0 8px rgba(234,250,255,.9))");
      dial.append(needle);
      c.needleEl = needle;
      c.geom = { cx, cy, r };

      keyEl.replaceChildren();
      const inner = document.createElement("div");
      inner.textContent = c.key.label;
      const small = document.createElement("small");
      small.textContent = "PRESS IN THE ARC";
      inner.append(small);
      keyEl.append(inner);
    }

    function moveNeedle(c, deg) {
      const { cx, cy, r } = c.geom;
      const [x, y] = polar(cx, cy, r + 4, deg);
      c.needleEl.setAttribute("x2", x);
      c.needleEl.setAttribute("y2", y);
      c.deg = deg;   // remember where the needle is actually drawn, for judging
    }

    /* ---------- a single check ---------- */
    function spawn() {
      const vw = window.innerWidth, vh = window.innerHeight;
      // random size, and a position that drifts around the middle of the screen
      const size = Math.round(Math.min(vw, vh) * (0.30 + Math.random() * 0.26));
      const x = Math.round((vw - size) / 2 + (Math.random() - 0.5) * vw * 0.30);
      const y = Math.round((vh - size) / 2 + (Math.random() - 0.5) * vh * 0.26);
      // both modes use the tight zone and fast needle (the old "demanding" feel)
      const zoneSize = 18 + Math.random() * 12;
      const sweep = (SWEEP_MIN + Math.random() * (SWEEP_MAX - SWEEP_MIN)) * 0.85;
      // never on or just in front of the needle: leave at least MIN_LEAD_MS of
      // travel before the zone opens, and keep the whole arc on the dial
      const minFrom = (MIN_LEAD_MS / sweep) * 360;
      const maxFrom = 350 - zoneSize;
      const zoneFrom = minFrom + Math.random() * Math.max(0, maxFrom - minFrom);

      const pool = keyMode === "space" ? [KEYS[0]] : KEYS;
      check = {
        size, x, y, zoneFrom, zoneSize, sweep,
        key: pool[Math.floor(Math.random() * pool.length)],
        start: performance.now(),
        done: false,
        // some checks jitter, and some slowly drift across the screen mid-cycle
        shake: Math.random() < 0.32,
        drift: Math.random() < 0.45,
        dx: (Math.random() - 0.5) * 90,
        dy: (Math.random() - 0.5) * 70,
      };
      wrap.hidden = false;
      wrap.className = check.shake ? "shake" : "";
      drawDial(check);
      moveNeedle(check, 0);
      sndSpawn();
      raf = requestAnimationFrame(tick);
    }

    function tick(now) {
      if (!check || check.done) return;
      const t = (now - check.start) / check.sweep;
      if (t >= 1) { resolve(false, "missed"); return; }
      moveNeedle(check, t * 360);
      // a drifting check crawls a little from where it spawned as the needle runs
      if (check.drift) {
        wrap.style.left = (check.x + check.dx * t) + "px";
        wrap.style.top = (check.y + check.dy * t) + "px";
      }
      raf = requestAnimationFrame(tick);
    }

    function needleDeg() {
      return ((performance.now() - check.start) / check.sweep) * 360;
    }

    function resolve(hit, why) {
      if (!check || check.done) return;
      check.done = true;
      cancelAnimationFrame(raf);
      wrap.className = hit ? "good" : "bad";
      // finishing means landing `reps` checks IN A ROW; any miss clears the run
      if (hit) { run.streak++; run.best = Math.max(run.best, run.streak); sndHit(); }
      else { run.failed++; run.streak = 0; sndMiss(); }
      paint();
      setTimeout(() => {
        wrap.hidden = true;
        check = null;
        if (hit && run.streak >= reps) return finish();
        paint();
        schedule();
      }, 420);
    }

    function schedule() {
      // the countdown used to be on screen, which told you exactly when to look
      clearTimeout(gapTimer);
      gapTimer = setTimeout(spawn, GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN));
    }

    /* ---------- run control ---------- */
    function paint() {
      document.getElementById("r-rep").textContent = Math.min(run.streak, reps) + " / " + reps;
      document.getElementById("r-streak").textContent = run.best;
      document.getElementById("r-failed").textContent = run.failed;
      pipsEl.replaceChildren();
      for (let i = 0; i < reps; i++) {
        const p = document.createElement("i");
        p.className = "pip" + (i < run.streak ? " hit" : "");
        pipsEl.append(p);
      }
    }

    function begin() {
      run = { streak: 0, best: 0, failed: 0 };
      document.getElementById("r-mode").textContent = mode;
      midEl.hidden = true;
      paint();
      schedule();
    }

    function finish() {
      clearTimeout(gapTimer);
      midEl.hidden = false;
      const v = document.getElementById("verdict");
      v.innerHTML = "<span class='g'>" + reps + " in a row</span> &nbsp; " +
        "<span class='b'>" + run.failed + " missed</span> along the way";
      document.getElementById("start").textContent = "again";
      paint();
    }

    function chipGroup(id, apply) {
      const box = document.getElementById(id);
      box.addEventListener("click", (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        [...box.querySelectorAll(".chip")].forEach((x) => x.classList.toggle("on", x === b));
        apply(b.dataset);
      });
    }
    chipGroup("opt-mode", (d) => {
      mode = d.mode;
      keyMode = mode === "demanding" ? "all" : "space";
      document.getElementById("hint").textContent = mode === "demanding"
        ? "Demanding: any of ten keys."
        : "Simple: the space bar only.";
      applyMode();                       // switch the colour scheme live
    });
    chipGroup("opt-reps", (d) => { reps = Number(d.reps); document.getElementById("reps-custom").value = ""; });
    // custom rep count: typing a number deselects the preset chips
    document.getElementById("reps-custom").addEventListener("input", (e) => {
      const n = Math.max(1, Math.min(999, parseInt(e.target.value, 10) || 0));
      if (n) { reps = n; document.querySelectorAll("#opt-reps .chip").forEach((c) => c.classList.remove("on")); }
    });
    applyMode();                          // set the starting colour scheme

    document.getElementById("start").addEventListener("click", () => {
      window.AudioBus && window.AudioBus.ctx();   // the gesture that starts audio
      begin();
    });

    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (!run || !check || check.done) return;
      // only a key that could have been asked for answers the check
      const pool = keyMode === "space" ? [KEYS[0]] : KEYS;
      const pressedOne = pool.some((k) => k.match(e));
      if (!pressedOne) return;
      e.preventDefault();
      if (!check.key.match(e)) { resolve(false, "wrong key"); return; }
      // judge the needle where it is DRAWN (what the player sees), not a freshly
      // recomputed live angle that runs ahead of the frame under any jank
      const deg = (check.deg != null) ? check.deg : needleDeg();
      const inZone = deg >= check.zoneFrom && deg <= check.zoneFrom + check.zoneSize;
      resolve(inZone, inZone ? "hit" : deg < check.zoneFrom ? "early" : "late");
    });

    // Back button: mid-run it returns to the settings screen; from settings it goes home.
    window.__navBack = function () {
      if (!midEl.hidden) { window.location.href = "/dashboard"; return true; }
      clearTimeout(gapTimer);
      cancelAnimationFrame(raf);
      if (check) check.done = true;
      check = null; run = null;
      wrap.hidden = true;
      midEl.hidden = false;
      return true;
    };

    window.siteMe().catch(() => (window.location.href = "/"));
  </script>
  <script src="/nav.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
