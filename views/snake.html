<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/me.js"></script>
  <script src="/glitch.js"></script>
  <style>
    /* Snake — Blood Ritual skin, full window (dark-red terminal). Snake colours
       come from the CSS vars below so the existing draw code stays untouched. */
    :root { --button-bg: #ff2010; --heart-color: #ffffff;
            --c:#d20f05; --br:#ff2010; --dim:#5e0f09; --bg:#000000; --glow:rgba(255,32,16,0.45); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: #000; color: var(--c); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background:
      repeating-linear-gradient(0deg, rgba(210,15,5,0.045) 0 1px, transparent 1px 4px); z-index: 1; touch-action: none; }
    .scan { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 1px, transparent 1px 3px); }
    .vig { position: fixed; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 26vh 9vh rgba(0,0,0,0.72); }

    .hud { position: fixed; z-index: 5; }
    .hud .k { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
    .hud .v { font-weight: 800; color: var(--br); text-shadow: 0 0 14px var(--glow); line-height: 1; font-variant-numeric: tabular-nums; }
    .tl { top: 3vh; left: 3vw; } .tr { top: 3vh; right: 3vw; text-align: right; }
    .bl { bottom: 3vh; left: 3vw; } .br2 { bottom: 3vh; right: 3vw; text-align: right; }
    .tl .v { font-size: clamp(2rem, 5vw, 3.4rem); } .tr .v, .bl .v { font-size: clamp(1.2rem, 2.6vw, 1.8rem); }
    .title { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); z-index: 5; text-align: center; }
    .title h1 { font-size: clamp(1.3rem, 3vw, 2.2rem); letter-spacing: 0.34em; text-transform: uppercase; color: var(--br); text-shadow: 0 0 22px var(--glow); font-weight: 700; }
    .title .status { color: var(--dim); font-size: 0.9rem; letter-spacing: 0.06em; margin-top: 0.7rem; min-height: 1.3em; font-weight: 700; }

    .nav { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 1rem; }
    .nav button { font-family: inherit; cursor: pointer; font-size: 0.9rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700;
      padding: 0.6rem 1.8rem; border: 1.5px solid var(--br); background: transparent; color: var(--br); box-shadow: 0 0 18px rgba(255,32,16,0.28); }
    .nav button:hover { background: var(--br); color: var(--bg); }
    #back { border-color: var(--dim); color: var(--c); box-shadow: none; }
  </style>
</head>
<body class="has-top-nav">
  <canvas id="game"></canvas>
  <div class="vig"></div>
  <div class="scan"></div>

  <div class="title"><p class="status" id="status">an offering to the Princess</p></div>
  <div class="hud tl"><div class="k">score</div><div class="v" id="hud-score">0</div></div>
  <div class="hud tr"><div class="k">length</div><div class="v" id="hud-length">3</div></div>
  <div class="hud bl"><div class="k">points earned</div><div class="v" id="hud-earned">0</div></div>

  <div class="nav">
    <button id="start" type="button">Start</button>
    <button id="back" type="button">Dashboard</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    // full-window grid: fixed cell size, columns/rows derived from the viewport,
    // centred with a small offset so it fills the screen edge to edge.
    let CELL, COLS, ROWS, OFFX, OFFY;
    function sizeGrid() {
      const dpr = 1;
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      // smaller cells => a denser grid, so the arena reads bigger and the
      // snake/food read smaller against it
      CELL = Math.max(12, Math.min(26, Math.floor(Math.min(canvas.width, canvas.height) / 34)));
      COLS = Math.floor(canvas.width / CELL);
      ROWS = Math.floor(canvas.height / CELL);
      OFFX = Math.floor((canvas.width - COLS * CELL) / 2);
      OFFY = Math.floor((canvas.height - ROWS * CELL) / 2);
    }
    sizeGrid();
    window.addEventListener("resize", () => { sizeGrid(); if (snake) draw(); });

    const heartColor = () => getComputedStyle(document.body).getPropertyValue("--heart-color").trim() || "#ffffff";
    let teleportChance = 0.9;
    const TELEPORT_MIN_DISTANCE = 8, SPAWN_MIN_DISTANCE = 4;

    function headColor() { return getComputedStyle(document.body).getPropertyValue("--button-bg").trim() || "#ff3b2f"; }
    function hexToRgb(hex) { const h = hex.replace("#", ""); const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h; return [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16)); }
    function segmentColor(base, index) {
      const [r, g, b] = hexToRgb(base);
      const fade = Math.min(0.72, index * 0.05);
      const mix = (c) => Math.round(c + (255 - c) * fade);
      return "rgb(" + mix(r) + ", " + mix(g) + ", " + mix(b) + ")";
    }

    let snake, dir, nextDir, food, score, timer = null, alive = false, earned = 0;

    function reset() {
      const cy = Math.floor(ROWS / 2), cx = Math.floor(COLS / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 }; nextDir = dir; score = 0; alive = true; placeFood();
    }
    function freeSquares() {
      const taken = new Set(snake.map((s) => s.x + "," + s.y));
      const open = [];
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!taken.has(x + "," + y)) open.push({ x, y });
      return open;
    }
    function pickSquare(head, minDist) {
      const open = freeSquares();
      if (!open.length) return food;
      let pool = open.filter((sq) => distance(sq, head) >= minDist);
      if (!pool.length) pool = open.filter((sq) => distance(sq, head) > 1);
      if (!pool.length) pool = open;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function placeFood() { food = pickSquare(snake[0], SPAWN_MIN_DISTANCE); }
    function distance(a, b) {
      const dx = Math.min(Math.abs(a.x - b.x), COLS - Math.abs(a.x - b.x));
      const dy = Math.min(Math.abs(a.y - b.y), ROWS - Math.abs(a.y - b.y));
      return Math.max(dx, dy);
    }
    // The food escaping is the game's whole tease, so it gets a subliminal of
    // its own: a single brief blip, not the dashboard's full strobe, and rate
    // limited because escapes come thick and fast.
    const TAUNTS = ["keep trying", "so close", "not for you", "again", "almost",
                    "try harder", "not yet", "reach", "further", "good servant"];
    let lastTaunt = 0;
    function taunt() {
      const now = Date.now();
      if (now - lastTaunt < 2500) return;
      lastTaunt = now;
      if (window.Subliminal) window.Subliminal.blip(TAUNTS[Math.floor(Math.random() * TAUNTS.length)]);
    }
    function fleeFrom(head) { food = pickSquare(head, TELEPORT_MIN_DISTANCE); taunt(); }

    function drawBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function drawHeart(cx, cy, size) {
      ctx.save();
      ctx.shadowColor = "rgba(255,60,48,0.9)"; ctx.shadowBlur = size * 0.7;
      ctx.fillStyle = heartColor();
      ctx.beginPath();
      const s = size / 2;
      ctx.moveTo(cx, cy + s * 0.6);
      ctx.bezierCurveTo(cx + s, cy - s * 0.4, cx + s * 0.5, cy - s, cx, cy - s * 0.3);
      ctx.bezierCurveTo(cx - s * 0.5, cy - s, cx - s, cy - s * 0.4, cx, cy + s * 0.6);
      ctx.fill();
      ctx.restore();
    }
    function draw() {
      drawBoard();
      drawHeart(OFFX + food.x * CELL + CELL / 2, OFFY + food.y * CELL + CELL / 2, CELL * 0.7);
      const base = headColor();
      snake.forEach((seg, i) => {
        ctx.fillStyle = segmentColor(base, i);
        if (i === 0) { ctx.save(); ctx.shadowColor = base; ctx.shadowBlur = CELL * 0.6; }
        const pad = CELL * 0.2, r = Math.max(2, CELL * 0.22);
        const x = OFFX + seg.x * CELL + pad, y = OFFY + seg.y * CELL + pad, w = CELL - pad * 2;
        ctx.beginPath(); ctx.roundRect(x, y, w, w, r); ctx.fill();
        if (i === 0) ctx.restore();
      });
    }
    function tick() {
      dir = nextDir;
      const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };
      if (snake.some((s) => s.x === head.x && s.y === head.y)) { gameOver(); return; }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { score++; awardFood(); showScore(); placeFood(); }
      else { snake.pop(); if (distance(head, food) <= 1 && Math.random() < teleportChance) fleeFrom(head); }
      draw();
    }
    async function awardFood() {
      try {
        const res = await fetch("/api/snake/food", { method: "POST" });
        if (!res.ok) return;
        const data = await res.json();
        earned += data.earned; if (data.bonus) earned += data.bonus;
        showScore();
      } catch {}
    }
    function showScore() {
      document.getElementById("hud-score").textContent = score;
      document.getElementById("hud-length").textContent = snake ? snake.length : 0;
      document.getElementById("hud-earned").textContent = earned;
    }
    function gameOver() {
      alive = false; clearInterval(timer); timer = null;
      statusEl.textContent = "fallen · score " + score + (earned ? " · earned " + earned + " points" : "") + " · press start to begin again";
      document.getElementById("start").textContent = "Start";
    }
    function start() {
      if (timer) clearInterval(timer);
      sizeGrid(); reset(); earned = 0; showScore();
      statusEl.textContent = "";
      document.getElementById("start").textContent = "Restart";
      draw(); timer = setInterval(tick, 80);
    }

    const UP = { x: 0, y: -1 }, DOWN = { x: 0, y: 1 }, LEFT = { x: -1, y: 0 }, RIGHT = { x: 1, y: 0 };
    const KEYS = { ArrowUp: UP, ArrowDown: DOWN, ArrowLeft: LEFT, ArrowRight: RIGHT, Up: UP, Down: DOWN, Left: LEFT, Right: RIGHT, KeyW: UP, KeyS: DOWN, KeyA: LEFT, KeyD: RIGHT, w: UP, s: DOWN, a: LEFT, d: RIGHT };
    document.addEventListener("keydown", (e) => {
      const key = e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const d = KEYS[key] || KEYS[e.code];
      if (!d) return;
      e.preventDefault();
      if (!alive) return;
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
    });
    document.getElementById("start").addEventListener("click", start);
    document.getElementById("back").addEventListener("click", () => { window.location.href = "/dashboard"; });

    window.siteMe().then((d) => {
      if (d.isAdmin) teleportChance = 0.5;
      // same photosensitivity gate as the dashboard
      if (window.Subliminal) window.Subliminal.setEnabled(!d.photosensitive);
    }).catch(() => (window.location.href = "/"));
    drawBoard();
  </script>
  <script src="/nav.js" defer></script>
  <script src="/notifications.js" defer></script>
  <script src="/updatecheck.js" defer></script>
</body>
</html>
