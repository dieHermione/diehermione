<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/me.js"></script>
  <script src="/glitch.js"></script>
  <style>
    /* Snake — Blood Ritual skin, full window (dark-red terminal). Snake colours
       come from the CSS vars below so the existing draw code stays untouched. */
    :root { --button-bg: #ff2010; --heart-color: #ffffff;
            --c:#d20f05; --br:#ff2010; --dim:#5e0f09; --bg:#000000; --glow:rgba(255,32,16,0.45); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: #000; color: var(--c); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background:
      repeating-linear-gradient(0deg, rgba(210,15,5,0.045) 0 1px, transparent 1px 4px); z-index: 1; touch-action: none; }
    .scan { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 1px, transparent 1px 3px); }
    .vig { position: fixed; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 26vh 9vh rgba(0,0,0,0.72); }

    .hud { position: fixed; z-index: 5; }
    .hud .k { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
    .hud .v { font-weight: 800; color: var(--br); text-shadow: 0 0 14px var(--glow); line-height: 1; font-variant-numeric: tabular-nums; }
    .tl { top: 3vh; left: 3vw; } .tr { top: 3vh; right: 3vw; text-align: right; }
    .bl { bottom: 3vh; left: 3vw; } .br2 { bottom: 3vh; right: 3vw; text-align: right; }
    .tl .v { font-size: clamp(2rem, 5vw, 3.4rem); } .tr .v, .bl .v { font-size: clamp(1.2rem, 2.6vw, 1.8rem); }
    .title { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); z-index: 5; text-align: center; }
    .title h1 { font-size: clamp(1.3rem, 3vw, 2.2rem); letter-spacing: 0.34em; text-transform: uppercase; color: var(--br); text-shadow: 0 0 22px var(--glow); font-weight: 700; }
    .title .status { color: var(--dim); font-size: 0.9rem; letter-spacing: 0.06em; margin-top: 0.7rem; min-height: 1.3em; font-weight: 700; }

    .nav { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 1rem; }
    .nav button { font-family: inherit; cursor: pointer; font-size: 0.9rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700;
      padding: 0.6rem 1.8rem; border: 1.5px solid var(--br); background: transparent; color: var(--br); box-shadow: 0 0 18px rgba(255,32,16,0.28); }
    .nav button:hover { background: var(--br); color: var(--bg); }
    #back { border-color: var(--dim); color: var(--c); box-shadow: none; }
  </style>
  <script src="/audio.js"></script>
</head>
<body class="has-top-nav">
  <canvas id="game"></canvas>
  <div class="vig"></div>
  <div class="scan"></div>

  <div class="title"><p class="status" id="status">an offering to the Princess</p></div>
  <div class="hud tl"><div class="k">score</div><div class="v" id="hud-score">0</div></div>
  <div class="hud tr"><div class="k">length</div><div class="v" id="hud-length">0</div></div>
  <div class="hud bl"><div class="k">points earned</div><div class="v" id="hud-earned">0</div></div>

  <div class="nav">
    <button id="start" type="button">Start</button>
    <button id="pause" type="button" disabled>Pause</button>
    <button id="back" type="button">Dashboard</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    /* Free-swimming snake: no grid. The head carries a heading angle and moves
       at a constant speed; steering turns that angle rather than snapping to
       one of four directions. The body is the trail the head has just walked,
       drawn as one tapered outline, so it bends and twists with the turns.
       There is no self-collision, so the body is purely cosmetic. */

    const SPEED = 380;          // px per second
    const TURN = 3.4;           // radians per second at full lock
    // The trail is the body, so its length in px is also how much of a turn
    // stays visible: at SPEED this is a little over a second of history.
    const START_LEN = 260;
    const GROW_PER_FOOD = 42;
    const HEAD_R = 9;           // head radius; the body tapers away from this
    const FOOD_R = 9;
    const FLEE_R = 46;          // the food bolts if the head gets this close

    let W = 0, H = 0;
    function sizeCanvas() {
      canvas.width = W = window.innerWidth;
      canvas.height = H = window.innerHeight;
    }
    sizeCanvas();
    window.addEventListener("resize", () => { sizeCanvas(); if (path.length) draw(); });

    const heartColor = () => getComputedStyle(document.body).getPropertyValue("--heart-color").trim() || "#ffffff";
    function headColor() { return getComputedStyle(document.body).getPropertyValue("--button-bg").trim() || "#ff2010"; }
    function hexToRgb(hex) { const h = hex.replace("#", ""); const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h; return [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16)); }
    function shade(base, t) {                       // t 0 head .. 1 tail
      const [r, g, b] = hexToRgb(base);
      const k = 1 - Math.min(0.62, t * 0.62);
      return "rgb(" + Math.round(r * k) + "," + Math.round(g * k) + "," + Math.round(b * k) + ")";
    }

    let teleportChance = 0.9;
    let path = [];              // [{x,y}], newest first; the body is this trail
    let angle = 0, turnInput = 0, targetLen = START_LEN;
    let food = null, score = 0, earned = 0, alive = false, raf = null, last = 0, paused = false;
    let fleeArmed = true;       // one escape roll per approach, not per frame

    // wrap coordinates onto the torus the old grid used
    function wrap(p) {
      if (p.x < 0) p.x += W; else if (p.x >= W) p.x -= W;
      if (p.y < 0) p.y += H; else if (p.y >= H) p.y -= H;
      return p;
    }
    // shortest distance on a torus, so "near the food" works across the seam
    function dist(a, b) {
      let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
      if (dx > W / 2) dx = W - dx;
      if (dy > H / 2) dy = H - dy;
      return Math.hypot(dx, dy);
    }
    function placeFood(minDist) {
      const head = path[0] || { x: W / 2, y: H / 2 };
      let best = null, bestD = -1;
      for (let i = 0; i < 40; i++) {                 // rejection sample, keep the furthest
        const c = { x: 40 + Math.random() * (W - 80), y: 40 + Math.random() * (H - 80) };
        const d = dist(c, head);
        if (d >= minDist) return c;
        if (d > bestD) { bestD = d; best = c; }
      }
      return best;
    }

    // The food escaping is the game's whole tease, so it gets a subliminal of
    // its own: a single brief blip rather than the dashboard's full strobe.
    // It fires on every escape, with no rate limit.
    const TAUNTS = ["keep trying", "so close", "not for you", "again", "almost",
                    "try harder", "not yet", "reach", "further", "good servant"];
    function taunt() {
      if (window.Subliminal) window.Subliminal.blip(TAUNTS[Math.floor(Math.random() * TAUNTS.length)]);
    }

    function reset() {
      path = [];
      const start = { x: W / 2, y: H / 2 };
      for (let i = 0; i < 24; i++) path.push({ x: start.x - i * 4, y: start.y });
      angle = 0; turnInput = 0; targetLen = START_LEN;
      score = 0; alive = true;
      food = placeFood(220);
    }

    // total length of the trail in px, used to trim it to targetLen
    function trimPath() {
      let acc = 0;
      for (let i = 1; i < path.length; i++) {
        const seg = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        // a wrap jump is not real distance travelled; stop measuring across it
        acc += seg > Math.min(W, H) / 2 ? 0 : seg;
        if (acc > targetLen) { path.length = i + 1; return; }
      }
    }

    function step(dt) {
      angle += turnInput * TURN * dt;
      const head = path[0];
      const next = wrap({ x: head.x + Math.cos(angle) * SPEED * dt, y: head.y + Math.sin(angle) * SPEED * dt });
      path.unshift(next);
      trimPath();

      if (food) {
        const d = dist(next, food);
        if (d < HEAD_R + FOOD_R) {
          score++; targetLen += GROW_PER_FOOD; awardFood(); showScore();
          food = placeFood(220); fleeArmed = true;
        } else if (d < FLEE_R) {
          // One roll per approach, taken as the head crosses into range. The
          // old per-frame roll was frame-rate and speed dependent: at the new
          // 380px/s the head covers the gap in about four frames, so the food
          // only got away a third of the time instead of teleportChance.
          if (fleeArmed) {
            fleeArmed = false;
            if (Math.random() < teleportChance) { food = placeFood(320); taunt(); }
          }
        } else {
          fleeArmed = true;                       // left the zone, re-arm
        }
      }
    }

    /* ---- drawing: one tapered outline built from the trail ---- */
    // t 0 head .. 1 tail. A linear taper reads as a dart, so hold most of the
    // width through the body and lose it late, which looks like an animal.
    function widthAt(t) { return HEAD_R * Math.pow(1 - t, 0.45) + 1.2; }

    // split the trail wherever it jumps across a screen edge, so a wrapped
    // body draws as two pieces instead of one line straight across the arena
    function runs() {
      const out = []; let cur = [path[0]];
      for (let i = 1; i < path.length; i++) {
        const a = path[i - 1], b = path[i];
        if (Math.hypot(b.x - a.x, b.y - a.y) > Math.min(W, H) / 2) { out.push(cur); cur = [b]; }
        else cur.push(b);
      }
      out.push(cur);
      return out.filter((r) => r.length > 1);
    }

    function drawBody(base) {
      const total = path.length;
      let consumed = 0;
      for (const run of runs()) {
        const left = [], right = [];
        for (let i = 0; i < run.length; i++) {
          const p = run[i];
          const prev = run[Math.max(0, i - 1)], nextP = run[Math.min(run.length - 1, i + 1)];
          let tx = nextP.x - prev.x, ty = nextP.y - prev.y;
          const m = Math.hypot(tx, ty) || 1;
          tx /= m; ty /= m;
          const w = widthAt(Math.min(1, (consumed + i) / total));
          left.push({ x: p.x - ty * w, y: p.y + tx * w });
          right.push({ x: p.x + ty * w, y: p.y - tx * w });
        }
        consumed += run.length;
        ctx.beginPath();
        ctx.moveTo(left[0].x, left[0].y);
        for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
        for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
        ctx.closePath();
        const g = ctx.createLinearGradient(run[0].x, run[0].y, run[run.length - 1].x, run[run.length - 1].y);
        g.addColorStop(0, shade(base, 0)); g.addColorStop(1, shade(base, 1));
        ctx.fillStyle = g;
        ctx.fill();
      }
    }

    function drawHeart(cx, cy, size) {
      ctx.save();
      ctx.shadowColor = "rgba(255,60,48,0.9)"; ctx.shadowBlur = size * 0.7;
      ctx.fillStyle = heartColor();
      ctx.beginPath();
      const s = size / 2;
      ctx.moveTo(cx, cy + s * 0.6);
      ctx.bezierCurveTo(cx + s, cy - s * 0.4, cx + s * 0.5, cy - s, cx, cy - s * 0.3);
      ctx.bezierCurveTo(cx - s * 0.5, cy - s, cx - s, cy - s * 0.4, cx, cy + s * 0.6);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      if (food) drawHeart(food.x, food.y, FOOD_R * 2);
      if (!path.length) return;
      const base = headColor();
      drawBody(base);
      // head, with the glow the old square head carried
      const h = path[0];
      ctx.save();
      ctx.shadowColor = base; ctx.shadowBlur = HEAD_R * 1.6;
      ctx.fillStyle = base;
      ctx.beginPath(); ctx.arc(h.x, h.y, HEAD_R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!alive) return;
      if (paused) { last = now; return; }                    // hold position, do not bank time
      const dt = Math.min(0.05, (now - last) / 1000 || 0);   // clamp after a tab stall
      last = now;
      step(dt);
      draw();
      showScore();
    }

    async function awardFood() {
      try {
        const res = await fetch("/api/snake/food", { method: "POST" });
        if (!res.ok) return;
        const data = await res.json();
        earned += data.earned; if (data.bonus) earned += data.bonus;
        showScore();
      } catch {}
    }
    function showScore() {
      document.getElementById("hud-score").textContent = score;
      document.getElementById("hud-length").textContent = Math.round(targetLen);
      document.getElementById("hud-earned").textContent = earned;
    }
    function start() {
      sizeCanvas(); reset(); earned = 0; showScore();
      statusEl.textContent = "";
      document.getElementById("start").textContent = "Restart";
      const pb = document.getElementById("pause");
      pb.disabled = false; pb.textContent = "Pause"; paused = false;
      last = performance.now();
      if (!raf) raf = requestAnimationFrame(frame);
    }

    // steering: hold to turn. There is no reverse and no braking.
    const LEFT_KEYS = { ArrowLeft: 1, Left: 1, KeyA: 1, a: 1 };
    const RIGHT_KEYS = { ArrowRight: 1, Right: 1, KeyD: 1, d: 1 };
    function keyDir(e) {
      const k = e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (LEFT_KEYS[k] || LEFT_KEYS[e.code]) return -1;
      if (RIGHT_KEYS[k] || RIGHT_KEYS[e.code]) return 1;
      return 0;
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P" || e.code === "Space") {
        const t = e.target, tag = (t && t.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea") return;
        e.preventDefault(); togglePause(); return;
      }
      const d = keyDir(e);
      if (!d) return;
      e.preventDefault();
      turnInput = d;
    });
    document.addEventListener("keyup", (e) => {
      const d = keyDir(e);
      if (d && Math.sign(turnInput) === d) turnInput = 0;
    });

    function togglePause() {
      if (!alive) return;
      paused = !paused;
      const pb = document.getElementById("pause");
      pb.textContent = paused ? "Resume" : "Pause";
      statusEl.textContent = paused ? "paused" : "";
    }
    document.getElementById("pause").addEventListener("click", togglePause);
    document.getElementById("start").addEventListener("click", start);
    document.getElementById("back").addEventListener("click", () => { window.location.href = "/dashboard"; });

    window.siteMe().then((d) => {
      if (d.isAdmin) teleportChance = 0.5;
      // same photosensitivity gate as the dashboard
      if (window.Subliminal) window.Subliminal.setEnabled(!d.photosensitive);
    }).catch(() => (window.location.href = "/"));

    ctx.clearRect(0, 0, W, H);
  </script>
  <script src="/nav.js" defer></script>
  <script src="/notifications.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
</body>
</html>
