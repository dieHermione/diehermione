<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Major+Mono+Display&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <style>
    /* The disciple onboarding questionnaire. A pending Sub is sent here straight
       after registering, before Hermione reviews them; the answers are stored on
       the account for her to read. One question at a time, terminal skin to match
       the writing game. Self-contained, no site.css, no login (a one-shot
       onboarding session gates it server-side). */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --c: #00acdb; --dim: #00acdb; --dim2: #00acdb; --bright: #eafaff;
      --accent: #00acdb; --glow: rgba(0,172,219,.34); --red: #ff3b2f; --gold: #ffd27a;
      --ok: #7dffb0; --panel: #0a1720; --line: #173040;
    }
    html, body { height: 100%; }
    body {
      background: #000; color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px;
      overflow: hidden;
    }
    .scan { position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }

    /* standard site back button: a chevron pinned top-left, no plate */
    .back { position: fixed; top: 1.3rem; left: 1.3rem; z-index: 1000; width: 2.6rem; height: 2.6rem;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; background: none;
      color: var(--c); opacity: .8; text-decoration: none; transition: transform .2s ease, opacity .2s ease; }
    .back:hover { transform: translateY(-2px); opacity: 1; }
    .back svg { width: 22px; height: 22px; }

    .shell { position: relative; z-index: 5; width: 100%;
      height: 100%; display: flex; flex-direction: column; padding: 4vh 5vw 3vh; }
    .top { display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; padding-left: 3.4rem; }
    .top b { color: var(--bright); font-weight: 400; }

    .prog { margin: 1.4rem 0 0; }
    .prog .bar { height: 3px; background: var(--dim2); position: relative; overflow: hidden; }
    .prog .bar i { position: absolute; inset: 0; width: 0; background: var(--accent);
      box-shadow: 0 0 10px var(--glow); transition: width .3s ease; }
    .prog .lab { display: flex; justify-content: space-between; margin-top: .4rem;
      font-size: 10px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }

    /* the page itself never scrolls; a tall slide scrolls inside the stage */
    .stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
      justify-content: safe center; padding: 3vh 0; }
    .step { animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .eyebrow { color: var(--dim); letter-spacing: .3em; text-transform: uppercase; font-size: 11px; }
    h1 { font-family: "Major Mono Display", monospace; font-weight: 400; text-transform: lowercase;
      font-size: clamp(1.8rem, 5vw, 3rem); color: var(--bright); text-shadow: 0 0 26px var(--glow);
      letter-spacing: .04em; margin: .5rem 0 .2rem; line-height: 1.05; }
    .lede { color: var(--dim); font-size: 1rem; line-height: 1.7; margin-top: 1rem; max-width: 60ch; }
    .lede.body { color: var(--c); }

    /* the 1..5 interest scale */
    .qsub { color: var(--dim); font-size: .95rem; margin: .5rem 0 0; }
    /* consistent gap above the buttons whether or not a description is present */
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; margin-top: 1.2rem; }
    .scale button { position: relative; background: var(--panel); border: 1px solid var(--line);
      color: var(--c); font-family: inherit; font-size: 1.5rem; padding: 1.3rem 0 .6rem;
      cursor: pointer; transition: border-color .12s, box-shadow .12s, background .12s; }
    .scale button:hover { border-color: var(--dim); }
    .scale button.on { border-color: var(--c); color: var(--bright);
      box-shadow: 0 0 16px var(--glow); background: rgba(0,172,219,.08); }
    .scale button .num { display: block; font-size: 1.5rem; line-height: 1; }
    .scale button .cap { display: block; font-size: 10px; letter-spacing: .04em; color: var(--dim);
      text-transform: uppercase; margin-top: .7rem; min-height: 2.2em; padding: 0 .2rem; }
    .scale button.on .cap { color: var(--accent); }

    /* label with a hover hint */
    .hinted { border-bottom: 1px dotted var(--dim2); cursor: help; }
    .hint-tip { position: relative; }
    .hint-tip .tip { position: absolute; left: 0; top: 100%; margin-top: .5rem; z-index: 30;
      background: #04101a; border: 1px solid var(--line); color: var(--dim); padding: .5rem .7rem;
      font-size: 12px; letter-spacing: .02em; max-width: 40ch; opacity: 0; pointer-events: none;
      transition: opacity .12s; text-transform: none; }
    .hint-tip:hover .tip, .hinted:hover + .tip { opacity: 1; }

    /* two-choice rows (punishments, petnames) */
    .rows { display: flex; flex-direction: column; gap: .5rem; }
    .row2 { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: .6rem;
      border: 1px solid var(--line); background: var(--panel); padding: .7rem .9rem; }
    .row2 .name { color: var(--c); }
    .row2 button { background: transparent; border: 1px solid var(--dim2); color: var(--dim);
      font-family: inherit; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      padding: .4rem .8rem; cursor: pointer; white-space: nowrap; transition: all .12s; }
    .row2 button:hover { color: var(--c); border-color: var(--dim); }
    .row2 button.yes.on { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 12px rgba(125,255,176,.25); }
    .row2 button.no.on { border-color: var(--red); color: var(--red); box-shadow: 0 0 12px rgba(255,59,47,.22); }

    /* three-choice rows (petnames: love / indifferent / hate) */
    .row3 { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: .5rem;
      border: 1px solid var(--line); background: var(--panel); padding: .7rem .9rem; }
    .row3 .name { color: var(--c); }
    .row3 .opt { background: transparent; border: 1px solid var(--dim2); color: var(--dim); font-family: inherit;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: .4rem .8rem; cursor: pointer;
      white-space: nowrap; transition: all .12s; }
    .row3 .opt:hover { color: var(--c); border-color: var(--dim); }
    .row3 .opt.love.on { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 12px rgba(125,255,176,.25); }
    .row3 .opt.mid.on { border-color: var(--accent); color: var(--bright); box-shadow: 0 0 12px var(--glow); }
    .row3 .opt.hate.on { border-color: var(--red); color: var(--red); box-shadow: 0 0 12px rgba(255,59,47,.22); }

    /* several questions stacked on one slide */
    .qblock { margin-top: 1.6rem; }
    .qblock:first-of-type { margin-top: 1.2rem; }
    .qblock .qhead { font-size: 1.15rem; color: var(--bright); letter-spacing: .02em; margin-bottom: .2rem; }

    /* the final slide: Hermione's contact and the application code */
    .finishbox { margin-top: 1.6rem; border: 1px solid var(--line); background: var(--panel); padding: 1rem 1.2rem; max-width: 34rem; }
    .finishbox .fb-row { display: flex; justify-content: space-between; align-items: baseline; padding: .4rem 0; }
    .finishbox .fb-k { color: var(--dim); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .finishbox .fb-v { color: var(--bright); font-size: 1.1rem; }
    .finishbox .fb-v.code { color: var(--gold); letter-spacing: .3em; font-weight: 600; }

    textarea, input[type="text"] {
      width: 100%; background: rgba(0,172,219,.05); border: 1px solid var(--line);
      color: var(--bright); font-family: inherit; font-size: 15px; padding: .8rem;
      resize: vertical; }
    textarea { min-height: 8rem; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
    .other { margin-top: .8rem; display: flex; gap: .6rem; align-items: center; }
    .other label { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

    /* review */
    .review { display: flex; flex-direction: column; gap: 1.2rem; }
    .rgroup h3 { color: var(--dim); letter-spacing: .2em; text-transform: uppercase; font-size: 11px;
      font-weight: 400; margin-bottom: .5rem; border-bottom: 1px solid var(--line); padding-bottom: .3rem; }
    .ritem { display: flex; justify-content: space-between; padding: .18rem 0; font-size: 13px; }
    .ritem .k { color: var(--c); } .ritem .v { color: var(--accent); }
    .ritem .v.warn { color: var(--gold); }

    .nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
    .btn { background: transparent; border: 1px solid var(--dim2); color: var(--c);
      font-family: inherit; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
      padding: .7rem 1.6rem; cursor: pointer; transition: all .14s; }
    .btn:hover:not(:disabled) { border-color: var(--c); box-shadow: 0 0 14px var(--glow); color: var(--bright); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.primary { border-color: var(--accent); color: var(--bright); }
    .btn.ghost { border-color: transparent; color: var(--dim); }
    .btn.ghost:hover:not(:disabled) { color: var(--c); box-shadow: none; }
    .err { color: var(--red); font-size: 13px; min-height: 1.2em; }

    .done { text-align: center; }
    .done .mark { font-size: 3rem; color: var(--ok); text-shadow: 0 0 26px rgba(125,255,176,.4); }
  </style>
</head>
<body>
  <a class="back" href="/" aria-label="Back to login" title="Back to login">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="shell">
    <div class="top"><span><span style="text-transform:none">angelOS v0.2</span> // application</span><span><b id="who">apply to join</b></span></div>
    <div class="prog" id="prog">
      <div class="bar"><i id="progfill"></i></div>
      <div class="lab"><span id="proglabel">intro</span><span id="progcount">1 / 1</span></div>
    </div>
    <div class="stage"><div id="stage"></div></div>
    <div class="err" id="err"></div>
    <div class="nav">
      <button class="btn ghost" id="back" type="button">&larr; back</button>
      <button class="btn primary" id="next" type="button">next &rarr;</button>
    </div>
  </div>
<div class="scan"></div>

  <script>
    // ---- content ----
    // Kink hover hints are deliberately "placeholder" for now; the real copy will
    // be written later. What each item covers, for reference:
    //   feet   - Feet, socks, shoes, anything adjacent. The biggest thing.
    //   tasks  - Research / Essays / Games / Other.
    const KINK_SCALE_B = ["hate", "indifferent", "like", "love", "obsessed"];
    const KINKS = [
      { id: "feet",         label: "Feet",         sub: "Feet, socks, shoes, anything adjacent.", hint: "", scale: KINK_SCALE_B },
      { id: "tasks",        label: "Tasks / Chores", sub: "Research / Essays / Games / Other.",            hint: "", scale: KINK_SCALE_B },
      { id: "degradation",  label: "Degradation",  sub: "", hint: "placeholder", scale: KINK_SCALE_B },
      { id: "masochism",    label: "Masochism",    sub: "", hint: "placeholder", scale: KINK_SCALE_B },
      { id: "chastity",     label: "Chastity",     sub: "", hint: "placeholder", scale: KINK_SCALE_B },
      { id: "worship",      label: "Worship",      sub: "", hint: "placeholder", scale: KINK_SCALE_B },
      { id: "petplay",      label: "Petplay",      sub: "", hint: "placeholder", scale: KINK_SCALE_B },
    ];
    const PUNISHMENTS = [
      { id: "lines_physical",   label: "Lines (physical)" },
      { id: "lines_typing",     label: "Lines (typing)" },
      { id: "voice_memos",      label: "Voice memos" },
      { id: "ignoring",         label: "Ignoring" },
      { id: "onsite_games_hard",label: "On-site games (hard)" },
    ];
    const PETNAMES = [
      { id: "dog",   label: "Dog / Doggy / Puppy" },
      { id: "good",  label: "Good Boy / Girl" },
      { id: "doll",  label: "Doll" },
      { id: "pet",   label: "Pet" },
      { id: "bitch", label: "Bitch" },
      { id: "loser", label: "Loser" },
      { id: "dummy", label: "Dummy" },
    ];

    // ---- answers ----
    const A = { kinks: {}, limits: "", otherKinks: "", punishments: {}, petnames: {}, petnamesOther: "", brat: "", age: "" };
    // A short application code the applicant DMs to Hermione so she can match a
    // Discord message to these answers before making the account by hand.
    // Generated lazily — only once the age gate (bratage step) is actually
    // passed, not eagerly at load, so a rejected under-18 never even gets one.
    let AUTH = null;
    function ensureAuth() {
      if (!AUTH) AUTH = Array.from({ length: 6 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join("");
      return AUTH;
    }
    const KINK_BY = Object.fromEntries(KINKS.map((k) => [k.id, k]));

    // ---- step plan: one combined intro, three grouped interest slides (the
    // last also carries hard limits), punishments, petnames, brat+age. The
    // former standalone "send it" slide is gone — bratage is the last step
    // now, and its Next button sends the application directly.
    const STEPS = [
      { kind: "intro" },
      { kind: "kinks", ids: ["feet", "tasks", "degradation"] },
      { kind: "kinks", ids: ["masochism", "chastity", "worship"] },
      { kind: "kinks", ids: ["petplay"], limits: true },
      { kind: "punishments" },
      { kind: "petnames" },
      { kind: "bratage" },
    ];
    let i = 0;
    let submitted = false;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // ---- section renderers ----
    // The two intro slides are written by Hermione from the admin panel.
    const INTRO = { about: "", purpose: "" };
    function introStep() {
      return `<div class="step">
        <div class="eyebrow">about</div>
        <p class="lede body" style="white-space:pre-wrap">${esc(INTRO.about)}</p>
        <div class="eyebrow" style="margin-top:1.8rem">site purpose</div>
        <p class="lede body" style="white-space:pre-wrap">${esc(INTRO.purpose)}</p>
      </div>`;
    }
    function scaleButtons(id) {
      const k = KINK_BY[id], cur = A.kinks[id];
      return k.scale.map((cap, idx) => {
        const val = idx + 1;
        return `<button type="button" data-val="${val}" class="${cur === val ? "on" : ""}"><span class="num">${val}</span><span class="cap">${cap ? esc(cap) : ""}</span></button>`;
      }).join("");
    }
    function kinksStep(step) {
      const blocks = step.ids.map((id) => {
        const k = KINK_BY[id];
        // no hint text -> plain label, no hover affordance to show for it
        const labelHtml = k.hint
          ? `<span class="hint-tip"><div class="qhead"><span class="hinted">${esc(k.label)}</span></div><span class="tip">${esc(k.hint)}</span></span>`
          : `<div class="qhead">${esc(k.label)}</div>`;
        return `<div class="qblock" data-kid="${id}">
          ${labelHtml}
          ${k.sub ? `<div class="qsub">${esc(k.sub)}</div>` : ""}
          <div class="scale">${scaleButtons(id)}</div></div>`;
      }).join("");
      const lim = step.limits ? `<div class="qblock"><div class="qhead">Hard limits</div>
        <textarea id="limits" placeholder="write your hard limits here (optional)" maxlength="1000">${esc(A.limits)}</textarea></div>
        <div class="qblock"><div class="qhead">Other kinks</div>
        <textarea id="otherKinks" placeholder="anything not covered above (optional)" maxlength="1000">${esc(A.otherKinks)}</textarea></div>` : "";
      return `<div class="step"><div class="eyebrow">rate each 1 to 5</div>${blocks}${lim}</div>`;
    }
    function petnamesStep() {
      const rows = PETNAMES.map((it) => {
        const v = A.petnames[it.id];
        return `<div class="row3" data-id="${it.id}">
          <span class="name">${esc(it.label)}</span>
          <button type="button" class="opt love ${v === "love" ? "on" : ""}" data-v="love">Love</button>
          <button type="button" class="opt mid ${v === "indifferent" ? "on" : ""}" data-v="indifferent">Indifferent</button>
          <button type="button" class="opt hate ${v === "hate" ? "on" : ""}" data-v="hate">Hate</button>
        </div>`;
      }).join("");
      const other = `<div class="other"><label>other</label><input type="text" id="petother" maxlength="120" placeholder="another name, optional" value="${esc(A.petnamesOther)}" /></div>`;
      return `<div class="step"><div class="eyebrow">love, indifferent, or hate</div><h1>Petnames</h1><div class="rows">${rows}</div>${other}</div>`;
    }
    function twoChoiceStep(title, eyebrow, list, store, yesLabel, noLabel, yesVal, noVal, extraOther, note) {
      const rows = list.map((it) => {
        const v = store[it.id];
        return `<div class="row2" data-id="${it.id}">
          <span class="name">${esc(it.label)}</span>
          <button type="button" class="yes ${v === yesVal ? "on" : ""}" data-v="${yesVal}">${esc(yesLabel)}</button>
          <button type="button" class="no ${v === noVal ? "on" : ""}" data-v="${noVal}">${esc(noLabel)}</button>
        </div>`;
      }).join("");
      const other = extraOther ? `<div class="other"><label>other</label>
        <input type="text" id="petother" maxlength="120" placeholder="another name, optional"
          value="${esc(A.petnamesOther)}" /></div>` : "";
      const noteHtml = note ? `<p class="lede" style="margin-top:.8rem;padding-bottom:1rem">${esc(note)}</p>` : "";
      return `<div class="step">
        <div class="eyebrow">${esc(eyebrow)}</div>
        <h1>${esc(title)}</h1>
        ${noteHtml}
        <div class="rows">${rows}</div>
        ${other}
      </div>`;
    }
    function bratAgeStep() {
      const v = A.brat;
      return `<div class="step">
        <h1 style="padding-bottom:.9rem">are you a <span class="hint-tip"><span class="hinted">brat</span><span class="tip">a sub who intentionally disobeys in order to elicit punishment</span></span>?</h1>
        <div class="rows" id="brat-opts">
          <div class="row2"><span class="name"></span>
            <button type="button" class="yes ${v === "yes" ? "on" : ""}" data-v="yes">Yes</button>
            <button type="button" class="no ${v === "no" ? "on" : ""}" data-v="no">No</button>
          </div>
        </div>
        <div class="other" style="margin-top:1.4rem"><label>age</label>
          <input type="text" id="age" inputmode="numeric" maxlength="3" placeholder="your age" value="${esc(A.age)}" /></div>
      </div>`;
    }
    function reviewStep() {
      const krows = KINKS.map((k) => {
        const v = A.kinks[k.id];
        // No warning shown to the applicant; the Feet/Tasks flag is Hermione's to see.
        return `<div class="ritem"><span class="k">${esc(k.label)}</span>
          <span class="v">${v} / 5</span></div>`;
      }).join("");
      const prows = PUNISHMENTS.map((p) =>
        `<div class="ritem"><span class="k">${esc(p.label)}</span>
          <span class="v">${A.punishments[p.id] === "acceptable" ? "acceptable" : "hard no"}</span></div>`).join("");
      const nrows = PETNAMES.map((p) =>
        `<div class="ritem"><span class="k">${esc(p.label)}</span>
          <span class="v">${A.petnames[p.id] === "like" ? "like" : "hate"}</span></div>`).join("");
      return `<div class="step review">
        <div class="eyebrow">review</div>
        <h1>before you send</h1>
        <p class="lede">This goes to Hermione as it is. She reviews it before approving your account.</p>
        <div class="rgroup"><h3>interests</h3>${krows}</div>
        <div class="rgroup"><h3>limits</h3><div class="ritem"><span class="k" style="white-space:pre-wrap">${esc(A.limits) || "<span style='color:var(--dim2)'>none given</span>"}</span></div></div>
        <div class="rgroup"><h3>punishments</h3>${prows}</div>
        <div class="rgroup"><h3>petnames</h3>${nrows}${A.petnamesOther ? `<div class="ritem"><span class="k">Other</span><span class="v">${esc(A.petnamesOther)}</span></div>` : ""}</div>
      </div>`;
    }
    function doneStep() {
      // The only place the code and Discord contact are shown — the pre-submit
      // slide used to show them too; now it's said once, here, after sending.
      return `<div class="step done">
        <h1>sent</h1>
        <div class="finishbox" style="margin-left:auto;margin-right:auto;text-align:left">
          <div class="fb-row"><span class="fb-k">Hermione &middot; Discord</span><span class="fb-v">@a.ngelsocks</span></div>
          <div class="fb-row"><span class="fb-k">your code</span><span class="fb-v code">${ensureAuth()}</span></div>
        </div>
        <div style="margin-top:1.6rem"><a class="btn primary" href="/">go back</a></div>
      </div>`;
    }

    // ---- wiring per step ----
    function bindStep(step) {
      if (step.kind === "kinks") {
        document.querySelectorAll(".qblock[data-kid]").forEach((block) => {
          const id = block.dataset.kid;
          block.querySelector(".scale").addEventListener("click", (e) => {
            const b = e.target.closest("button[data-val]"); if (!b) return;
            A.kinks[id] = Number(b.dataset.val);
            [...block.querySelectorAll(".scale button")].forEach((c) => c.classList.toggle("on", c === b));
            refreshNav();
          });
        });
        const lim = $("limits");
        if (lim) lim.addEventListener("input", (e) => { A.limits = e.target.value; });
        const otherKinksEl = $("otherKinks");
        if (otherKinksEl) otherKinksEl.addEventListener("input", (e) => { A.otherKinks = e.target.value; });
      } else if (step.kind === "punishments") {
        document.querySelectorAll(".row2").forEach((row) => {
          const id = row.dataset.id;
          row.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => {
              A.punishments[id] = btn.dataset.v;
              row.querySelector(".yes").classList.toggle("on", btn.classList.contains("yes"));
              row.querySelector(".no").classList.toggle("on", btn.classList.contains("no"));
              refreshNav();
            });
          });
        });
      } else if (step.kind === "petnames") {
        document.querySelectorAll(".row3").forEach((row) => {
          const id = row.dataset.id;
          row.querySelectorAll(".opt").forEach((btn) => {
            btn.addEventListener("click", () => {
              A.petnames[id] = btn.dataset.v;
              row.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o === btn));
              refreshNav();
            });
          });
        });
        const other = $("petother");
        if (other) other.addEventListener("input", (e) => { A.petnamesOther = e.target.value; });
      } else if (step.kind === "bratage") {
        document.querySelectorAll("#brat-opts button").forEach((btn) => {
          btn.addEventListener("click", () => {
            A.brat = btn.dataset.v;
            document.querySelectorAll("#brat-opts button").forEach((b) => b.classList.toggle("on", b === btn));
            refreshNav();
          });
        });
        const ageEl = $("age");
        if (ageEl) ageEl.addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);   // digits only, no spinner
          A.age = e.target.value;
          refreshNav();
        });
      }
    }

    // ---- completeness gate ----
    // Note bratage only requires a plausible-looking age to enable Next, not
    // one that clears 18 — an under-18 answer is still "complete" enough to
    // click Next; the actual 18+ check happens there and ends the session
    // instead of just leaving the button disabled.
    function stepComplete(step) {
      if (step.kind === "kinks") return step.ids.every((id) => !!A.kinks[id]);
      if (step.kind === "punishments") return PUNISHMENTS.every((p) => A.punishments[p.id]);
      if (step.kind === "petnames") return PETNAMES.every((p) => A.petnames[p.id]);
      if (step.kind === "bratage") return (A.brat === "yes" || A.brat === "no") && /^\d{1,3}$/.test(A.age);
      return true; // intro
    }

    function render() {
      const step = STEPS[i];
      let html = "";
      if (step.kind === "intro") html = introStep();
      else if (step.kind === "kinks") html = kinksStep(step);
      else if (step.kind === "punishments") html = twoChoiceStep("Punishments", "acceptable, or not", PUNISHMENTS, A.punishments, "Acceptable", "hate", "acceptable", "hate", false,
        "These options are not for indicating what you find fun. They are for indicating what you are willing to do if you are disobedient.");
      else if (step.kind === "petnames") html = petnamesStep();
      else if (step.kind === "bratage") html = bratAgeStep();
      $("stage").innerHTML = html;
      bindStep(step);

      const labels = { intro: "intro", kinks: "interests", punishments: "punishments", petnames: "petnames", bratage: "brat + age" };
      $("proglabel").textContent = labels[step.kind] || "";
      $("progcount").textContent = (i + 1) + " / " + STEPS.length;
      $("progfill").style.width = (i / (STEPS.length - 1) * 100) + "%";

      $("back").disabled = false;
      $("next").textContent = i === STEPS.length - 1 ? "send →" : "next →";
      $("next").classList.toggle("primary", true);
      $("err").textContent = "";
      refreshNav();
    }
    function refreshNav() {
      $("next").disabled = !stepComplete(STEPS[i]);
    }

    async function submit() {
      $("next").disabled = true;
      $("err").textContent = "";
      try {
        const res = await fetch("/api/apply", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ authCode: ensureAuth(), age: A.age, brat: A.brat, kinks: A.kinks, limits: A.limits, otherKinks: A.otherKinks, punishments: A.punishments, petnames: A.petnames, petnamesOther: A.petnamesOther }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { $("err").textContent = data.error || "Could not send. Check your answers."; $("next").disabled = false; return; }
        submitted = true;
        $("prog").hidden = true;
        $("stage").innerHTML = doneStep();
        document.querySelector(".nav").hidden = true;
      } catch (e) {
        $("err").textContent = "Network trouble. Try again."; $("next").disabled = false;
      }
    }

    // An under-18 answer doesn't just block Next — it ends the session outright.
    // window.close() only works on a tab this script opened (rare here), so the
    // redirect to login is the real fallback and fires right behind it.
    function kickOutUnderage() {
      try { window.close(); } catch (e) {}
      window.location.href = "/";
    }

    $("back").addEventListener("click", () => { if (i > 0) { i--; render(); } else { window.location.href = "/"; } });
    $("next").addEventListener("click", () => {
      const step = STEPS[i];
      if (!stepComplete(step)) return;
      if (step.kind === "bratage") {
        if (!(parseInt(A.age, 10) >= 18)) { kickOutUnderage(); return; }
        ensureAuth();   // the age gate passed — only now does a code exist
        submit();       // bratage is the last step now — Next sends it
        return;
      }
      if (i < STEPS.length - 1) { i++; render(); }
    });

    // ---- boot: load the intro copy + Hermione's editable option descriptions ----
    function loadSubs() {
      return fetch("/api/questionnaire")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((d) => {
          const s = (d && d.subs) || {};
          KINKS.forEach((k) => { if (s[k.id] !== undefined) k.sub = s[k.id]; });
        })
        .catch(() => {});
    }
    loadSubs().then(() => {
      fetch("/api/apply")
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((d) => {
          INTRO.about = d.about || ""; INTRO.purpose = d.purpose || "";
          render();
        })
        .catch(() => { render(); });
    });
  </script>
  <script src="/dashglitch.js" defer></script>

  <script src="/glitchboot.js" defer></script>

</body>
</html>
