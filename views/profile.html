<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <style>
    /* The profile is the "man page" design: the account rendered as its own
       entry in the angelOS database. Self-contained, no site.css. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* site.css normally carries this; the fix has to come with us */
    [hidden] { display: none !important; }

    :root {
      --c: #aee3ff;
      --dim: #4f7ea0;
      --dim2: #2c4a5e;
      --bright: #eafaff;
      --accent: #8fd0ff;
      --glow: rgba(120, 190, 255, 0.32);
      --err: #ff5a4a;

      /* ranks.js styles its modal off the shared-shell variables; map those
         onto the terminal palette so the ladder matches this page */
      --panel-bg: #05080b;
      --panel-solid: #05080b;
      --text-color: var(--c);
      --heading-color: var(--bright);
      --muted-color: var(--dim);
      --table-border: var(--dim2);
      --table-header-color: var(--dim);
      --button-bg: var(--c);
      --button-hover-bg: var(--bright);
      --button-text: #04070a;
      --input-bg: rgba(120, 190, 255, 0.05);
      --input-border: var(--dim2);
      --input-text: var(--bright);
      --shadow: rgba(0, 0, 0, 0.8);
      --notif-item-bg: rgba(120, 190, 255, 0.1);
    }

    html, body { height: 100%; }
    body {
      background: #000;
      color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 14px;
      overflow: hidden;
    }
    .scan {
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0 1px, transparent 1px 3px);
    }
    .vig {
      position: fixed; inset: 0; z-index: 199; pointer-events: none;
      box-shadow: inset 0 0 24vh 8vh rgba(0, 0, 0, 0.7);
    }

    .mp {
      position: absolute; inset: 0;
      padding: 3vh 3vw;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }
    .mp .top, .mp .bottom {
      display: flex; justify-content: space-between;
      font-size: 11px; letter-spacing: 0.2em; color: var(--dim);
      flex-shrink: 0;
    }
    .mp .top { border-bottom: 1px solid var(--dim2); padding-bottom: 0.4rem; margin-bottom: 1.4rem; }
    .mp .bottom { border-top: 1px solid var(--dim2); padding-top: 0.4rem; margin-top: 1rem; }

    .sec { margin-bottom: 1.1rem; }
    .sec h4 {
      font-size: 12px; letter-spacing: 0.28em; color: var(--bright);
      font-weight: 400; margin-bottom: 0.35rem;
    }
    .sec .body { padding-left: 2.2rem; color: var(--c); font-size: 13px; line-height: 1.95; }
    .sec .body b { color: var(--bright); font-weight: 400; }
    .sec .body .d { color: var(--dim); }
    /* onboarding answers block (Hermione-only) */
    #p-onboarding .onb-flag { color: var(--err); border: 1px solid var(--err); padding: 0.3rem 0.6rem; margin-bottom: 0.7rem; font-size: 12px; letter-spacing: 0.05em; display: inline-block; }
    #p-onboarding .onb-grp { margin-bottom: 0.7rem; }
    #p-onboarding .oh { color: var(--dim); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.4; }
    #p-onboarding .ogrid { display: flex; flex-wrap: wrap; gap: 0.15rem 1.1rem; }
    #p-onboarding .ol { display: inline-flex; gap: 0.4rem; font-size: 12.5px; line-height: 1.7; }
    #p-onboarding .ok { color: var(--c); }
    #p-onboarding .ov { color: var(--bright); }
    #p-onboarding .ov.warn, #p-onboarding .ov.no { color: var(--err); }
    #p-onboarding .ov.yes { color: #7dffb0; }
    #p-onboarding .oline { color: var(--c); white-space: pre-wrap; font-size: 12.5px; line-height: 1.7; }

    /* NAME carries the picture, sized to sit on the same baseline block */
    .nameline { display: flex; align-items: center; gap: 1rem; }
    .portrait {
      flex-shrink: 0;
      width: 58px; height: 58px;
      border: 1px solid var(--dim2);
      display: grid; place-items: center;
      object-fit: cover;
      background: rgba(120, 190, 255, 0.05);
      color: var(--bright);
      font-size: 1.7rem;
      line-height: 1;
    }
    .portrait.clickable { cursor: pointer; }
    .portrait.clickable:hover { border-color: var(--c); box-shadow: 0 0 14px var(--glow); }
    .rankword { color: var(--bright); cursor: pointer; border-bottom: 1px dotted var(--dim2); }
    .rankword:hover { border-bottom-color: var(--c); }

    .opt {
      display: grid; grid-template-columns: 15rem 1fr;
      gap: 0.3rem 0.8rem; padding-left: 2.2rem; font-size: 13px;
    }
    .opt .o { color: var(--bright); }
    .opt .t { color: var(--dim); }

    /* SEE ALSO entries are the real controls */
    .also { display: flex; gap: 1.4rem; padding-left: 2.2rem; font-size: 13px; }
    .also a, .also button {
      background: none; border: none; padding: 0;
      font-family: inherit; font-size: inherit;
      color: var(--bright); text-decoration: none; cursor: pointer;
    }
    .also a:hover, .also button:hover { text-shadow: 0 0 12px var(--glow); }
    .also .n { color: var(--dim); }

    /* edit mode: the same manual page, with the fields opened up */
    #edit-form { display: none; }
    #edit-form.open { display: block; }
    #view-mode.closed { display: none; }
    .fieldrow {
      display: grid; grid-template-columns: 15rem 1fr;
      gap: 0.5rem 0.8rem; padding-left: 2.2rem;
      align-items: start; margin-bottom: 0.6rem; font-size: 13px;
    }
    .fieldrow > label { color: var(--bright); padding-top: 0.35rem; }
    .fieldrow textarea, .fieldrow select {
      width: 100%;
      padding: 0.4rem 0.6rem;
      background: var(--input-bg);
      border: 1px solid var(--dim2);
      color: var(--bright);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .fieldrow textarea { min-height: 5.5rem; line-height: 1.7; }
    /* a native select arrow looks wrong against the terminal; draw our own */
    .fieldrow select {
      cursor: pointer;
      appearance: none;
      padding-right: 2rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                        linear-gradient(135deg, var(--dim) 50%, transparent 50%);
      background-position: calc(100% - 1.05rem) 55%, calc(100% - 0.7rem) 55%;
      background-size: 0.35rem 0.35rem, 0.35rem 0.35rem;
      background-repeat: no-repeat;
    }
    .fieldrow select option { background: #05080b; }
    .fieldrow textarea:focus, .fieldrow select:focus {
      outline: none; border-color: var(--c); box-shadow: 0 0 14px var(--glow);
    }
    .form-error {
      display: none;
      margin-left: 2.2rem; margin-bottom: 0.8rem;
      border: 1px solid var(--err); color: var(--err);
      padding: 0.4rem 0.7rem; font-size: 12px;
    }
    .tbtn {
      background: none;
      border: 1px solid var(--dim2);
      color: var(--bright);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.4rem 1.2rem;
      cursor: pointer;
    }
    .tbtn:hover { border-color: var(--c); box-shadow: 0 0 14px var(--glow); }
    .form-actions { display: flex; gap: 0.6rem; padding-left: 2.2rem; margin-top: 0.9rem; }

    /* ranks.js draws a rounded, soft-shell modal; square it off to match */
    .rank-modal { border-radius: 0; border: 1px solid var(--dim2); }
    .rank-row { border-radius: 0; }
    .rank-close {
      border-radius: 0; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.78rem;
    }

    /* the manual is narrow enough to stack on a phone */
    @media (max-width: 720px) {
      .opt, .fieldrow { grid-template-columns: 1fr; padding-left: 1rem; }
      .sec .body, .also, .form-actions, .form-error { padding-left: 1rem; margin-left: 0; }
      .mp { justify-content: flex-start; padding-top: 5rem; }
    }
  </style>
  <script src="/audio.js"></script>
</head>
<body class="has-top-nav">
  <main class="mp">
    <div class="top"><span id="hd-l">…</span><span>angelOS database</span><span id="hd-r">…</span></div>

    <div id="view-mode">
      <input type="file" id="quick-icon" accept="image/*" hidden />

      <div class="sec">
        <h4>NAME</h4>
        <div class="body">
          <div class="nameline">
            <div id="portrait-slot"></div>
            <div>
              <b id="p-username">…</b>
              <span class="d"> - </span><span class="rankword" id="p-rank">…</span><span class="d" id="p-nameline-rest"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="sec">
        <h4>DESCRIPTION</h4>
        <div class="body"><span id="p-bio"></span><br>
          <span class="d" id="p-service"></span></div>
      </div>

      <div class="sec">
        <h4>COUNTERS</h4>
        <div class="opt" id="p-counters"></div>
      </div>

      <div class="sec" id="onb-sec" hidden>
        <h4>ONBOARDING</h4>
        <div class="body" id="p-onboarding"></div>
      </div>

      <div class="sec">
        <h4>SEE ALSO</h4>
        <div class="also" id="also">
          <button type="button" id="edit-btn" data-key="1" hidden>edit<span class="n">(1)</span></button>
          <a href="/games" data-key="2">games<span class="n">(2)</span></a>
          <a href="/dashboard" data-key="3">dashboard<span class="n">(3)</span></a>
        </div>
      </div>
    </div>

    <form id="edit-form">
      <div class="form-error" id="form-error"></div>
      <div class="sec">
        <h4>EDIT RECORD</h4>
        <div class="fieldrow">
          <label for="f-bio">bio</label>
          <textarea id="f-bio" maxlength="500" placeholder="say something about yourself"></textarea>
        </div>
        <div class="fieldrow">
          <label for="f-pronouns">pronouns</label>
          <select id="f-pronouns">
            <option value="">not set</option>
            <option value="She/Her">She/Her</option>
            <option value="He/Him">He/Him</option>
            <option value="They/Them">They/Them</option>
          </select>
        </div>
        <div class="fieldrow" id="rank-field" hidden>
          <label for="f-rank">rank</label>
          <select id="f-rank">
            <option value="">not set</option>
            <option value="Servant">Servant</option>
            <option value="Follower">Follower</option>
            <option value="Devoted">Devoted</option>
            <option value="Worshipper">Worshipper</option>
            <option value="Disciple">Disciple</option>
            <option value="Visitor">Visitor</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="tbtn" id="save-btn">Save</button>
          <button type="button" class="tbtn" id="cancel-btn">Cancel</button>
        </div>
      </div>
    </form>

    <div class="bottom"><span>angelOS v0.2</span><span id="ft-mid">…</span><span id="ft-r">…</span></div>
  </main>

  <div class="vig"></div>
  <div class="scan"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let me = null;
    let profileUser = null; // whose profile is shown
    let profile = null;

    const N = (n) => Number(n || 0).toLocaleString();

    function daysKept(createdAt) {
      return Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime()) / 86400000));
    }

    function portraitEl(p) {
      if (p.icon) {
        const img = document.createElement("img");
        img.className = "portrait";
        img.src = p.icon;
        img.alt = p.username + "'s picture";
        return img;
      }
      const div = document.createElement("div");
      div.className = "portrait";
      div.textContent = (p.username[0] || "?").toLowerCase();
      return div;
    }

    // Which counters are real depends on the account: Hermione keeps no points
    // and no stats, so her page says so rather than printing a column of zeroes.
    function counterRows() {
      const st = profile.stats || {};
      if (profile.points === null) {
        return [["records", "not kept"], ["days kept", N(daysKept(profile.createdAt))]];
      }
      return [
        ["points", N(profile.points)],
        ["angelcoins", N(profile.angelcoins)],
        ["letters typed", N(st.lettersTyped)],
        ["lines completed", N(st.linesCompleted)],
        ["food eaten", N(st.foodEaten)],
        ["penance series", N(st.penanceSeries)],
        ["devotion series", N(st.devotionSeries)],
        ["days kept", N(daysKept(profile.createdAt))],
      ];
    }

    // The disciple onboarding answers, laid out man-page style. Only ever reached
    // when the server includes them, which it does for Hermione alone.
    const ONB_KINKS = { feet: "Feet", tasks: "Tasks / Chores", degradation: "Degradation",
      humiliation: "Humiliation", masochism: "Masochism", exhibitionism: "Exhibitionism",
      worship: "Worship", petplay: "Petplay" };
    const ONB_PUN = { lines_physical: "Lines (physical)", lines_typing: "Lines (typing)",
      voice_memos: "Voice memos", ignoring: "Ignoring", onsite_games_hard: "On-site games (hard)" };
    const ONB_PET = { dog: "Dog / doggy / puppy", good: "Good boy / girl", doll: "Doll",
      pet: "Pet", bitch: "Bitch", loser: "Loser", dummy: "Dummy" };
    function renderOnboarding(o, flag) {
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const item = (label, valueHtml) => `<span class="ol"><span class="ok">${esc(label)}</span><span class="ov-wrap">${valueHtml}</span></span>`;
      const kinks = Object.keys(ONB_KINKS).map((k) => {
        const v = (o.kinks || {})[k]; const warn = (k === "feet" || k === "tasks") && v < 4;
        return item(ONB_KINKS[k], `<span class="ov ${warn ? "warn" : ""}">${v}/5</span>`);
      }).join("");
      const pun = Object.keys(ONB_PUN).map((k) => {
        const v = (o.punishments || {})[k];
        return item(ONB_PUN[k], `<span class="ov ${v === "acceptable" ? "yes" : "no"}">${v === "acceptable" ? "acceptable" : "hard no"}</span>`);
      }).join("");
      const pet = Object.keys(ONB_PET).map((k) => {
        const v = (o.petnames || {})[k];
        return item(ONB_PET[k], `<span class="ov ${v === "like" ? "yes" : "no"}">${esc(v)}</span>`);
      }).join("");
      return (flag ? `<div class="onb-flag">&#9873; flagged &mdash; Feet or Tasks/Chores rated below 4</div>` : "") +
        `<div class="onb-grp"><div class="oh">interests</div><div class="ogrid">${kinks}</div></div>` +
        `<div class="onb-grp"><div class="oh">limits</div><div class="oline">${o.limits ? esc(o.limits) : '<span class="d">none given</span>'}</div></div>` +
        `<div class="onb-grp"><div class="oh">punishments</div><div class="ogrid">${pun}</div></div>` +
        `<div class="onb-grp"><div class="oh">petnames</div><div class="ogrid">${pet}${o.petnamesOther ? item("Other", `<span class="ov">${esc(o.petnamesOther)}</span>`) : ""}</div></div>`;
    }

    function renderProfile() {
      const name = profile.username;
      const manref = name.toUpperCase() + "(1)";
      document.getElementById("hd-l").textContent = manref;
      document.getElementById("hd-r").textContent = manref;
      document.getElementById("ft-r").textContent = manref;

      const slot = document.getElementById("portrait-slot");
      const pic = portraitEl(profile);
      if (profile.canEdit) {
        pic.classList.add("clickable");
        pic.title = "Click to change the picture";
        pic.addEventListener("click", () => document.getElementById("quick-icon").click());
      }
      slot.replaceChildren(pic);

      document.getElementById("p-username").textContent = name;

      const rank = profile.rank || "unranked";
      const rankEl = document.getElementById("p-rank");
      rankEl.textContent = rank.toLowerCase();
      window.RankLegend?.attach(rankEl, () => ({
        rank: profile.rank,
        username: profile.username,
        // hermione can hand out ranks, but not to herself
        canEdit: Boolean(me && me.isAdmin) && profile.username.toLowerCase() !== "hermione",
        onChange: () => loadProfile(),
      }));

      document.getElementById("p-nameline-rest").textContent =
        ", " + (profile.pronouns || "no pronouns set").toLowerCase();

      const bio = document.getElementById("p-bio");
      bio.textContent = profile.bio || "No description has been written for this account.";
      bio.className = profile.bio ? "" : "d";

      const joined = new Date(profile.createdAt);
      const joinedText = joined.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
      document.getElementById("p-service").textContent = "In service since " + joinedText + ".";
      document.getElementById("ft-mid").textContent = joinedText.toLowerCase();

      const counters = document.getElementById("p-counters");
      counters.replaceChildren();
      for (const [k, v] of counterRows()) {
        const key = document.createElement("span");
        key.className = "o";
        key.textContent = k;
        const val = document.createElement("span");
        val.className = "t";
        val.textContent = v;
        counters.append(key, val);
      }

      // onboarding answers: the server only sends these to Hermione
      const onbSec = document.getElementById("onb-sec");
      if (profile.onboarding) {
        onbSec.hidden = false;
        document.getElementById("p-onboarding").innerHTML =
          renderOnboarding(profile.onboarding, profile.onboardingFlag);
      } else {
        onbSec.hidden = true;
      }

      // nothing left that is conditional on who is being looked at
      document.getElementById("edit-btn").hidden = !profile.canEdit;
      renumber();
      document.title = name + " - Profile";
    }

    async function loadProfile() {
      const res = await fetch("/api/profile/" + encodeURIComponent(profileUser));
      if (!res.ok) {
        document.getElementById("p-username").textContent = "no such entry";
        document.getElementById("p-bio").textContent =
          "No manual entry for " + profileUser + ".";
        return;
      }
      profile = (await res.json()).profile;
      renderProfile();
    }

    function setEditing(on) {
      document.getElementById("edit-form").classList.toggle("open", on);
      document.getElementById("view-mode").classList.toggle("closed", on);
      if (on) {
        document.getElementById("form-error").style.display = "none";
        document.getElementById("f-bio").value = profile.bio;
        document.getElementById("f-pronouns").value = profile.pronouns;
        document.getElementById("rank-field").hidden = !me.isAdmin;
        document.getElementById("f-rank").value = profile.rank;
      }
    }

    // picking a file from the portrait uploads straight away, no form needed
    document.getElementById("quick-icon").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      shrink(file, async (dataUrl) => {
        const res = await fetch("/api/profile/" + encodeURIComponent(profileUser), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ icon: dataUrl }),
        });
        if (res.ok) await loadProfile();
        e.target.value = "";
      });
    });

    document.getElementById("edit-btn").addEventListener("click", () => setEditing(true));
    document.getElementById("cancel-btn").addEventListener("click", () => setEditing(false));

    // downscale the chosen image to a 256px square so uploads stay tiny
    function shrink(file, done) {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        done(canvas.toDataURL("image/jpeg", 0.85));
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }

    document.getElementById("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const bodyData = {
        bio: document.getElementById("f-bio").value,
        pronouns: document.getElementById("f-pronouns").value,
      };
      if (me.isAdmin) bodyData.rank = document.getElementById("f-rank").value;
      const res = await fetch("/api/profile/" + encodeURIComponent(profileUser), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyData),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = document.getElementById("form-error");
        err.textContent = data.error || "Saving failed.";
        err.style.display = "block";
        return;
      }
      await loadProfile();
      setEditing(false);
    });

    /* The numbers beside the SEE ALSO entries are the keys that fire them, so
       the manual's section numbers became real shortcuts. Renumbered on every
       paint, because "edit" is only there on your own page. */
    function renumber() {
      const items = [...document.querySelectorAll("#also > *")].filter((el) => !el.hidden);
      items.forEach((el, i) => {
        const key = String(i + 1);
        el.dataset.key = key;
        el.querySelector(".n").textContent = "(" + key + ")";
      });
    }
    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
      if (document.getElementById("edit-form").classList.contains("open")) return;
      const hit = document.querySelector('#also > [data-key="' + e.key + '"]:not([hidden])');
      if (!hit) return;
      e.preventDefault();
      hit.click();
    });

    window.siteMe()
      .then(async (d) => {
        me = d;
        profileUser = params.get("user") || d.username;
        await loadProfile();
      })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/ranks.js"></script>
  <script src="/nav.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
