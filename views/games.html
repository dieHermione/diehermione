<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <script src="/audio.js"></script>
  <style>
    /* Game selection, "paste-up" (mockup 2): posters pasted crooked onto a
       board, each one wearing its own game's skin. Self-contained, no site.css. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c: #aee3ff; --dim: #4f7ea0; --dim2: #2c4a5e; --bright: #eafaff;
      --accent: #8fd0ff; --glow: rgba(120,190,255,.32);
      --red: #ff3b2f; --deep: #c11208; --err: #ff5a4a;
    }
    html, body { height: 100%; }
    body {
      background: #000; color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
      overflow: hidden;
    }
    .scan { position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px); }
    .vig { position: fixed; inset: 0; z-index: 199; pointer-events: none;
      box-shadow: inset 0 0 24vh 8vh rgba(0,0,0,.7); }

    .stage { position: absolute; inset: 0; padding: 3vh 3vw; display: flex; flex-direction: column; }
    .hdr { display: flex; justify-content: space-between; font-size: 10px;
      letter-spacing: .35em; color: var(--dim); flex-shrink: 0; }
    .hdr > span:first-child { padding-left: 2.8rem; }   /* room for the back chevron */
    .hdr b { color: var(--bright); font-weight: 400; }

    /* the board the posters are pasted onto */
    .board {
      position: relative; flex: 1; min-height: 0; margin-top: 1.2rem;
      background: repeating-linear-gradient(90deg, rgba(120,190,255,.02) 0 1px, transparent 1px 46px),
                  repeating-linear-gradient(0deg, rgba(120,190,255,.02) 0 1px, transparent 1px 46px);
    }

    .p {
      position: absolute; width: 230px; height: 290px;
      border: 1px solid var(--dim2); padding: 1rem .9rem;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden; background: #000; text-decoration: none; cursor: pointer;
      box-shadow: 0 18px 40px rgba(0,0,0,.85);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .p .glyph { font-family: "Major Mono Display", monospace; font-size: 4.6rem;
      line-height: 1; color: var(--dim); opacity: .5; }
    .p .nm { position: relative; z-index: 2; font-size: 1.5rem; color: var(--bright);
      letter-spacing: .04em; line-height: 1.1; }
    .p .glyph { position: relative; z-index: 2; }
    .p .num { position: absolute; bottom: .7rem; right: .8rem; font-size: 9px;
      letter-spacing: .24em; color: var(--dim2); }
    .p .tape { position: absolute; top: -9px; left: 50%;
      transform: translateX(-50%) rotate(-2deg); width: 64px; height: 18px;
      background: rgba(174,227,255,.14); border: 1px solid rgba(174,227,255,.22); }
    .p::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px); }

    /* Each poster is drawn rather than tinted: one motif per game, built from
       gradients on a single .art layer, so no two read as the same card. */
    .p .art { position: absolute; inset: 0; pointer-events: none; }

    /* snake: the trail it leaves */
    .art-trail { border-color: rgba(193,18,8,.5); background: #12070a; }
    .art-trail .art {
      background:
        radial-gradient(circle 4px at 74% 22%, #ff3b2f 0 100%, transparent 0),
        repeating-conic-gradient(from 0deg at 42% 58%, transparent 0 12deg, rgba(255,59,47,.5) 12deg 13deg);
      -webkit-mask-image: radial-gradient(circle at 42% 58%, #000 0 42%, transparent 62%);
      mask-image: radial-gradient(circle at 42% 58%, #000 0 42%, transparent 62%);
    }
    .art-trail .glyph { color: #ff3b2f; }

    /* penance: line after line, breaking down */
    .art-lines { border-color: rgba(193,18,8,.5); background: #100608; }
    .art-lines .art {
      background: repeating-linear-gradient(0deg,
        rgba(255,59,47,.32) 0 1px, transparent 1px 9px);
      -webkit-mask-image: linear-gradient(180deg, #000 20%, transparent 92%);
      mask-image: linear-gradient(180deg, #000 20%, transparent 92%);
    }
    .art-lines .glyph { color: #ff3b2f; }

    /* devotion: the same lines, neat and blue */
    .art-ruled { border-color: rgba(120,190,255,.4); background: #050b12; }
    .art-ruled .art {
      background: repeating-linear-gradient(0deg, rgba(143,208,255,.22) 0 1px, transparent 1px 14px),
                  linear-gradient(90deg, rgba(143,208,255,.35) 0 1px, transparent 1px);
      background-position: 0 0, 2.2rem 0;
    }

    /* deathroll: falling pips */
    .art-pips { border-color: rgba(193,18,8,.5); background: #0f0709; }
    .art-pips .art {
      background:
        radial-gradient(circle 5px at 24% 18%, rgba(255,59,47,.9) 0 100%, transparent 0),
        radial-gradient(circle 5px at 62% 34%, rgba(255,59,47,.7) 0 100%, transparent 0),
        radial-gradient(circle 5px at 36% 52%, rgba(255,59,47,.5) 0 100%, transparent 0),
        radial-gradient(circle 5px at 78% 66%, rgba(255,59,47,.35) 0 100%, transparent 0),
        radial-gradient(circle 5px at 48% 80%, rgba(255,59,47,.2) 0 100%, transparent 0);
    }
    .art-pips .glyph { color: #ff3b2f; }

    /* elysium: growth rings */
    .art-rings { border-color: rgba(120,200,150,.42); background: #05100b; }
    .art-rings .art {
      background: repeating-radial-gradient(circle at 50% 74%,
        transparent 0 9px, rgba(111,224,166,.28) 9px 10px);
    }
    .art-rings .glyph { color: #6fe0a6; } .art-rings .nm { color: #e6fff2; }

    /* wheel: the faces fanning past */
    .art-fan { border-color: rgba(120,190,255,.4); background: #050a11; }
    .art-fan .art {
      background: repeating-linear-gradient(90deg,
        rgba(143,208,255,.30) 0 1px, transparent 1px 15px);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 45%, transparent);
    }

    /* chess: rice paper, and a corner of the board */
    .art-board { border-color: #9c9384; background: linear-gradient(180deg, #efe9dd, #ddd6c6 62%); }
    .art-board .art {
      background:
        repeating-conic-gradient(#c3bbab 0 25%, transparent 0 50%) 0 0 / 34px 34px;
      -webkit-mask-image: linear-gradient(215deg, #000 0 32%, transparent 46%);
      mask-image: linear-gradient(215deg, #000 0 32%, transparent 46%);
    }
    .art-board .glyph { color: #a4322a; opacity: .6; }
    .art-board .nm { color: #2b2723; } .art-board .num { color: #9c9384; }
    .art-board .tape { background: rgba(60,50,40,.1); border-color: rgba(60,50,40,.18); }

    /* dummy parse: a damage breakdown */
    .art-bars { border-color: rgba(120,190,255,.4); background: #04080e; }
    .art-bars .art {
      background:
        linear-gradient(90deg, rgba(255,59,47,.30) 0 82%, transparent 82%) 0 58% / 100% 9px,
        linear-gradient(90deg, rgba(255,59,47,.24) 0 61%, transparent 61%) 0 68% / 100% 9px,
        linear-gradient(90deg, rgba(255,59,47,.18) 0 44%, transparent 44%) 0 78% / 100% 9px,
        linear-gradient(90deg, rgba(255,59,47,.12) 0 27%, transparent 27%) 0 88% / 100% 9px;
      background-repeat: no-repeat;
    }

    /* skill check: the dial and its good zone */
    .art-dial { border-color: rgba(193,18,8,.5); background: #0d0709; }
    .art-dial .art {
      background:
        conic-gradient(from 210deg at 50% 56%, #ff3b2f 0 42deg, transparent 42deg),
        radial-gradient(circle at 50% 56%, transparent 0 52px, rgba(174,227,255,.22) 52px 54px, transparent 54px);
      -webkit-mask-image: radial-gradient(circle at 50% 56%, transparent 0 48px, #000 48px 60px, transparent 60px);
      mask-image: radial-gradient(circle at 50% 56%, transparent 0 48px, #000 48px 60px, transparent 60px);
    }
    .art-dial .glyph { color: #ff3b2f; }

    /* summary: a justified column with a rule under the limit */
    .art-column { border-color: rgba(120,190,255,.4); background: #050a10; }
    .art-column .art {
      background:
        repeating-linear-gradient(0deg, rgba(174,227,255,.20) 0 2px, transparent 2px 8px),
        linear-gradient(90deg, transparent 0 62%, rgba(255,59,47,.55) 62% 63%, transparent 63%);
      -webkit-mask-image: linear-gradient(180deg, transparent 12%, #000 20% 62%, transparent 74%);
      mask-image: linear-gradient(180deg, transparent 12%, #000 20% 62%, transparent 74%);
    }

    /* slots: the printed scratch card, cream stock with a red banner and a
       half-rubbed foil panel. The odd one out on the wall: it is paper, not glass. */
    .art-card { border-color: #9c9384; background: linear-gradient(168deg, #fffdf6, #ece5d5); }
    .art-card .art {
      background:
        linear-gradient(90deg, #a3202b 0 100%) 8% 14% / 58% 7px no-repeat,
        linear-gradient(126deg, #b9bcc2, #8d9299 45%, #cfd3d8 66%, #7e838a) 66% 62% / 26% 40% no-repeat,
        repeating-linear-gradient(58deg, rgba(255,255,255,.4) 0 2px, transparent 2px 6px) 66% 62% / 26% 40% no-repeat,
        linear-gradient(0deg, rgba(0,0,0,.06) 0 100%) 8% 60% / 30% 34% no-repeat,
        linear-gradient(0deg, rgba(0,0,0,.06) 0 100%) 38% 60% / 22% 34% no-repeat;
    }
    .art-card .glyph { color: #a3202b; text-shadow: none; opacity: .32; }
    .art-card .nm { color: #2b2820; }
    .art-card .num { color: #a49b83; }
    .art-card .tape { background: rgba(60,50,40,.1); border-color: rgba(60,50,40,.18); }
    .art-card.sel { box-shadow: 0 0 40px rgba(163,32,43,.4), 0 18px 40px rgba(0,0,0,.85); outline-color: #a3202b; }

    .p.sel { z-index: 20; box-shadow: 0 0 40px var(--glow), 0 18px 40px rgba(0,0,0,.85);
      outline: 1px solid var(--c); outline-offset: 3px; }
    .art-trail.sel, .art-lines.sel, .art-pips.sel, .art-dial.sel {
      box-shadow: 0 0 40px rgba(255,59,47,.4), 0 18px 40px rgba(0,0,0,.85); outline-color: var(--red); }
    .art-rings.sel { box-shadow: 0 0 40px rgba(111,224,166,.35), 0 18px 40px rgba(0,0,0,.85); outline-color: #6fe0a6; }
    .art-board.sel { box-shadow: 0 0 40px rgba(164,50,42,.35), 0 18px 40px rgba(0,0,0,.85); outline-color: #a4322a; }
    .p:focus-visible { outline: 2px solid var(--bright); outline-offset: 3px; }

    /* a locked poster is pasted over, not removed */
    .p.locked { filter: grayscale(.7) brightness(.55); cursor: not-allowed; }
    .p.locked .locknote {
      position: absolute; left: 0; right: 0; top: 46%;
      background: rgba(0,0,0,.82); border-top: 1px solid var(--dim2); border-bottom: 1px solid var(--dim2);
      padding: .35rem 0; text-align: center; font-size: 9px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--c);
    }

    .foot { flex-shrink: 0; font-size: 10px; letter-spacing: .3em; color: var(--dim2);
      margin-top: .8rem; text-align: center; }

    /* on a narrow screen the paste-up gives up and becomes a list */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .stage { position: static; min-height: 100%; }
      .board { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem; margin-top: 1rem; }
      .p { position: static !important; width: auto; height: 250px; transform: none !important; }
    }
  </style>
</head>
<body class="has-top-nav">
  <div class="stage">
    <div class="hdr">
      <span>angelOS v0.2</span>
      <span>SELECT</span>
      <span><b id="count">0</b> GAMES</span>
    </div>
    <div class="board" id="board"></div>
    <div class="foot">ARROWS TO MOVE &nbsp;·&nbsp; ENTER TO OPEN</div>
  </div>
  <div class="vig"></div><div class="scan"></div>

  <script>
    /* One poster per game, pasted at a slight angle. The grid is computed from
       the list rather than written out, so adding a game here is one line. */
    const GAMES = [
      { n: "snake",       g: "S", href: "/snake",              art: "trail" },
      { n: "penance",     g: "P", href: "/writing",            art: "lines" },
      { n: "devotion",    g: "D", href: "/writing?mode=devotion", art: "ruled" },
      { n: "deathroll",   g: "X", href: "/deathroll",          art: "pips",  multi: true },
      // Elysium is requireLogin, not requirePlayer: a tree has to be remembered
      { n: "elysium",     g: "E", href: "/elysium",            art: "rings", multi: true },
      { n: "wheel",       g: "W", href: "/wheel",              art: "fan" },
      { n: "chess",       g: "C", href: "/chess",              art: "board", multi: true },
      { n: "dummy parse", g: "M", href: "/dummyparse",         art: "bars" },
      { n: "skill check", g: "K", href: "/skillcheck",         art: "dial" },
      { n: "summary",     g: "R", href: "/summary",            art: "column" },
      { n: "lottery",     g: "L", href: "/lottery",            art: "card", multi: true },
    ];

    const board = document.getElementById("board");
    let sel = 0;
    let cards = [];
    let guest = false;

    // a stable but arbitrary lean per poster, so the wall looks pasted by hand
    const LEAN = [-3, 2, -1.5, 3, -2.5, 1.5, -2, 2.5, -1.8, 2.2];

    function layout() {
      // five across, as many rows as it takes
      const cols = 5;
      const rows = Math.ceil(GAMES.length / cols);
      const stepX = 96 / cols;
      const stepY = rows > 1 ? 92 / rows : 0;
      cards.forEach((el, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        // nudge alternate rows sideways so the columns do not read as a grid
        const left = col * stepX + 1 + (row % 2 ? 2.4 : 0);
        const top = row * stepY + 2;
        el.style.left = left + "%";
        el.style.top = top + "%";
        el.style.transform = "rotate(" + LEAN[i % LEAN.length] + "deg)";
      });
    }

    function build() {
      board.replaceChildren();
      cards = GAMES.map((g, i) => {
        const a = document.createElement("a");
        a.className = "p art-" + g.art;
        a.href = g.href;
        a.tabIndex = 0;
        // anything needing an account is pasted over for a guest
        const locked = guest && g.multi;
        if (locked) {
          a.classList.add("locked");
          a.removeAttribute("href");
          a.setAttribute("aria-disabled", "true");
        }
        a.innerHTML =
          '<div class="tape"></div><div class="art"></div>' +
          '<div class="glyph"></div>' +
          '<div class="nm"></div>' +
          '<div class="num">' + String(i + 1).padStart(2, "0") + "</div>" +
          (locked ? '<div class="locknote">sign in to play</div>' : "");
        a.querySelector(".glyph").textContent = g.g;
        a.querySelector(".nm").textContent = g.n;
        a.addEventListener("mouseenter", () => setSel(i));
        a.addEventListener("focus", () => setSel(i));
        a.addEventListener("click", (e) => { if (locked) e.preventDefault(); });
        board.append(a);
        return a;
      });
      document.getElementById("count").textContent = GAMES.length;
      layout();
      setSel(0);
    }

    function setSel(i) {
      sel = (i + GAMES.length) % GAMES.length;
      cards.forEach((el, n) => el.classList.toggle("sel", n === sel));
    }

    function open() {
      const g = GAMES[sel];
      if (guest && g.multi) return;
      window.location.href = g.href;
    }

    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      const cols = 5;
      if (e.key === "ArrowRight") { e.preventDefault(); setSel(sel + 1); cards[sel].focus(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); setSel(sel - 1); cards[sel].focus(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); setSel(sel + cols); cards[sel].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setSel(sel - cols); cards[sel].focus(); }
      else if (e.key === "Enter") { e.preventDefault(); open(); }
    });

    window.addEventListener("resize", layout);

    window.siteMe()
      .then((d) => { guest = Boolean(d.guest); build(); })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/nav.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
