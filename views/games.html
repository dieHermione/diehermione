<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Major+Mono+Display&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <script src="/me.js"></script>
  <script src="/audio.js"></script>
  <style>
    /* Game selection wall (locked layout). Each poster is a bespoke object for
       its game — nothing standardised between the interiors — dropped into one
       standard macOS-style window frame. Self-contained, no site.css. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c: #aee3ff; --dim: #4f7ea0; --dim2: #2c4a5e; --bright: #eafaff;
      --accent: #8fd0ff; --glow: rgba(0,172,219,.32);
      --red: #ff3b2f; --deep: #c11208; --err: #ff5a4a;
      /* Penance red, shared with the skill-check card so the two read as one game
         family. This IS the penance game's actual text colour (#c11208 — the
         `--c` every line, cursor and label uses in writing.html); the card is
         monochrome in it, exactly like the game. An earlier lighter coral read as
         washed-out, which is the opposite of the game's deep blood red. */
      --pen-red: #c11208; --pen-hot: #c11208; --pen-mid: #c11208; --pen-low: #c11208;
    }
    html, body { height: 100%; }
    body {
      background: #000; color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
      overflow: hidden;
    }
    .scan { position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px); }

    .stage { position: absolute; inset: 0; padding: 3vh 3vw; display: flex; flex-direction: column; }
    .hdr { display: flex; justify-content: space-between; font-size: 10px;
      letter-spacing: .35em; color: var(--dim); flex-shrink: 0; }
    .hdr > span:first-child { padding-left: 2.8rem; }   /* room for the back chevron */
    .hdr b { color: var(--bright); font-weight: 400; }

    /* the wall is split into tabs; the strip below shows one tab at a time.
       Pinned top-left, under the angelOS header, not sharing its row. */
    .tabs { display: flex; gap: .4rem; flex-shrink: 0; margin: .8rem 0 0; padding-left: 2.8rem; }
    .tab { background: transparent; border: 1px solid var(--dim2); color: var(--dim);
      font-family: inherit; font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
      padding: .3rem 1.1rem; cursor: pointer; border-radius: 3px; }
    .tab:hover { color: var(--accent); border-color: var(--accent); }
    .tab.on { color: var(--bright); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent); }

    /* The wall is a single strip, flush left, that scrolls sideways as games
       are added rather than wrapping. `grid-auto-flow: column` with one row
       lets every card stand at full board height — much larger than the old
       two-row wall, which had to fit two cards into that same space. */
    .board { position: relative; flex: 1; min-height: 0; margin-top: 1rem;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      scrollbar-color: rgba(0,172,219,.35) transparent; cursor: grab; }
    .board.dragging { cursor: grabbing; user-select: none; }
    .board::-webkit-scrollbar { height: 7px; }
    .board::-webkit-scrollbar-thumb { background: rgba(0,172,219,.32); border-radius: 999px; }
    .track { display: grid; grid-auto-flow: column; grid-template-rows: 1fr;
      grid-auto-columns: max-content; gap: 30px; width: max-content; height: 100%;
      align-content: stretch; align-items: center; padding: 0 2px 6px; }

    /* the poster is only a positioning / selection / lock wrapper; the frame fills it.
       Height is a share of the single row (not the full row — that read too large
       on a laptop); width follows from the aspect ratio, so cards grow and shrink
       with the viewport instead of sitting at a fixed pixel size. */
    .p { position: relative; height: 80%; aspect-ratio: 19 / 24; text-decoration: none; cursor: pointer; }

    /* ---------- the macOS window frame ---------- */
    .frame-mac { position: relative; width: 100%; height: 100%; border: 1px solid #26333f; border-radius: 9px;
      overflow: hidden; background: #04060a; box-shadow: 0 16px 38px rgba(0,0,0,.82); display: flex; flex-direction: column; }
    .frame-mac .bar { display: flex; align-items: center; gap: .4rem; padding: .45rem .6rem;
      background: #0c1219; border-bottom: 1px solid #1a2530; flex-shrink: 0; }
    .frame-mac .bar i { width: 9px; height: 9px; border-radius: 50%; }
    .frame-mac .bar .r { background: #ff5f57; } .frame-mac .bar .y { background: #febc2e; } .frame-mac .bar .g { background: #28c840; }
    .frame-mac .bar .t { margin-left: .35rem; font-size: .62rem; color: #93a7ba; letter-spacing: .03em; }
    .frame-mac .win { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--wb, #04060a); }
    .frame-mac .win::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
      background: linear-gradient(180deg, transparent, rgba(4,6,10,.92)); pointer-events: none; z-index: 4; }
    .frame-mac .lbl { position: absolute; bottom: 10px; left: 13px; z-index: 6; font-size: 1.35rem;
      font-weight: 700; letter-spacing: .05em; color: #fff; text-shadow: 0 0 12px var(--a); }
    .frame-mac .num { position: absolute; bottom: 13px; right: 13px; z-index: 6; font-size: 10px;
      letter-spacing: .24em; color: #3f5568; }
    /* "unfinished" — an honest label, not a lock. The card underneath it is
       still a live link; this never gets pointer-events, so it can never be
       the thing a click lands on. */
    .frame-mac .wip { position: absolute; top: 10px; right: 10px; z-index: 7; pointer-events: none;
      background: rgba(24,14,0,.85); border: 1px solid #ffb020; color: #ffd27a;
      font-size: .54rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      padding: .3rem .55rem; border-radius: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

    /* ===================== bespoke card interiors ===================== */

    /* a game whose card has not been designed yet */
    .c-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #7a8694; font-size: .92rem; letter-spacing: .08em; }

    /* SNAKE — the real game screen, dimmed: the white countdown over the trail */
    .c-snk { position: absolute; inset: 0; opacity: .75;
      background: repeating-linear-gradient(0deg, rgba(210,15,5,.055) 0 1px, transparent 1px 4px); }
    .c-snk svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .c-snk .timer { position: absolute; top: 10px; left: 0; right: 0; text-align: center; color: #fff;
      font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(255,255,255,.35); }
    .c-snk .timer .k { font-size: .5rem; letter-spacing: .26em; text-transform: uppercase;
      color: var(--a); font-weight: 700; }
    .c-snk .timer .t { font-size: 2rem; font-weight: 700; }

    /* DEATHROLL — the play screen: the roll, whose turn it is, and the roll button */
    .c-dr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: .5rem; padding-bottom: 1.6rem; }
    .c-dr .val { font-weight: 800; font-size: 3rem; line-height: .9; color: var(--a);
      text-shadow: 0 0 26px rgba(193,18,8,.5); font-variant-numeric: tabular-nums; }
    .c-dr .status { font-size: .58rem; letter-spacing: .06em; color: #eafaff; }
    .c-dr .pill { border: 1.5px solid var(--a); color: var(--a); font-size: .5rem; letter-spacing: .22em;
      text-transform: uppercase; padding: .3rem .8rem; margin-top: .3rem; }

    /* MULTITAP — the flat old-phone keypad, one key lit */
    .c-mt { position: absolute; inset: 0; padding: .8rem .8rem 2rem; display: flex; align-items: center; justify-content: center; }
    .c-mt .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 150px; }
    .c-mt .key { border: 1px solid color-mix(in srgb, var(--a) 22%, transparent); background: rgba(0,0,0,.45);
      border-radius: 4px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: .28rem 0; }
    .c-mt .key b { color: #eafaff; font-size: .72rem; font-weight: 500; line-height: 1; }
    .c-mt .key s { color: var(--a); font-size: .42rem; letter-spacing: .1em; text-decoration: none; margin-top: .12rem; min-height: .5em; }
    .c-mt .key.on { border-color: var(--a); background: color-mix(in srgb, var(--a) 16%, transparent); box-shadow: 0 0 10px var(--a); }

    /* PENANCE — a typing drill: one line, the caret mid-word, and the counters */
    .c-pen { position: absolute; inset: 0; padding: 1.1rem .95rem 2rem; display: flex; flex-direction: column;
      justify-content: center; gap: .75rem; }
    .c-pen .meta { font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--pen-hot); }
    .c-pen .phrase { font-size: .98rem; line-height: 1.5; color: var(--pen-low); }
    .c-pen .phrase b { color: var(--pen-hot); font-weight: 400; }
    .c-pen .phrase .cur { background: var(--pen-red); color: #120607; }
    .c-pen .pbar { height: 4px; background: #3a0d09; }
    .c-pen .pbar b { display: block; height: 100%; width: 24%; background: var(--pen-red); }
    .c-pen .stat { font-size: .6rem; letter-spacing: .1em; color: var(--pen-hot); }

    /* DEVOTION — a verse reader: real lines, the current one lit, a small progress */
    .c-dev { position: absolute; inset: 0; padding: .8rem .85rem 2rem; display: flex; flex-direction: column; gap: .42rem;
      font-size: .76rem; line-height: 1.35; }
    .c-dev .v { color: #00acdb; }
    .c-dev .v.on { color: #eafaff; text-shadow: 0 0 10px var(--a); }
    .c-dev .v.on::before { content: "▸ "; color: var(--a); }
    .c-dev .prog { margin-top: auto; font-size: .56rem; letter-spacing: .18em; color: #00acdb; text-transform: uppercase; }

    /* ELYSIUM — a laurel wreath around the real days-tended count */
    .c-elys-w { position: absolute; inset: 0; padding: .8rem .8rem 2.2rem; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .3rem; }
    .c-elys-w svg { width: 172px; height: 152px; }
    .c-elys-w .ew-num { fill: #9fe0bb; }
    .c-elys-w .ew-cap { font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: #4f8f6a; }

    /* DUMMY PARSE — a damage recount */
    .c-parse { position: absolute; inset: 0; padding: .55rem .6rem; display: flex; flex-direction: column; gap: .3rem; }
    .c-parse .b { position: relative; height: 20px; background: #140a0a; overflow: hidden; display: flex; align-items: center; }
    .c-parse .b .f { position: absolute; inset: 0; opacity: .85; }
    .c-parse .b .l { position: relative; z-index: 2; padding-left: .4rem; color: #fff; font-size: .68rem; }
    .c-parse .b .v { position: relative; z-index: 2; margin-left: auto; padding-right: .4rem; color: #fff; font-size: .68rem; font-variant-numeric: tabular-nums; }
    .c-parse .dps { margin-top: auto; display: flex; align-items: baseline; gap: .4rem; padding-top: .2rem; }
    .c-parse .dps b { font-size: 1.4rem; color: #ff5a4a; text-shadow: 0 0 14px rgba(255,90,74,.6); }
    .c-parse .dps span { font-size: .56rem; letter-spacing: .16em; color: #7a4a44; text-transform: uppercase; }

    /* SKILL CHECK — the dial and its good zone */
    .c-skill svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* OT12 / LOONA — the one card that breaks from the terminal minimalism on
       purpose: a real photo of the group, full-bleed, under a stylised display
       wordmark. Every other card is a dim in-theme readout; this one is a poster. */
    .c-ot12 { position: absolute; inset: 0; overflow: hidden; background: #000; }
    .c-ot12 img { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 22%; }
    .c-ot12 .ot12-fade { position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,.22) 60%, rgba(0,0,0,.78) 100%); }
    .c-ot12 .ot12-logo { position: absolute; left: 0; right: 0; top: 8%; text-align: center;
      font-family: "Bebas Neue", "IBM Plex Mono", sans-serif; font-size: 7rem; font-weight: 400;
      letter-spacing: .1em; color: #fff;
      text-shadow: 0 2px 24px rgba(0,0,0,.7), 0 0 48px rgba(255,166,197,.55); }
    .c-ot12 .ot12-sub { position: absolute; left: 0; right: 0; top: calc(8% + 6rem);
      text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 1rem;
      letter-spacing: .3em; text-transform: uppercase; color: #ffd6e6; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

    /* SUMMARY — a read-and-retell column with a word-limit rule */
    .c-sum { position: absolute; inset: 0; padding: .7rem .8rem; overflow: hidden; }
    .c-sum .h { color: #eafaff; font-size: .82rem; letter-spacing: .02em; margin-bottom: .3rem; }
    .c-sum .k { font-size: .54rem; letter-spacing: .16em; color: #00acdb; text-transform: uppercase; margin-bottom: .5rem; }
    .c-sum .lines { display: flex; flex-direction: column; gap: 5px; }
    .c-sum .lines i { display: block; height: 3px; background: #00acdb; }
    .c-sum .lines i:nth-child(3n) { width: 74%; } .c-sum .lines i:nth-child(4n) { width: 88%; }
    .c-sum .limit { margin-top: .5rem; height: 4px; background: #06222b; }
    .c-sum .limit b { display: block; height: 100%; width: 62%; background: var(--a); }
    .c-sum .wc { margin-top: .3rem; font-size: .56rem; letter-spacing: .1em; color: #00acdb; }

    /* ---------- selection & lock ---------- */
    .p.sel { z-index: 20; }
    /* the hover border/glow follows the account's theme colour, not the game accent */
    .p.sel .frame-mac { outline: 1px solid var(--accent); outline-offset: 3px;
      box-shadow: 0 0 34px color-mix(in srgb, var(--accent) 45%, transparent), 0 16px 38px rgba(0,0,0,.82); }
    .p:focus-visible { outline: none; }
    .p:focus-visible .frame-mac { outline: 2px solid var(--bright); outline-offset: 3px; }

    .p.locked .frame-mac { filter: grayscale(.7) brightness(.55); }
    .p.locked { cursor: not-allowed; }
    .p .locknote { position: absolute; left: 0; right: 0; top: 46%; z-index: 30; display: none;
      background: rgba(0,0,0,.82); border-top: 1px solid var(--dim2); border-bottom: 1px solid var(--dim2);
      padding: .35rem 0; text-align: center; font-size: 9px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--c); }
    .p.locked .locknote { display: block; }

    /* in-theme hover text: no native title chrome. Each card draws its own clipped
       terminal panel (the same "// ..." treatment the dashboard game links used)
       over its face on hover or keyboard focus. */
    .p .tip { position: absolute; left: 0; top: 0; width: 15rem; max-width: 80vw;
      z-index: 25; padding: .62rem .72rem; text-align: left; pointer-events: none;
      background: rgba(0,0,0,.94); border: 1px solid var(--accent);
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 40%, transparent);
      color: var(--bright); font-size: .72rem; line-height: 1.5; letter-spacing: .02em;
      clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
      opacity: 0; visibility: hidden; transition: opacity .14s ease; }
    .p .tip::before { content: "// "; color: var(--accent); }
    .p:hover .tip, .p:focus-visible .tip { opacity: 1; visibility: visible; }
    .p.locked .tip { display: none; }   /* the lock note speaks for locked cards */


    /* on a narrow screen the wall becomes a list */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .stage { position: static; min-height: 100%; }
      /* on a narrow screen the strip becomes a normal wrapping list again */
      .board { position: static; overflow: visible; }
      .track { display: grid; grid-auto-flow: row; grid-template-rows: none;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        grid-auto-columns: auto; width: auto; height: auto; gap: 1.4rem; padding: 0; }
      .p { width: auto; height: 300px; aspect-ratio: auto; }
    }
  </style>
</head>
<body class="has-top-nav">
  <div class="stage">
    <div class="hdr">
      <span>angelOS v0.2</span>
      <span><b id="count">0</b> GAMES</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-tab="main">games</button>
      <button class="tab" type="button" data-tab="extra">extra</button>
    </div>
    <div class="board" id="board"></div>
  </div>
<div class="scan"></div>

  <script>
    /* One poster per game. Wheel, chess and lottery are still routes in the
       server and playable directly — they are just no longer linked from this
       wall. Each game names a bespoke interior "art" and its accent; every card
       shares the one macOS window frame. */
    const GAMES = [
      { n: "snake",       href: "/snake",                 art: "snake", a: "#c11208", wb: "linear-gradient(#140506, #05060a)",
        tip: "Free-swimming serpent. Chase the fleeing heart and grow; die on your own tail." },
      { n: "penance",     href: "/writing",               art: "pen",   a: "#c11208", wb: "#0e0607",
        tip: "A typing drill of correction. Type each line exactly — falter and it corrupts." },
      { n: "devotion",    href: "/writing?mode=devotion", art: "dev",   a: "#00acdb", wb: "#050a10", account: true, tab: "extra",
        tip: "A verse reader. Recite Her lines in turn. An account is required." },
      { n: "multitap",    href: "/multitap",              art: "t9",    a: "#0bdb00", wb: "#050d05",
        tip: "A typing drill on an old-phone keypad. No hints — remember the taps." },
      { n: "deathroll",   href: "/deathroll",             art: "death", a: "#c11208", wb: "#0e0607", multi: true, tab: "extra",
        tip: "Roll against another, each cap the next roll. Hit one and you lose. Account required." },
      { n: "dummy parse", href: "/dummyparse",            art: "parse", a: "#ff5a4a", wb: "#0a0608", tab: "extra",
        tip: "A priest damage recount. Parse the dummy and chase a higher DPS." },
      { n: "skill check", href: "/skillcheck",            art: "skill", a: "#c11208", wb: "radial-gradient(120% 120% at 50% 46%, #200a0c, #050202 74%)",
        tip: "Stop the sweeping dial inside the good zone. Pure nerve." },
      { n: "ot12",        href: "/ot12",                  art: "ot12",  a: "#ffa6c5", wb: "#0d0508", wip: true,
        tip: "Match the photo to the member. Twelve girls, four names, one right answer." },
      { n: "elysium",     href: "/elysium",               art: "elysium", a: "#3f9f6a", wb: "#04100a", account: true, tab: "extra",
        tip: "A tree you tend. It remembers how long you have kept it." },
      { n: "summary",     href: "/summary",               art: "sum",   a: "#00acdb", wb: "#050a10",
        tip: "Read a real Wikipedia article, then retell it in your own words." },
      { n: "chess",       href: "/chess",                 art: "chess", a: "#a4322a", wb: "#0c0a08", tab: "extra",
        tip: "Ink-wash chess against Her. Win and you may STRIKE; lose and brace for REWIND." },
    ];

    // a ring of laurel leaves, for the elysium card
    function wreath() {
      let s = ""; const cx = 107, cy = 122, R = 52, degs = [22, 42, 62, 82, 102, 122, 142, 160];
      for (const sgn of [1, -1]) for (const d of degs) {
        const th = sgn * d, rad = th * Math.PI / 180;
        const x = (cx + R * Math.sin(rad)).toFixed(1), y = (cy - R * Math.cos(rad)).toFixed(1), rot = (th + sgn * 90).toFixed(0);
        s += `<ellipse cx="${x}" cy="${y}" rx="9" ry="3.4" fill="#3f9f6a" opacity=".85" transform="rotate(${rot} ${x} ${y})"/>`;
      }
      return s;
    }

    // Bespoke interior per game — nothing shared between them but the frame.
    const ART = {
      // snake & deathroll are placeholder cards for now — their art is still being
      // worked out. The games themselves are unchanged and still linked.
      snake: () => `<div class="c-snk">
        <svg viewBox="0 0 214 214" preserveAspectRatio="none">
          <path d="M-6 168 C 60 168, 40 92, 112 100 C 176 108, 152 44, 224 52" fill="none"
                stroke="var(--a)" stroke-width="13" opacity=".4" stroke-linecap="round"/>
        </svg>
        <div class="timer"><div class="k">time left</div><div class="t">0:48</div></div></div>`,
      // ot12 / LOONA: the real group photo, full-bleed, under a display wordmark
      ot12: () => `<div class="c-ot12">
        <img src="/img/ot12-loona.jpg" alt="" />
        <div class="ot12-fade"></div>
        <div class="ot12-logo">LOONA</div>
        <div class="ot12-sub">fun trivia game</div></div>`,
      elysium: () => `<div class="c-ph">placeholder card</div>`,
      // chess: no bespoke art yet, same placeholder treatment as elysium
      chess: () => `<div class="c-ph">placeholder card</div>`,
      t9: () => `<div class="c-mt"><div class="pad">${
        [["1",".,-"],["2","abc"],["3","def"],["4","ghi"],["5","jkl"],["6","mno"],
         ["7","pqrs"],["8","tuv"],["9","wxyz"],["*","⌫"],["0","␣"],["#","↵"]]
          .map(([n,l],i) => `<div class="key${i===5?" on":""}"><b>${n}</b><s>${l}</s></div>`).join("")
      }</div></div>`,

      // penance: a typing drill on a real line from the penance pool. Hydrated
      // from /api/penance/presets; the literal below is a real pool line as a
      // fallback if the fetch fails.
      pen: () => `<div class="c-pen">
        <div class="meta">line 12 / 50</div>
        <div class="phrase"><b>I exist to be </b><span class="cur">c</span>orrected.</div>
        <div class="pbar"><b></b></div>
        <div class="stat">3 errors · 41 wpm</div></div>`,
      // devotion: a verse reader on real lines from the devotion pool (hydrated).
      dev: () => `<div class="c-dev">
        <div class="v">Hermione is my guardian angel.</div>
        <div class="v on">I belong at Her feet.</div>
        <div class="v">I am not in control.</div>
        <div class="v">Her will is Divine. I will obey.</div>
        <div class="prog">verse 2 / 10</div></div>`,
      death: () => `<div class="c-dr">
        <div class="val">240</div>
        <div class="status">your turn</div>
        <div class="pill">roll</div></div>`,
      // elysium: a laurel wreath around the real number of days the tree has been
      // tended (hydrated from /api/elysium's ageDays; a dash until it loads).
      elys: () => `<div class="c-elys-w"><svg viewBox="0 0 214 210" preserveAspectRatio="xMidYMid meet">${wreath()}
        <text class="ew-num" x="107" y="118" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="22">–</text></svg>
        <div class="ew-cap">days tended</div></div>`,
      parse: () => `<div class="c-parse">
        <div class="b"><span class="f" style="width:100%;background:linear-gradient(90deg,#ffd36b,#a9791f)"></span><span class="l">Smite</span><span class="v">2,410</span></div>
        <div class="b"><span class="f" style="width:78%;background:linear-gradient(90deg,#ff8a3d,#a1461a)"></span><span class="l">Holy Fire</span><span class="v">1,884</span></div>
        <div class="b"><span class="f" style="width:63%;background:linear-gradient(90deg,#b98cff,#5a3a9a)"></span><span class="l">SW: Pain</span><span class="v">1,520</span></div>
        <div class="b"><span class="f" style="width:44%;background:linear-gradient(90deg,#7fd0ff,#2f6a9a)"></span><span class="l">Mind Blast</span><span class="v">1,067</span></div>
        <div class="dps"><b>812</b><span>dps</span></div></div>`,
      skill: () => `<div class="c-skill"><svg viewBox="0 0 214 262">
        <circle cx="107" cy="128" r="64" fill="none" stroke="#3a1416" stroke-width="14"/>
        <path d="M 63.6 171.4 A 64 64 0 0 1 47.7 102.9" fill="none" stroke="#c11208" stroke-width="14"/>
        <circle cx="107" cy="128" r="64" fill="none" stroke="rgba(174,227,255,.18)" stroke-width="1"/>
        <line x1="107" y1="128" x2="72" y2="86" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="107" cy="128" r="6" fill="#fff"/></svg></div>`,
      sum: () => `<div class="c-sum"><div class="h">angels</div><div class="k">wikipedia · 150 words</div>
        <div class="lines">${Array.from({length:9}).map(()=>'<i></i>').join("")}</div>
        <div class="limit"><b></b></div><div class="wc">93 / 150 words</div></div>`,
    };

    function frameHTML(g, i) {
      const num = String(i + 1).padStart(2, "0");
      // an "unfinished" notice, not a lock — the card stays fully playable,
      // it just says so. Separate from the account/multi lock treatment below.
      const wip = g.wip ? '<div class="wip">unfinished</div>' : "";
      return `<div class="frame-mac" style="--a:${g.a};--wb:${g.wb}">
        <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="t">${g.n}@angeldomme</span></div>
        <div class="win">${ART[g.art]()}${wip}<div class="lbl">${g.n}</div><div class="num">${num}</div></div>
      </div>`;
    }

    const board = document.getElementById("board");
    let sel = 0;
    let cards = [];
    let guest = false;

    // Placement is pure CSS now (a two-row, column-flow grid in .track), so
    // there is no manual layout pass to run or to redo on resize.

    // Only the active tab's games are on the wall; `shown` is what every index
    // (selection, arrow keys, open) refers to, not the full GAMES list.
    let curTab = "main", shown = [];
    function build() {
      board.replaceChildren();
      const track = document.createElement("div");
      track.className = "track";
      board.append(track);
      shown = GAMES.filter((g) => (g.tab || "main") === curTab);
      cards = shown.map((g, i) => {
        const a = document.createElement("a");
        a.className = "p";
        a.href = g.href;
        a.tabIndex = 0;
        a.style.setProperty("--a", g.a);   // so the hover panel picks up the game's accent
        // anything needing an account is pasted over for a guest
        const locked = guest && (g.multi || g.account);
        if (locked) {
          a.classList.add("locked");
          a.removeAttribute("href");
          a.setAttribute("aria-disabled", "true");
        }
        const tip = g.tip ? `<div class="tip">${g.tip}</div>` : "";
        a.innerHTML = frameHTML(g, i) + tip + (locked ? '<div class="locknote">sign in to play</div>' : "");
        a.addEventListener("mouseenter", (e) => { setSel(i); positionTip(a, e.clientX, e.clientY); });
        a.addEventListener("mousemove", (e) => positionTip(a, e.clientX, e.clientY));
        // keyboard focus has no cursor, so anchor the panel to a sensible default
        a.addEventListener("focus", () => { setSel(i); const t = a.querySelector(".tip"); if (t) { t.style.left = "12px"; t.style.top = "58%"; } });
        a.addEventListener("click", (e) => { if (locked) e.preventDefault(); });
        track.append(a);
        return a;
      });
      document.getElementById("count").textContent = shown.length;
      board.scrollLeft = 0;
      setSel(0);
      hydrate();
    }

    // The penance, devotion and elysium cards show real state, not invented copy:
    // pool lines for the two writing games, and the tree's actual days-tended.
    function hydrate() {
      fetch("/api/penance/presets").then((r) => (r.ok ? r.json() : null)).then((d) => {
        const p = d && d.presets && d.presets[0], line = p && p.lines && p.lines[0];
        const el = board.querySelector(".c-pen .phrase");
        if (!line || !el) return;
        const cut = Math.max(4, Math.round(line.length * 0.62));
        const b = document.createElement("b"); b.textContent = line.slice(0, cut);
        const cur = document.createElement("span"); cur.className = "cur"; cur.textContent = line.slice(cut, cut + 1) || " ";
        el.replaceChildren(b, cur, document.createTextNode(line.slice(cut + 1)));
      }).catch(() => {});
      fetch("/api/devotion/presets").then((r) => (r.ok ? r.json() : null)).then((d) => {
        const p = d && d.presets && d.presets[0], lines = p && p.lines;
        const dev = board.querySelector(".c-dev");
        if (!lines || !lines.length || !dev) return;
        dev.querySelectorAll(".v").forEach((v, i) => { v.textContent = lines[i] || ""; v.hidden = !lines[i]; });
        const prog = dev.querySelector(".prog"); if (prog) prog.textContent = "verse 2 / " + lines.length;
      }).catch(() => {});
      fetch("/api/elysium").then((r) => (r.ok ? r.json() : null)).then((d) => {
        const num = board.querySelector(".c-elys-w .ew-num");
        const days = d && d.tree && typeof d.tree.ageDays === "number" ? d.tree.ageDays : null;
        if (num && days != null) num.textContent = days;
      }).catch(() => {});
      // Hover text is Hermione-editable in /admin; the g.tip strings above are just
      // the fallback if this fetch fails. Override each card with the server value.
      fetch("/api/gametips").then((r) => (r.ok ? r.json() : null)).then((d) => {
        if (!d || !d.tips) return;
        cards.forEach((el, i) => {
          // index into `shown` (this tab's games), not the full GAMES list —
          // the two only line up on a tab that happens to hold every game
          const t = d.tips[shown[i].n];
          const tipEl = el.querySelector(".tip");
          if (t && tipEl) tipEl.textContent = t;
        });
      }).catch(() => {});
    }

    function setSel(i) {
      if (!shown.length) return;
      sel = (i + shown.length) % shown.length;
      cards.forEach((el, n) => el.classList.toggle("sel", n === sel));
    }

    // The hover panel is anchored to the cursor: it floats just off the pointer
    // and flips to the other side near the viewport edges so it never runs off.
    function positionTip(a, cx, cy) {
      const t = a.querySelector(".tip");
      if (!t) return;
      const r = a.getBoundingClientRect();
      const tw = 240, th = t.offsetHeight || 84, pad = 16;
      let x = cx - r.left + pad, y = cy - r.top + pad;
      if (cx + pad + tw > window.innerWidth) x = cx - r.left - tw - 8;
      if (cy + pad + th > window.innerHeight) y = cy - r.top - th - 8;
      t.style.left = x + "px";
      t.style.top = y + "px";
    }

    function open() {
      const g = shown[sel];
      if (!g) return;
      if (guest && (g.multi || g.account)) return;
      window.location.href = g.href;
    }

    document.addEventListener("keydown", (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      // one row now, not two — every arrow just steps to the next/previous card
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); setSel(sel + 1); cards[sel].focus(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); setSel(sel - 1); cards[sel].focus(); }
      else if (e.key === "Enter") { e.preventDefault(); open(); }
    });


    // Vertical wheel scrolls the strip sideways (down = right, up = left) —
    // only when the strip actually overflows, so the narrow-screen fallback
    // (a normal wrapping list, no horizontal scroll) keeps its normal page
    // scroll instead of being eaten here.
    board.addEventListener("wheel", (e) => {
      if (board.scrollWidth <= board.clientWidth) return;
      // A trackpad's own two-finger horizontal swipe already scrolls the strip
      // natively via deltaX — leave that alone, or preventDefault below blocks
      // it without anything picking up the slack. Only remap a vertical-only
      // wheel (deltaX ~ 0, a plain mouse wheel or a vertical two-finger swipe).
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      board.scrollLeft += e.deltaY;
    }, { passive: false });

    // Click-and-drag panning. A card is an <a>, so a real click must still
    // navigate — only a drag past a small threshold suppresses it.
    let dragging = false, dragged = false, dragX = 0, dragScroll = 0;
    board.addEventListener("mousedown", (e) => {
      if (board.scrollWidth <= board.clientWidth) return;
      dragging = true; dragged = false;
      dragX = e.pageX; dragScroll = board.scrollLeft;
      board.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.pageX - dragX;
      if (Math.abs(dx) > 4) dragged = true;
      board.scrollLeft = dragScroll - dx;
    });
    window.addEventListener("mouseup", () => {
      dragging = false;
      board.classList.remove("dragging");
    });
    // capture phase: get to the click before the anchor's own navigation
    board.addEventListener("click", (e) => {
      if (!dragged) return;
      e.preventDefault(); e.stopPropagation(); dragged = false;
    }, true);

    document.getElementById("tabs").addEventListener("click", (e) => {
      const b = e.target.closest(".tab"); if (!b || b.dataset.tab === curTab) return;
      [...document.querySelectorAll("#tabs .tab")].forEach((t) => t.classList.toggle("on", t === b));
      curTab = b.dataset.tab;
      build();
    });

    window.siteMe()
      .then((d) => { if (window.Theme) window.Theme.fromAccount(d.themeColor || "default", d.guest); guest = Boolean(d.guest); build(); })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/nav.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
