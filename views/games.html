<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The wall · angeldomme</title>

  <!--
    The games wall, rebuilt 2026-10-27 in the shell's material.

    The old cards were little dark screens — a terminal keypad, a red dial, a
    black board — each its own world, which was right when the site was a
    terminal. They are engravings on paper now: one ink drawing per game, in
    the panel's own three greys, with the name set in the same didone as every
    other heading. Nothing is a screenshot of the game; each drawing says what
    the game IS.

    The hover text she edits in Admin → Games → General is wired back up. It is
    fetched from /api/gametips and shown on the card. The editor has been there
    the whole time; the wall stopped reading it at some point and nobody noticed,
    so she was editing text that nothing displayed.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell.css" />
  <script src="/me.js"></script>
  <script src="/audio.js"></script>
  <style>
    .stage { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .wall-head { text-align: center; flex-shrink: 0; }
    .wall-head h1 { margin-bottom: .4rem; }

    .tabs { display: flex; gap: .5rem; flex-shrink: 0; justify-content: center; margin: 1.1rem 0 1.5rem; }
    .tab {
      background: rgba(255, 255, 255, .4); border: 1px solid var(--line); color: var(--dim);
      font-family: var(--ui); font-weight: 300; font-size: .85rem; letter-spacing: .14em;
      text-transform: lowercase; padding: .38rem 1.2rem; cursor: pointer; border-radius: 999px;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .tab:hover { color: var(--ink); border-color: var(--faint); }
    .tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }

    /* One strip, flush left, that scrolls sideways as games are added rather
       than wrapping. Below 820px it becomes an ordinary wrapping list. */
    .board {
      position: relative; flex: 1 1 auto; min-height: 0;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      scroll-behavior: smooth; cursor: grab; padding-bottom: .6rem;
    }
    .board.dragging { cursor: grabbing; user-select: none; scroll-behavior: auto; }
    .board::-webkit-scrollbar { height: 6px; }
    .board::-webkit-scrollbar-thumb { background: rgba(23, 19, 24, .22); border-radius: 999px; }
    .track { display: flex; gap: 1rem; height: 100%; align-items: stretch; width: max-content; }

    .p {
      position: relative; flex: 0 0 auto; height: 100%; aspect-ratio: 3 / 4;
      display: flex; flex-direction: column;
      border: 1px solid var(--line); border-radius: var(--r-md);
      background: rgba(255, 255, 255, .55);
      text-decoration: none; color: inherit; cursor: pointer; overflow: hidden;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .p:hover, .p.sel { background: rgba(255, 255, 255, .86); border-color: var(--faint); transform: translateY(-4px); }
    .p:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* the drawing */
    .art { flex: 1 1 auto; min-height: 0; position: relative; display: grid; place-items: center; padding: 1.1rem; }
    /* `overflow: visible` let a caption near the viewBox's bottom edge spill out
       of the card and land on top of the game's name. The drawing clips. */
    .art svg { width: 100%; height: 100%; display: block; }
    .ink { stroke: var(--ink); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .ink-2 { stroke: var(--dim); fill: none; stroke-width: 1.1; stroke-linecap: round; }
    .ink-3 { stroke: var(--faint); fill: none; stroke-width: 1; stroke-linecap: round; }
    .fill { fill: var(--ink); stroke: none; }
    .fill-2 { fill: var(--dim); stroke: none; }
    .fill-3 { fill: var(--faint); stroke: none; }

    /* the foot: name, keyword, number */
    .foot { flex-shrink: 0; border-top: 1px solid var(--line); padding: .7rem .9rem .8rem; }
    .foot .n {
      font-family: var(--display); font-weight: 400; font-size: 1.2rem; line-height: 1.1;
      color: var(--ink); display: flex; align-items: baseline; justify-content: space-between; gap: .5rem;
    }
    .foot .num { font-family: var(--ui); font-size: .58rem; letter-spacing: .2em; color: var(--faint); }
    .foot .k { font-size: .54rem; letter-spacing: .26em; text-transform: uppercase; color: var(--faint); margin-top: .25rem; }

    /* Her hover line, from /api/gametips. It sits over the DRAWING, not over the
       foot: you should still be able to see which game you are reading about. */
    .tip {
      position: absolute; inset: auto 0 0 0; z-index: 3;   /* against .art's padding box */
      background: rgba(255, 253, 250, .95);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--line);
      padding: .8rem .9rem; font-size: .78rem; line-height: 1.6; color: var(--dim);
      opacity: 0; transform: translateY(6px); pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .p:hover .tip, .p.sel .tip { opacity: 1; transform: translateY(0); }

    .wip {
      position: absolute; top: .7rem; right: .7rem; z-index: 2;
      font-size: .5rem; letter-spacing: .22em; text-transform: uppercase; color: var(--faint);
      border: 1px solid var(--line); border-radius: 999px; padding: .2rem .55rem;
      background: rgba(255, 255, 255, .7);
    }

    @media (max-width: 820px) {
      .board { overflow: visible; cursor: default; flex: none; }
      .track { flex-wrap: wrap; width: auto; height: auto; justify-content: center; }
      .p { height: auto; width: min(14rem, 44vw); }
      .art { min-height: 11rem; }
    }
  </style>
</head>
<body>
  <div class="page solo">
    <main class="panel">
      <a class="solo-back" href="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        dashboard
      </a>
      <div class="inner wide">
        <div class="stage">
          <div class="wall-head">
            <div class="eyebrow"><b id="count">0</b> of them</div>
            <h1>The wall</h1>
          </div>
          <div class="tabs" id="tabs">
            <button class="tab on" type="button" data-tab="main">games</button>
            <button class="tab" type="button" data-tab="extra">extra</button>
          </div>
          <div class="board" id="board"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="veil"></div>
  <div class="frame"></div>

  <script src="/console.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/wall.js"></script>
</body>
</html>
