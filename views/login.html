<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · angeldomme</title>

  <!--
    Hermione's sign-in. Reached only by `pray login` from the console; there is
    no button anywhere that leads here, because there are no accounts to sign
    into but hers.

    Reskinned 2026-10-24: the same frame, paper and faces as the shell, in the
    `solo` layout (frame + one panel, no nav). The terminal version's boot
    chatter, scan line and ambient glitch are gone.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell.css" />
  <style>
    .lf { max-width: 22rem; margin: 0 auto; text-align: center; }
    .lf .field { text-align: left; }
    .lf .field + .field { margin-top: 1rem; }
    .lf .go { margin-top: 1.2rem; }
    .lf .back { display: block; margin-top: 1.8rem; font-size: .8rem; color: var(--faint); text-decoration: none; }
    .lf .back:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="page solo middle">
    <main class="panel">
      <div class="inner">
        <form class="lf" id="form" autocomplete="on">
          <div class="solo-brand">angel<i>domme</i></div>

          <div class="field">
            <label class="flabel" for="username">who</label>
            <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="30" />
          </div>
          <div class="field">
            <label class="flabel" for="password">passphrase</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
          </div>

          <div class="warn" id="error"></div>
          <button class="go" id="submit" type="submit">Enter</button>
          <a class="back" href="/">not her? go back</a>
        </form>
      </div>
    </main>
  </div>

  <div class="veil"></div>
  <div class="frame"></div>

  <script>
    var $ = function (id) { return document.getElementById(id); };
    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      $("error").textContent = "";
      fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
      }).then(function (out) {
        if (out.ok) { window.location.href = "/dashboard"; return; }
        $("error").textContent = out.d.error || "Something went wrong.";
      }).catch(function () {
        $("error").textContent = "Connection lost. Try again.";
      });
    });
  </script>
  <script src="/ambience.js" defer></script>
</body>
</html>
