<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage accounts - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root { --c:#aee3ff; --dim:#4f7ea0; --dim2:#2c4a5e; --bright:#eafaff; --accent:#8fd0ff;
            --glow:rgba(0,172,219,.32); --red:#ff5a4a; --gold:#ffd27a; --ok:#7dffb0; --line:#173040; --panel:#0a1720; }
    html, body { height:100%; }
    body { background:#000; color:var(--c); font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px; }
    .scan { position:fixed; inset:0; z-index:200; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px); }
    .wrap { position:relative; z-index:5; max-width:960px; margin:0 auto; padding:4vh 5vw 6vh; }
    .top { display:flex; justify-content:space-between; align-items:baseline; font-size:11px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase; }
    .top a { color:var(--dim); text-decoration:none; } .top a:hover { color:var(--c); }
    h1 { font-size:1.4rem; color:var(--bright); letter-spacing:.06em; margin:1.4rem 0 0.3rem; font-weight:600; }
    .sub { color:var(--dim); margin-bottom:1.6rem; }
    section { border:1px solid var(--line); background:var(--panel); padding:1.2rem 1.3rem; margin-bottom:1.4rem; }
    h2 { font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); font-weight:400; margin-bottom:1rem; }
    .field { display:flex; align-items:center; gap:1rem; margin-bottom:.9rem; flex-wrap:wrap; }
    .field label { width:8rem; color:var(--dim); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
    input { flex:1; min-width:12rem; background:rgba(0,172,219,.06); border:1px solid var(--line); color:var(--bright);
      font-family:inherit; font-size:1rem; padding:.5rem .7rem; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 12px var(--glow); }
    .types { display:flex; gap:.6rem; }
    .type { border:1px solid var(--dim2); background:transparent; color:var(--dim); font-family:inherit; font-size:.85rem;
      letter-spacing:.08em; text-transform:lowercase; padding:.4rem 1.1rem; cursor:pointer; }
    .type.on { border-color:var(--accent); color:var(--bg,#000); background:var(--accent); box-shadow:0 0 14px var(--glow); }
    .btn { border:1px solid var(--c); background:transparent; color:var(--bright); font-family:inherit; font-size:.82rem;
      letter-spacing:.16em; text-transform:uppercase; padding:.6rem 1.6rem; cursor:pointer; }
    .btn.solid { background:var(--accent); color:#000; box-shadow:0 0 18px var(--glow); }
    .btn:hover { box-shadow:0 0 18px var(--glow); }
    .btn.mini { padding:.3rem .8rem; font-size:.72rem; letter-spacing:.1em; }
    .btn.ghost { border-color:var(--dim2); color:var(--dim); }
    .note { color:var(--dim); font-size:.8rem; margin-top:.4rem; }
    .msg { min-height:1.3em; margin-top:.6rem; }
    .msg.ok { color:var(--ok); } .msg.no { color:var(--red); }
    .gen { border:1px solid var(--dim2); background:transparent; color:var(--dim); font-family:inherit; font-size:.72rem;
      letter-spacing:.1em; text-transform:uppercase; padding:.5rem .8rem; cursor:pointer; white-space:nowrap; }
    .apps { display:flex; flex-direction:column; gap:.7rem; }
    .app { border:1px solid var(--line); padding:.8rem .9rem; }
    .app.flag { border-color:var(--gold); }
    .app .head { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .app .who { color:var(--bright); }
    .app .when { color:var(--dim); font-size:.72rem; }
    .app .acts { display:flex; gap:.5rem; }
    .app .flagtag { color:var(--gold); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
    .app .detail { margin-top:.7rem; display:none; }
    .app.open .detail { display:block; }
    .app .rgroup { margin-top:.6rem; }
    .app .rgroup h3 { color:var(--dim); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; font-weight:400; margin-bottom:.3rem; border-bottom:1px solid var(--line); padding-bottom:.2rem; }
    .app .ritem { display:flex; justify-content:space-between; padding:.1rem 0; font-size:12px; }
    .app .ritem .k { color:var(--c); } .app .ritem .v { color:var(--accent); } .app .ritem .v.warn { color:var(--gold); }
    .empty { color:var(--dim2); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><span><span style="text-transform:none">angelOS v0.2</span> // account management</span><a href="/dashboard">&larr; dashboard</a></div>
    <h1>Manage accounts</h1>
    <div class="sub">Create an account, hand it out with the dummy password; the account sets its own on first sign-in.</div>

    <section>
      <h2>Create account</h2>
      <div class="field"><label>username</label><input id="u-name" maxlength="30" placeholder="username" /></div>
      <div class="field"><label>type</label>
        <div class="types" id="types">
          <button class="type on" type="button" data-type="Sub">disciple</button>
          <button class="type" type="button" data-type="Visitor">visitor</button>
        </div>
      </div>
      <div class="field"><label>dummy password</label><input id="u-pass" maxlength="72" /><button class="gen" id="gen" type="button">generate</button></div>
      <div class="field"><label></label><button class="btn solid" id="create" type="button">create account</button></div>
      <div class="msg" id="msg"></div>
    </section>

    <section>
      <h2>Applications</h2>
      <div class="apps" id="apps"><div class="empty">Loading…</div></div>
    </section>
  </div>
  <div class="scan"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    let type = "Sub";

    function randPass() {
      const cs = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = ""; for (let i = 0; i < 10; i++) s += cs[Math.floor(Math.random() * cs.length)];
      return s;
    }
    $("gen").addEventListener("click", () => { $("u-pass").value = randPass(); });
    $("u-pass").value = randPass();

    $("types").addEventListener("click", (e) => {
      const b = e.target.closest(".type"); if (!b) return;
      type = b.dataset.type;
      [...$("types").children].forEach((c) => c.classList.toggle("on", c === b));
    });

    function msg(text, cls) { const m = $("msg"); m.textContent = text; m.className = "msg " + (cls || ""); }

    $("create").addEventListener("click", async () => {
      const username = $("u-name").value.trim();
      const password = $("u-pass").value;
      if (username.length < 3) return msg("Username must be at least 3 characters.", "no");
      if (password.length < 8) return msg("Dummy password must be at least 8 characters.", "no");
      $("create").disabled = true;
      let res, data;
      try {
        res = await fetch("/api/admin/accounts", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, type }) });
        data = await res.json().catch(() => ({}));
      } catch (e) { $("create").disabled = false; return msg("Network trouble.", "no"); }
      $("create").disabled = false;
      if (!res.ok) return msg(data.error || "That didn't work.", "no");
      msg("Created " + data.username + " (" + (type === "Sub" ? "disciple" : "visitor") + "). Password: " + password, "ok");
      $("u-name").value = ""; $("u-pass").value = randPass();
    });

    // --- applications ---
    const KINKS = ["feet","tasks","degradation","humiliation","masochism","exhibitionism","worship","petplay"];
    const PUNS = ["lines_physical","lines_typing","voice_memos","ignoring","onsite_games_hard"];
    const PETS = ["dog","good","doll","pet","bitch","loser","dummy"];
    function labelize(s) { return s.replace(/_/g, " "); }

    async function loadApps() {
      let data = { applications: [] };
      try { const r = await fetch("/api/admin/applications"); if (r.ok) data = await r.json(); } catch (e) {}
      const box = $("apps");
      if (!data.applications.length) { box.innerHTML = '<div class="empty">No applications waiting.</div>'; return; }
      box.replaceChildren();
      data.applications.forEach((a) => {
        const el = document.createElement("div");
        el.className = "app" + (a.flag ? " flag" : "");
        const kr = KINKS.map((k) => `<div class="ritem"><span class="k">${k}</span><span class="v ${a.flag && (k==='feet'||k==='tasks') ? 'warn' : ''}">${a.kinks[k]} / 5</span></div>`).join("");
        const pr = PUNS.map((p) => `<div class="ritem"><span class="k">${labelize(p)}</span><span class="v">${a.punishments[p] === "acceptable" ? "acceptable" : "hard no"}</span></div>`).join("");
        const nr = PETS.map((p) => `<div class="ritem"><span class="k">${p}</span><span class="v">${a.petnames[p] === "like" ? "like" : "hate"}</span></div>`).join("");
        el.innerHTML =
          `<div class="head">
            <div><span class="who">${esc(a.contact && a.contact.discord)}</span> ${a.flag ? '<span class="flagtag">&middot; flagged</span>' : ''}
              <span class="when">${new Date(a.at).toLocaleString()}</span></div>
            <div class="acts">
              <button class="btn mini" data-act="toggle" type="button">view</button>
              <button class="btn mini" data-act="use" type="button">use &rarr; create</button>
              <button class="btn mini ghost" data-act="dismiss" type="button">dismiss</button>
            </div>
          </div>
          <div class="detail">
            <div class="rgroup"><h3>interests</h3>${kr}</div>
            <div class="rgroup"><h3>limits</h3><div class="ritem"><span class="k" style="white-space:pre-wrap">${esc(a.limits) || "<span style='color:var(--dim2)'>none given</span>"}</span></div></div>
            <div class="rgroup"><h3>punishments</h3>${pr}</div>
            <div class="rgroup"><h3>petnames</h3>${nr}${a.petnamesOther ? `<div class="ritem"><span class="k">other</span><span class="v">${esc(a.petnamesOther)}</span></div>` : ""}</div>
          </div>`;
        el.querySelector('[data-act="toggle"]').addEventListener("click", () => el.classList.toggle("open"));
        el.querySelector('[data-act="use"]').addEventListener("click", () => {
          const suggested = String((a.contact && a.contact.discord) || "").replace(/[^a-zA-Z0-9]+/g, "").slice(0, 30);
          $("u-name").value = suggested; $("u-pass").value = randPass();
          window.scrollTo({ top: 0, behavior: "smooth" });
          msg("Prefilled from " + (a.contact && a.contact.discord) + ". Set a username and create.", "ok");
        });
        el.querySelector('[data-act="dismiss"]').addEventListener("click", async () => {
          if (!confirm("Dismiss this application?")) return;
          const r = await fetch("/api/admin/applications/" + encodeURIComponent(a.id), { method: "DELETE" });
          if (r.ok) el.remove();
        });
        box.append(el);
      });
    }

    window.siteMe().then((d) => { if (!d || !d.isAdmin) { window.location.href = "/dashboard"; return; } loadApps(); })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/console.js" defer></script>
</body>
</html>
