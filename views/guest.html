<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Major+Mono+Display&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <style>
    /* Guest landing: the dashboard's terminal look, stripped to what a session
       without an account can actually do. No points, no dailies, no admin. */
    :root { --c:#aee3ff; --dim:#4f7ea0; --dim2:#37576f; --bright:#eafaff; --accent:#8fd0ff;
            --bg:#000000; --glow:rgba(120,190,255,0.32); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--c); font-family: "IBM Plex Mono", monospace; font-size: 15px;
      display: flex; align-items: center; justify-content: center; padding: 4vh 5vw; }
    .term-scan { position: fixed; inset: 0; z-index: 60; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.24) 0 1px, transparent 1px 3px); }
    .term-vig { position: fixed; inset: 0; z-index: 59; pointer-events: none; box-shadow: inset 0 0 26vh 9vh rgba(0,0,0,0.6); }
    a { color: inherit; text-decoration: none; }

    .wrap { width: min(900px, 100%); }
    .eyebrow { color: var(--dim); font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; }
    h1 { font-family: "Major Mono Display", "IBM Plex Mono", monospace; font-weight: 400; text-transform: lowercase;
      font-size: clamp(2.4rem, 7vw, 4.4rem); margin: 0.4rem 0 0.2rem; color: var(--bright); text-shadow: 0 0 22px var(--glow); }
    .sub { color: var(--dim); margin-bottom: 2.4rem; line-height: 1.7; }
    .sub b { color: var(--c); font-weight: 500; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.6rem; }
    @media (max-width: 720px) { .cols { grid-template-columns: 1fr; gap: 1.8rem; } }
    .stitle { color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.72rem; margin-bottom: 0.8rem; }
    .links { display: flex; flex-direction: column; gap: 0.15rem; }
    .links a { font-size: 1.08rem; padding: 0.16rem 0; position: relative; }
    .links a::before { content: "› "; color: var(--dim2); }
    .links a:hover { color: var(--bright); text-shadow: 0 0 10px var(--glow); }

    .links a[data-tip]::after {
      content: "// " attr(data-tip);
      position: absolute; left: calc(100% + 0.9rem); top: 50%; transform: translateY(-50%);
      width: 15rem; padding: 0.55rem 0.7rem; z-index: 30;
      background: rgba(0,0,0,0.96); border: 1px solid var(--accent); box-shadow: 0 0 22px var(--glow);
      color: var(--c); font-size: 0.72rem; line-height: 1.5; text-transform: none; text-align: left;
      opacity: 0; visibility: hidden; transition: opacity 0.12s ease;
      clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    }
    .links a[data-tip]:hover::after { opacity: 1; visibility: visible; }
    @media (max-width: 1100px) { .links a[data-tip]::after { display: none; } }

    .note { margin-top: 2.6rem; border-top: 1px solid var(--dim2); padding-top: 1rem;
      color: var(--dim2); font-size: 0.78rem; line-height: 1.7; }
    .note a { color: var(--c); border-bottom: 1px solid var(--dim2); }
    .note a:hover { color: var(--bright); }
  </style>
  <script src="/audio.js"></script>
</head>
<body>
  <div class="term-vig"></div>
  <div class="term-scan"></div>

  <div class="wrap">
    <div class="eyebrow">guest session</div>
    <h1 id="who">guest</h1>
    <p class="sub">Nothing you do here survives the session.</p>

    <div class="cols">
      <section>
        <div class="stitle">alone</div>
        <div class="links">
          <a href="/snake" data-tip="Chase the food. Classic Snake clone.">Snake</a>
          <a href="/writing" data-tip="A writeforme clone for punishments.">Penance</a>
          <a href="/writing?mode=devotion" data-tip="A calmer writeforme clone for mantras.">Devotion</a>
          <a href="/wheel" data-tip="One spin. Pays angelcoins, which a guest cannot keep.">Wheel</a>
        </div>
      </section>
      <section>
        <div class="stitle">against hermione</div>
        <div class="links">
          <a href="/deathroll" data-tip="A two-player dice game. The first player to roll a 1 loses.">Deathroll</a>
          <a href="/chess" data-tip="Chess against Hermione. She plays black.">Chess</a>
        </div>
      </section>
    </div>

    <p class="note"><a href="/">Sign in or register</a></p>
  </div>

  <script>
    window.siteMe()
      .then((d) => {
        if (!d.guest) { window.location.href = "/dashboard"; return; }   // real accounts get the real one
        document.getElementById("who").textContent = d.username || "guest";
      })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
</body>
</html>
