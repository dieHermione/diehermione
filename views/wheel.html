<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="/me.js"></script>
  <style>
    /* The wheel, unrolled (mockup 5). The faces are not on a disc any more:
       they run past on a cylinder seen edge-on, and the one under the pin is
       the one that pays. Self-contained, no site.css. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --c: #aee3ff; --dim: #4f7ea0; --dim2: #2c4a5e; --bright: #eafaff;
      --accent: #8fd0ff; --glow: rgba(120, 190, 255, .32); --red: #ff3b2f;
      --err: #ff5a4a;
    }
    html, body { height: 100%; }
    body {
      background: #000; color: var(--c);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
      overflow: hidden;
    }
    .scan {
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px);
    }
    .vig {
      position: fixed; inset: 0; z-index: 199; pointer-events: none;
      box-shadow: inset 0 0 24vh 8vh rgba(0,0,0,.7);
    }

    .cy {
      position: absolute; inset: 0; padding: 3vh 3vw;
      display: flex; flex-direction: column; justify-content: center; gap: 2rem;
      perspective: 900px;
    }
    .chd {
      display: flex; justify-content: space-between;
      font-size: 10px; letter-spacing: .35em; color: var(--dim);
    }
    .chd b { color: var(--bright); font-weight: 400; }

    /* ---- the band ---- */
    .band {
      position: relative; height: 280px;
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
    }
    .rails {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      height: 230px; border-top: 1px solid var(--dim2); border-bottom: 1px solid var(--dim2);
    }
    /* the pin sits on the top edge of the centre face, not up in the header */
    .pin {
      position: absolute; left: 50%; top: 22px; transform: translateX(-50%);
      border: 12px solid transparent; border-top-color: var(--red);
      filter: drop-shadow(0 0 12px rgba(255,59,47,.8)); z-index: 40;
    }
    .seg {
      position: absolute; width: 170px; height: 190px;
      border: 1px solid var(--dim2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000;
      background-image: repeating-linear-gradient(0deg, rgba(120,190,255,.05) 0 2px, transparent 2px 6px);
      will-change: transform, opacity;
    }
    .seg .v { font-size: 2.6rem; color: var(--dim); line-height: 1; }
    .seg .u { font-size: 8px; letter-spacing: .3em; color: var(--dim2); margin-top: .4rem; }
    .seg.c { border-color: var(--c); box-shadow: 0 0 50px var(--glow), inset 0 0 40px rgba(120,190,255,.1); }
    .seg.c .v { font-size: 4.4rem; color: var(--bright); text-shadow: 0 0 36px var(--glow); }
    .seg.c .u { color: var(--accent); }

    /* ---- foot ---- */
    .cyf { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2rem; align-items: center; }
    .odds { font-size: 10px; line-height: 2; color: var(--dim); }
    .odds b { color: var(--bright); font-weight: 400; }
    .pay { text-align: center; min-height: 5rem; }
    .pay .n { font-size: 3.6rem; color: var(--bright); text-shadow: 0 0 30px var(--glow); line-height: 1; }
    .pay .k { font-size: 9px; letter-spacing: .4em; color: var(--dim); margin-top: .4rem; }
    .pay.bad .n { font-size: 1.2rem; color: var(--err); text-shadow: none; }
    .turn {
      justify-self: end; border: 1.5px solid var(--c); background: transparent;
      font-family: inherit; font-size: .82rem; letter-spacing: .34em; text-transform: uppercase;
      color: var(--bright); padding: .85rem 2.6rem; cursor: pointer;
      box-shadow: 0 0 22px var(--glow);
    }
    .turn:hover:not(:disabled) { background: rgba(120,190,255,.12); }
    .turn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  </style>
  <script src="/audio.js"></script>
</head>
<body class="has-top-nav">
  <div class="cy">
    <div class="chd">
      <span>angelOS v0.2</span>
      <span id="rule"></span>
      <span>VAULT <b id="vault">…</b> &#10022;</span>
    </div>

    <div class="band" id="band">
      <div class="rails"></div>
      <div class="pin"></div>
    </div>

    <div class="cyf">
      <div class="odds" id="odds">&nbsp;</div>
      <div class="pay" id="pay"><div class="k" id="paykey">READY</div></div>
      <button class="turn" id="turn" type="button" disabled>turn</button>
    </div>
  </div>
  <div class="vig"></div><div class="scan"></div>

  <script>
    /* The faces sit on a cylinder. `pos` is a continuous index into the face
       list, so turning is a matter of easing `pos` up to the face the server
       picked; each frame re-places every visible face around it. */

    const SPACING = 150;       // px between face centres
    const VISIBLE = 5;         // faces either side of the pin
    const TURN_MS = 13500;     // the long turn the wheel is meant to have

    const bandEl = document.getElementById("band");
    const payEl = document.getElementById("pay");
    const turnBtn = document.getElementById("turn");

    let segments = [];
    let faces = [];            // one element per segment, reused every frame
    let pos = 0;               // continuous index under the pin
    let turning = false;

    function buildFaces() {
      faces.forEach((f) => f.remove());
      faces = segments.map((seg) => {
        const el = document.createElement("div");
        el.className = "seg";
        const v = document.createElement("div");
        v.className = "v";
        v.textContent = seg.label;
        el.append(v);
        bandEl.append(el);
        return el;
      });
      place();
    }

    // signed distance from the pin, wrapped, so the strip has no ends
    function offsetOf(i) {
      const n = segments.length;
      return ((i - pos + n / 2) % n + n) % n - n / 2;
    }

    function place() {
      faces.forEach((el, i) => {
        const off = offsetOf(i);
        const mag = Math.abs(off);
        if (mag > VISIBLE) { el.hidden = true; return; }
        el.hidden = false;
        el.style.transform =
          "translateX(" + (off * SPACING) + "px) translateZ(" + (-mag * 90) + "px) " +
          "rotateY(" + (off * -26) + "deg)";
        el.style.opacity = Math.max(.12, 1 - mag * .22);
        el.style.zIndex = String(30 - Math.round(mag));
        el.classList.toggle("c", mag < .5);
      });
    }

    const easeOut = (t) => 1 - Math.pow(1 - t, 3);

    function turnTo(index) {
      return new Promise((resolve) => {
        const n = segments.length;
        const from = pos;
        // three whole revolutions, then forward onto the winning face
        const ahead = ((index - from) % n + n) % n;
        const to = from + n * 3 + ahead;
        const start = performance.now();
        function step(now) {
          const t = Math.min(1, (now - start) / TURN_MS);
          pos = from + (to - from) * easeOut(t);
          place();
          if (t < 1) requestAnimationFrame(step);
          else { pos = ((to % n) + n) % n; place(); resolve(); }
        }
        requestAnimationFrame(step);
      });
    }

    function showPay(html, key, bad) {
      payEl.className = "pay" + (bad ? " bad" : "");
      payEl.replaceChildren();
      if (html !== null) {
        const n = document.createElement("div");
        n.className = "n";
        n.textContent = html;
        payEl.append(n);
      }
      const k = document.createElement("div");
      k.className = "k";
      k.textContent = key;
      payEl.append(k);
    }

    async function turn() {
      if (turning) return;
      turning = true;
      turnBtn.disabled = true;
      showPay(null, "TURNING");

      const res = await fetch("/api/wheel/spin", { method: "POST" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        turning = false;
        showPay(data.error || "That didn't work.", "", true);
        return;
      }

      await turnTo(data.index);
      turning = false;
      document.getElementById("vault").textContent = Number(data.angelcoins).toLocaleString();
      showPay("+" + data.won + " ✦", "");
      // once there are no spins left (accounts, after their turn) the button
      // stops being a dead control and becomes the way back. Guests keep spinning.
      if (!data.canSpin) becomeReturn();
      else turnBtn.disabled = false;
    }

    function becomeReturn() {
      turnBtn.disabled = false;
      turnBtn.textContent = "return";
      turnBtn.dataset.leave = "1";
    }

    turnBtn.addEventListener("click", () => {
      if (turnBtn.dataset.leave) { window.location.href = "/games"; return; }
      turn();
    });

    // real odds, off the server's own weights, rather than counting faces
    function oddsLine() {
      const coins = segments.map((s) => s.coins);
      const total = segments.reduce((a, s) => a + (s.weight || 1), 0);
      const share = (test) => segments.reduce((a, s) => a + (test(s.coins) ? (s.weight || 1) : 0), 0) / total;
      const mean = segments.reduce((a, s) => a + s.coins * (s.weight || 1), 0) / total;
      return [
        segments.length + " FACES &nbsp; " + Math.min(...coins) + " &ndash; " +
          Math.max(...coins) + " &#10022;",
        "P(&le;5) <b>" + Math.round(share((c) => c <= 5) * 100) + "%</b> &nbsp; " +
          "P(&ge;100) <b>" + (share((c) => c >= 100) * 100).toFixed(1) + "%</b>",
        "MEAN <b>" + mean.toFixed(1) + " &#10022;</b>",
      ].join("<br>");
    }

    window.siteMe()
      .then((d) => {
        document.getElementById("vault").textContent = Number(d.angelcoins || 0).toLocaleString();
        return fetch("/api/wheel");
      })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((state) => {
        segments = state.segments;
        buildFaces();
        document.getElementById("odds").innerHTML = oddsLine();
        turnBtn.disabled = !state.canSpin;
        if (!state.canSpin) becomeReturn();
        showPay(null, state.canSpin ? "READY" : "SPUN TODAY");
      })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/nav.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
