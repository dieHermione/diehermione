<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Devotion - angeldom.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  /* Devotion: the blue terminal. (Penance, its red corrupting sibling, was
     folded into it on 2026-09-11 — one game, presets or your own lines.) */
  :root { --c: #00acdb; --dim: #00acdb; --ok: #ffffff; --err: #e0543a; --glow: rgba(0,172,219,0.4); }
  body { font-family: "IBM Plex Mono", monospace; background: #04060a; color: var(--c); }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vh 5vw; }
  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
  .screen { width: min(880px, 92vw); position: relative; z-index: 2; display: none; }
  .screen.on { display: block; }
  /* the game itself is scaled up ~50% (the settings screens are left alone) */
  #play.on { transform: scale(1.5); transform-origin: center; }
  /* Mobile: the 1.5x scale blew the play screen past a clipped viewport (same bug
     the login page had). Drop the scale, let the page scroll, and shrink the fixed
     stage to a normal flow so nothing runs off the edge. */
  @media (max-width: 820px) {
    #play.on { transform: none; }
    #app { position: static; min-height: 100%; align-items: flex-start; }
    html, body { overflow: auto; }
    .screen { width: 100%; }
  }
  .c { color: var(--c); } .dim { color: var(--dim); } .ok { color: var(--ok); } .err { color: var(--err); }
  .cap { letter-spacing: 0.24em; text-transform: uppercase; }
  .md { font-size: 15px; line-height: 2; }
  .sm { font-size: 12.5px; line-height: 1.9; letter-spacing: 0.04em; }
  .big { font-size: clamp(1.1rem, 2.4vw, 1.5rem); line-height: 1.9; }
  a, button { font-family: inherit; }
  .blink { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  hr.d { border: none; border-top: 1px solid var(--dim); opacity: 0.5; margin: 0.9rem 0; }
  .cur { background: var(--c); color: #04060a; }
  .glitchblk { background: var(--err); color: #000; }

  /* boot */
  #boot .hint { margin-top: 1.6rem; color: var(--dim); }

  /* selection */
  .field { margin: 1.1rem 0; }
  .flabel { color: var(--dim); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .opt { cursor: pointer; padding: 0.35rem 0.9rem; border: 1px solid var(--dim); color: var(--c); background: transparent;
    border-radius: 2px; font-size: 0.9rem; letter-spacing: 0.04em; transition: background 0.12s, color 0.12s, border-color 0.12s; }
  .opt:hover { border-color: var(--c); }
  .opt.sel { background: var(--c); color: #04060a; border-color: var(--c); }
  .diffnote { color: var(--dim); font-size: 12px; margin-top: 0.45rem; min-height: 1.2em; }
  input.term, textarea.term { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--dim); color: var(--c);
    font-family: inherit; font-size: 1rem; padding: 0.6rem 0.7rem; border-radius: 2px; }
  input.term:focus, textarea.term:focus { outline: none; border-color: var(--c); }
  textarea.term { min-height: 5rem; line-height: 1.8; resize: vertical; }
  input.custom { width: 6rem; }
  .begin { margin-top: 1.6rem; cursor: pointer; padding: 0.55rem 1.6rem; border: 1px solid var(--c); background: transparent;
    color: var(--c); font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 2px; }
  .begin:hover { background: var(--c); color: #04060a; }
  .begin:disabled { opacity: 0.4; cursor: not-allowed; }
  .begin:disabled:hover { background: transparent; color: var(--c); }

  /* play */
  #play .status { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .warn { color: var(--err); min-height: 1.3em; margin: 0.4rem 0; }
  #play .target { position: relative; }
  #play .bar { margin-top: 1.2rem; }
  .barfill { display: inline-block; letter-spacing: -1px; }
  #play .actions { margin-top: 1.6rem; display: flex; gap: 1.4rem; }
  .tbtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.85rem; letter-spacing: 0.1em;
    text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
  .tbtn:hover { color: var(--c); }

  /* results */
  #done .row { display: flex; }
  #done .k { color: var(--dim); width: 10rem; }
  #done .transcript { margin-top: 0.6rem; color: var(--c); font-size: 0.95rem; line-height: 1.9; }
  #done .transcript .n { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
  <script src="/audio.js"></script>
</head>
<body class="has-top-nav">
  <div id="app">
    <!-- opening / boot -->
    <section class="screen on md" id="boot">
      <div id="boot-log"></div>
      <div class="hint" id="boot-hint" hidden><span class="cap">press any key to begin</span> <span class="blink">_</span></div>
    </section>

    <!-- selection -->
    <section class="screen md" id="select">
      <div class="c cap" style="font-size:1.1rem">:: configure devotion ::</div>
      <hr class="d" />
      <div class="field">
        <div class="flabel">repetitions</div>
        <div class="opts" id="reps-opts">
          <button class="opt" data-reps="25">25</button>
          <button class="opt sel" data-reps="50">50</button>
          <button class="opt" data-reps="100">100</button>
          <span class="dim">/</span>
          <input class="term custom" id="reps-custom" type="text" inputmode="numeric" maxlength="4" placeholder="custom" />
        </div>
      </div>
      <div class="field">
        <div class="flabel">lines</div>
        <!-- Hermione's presets, then "custom": your own lines, one per row -->
        <div class="opts" id="preset-opts"><button class="opt" data-preset="">custom</button></div>
        <textarea class="term" id="lines" rows="3" maxlength="600" placeholder="Her will is Divine. I will obey." style="display:none"></textarea>
        <div class="diffnote">at your own pace. a slip restarts the line.</div>
      </div>
      <div class="sm warn" id="sel-warn"></div>
      <button class="begin" id="begin" disabled>begin</button>
    </section>

    <!-- typing -->
    <section class="screen" id="play">
      <div class="sm dim cap status">
        <span id="p-cat">devotion</span>
        <span>rep <span id="p-rep">00</span> / <span id="p-total">00</span></span>
        <span>err <span id="p-err">00</span></span>
      </div>
      <div class="big"><span class="c">&gt; </span><span class="target" id="target"></span></div>
      <div class="bar sm"><span class="barfill" id="p-barfill"></span></div>
    </section>

    <!-- results -->
    <section class="screen md" id="done">
      <div class="c cap" style="font-size:1.1rem" id="done-title">:: session complete ::</div>
      <hr class="d" />
      <div class="row"><span class="k">lines</span><span><span id="r-lines">0</span> / <span id="r-total">0</span> <span class="ok" id="r-check">✓</span></span></div>
      <div class="row"><span class="k">errors</span><span id="r-err">0</span></div>
      <div class="row"><span class="k">time</span><span id="r-time">0:00</span></div>
      <div class="row"><span class="k">accuracy</span><span id="r-acc">100%</span></div>
      <hr class="d" />
      <div class="dim sm cap">transcript · in your own words</div>
      <div class="transcript" id="r-transcript"></div>
      <div class="dim sm" id="r-log" style="margin-top:1rem"></div>
      <div class="actions" style="margin-top:1.4rem; display:flex; gap:1.4rem;">
        <button class="tbtn" id="again">again</button>
        <a class="tbtn" href="/dashboard" style="text-decoration:underline">exit</a>
      </div>
    </section>
  </div>
  <div class="scan" id="scan"></div>

<script>
  const $ = (id) => document.getElementById(id);
  function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }

  // Devotion: type a line, again and again. The lines come from one of
  // Hermione's presets (server-stored, editable in /admin) or from the box —
  // your own, one per row. Either way the SERVER owns the run: it builds the
  // sequence, checks each finished line, and counts.
  const MODE = "devotion";
  let PRESETS = {};          // keyed by preset id, filled from /api/devotion/presets
  let preset = null;         // chosen preset id; null means "custom" (the box)

  /* ---------- audio: old-keyboard clicks over a soft hum ---------- */
  let actx = null, ambGain = null, ambStarted = false;
  function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
  function startAmbience() {
    const a = audio(); if (!a || ambStarted) return; ambStarted = true;
    const size = 2 * a.sampleRate, buf = a.createBuffer(1, size, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
    const n = a.createBufferSource(); n.buffer = buf; n.loop = true;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 360;
    ambGain = a.createGain(); ambGain.gain.value = 0.012;
    n.connect(f).connect(ambGain).connect(a.destination); n.start();
  }
  function keyClick(bad) {
    const a = audio(); if (!a) return; const now = a.currentTime;
    const len = Math.floor(a.sampleRate * 0.03), b = a.createBuffer(1, len, a.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = a.createBufferSource(); n.buffer = b;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = bad ? 1300 : 2100; f.Q.value = 0.8;
    const g = a.createGain(); g.gain.value = bad ? 0.16 : 0.09;
    n.connect(f).connect(g).connect(a.destination); n.start(now); n.stop(now + 0.03);
    const o = a.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(bad ? 88 : 150, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.04);
    const og = a.createGain(); og.gain.setValueAtTime(bad ? 0.12 : 0.06, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    o.connect(og).connect(a.destination); o.start(now); o.stop(now + 0.06);
  }

  /* ---------- state ---------- */
  const state = { reps: 50, lines: [], idx: 0, typed: 0, mistakes: 0, correct: 0, startedAt: 0, done: false };

  /* ---------- boot ---------- */
  const BOOT = [
    ["angelOS", " v0.2  ", "session 0x1F3A"],
    ["> power-on self test .............. ", "OK"],
    ["> mounting /devotion .............. ", "OK"],
    ["> establishing link to Her ........ ", "OK"],
    ["> devotion module ................. ", "READY"],
  ];
  function runBoot() {
    const log = $("boot-log"); log.innerHTML = "";
    let i = 0;
    (function step() {
      if (i >= BOOT.length) { $("boot-hint").hidden = false; return; }
      const parts = BOOT[i];
      const line = document.createElement("div");
      line.innerHTML = parts.map((p, k) => k === parts.length - 1 && /OK|READY/.test(p) ? '<span class="ok">' + p + "</span>" : (k === 0 && i === 0 ? '<span class="c">' + p + "</span>" : k === 2 ? '<span class="dim">' + p + "</span>" : p)).join("");
      log.appendChild(line); i++;
      setTimeout(step, 260);
    })();
  }
  function leaveBoot() { if ($("boot").classList.contains("on")) { show("select"); refreshBegin(); } }
  document.addEventListener("keydown", (e) => { if ($("boot").classList.contains("on")) { e.preventDefault(); leaveBoot(); } }, true);
  // mobile has no keyboard for "press any key" — a tap dismisses the boot too
  document.addEventListener("pointerdown", () => { if ($("boot").classList.contains("on")) leaveBoot(); }, true);
  $("boot").addEventListener("click", leaveBoot);

  /* ---------- selection ---------- */
  function pickGroup(container, attr, value) {
    container.querySelectorAll(".opt").forEach((b) => b.classList.toggle("sel", b.dataset[attr] === value));
  }
  $("reps-opts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-reps]"); if (!b) return;
    state.reps = Number(b.dataset.reps); $("reps-custom").value = "";
    pickGroup($("reps-opts"), "reps", b.dataset.reps);
  });
  $("reps-custom").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "");
    const n = parseInt(e.target.value);
    if (Number.isInteger(n) && n > 0) { state.reps = Math.min(9999, n); $("reps-opts").querySelectorAll(".opt").forEach((b) => b.classList.remove("sel")); }
  });
  function parseLines() { return $("lines").value.split("\n").map((l) => l.trim()).filter(Boolean); }
  function refreshBegin() {
    $("begin").disabled = preset ? false : parseLines().length === 0;
  }
  $("lines").addEventListener("input", refreshBegin);
  $("begin").addEventListener("click", startGame);

  // presets first, "custom" last; picking custom reveals the box
  const po = $("preset-opts");
  po.addEventListener("click", (e) => {
    const b = e.target.closest("[data-preset]"); if (!b) return;
    preset = b.dataset.preset || null;
    po.querySelectorAll(".opt").forEach((o) => o.classList.toggle("sel", o === b));
    $("lines").style.display = preset ? "none" : "";
    if (!preset) $("lines").focus();
    refreshBegin();
  });
  // presets come from the server (Hermione-editable); the first one is the
  // default. If none load, custom is the only option and gets selected.
  fetch("/api/devotion/presets").then((r) => r.json()).then((data) => {
    const custom = po.querySelector('[data-preset=""]');
    (data.presets || []).forEach((p, i) => {
      PRESETS[p.id] = p;
      const b = document.createElement("button"); b.className = "opt" + (i === 0 ? " sel" : "");
      b.dataset.preset = p.id; b.textContent = p.name; po.insertBefore(b, custom);
      if (i === 0) preset = p.id;
    });
    if (!preset) { custom.classList.add("sel"); $("lines").style.display = ""; }
    refreshBegin();
  }).catch(() => { po.querySelector('[data-preset=""]').classList.add("sel"); $("lines").style.display = ""; refreshBegin(); });

  /* ---------- game ---------- */
  // The SERVER owns the run: it builds the line sequence from its own pool (or
  // the box's lines) and counts the lines. The client renders what it is given
  // and reports each finished line for validation. `runId` ties the two.
  let runId = null, lineFailed = false;

  async function startGame() {
    const own = preset ? null : parseLines();
    if (!preset && !own.length) return;
    const begin = $("begin");
    begin.disabled = true; $("sel-warn").textContent = "";
    let data;
    try {
      const res = await fetch("/api/writing/session", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: MODE, reps: state.reps, presetId: preset || undefined, ownLines: own || undefined }),
      });
      data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Could not start.");
    } catch (e) {
      begin.disabled = false;
      $("sel-warn").textContent = "! " + (e.message || "Could not start.");
      return;
    }
    begin.disabled = false;
    runId = data.id;
    lineFailed = false;
    state.lines = data.lines;              // the server's sequence, not ours
    state.reps = data.reps;
    state.idx = 0; state.typed = 0; state.mistakes = 0; state.correct = 0; state.done = false;
    state.startedAt = Date.now();
    $("p-total").textContent = String(state.reps).padStart(2, "0");
    show("play"); startPassage();
  }

  // Report one finished line. The server checks it against the line it expects
  // and increments its own count; a rejection means the run will not log.
  async function reportLine(index, text, mistakes) {
    if (!runId) return;
    try {
      const res = await fetch("/api/writing/line", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: runId, index, text, mistakes }),
      });
      if (!res.ok) lineFailed = true;
    } catch (e) { lineFailed = true; }
  }
  function current() { return state.lines[state.idx % state.lines.length]; }
  let lineMistakesAt = 0;      // state.mistakes when the current line began
  function startPassage() {
    state.typed = 0;
    lineMistakesAt = state.mistakes;
    $("p-rep").textContent = String(state.idx + 1).padStart(2, "0");
    $("p-err").textContent = String(state.mistakes).padStart(2, "0");
    renderTarget();
  }
  function renderTarget() {
    const text = current();
    const el = $("target");
    const done = text.slice(0, state.typed);
    const cur = text.slice(state.typed, state.typed + 1);
    const rest = text.slice(state.typed + 1);
    el.innerHTML = '<span class="dim">' + escapeHtml(done) + '</span>' +
      '<span class="cur">' + escapeHtml(cur || " ") + "</span>" + escapeHtml(rest);
    // progress through the line
    const frac = state.typed / text.length;
    const width = 20, filled = Math.round(frac * width);
    $("p-barfill").textContent = "█".repeat(filled) + "░".repeat(width - filled);
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  document.addEventListener("keydown", (e) => {
    if (!$("play").classList.contains("on") || state.done) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Backspace") { e.preventDefault(); return; }   // no going back
    let key = e.key;
    if (key === "Enter") key = "\n";
    if (key.length !== 1 && key !== "\n") return;
    e.preventDefault();
    startAmbience();
    const text = current();
    if (key === text[state.typed]) {
      state.typed++; state.correct++; keyClick(false);
      if (state.typed >= text.length) { finishPassage(); return; }
      renderTarget();
    } else {
      // a slip restarts the current line
      state.mistakes++; keyClick(true);
      $("p-err").textContent = String(state.mistakes).padStart(2, "0");
      state.typed = 0;
      renderTarget();
    }
  });

  function advancePassage() {
    state.idx++;
    if (state.idx >= state.reps) { finishSession(); return; }
    startPassage();
  }
  // Report the line to the server BEFORE moving on, so the server's count is
  // always up to date by the time the last line triggers /complete.
  async function finishPassage() {
    await reportLine(state.idx, current(), state.mistakes - lineMistakesAt);
    advancePassage();
  }

  // Admin console hook (`pray skip_stage`): drop the current line but still count
  // it as progress. The SERVER does the counting (and re-checks isAdmin), so a
  // skipped line is real progress rather than a client-side fiction.
  window.__skipStage = async function () {
    if (!$("play").classList.contains("on") || state.done) return false;
    try {
      const r = await fetch("/api/writing/skip", { method: "POST" });
      if (!r.ok) { lineFailed = true; return false; }
    } catch (e) { lineFailed = true; return false; }
    advancePassage();
    return true;
  };

  function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function finishSession() {
    state.done = true;
    const elapsed = Date.now() - state.startedAt;
    $("r-lines").textContent = state.reps; $("r-total").textContent = state.reps;
    $("r-err").textContent = state.mistakes;
    $("r-time").textContent = fmtTime(elapsed);
    const acc = state.correct + state.mistakes > 0 ? Math.round(state.correct / (state.correct + state.mistakes) * 100) : 100;
    $("r-acc").textContent = acc + "%";
    // transcript lists each unique line once with how many times it was typed
    const counts = new Map();
    for (let i = 0; i < state.reps; i++) { const l = state.lines[i % state.lines.length]; counts.set(l, (counts.get(l) || 0) + 1); }
    const tr = $("r-transcript"); tr.innerHTML = "";
    counts.forEach((c, l) => {
      const d = document.createElement("div");
      d.innerHTML = '"' + escapeHtml(l) + '"  <span class="n">× ' + c + "</span>";
      tr.appendChild(d);
    });
    show("done");
    // Log the finished series. The server derives every number from the run it
    // owns (lines, count, mistakes, elapsed), so there is nothing to send and
    // nothing to forge — it refuses if its own count says the run is unfinished.
    fetch("/api/writing/complete", { method: "POST" })
      .then((r) => {
        $("r-log").textContent = r.ok
          ? "> logged to her record"
          : (lineFailed ? "> not logged: the run could not be verified" : "> not logged");
      })
      .catch(() => { $("r-log").textContent = "> not logged"; });
  }

  $("again").addEventListener("click", () => { show("select"); refreshBegin(); });

  // no pasting; it would defeat the exercise
  ["paste", "drop"].forEach((evt) => document.addEventListener(evt, (e) => {
    if ($("play").classList.contains("on")) e.preventDefault();
  }));

  // Back button: from the play/results screen it returns to the selection screen;
  // from selection (or boot) it goes to the games wall (where it was opened from).
  window.__navBack = function () {
    const atStart = $("select").classList.contains("on") || $("boot").classList.contains("on");
    if (atStart) { window.location.href = "/games"; return true; }
    state.done = true;
    show("select");
    refreshBegin();
    return true;
  };

  runBoot();
</script>
  <!-- nav.js gates the back button on siteMe(), so me.js has to come with it -->
  <script src="/me.js"></script>
  <script src="/nav.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
  <script src="/dashglitch.js" defer></script>
  <script src="/glitchboot.js" defer></script>
</body>
</html>
