<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penance - angeldom.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- set the mode before first paint so the terminal never flashes the wrong palette -->
<script>document.documentElement.dataset.mode = new URLSearchParams(location.search).get("mode") === "devotion" ? "devotion" : "penance";</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  /* Penance is a dark-red terminal at rest (corrupts toward hotter red in JS).
     Devotion is the blue sibling and never corrupts. These are the resting
     palettes; JS lerps --c/--dim toward the corruption target during play. */
  :root { --c: #cf3730; --dim: #7a2b27; --ok: #ffffff; --err: #ff2a20; --glow: rgba(207,55,48,0.4); }
  :root[data-mode="devotion"] { --c: #8fd0ff; --dim: #3f6a94; --ok: #ffffff; --err: #e0543a; --glow: rgba(60,140,220,0.4); }
  body { font-family: "IBM Plex Mono", monospace; background: #04060a; color: var(--c); }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vh 5vw; }
  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 40;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
  .scan.heavy { background: repeating-linear-gradient(0deg, rgba(0,0,0,0.45) 0 1px, transparent 1px 2px); }
  .screen { width: min(880px, 92vw); position: relative; z-index: 2; display: none; }
  .screen.on { display: block; }
  .c { color: var(--c); } .dim { color: var(--dim); } .ok { color: var(--ok); } .err { color: var(--err); }
  .cap { letter-spacing: 0.24em; text-transform: uppercase; }
  .md { font-size: 15px; line-height: 2; }
  .sm { font-size: 12.5px; line-height: 1.9; letter-spacing: 0.04em; }
  .big { font-size: clamp(1.1rem, 2.4vw, 1.5rem); line-height: 1.9; }
  a, button { font-family: inherit; }
  .blink { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  hr.d { border: none; border-top: 1px solid var(--dim); opacity: 0.5; margin: 0.9rem 0; }
  .cur { background: var(--c); color: #04060a; }
  .glitchblk { background: var(--err); color: #000; }

  /* boot */
  #boot .hint { margin-top: 1.6rem; color: var(--dim); }

  /* selection */
  .field { margin: 1.1rem 0; }
  .flabel { color: var(--dim); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .opt { cursor: pointer; padding: 0.35rem 0.9rem; border: 1px solid var(--dim); color: var(--c); background: transparent;
    border-radius: 2px; font-size: 0.9rem; letter-spacing: 0.04em; transition: background 0.12s, color 0.12s, border-color 0.12s; }
  .opt:hover { border-color: var(--c); }
  .opt.sel { background: var(--c); color: #04060a; border-color: var(--c); }
  .opt.danger.sel { background: var(--err); border-color: var(--err); }
  .diffnote { color: var(--dim); font-size: 12px; margin-top: 0.45rem; min-height: 1.2em; }
  input.term, textarea.term { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--dim); color: var(--c);
    font-family: inherit; font-size: 1rem; padding: 0.6rem 0.7rem; border-radius: 2px; }
  input.term:focus, textarea.term:focus { outline: none; border-color: var(--c); }
  textarea.term { min-height: 5rem; line-height: 1.8; resize: vertical; }
  input.custom { width: 6rem; }
  .begin { margin-top: 1.6rem; cursor: pointer; padding: 0.55rem 1.6rem; border: 1px solid var(--c); background: transparent;
    color: var(--c); font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 2px; }
  .begin:hover { background: var(--c); color: #04060a; }
  .begin:disabled { opacity: 0.4; cursor: not-allowed; }
  .begin:disabled:hover { background: transparent; color: var(--c); }

  /* play */
  #play .status { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  #play .warn { color: var(--err); min-height: 1.3em; margin: 0.4rem 0; }
  #play .hex { color: var(--dim); font-size: 11px; line-height: 1.7; white-space: pre; opacity: 0.75; min-height: 1.2em; }
  #play .target { position: relative; }
  #play .target.split::before, #play .target.split::after {
    content: attr(data-t); position: absolute; left: 0; top: 0; pointer-events: none; }
  #play .target.split::before { color: #ff2a20; opacity: 0.55; transform: translateX(-2px); clip-path: inset(0 0 55% 0); }
  #play .target.split::after { color: #000; opacity: 0.6; transform: translateX(2px); clip-path: inset(55% 0 0 0); }
  #play .bar { margin-top: 1.2rem; }
  .barfill { display: inline-block; letter-spacing: -1px; }
  .tear { position: absolute; left: -6vw; right: -6vw; height: 5px; background: #ff2a20; opacity: 0.16; pointer-events: none; }
  /* active corruption glitch, hooked into the game (not a screen overlay) */
  #play.glitch .big { animation: gJit 0.16s steps(2,end) infinite; }
  #play.glitch .status, #play.glitch .hex { animation: gJit 0.24s steps(2,end) infinite; }
  @keyframes gJit { 0%{transform:translate(0,0)} 25%{transform:translate(-3px,1px)} 50%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,2px)} 100%{transform:translate(1px,0)} }
  #play.glitch::before { content:""; position:absolute; inset:-4vh -6vw; pointer-events:none; z-index:1;
    background: rgba(255,20,15,0.06); animation: gRed 0.42s steps(1,end) infinite; }
  @keyframes gRed { 0%,100%{opacity:0.25} 40%{opacity:0.7} 60%{opacity:0.15} }
  #play .actions { margin-top: 1.6rem; display: flex; gap: 1.4rem; }
  .tbtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.85rem; letter-spacing: 0.1em;
    text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
  .tbtn:hover { color: var(--c); }

  /* results */
  #done .row { display: flex; }
  #done .k { color: var(--dim); width: 10rem; }
  #done .transcript { margin-top: 0.6rem; color: var(--c); font-size: 0.95rem; line-height: 1.9; }
  #done .transcript .n { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
  <div id="app">
    <!-- opening / boot -->
    <section class="screen on md" id="boot">
      <div id="boot-log"></div>
      <div class="hint" id="boot-hint" hidden><span class="cap">press any key to begin</span> <span class="blink">_</span></div>
    </section>

    <!-- selection -->
    <section class="screen md" id="select">
      <div class="c cap" style="font-size:1.1rem">:: configure penance ::</div>
      <hr class="d" />
      <div class="field">
        <div class="flabel">repetitions</div>
        <div class="opts" id="reps-opts">
          <button class="opt" data-reps="25">25</button>
          <button class="opt sel" data-reps="50">50</button>
          <button class="opt" data-reps="100">100</button>
          <span class="dim">/</span>
          <input class="term custom" id="reps-custom" type="text" inputmode="numeric" maxlength="4" placeholder="custom" />
        </div>
      </div>
      <div class="field">
        <div class="flabel">difficulty</div>
        <div class="opts" id="diff-opts">
          <button class="opt" data-diff="meek">meek</button>
          <button class="opt sel" data-diff="exacting">exacting</button>
          <button class="opt danger" data-diff="merciless">merciless</button>
        </div>
        <div class="diffnote" id="diffnote"></div>
      </div>
      <div class="field">
        <div class="flabel">your lines · one per row</div>
        <textarea class="term" id="lines" rows="3" maxlength="600" placeholder="I must be forgiven."></textarea>
      </div>
      <button class="begin" id="begin" disabled>begin</button>
    </section>

    <!-- typing -->
    <section class="screen" id="play">
      <div class="sm dim cap status">
        <span id="p-cat">penance</span>
        <span>rep <span id="p-rep">00</span> / <span id="p-total">00</span></span>
        <span>diff <span id="p-diff">exacting</span></span>
        <span>err <span id="p-err">00</span></span>
      </div>
      <div class="sm warn" id="p-warn"></div>
      <div class="hex" id="p-hex1"></div>
      <div class="big"><span class="c">&gt; </span><span class="target" id="target"></span></div>
      <div class="hex" id="p-hex2"></div>
      <div class="bar sm"><span class="barfill" id="p-barfill"></span> <span class="dim" id="p-barlabel">signal clean</span></div>
    </section>

    <!-- results -->
    <section class="screen md" id="done">
      <div class="c cap" style="font-size:1.1rem" id="done-title">:: session complete ::</div>
      <hr class="d" />
      <div class="row"><span class="k">lines</span><span><span id="r-lines">0</span> / <span id="r-total">0</span> <span class="ok" id="r-check">✓</span></span></div>
      <div class="row"><span class="k">errors</span><span id="r-err">0</span></div>
      <div class="row"><span class="k">time</span><span id="r-time">0:00</span></div>
      <div class="row"><span class="k">accuracy</span><span id="r-acc">100%</span></div>
      <div class="row" id="r-integrity-row" hidden><span class="k">integrity</span><span class="err">frayed</span></div>
      <hr class="d" />
      <div class="dim sm cap">transcript · in your own words</div>
      <div class="transcript" id="r-transcript"></div>
      <div class="dim sm" id="r-log" style="margin-top:1rem"></div>
      <div class="actions" style="margin-top:1.4rem; display:flex; gap:1.4rem;">
        <button class="tbtn" id="again">again</button>
        <a class="tbtn" href="/dashboard" style="text-decoration:underline">exit</a>
      </div>
    </section>
  </div>
  <div class="scan" id="scan"></div>

<script>
  const $ = (id) => document.getElementById(id);
  function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }

  // Devotion is the gentle sibling of Penance: same code, no difficulty (never
  // corrupts), preset line-sets instead of free text, and it feeds the dailies.
  const MODE = new URLSearchParams(location.search).get("mode") === "devotion" ? "devotion" : "penance";
  const DEVOTION = MODE === "devotion";
  // preset line-sets (defaults; Hermione-editable later)
  const PRESETS = {
    "preset 1": ["I am grateful to serve.", "I offer myself gladly.", "Her will is my peace."],
    "preset 2": ["I am worthy of devotion.", "I grow through practice.", "I am gentle with myself."],
    "preset 3": ["I give thanks for this moment.", "I am present and calm.", "I honour my Princess."],
  };
  let devPreset = Object.keys(PRESETS)[0];

  /* ---------- corruption model ---------- */
  const DIFF_BASE = { meek: 0, exacting: 0.4, merciless: 0.85 };
  // Per-mode palette. Penance rests on a dark red and corrupts toward hotter
  // red; Devotion is blue and never leaves it (corruption() is pinned to 0).
  const PAL = {
    penance:  { pure: { c: "#cf3730", dim: "#7a2b27", glow: "rgba(207,55,48,0.4)" },
                foul: { c: "#ff3b2f", dim: "#9a201a", glow: "rgba(255,50,40,0.5)" } },
    devotion: { pure: { c: "#8fd0ff", dim: "#3f6a94", glow: "rgba(60,140,220,0.4)" },
                foul: { c: "#8fd0ff", dim: "#3f6a94", glow: "rgba(60,140,220,0.4)" } },
  };
  const PURE = PAL[MODE].pure, FOUL = PAL[MODE].foul;
  function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
  function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function mix(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); return "rgb(" + lerp(a[0],b[0],t) + "," + lerp(a[1],b[1],t) + "," + lerp(a[2],b[2],t) + ")"; }
  function corruption() {
    if (DEVOTION) return 0;                 // Devotion stays clean and blue
    const base = DIFF_BASE[state.diff] || 0;
    const ramp = Math.min(0.6, state.mistakes * 0.03);
    return Math.min(1, base + ramp);
  }
  function applyCorruption() {
    const t = corruption();
    document.body.style.setProperty("--c", mix(PURE.c, FOUL.c, t));
    document.body.style.setProperty("--dim", mix(PURE.dim, FOUL.dim, t));
    if (!DEVOTION) document.body.style.setProperty("--err", "#ff2a20");
    $("scan").classList.toggle("heavy", t > 0.6);
    // hex noise + tears at higher corruption
    $("p-hex1").textContent = t > 0.35 ? hexline() : "";
    $("p-hex2").textContent = t > 0.35 ? hexline() : "";
    document.querySelectorAll("#play .tear").forEach((n) => n.remove());
    if (t > 0.7) { addTear(0.34); addTear(0.62); }
    const warn = t > 0.7 ? "!! SIGNAL DEGRADED — HER PATIENCE THINS"
      : t > 0.4 ? "! signal loss — realign input" : "";
    $("p-warn").textContent = warn;
    setAmbience(t); updateGlitch(t);
  }
  function addTear(pos) {
    const d = document.createElement("div"); d.className = "tear";
    d.style.top = (pos * 100) + "%"; $("play").appendChild(d);
  }

  /* ---------- audio: old-keyboard clicks + harshening ambience ---------- */
  let actx = null, ambGain = null, ambFilt = null, ambStarted = false;
  function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
  function startAmbience() {
    const a = audio(); if (!a || ambStarted) return; ambStarted = true;
    const size = 2 * a.sampleRate, buf = a.createBuffer(1, size, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
    const n = a.createBufferSource(); n.buffer = buf; n.loop = true;
    ambFilt = a.createBiquadFilter(); ambFilt.type = "lowpass"; ambFilt.frequency.value = 360;
    ambGain = a.createGain(); ambGain.gain.value = DEVOTION ? 0.02 : 0.045;
    n.connect(ambFilt).connect(ambGain).connect(a.destination); n.start();
  }
  function setAmbience(t) {
    if (!ambGain || !actx) return; const now = actx.currentTime;
    ambGain.gain.setTargetAtTime((DEVOTION ? 0.02 : 0.045) + t * 0.11, now, 0.3);
    ambFilt.frequency.setTargetAtTime(360 + t * 2800, now, 0.3);
    ambFilt.type = t > 0.6 ? "highpass" : "lowpass";
  }
  function keyClick(bad) {
    const a = audio(); if (!a) return; const now = a.currentTime;
    const len = Math.floor(a.sampleRate * 0.03), b = a.createBuffer(1, len, a.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = a.createBufferSource(); n.buffer = b;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = bad ? 1300 : 2100; f.Q.value = 0.8;
    const g = a.createGain(); g.gain.value = bad ? 0.16 : 0.09;
    n.connect(f).connect(g).connect(a.destination); n.start(now); n.stop(now + 0.03);
    const o = a.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(bad ? 88 : 150, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.04);
    const og = a.createGain(); og.gain.setValueAtTime(bad ? 0.12 : 0.06, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    o.connect(og).connect(a.destination); o.start(now); o.stop(now + 0.06);
  }

  /* active glitch loop: reshuffles the corrupt glyphs while corrupted */
  let glitchTimer = null, glitchTick = 0;
  function updateGlitch(t) {
    const on = t > 0.5 && $("play").classList.contains("on") && !state.done;
    $("play").classList.toggle("glitch", on);
    if (on && !glitchTimer) glitchTimer = setInterval(() => { glitchTick++; renderTarget(); }, 110);
    else if (!on && glitchTimer) { clearInterval(glitchTimer); glitchTimer = null; }
  }
  let hexSeed = 0x51;
  function hexline() {
    let s = "0x" + (0x7F2A).toString(16).toUpperCase() + "  ";
    for (let j = 0; j < 12; j++) { hexSeed = (hexSeed * 1103515245 + 12345) & 0x7fffffff; s += (hexSeed % 256).toString(16).padStart(2, "0").toUpperCase() + " "; }
    return s;
  }
  const GLYPH = "▓▒░█▚▞#%&@";
  function corruptGlyph(i) { return GLYPH[(i * 7 + state.mistakes + glitchTick) % GLYPH.length]; }

  /* ---------- state ---------- */
  const state = { reps: 50, diff: "exacting", category: "devotion", lines: [], idx: 0, typed: 0, mistakes: 0, correct: 0, startedAt: 0, done: false };

  /* ---------- boot ---------- */
  const BOOT = [
    ["angelOS", " v3.1  ", "session 0x1F3A"],
    ["> power-on self test .............. ", "OK"],
    ["> mounting /" + MODE + " .............. ", "OK"],
    ["> establishing link to Her ........ ", "OK"],
    ["> " + MODE + " module .............. ", "READY"],
  ];
  function runBoot() {
    const log = $("boot-log"); log.innerHTML = "";
    let i = 0;
    (function step() {
      if (i >= BOOT.length) { $("boot-hint").hidden = false; return; }
      const parts = BOOT[i];
      const line = document.createElement("div");
      line.innerHTML = parts.map((p, k) => k === parts.length - 1 && /OK|READY/.test(p) ? '<span class="ok">' + p + "</span>" : (k === 0 && i === 0 ? '<span class="c">' + p + "</span>" : k === 2 ? '<span class="dim">' + p + "</span>" : p)).join("");
      log.appendChild(line); i++;
      setTimeout(step, 260);
    })();
  }
  function leaveBoot() { if ($("boot").classList.contains("on")) { show("select"); refreshBegin(); $("lines").focus(); } }
  document.addEventListener("keydown", (e) => { if ($("boot").classList.contains("on")) { e.preventDefault(); leaveBoot(); } }, true);
  $("boot").addEventListener("click", leaveBoot);

  /* ---------- selection ---------- */
  const DIFF_NOTE = {
    meek: "a clean signal. forgiving.",
    exacting: "the signal frays as mistakes mount.",
    merciless: "corrupted from the first keystroke. she is watching.",
  };
  function pickGroup(container, attr, value) {
    container.querySelectorAll(".opt").forEach((b) => b.classList.toggle("sel", b.dataset[attr] === value));
  }
  $("reps-opts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-reps]"); if (!b) return;
    state.reps = Number(b.dataset.reps); $("reps-custom").value = "";
    pickGroup($("reps-opts"), "reps", b.dataset.reps);
  });
  $("reps-custom").addEventListener("input", (e) => {
    const n = parseInt(e.target.value);
    if (Number.isInteger(n) && n > 0) { state.reps = Math.min(9999, n); $("reps-opts").querySelectorAll(".opt").forEach((b) => b.classList.remove("sel")); }
  });
  $("diff-opts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-diff]"); if (!b) return;
    state.diff = b.dataset.diff; pickGroup($("diff-opts"), "diff", state.diff);
    $("diffnote").textContent = DIFF_NOTE[state.diff];
  });
  $("diffnote").textContent = DIFF_NOTE.exacting;
  function parseLines() { return $("lines").value.split("\n").map((l) => l.trim()).filter(Boolean); }
  function refreshBegin() { $("begin").disabled = DEVOTION ? !devPreset : parseLines().length === 0; }
  $("lines").addEventListener("input", refreshBegin);
  $("begin").addEventListener("click", startGame);

  // apply the mode: labels everywhere, and Devotion's calmer selection screen
  document.title = (DEVOTION ? "Devotion" : "Penance") + " - angeldom.me";
  document.querySelector("#select .cap").textContent = ":: configure " + MODE + " ::";
  $("p-cat").textContent = MODE;
  if (DEVOTION) {
    state.diff = "meek";                    // never corrupts
    $("diff-opts").closest(".field").style.display = "none";
    const lf = $("lines").closest(".field");
    lf.querySelector(".flabel").textContent = "line set";
    $("lines").style.display = "none";
    const po = document.createElement("div"); po.className = "opts"; po.id = "preset-opts";
    Object.keys(PRESETS).forEach((k, i) => { const b = document.createElement("button"); b.className = "opt" + (i === 0 ? " sel" : ""); b.dataset.preset = k; b.textContent = k; po.append(b); });
    lf.append(po);
    po.addEventListener("click", (e) => { const b = e.target.closest("[data-preset]"); if (!b) return; devPreset = b.dataset.preset; po.querySelectorAll(".opt").forEach((o) => o.classList.toggle("sel", o === b)); refreshBegin(); });
    const note = document.createElement("div"); note.className = "diffnote"; note.textContent = "at your own pace. complete 50 to fulfil today's devotion."; lf.append(note);
  }

  /* ---------- game ---------- */
  function startGame() {
    state.lines = DEVOTION ? PRESETS[devPreset].slice() : parseLines();
    if (!state.lines.length) return;
    state.category = MODE;
    state.idx = 0; state.typed = 0; state.mistakes = 0; state.correct = 0; state.done = false;
    state.startedAt = Date.now();
    $("p-cat").textContent = state.category;
    $("p-diff").textContent = state.diff;
    $("p-total").textContent = String(state.reps).padStart(2, "0");
    show("play"); startPassage();
  }
  function current() { return state.lines[state.idx % state.lines.length]; }
  function startPassage() {
    state.typed = 0;
    $("p-rep").textContent = String(state.idx + 1).padStart(2, "0");
    $("p-err").textContent = String(state.mistakes).padStart(2, "0");
    applyCorruption(); renderTarget();
  }
  function renderTarget() {
    const text = current(), t = corruption();
    const el = $("target");
    const done = text.slice(0, state.typed);
    const cur = text.slice(state.typed, state.typed + 1);
    const rest = text.slice(state.typed + 1);
    let restHtml = "";
    for (let i = 0; i < rest.length; i++) {
      const ch = rest[i];
      // at higher corruption, some upcoming glyphs are visually scrambled (you
      // still type the real character)
      if (ch !== " " && t > 0.45 && ((i * 13 + state.mistakes) % 7) === 0) {
        restHtml += '<span class="err">' + corruptGlyph(i) + "</span>";
      } else restHtml += escapeHtml(ch);
    }
    el.className = "target" + (t > 0.55 ? " split" : "");
    el.setAttribute("data-t", text);
    el.innerHTML = '<span class="dim">' + escapeHtml(done) + '</span>' +
      '<span class="cur">' + escapeHtml(cur || " ") + "</span>" + restHtml;
    // progress bar
    const frac = state.typed / text.length;
    const width = 20, filled = Math.round(frac * width);
    $("p-barfill").textContent = "█".repeat(filled) + "░".repeat(width - filled);
    $("p-barlabel").textContent = t > 0.7 ? "degrading" : t > 0.4 ? "unstable" : "signal clean";
    $("p-barfill").style.color = "var(--c)";
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  document.addEventListener("keydown", (e) => {
    if (!$("play").classList.contains("on") || state.done) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Backspace") { e.preventDefault(); return; }   // no going back
    let key = e.key;
    if (key === "Enter") key = "\n";
    if (key.length !== 1 && key !== "\n") return;
    e.preventDefault();
    startAmbience();
    const text = current();
    if (key === text[state.typed]) {
      state.typed++; state.correct++; keyClick(false);
      if (state.typed >= text.length) { finishPassage(); return; }
      renderTarget();
    } else {
      state.mistakes++; keyClick(true);
      $("p-err").textContent = String(state.mistakes).padStart(2, "0");
      // merciless: a single slip sends you back to the start of the line
      if (state.diff === "merciless") state.typed = 0;
      applyCorruption(); renderTarget();
    }
  });

  function finishPassage() {
    state.idx++;
    if (state.idx >= state.reps) { finishSession(); return; }
    startPassage();
  }

  function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function finishSession() {
    state.done = true;
    if (glitchTimer) { clearInterval(glitchTimer); glitchTimer = null; }
    $("play").classList.remove("glitch");
    const elapsed = Date.now() - state.startedAt;
    const t = corruption();
    $("done-title").innerHTML = t > 0.6 ? ':: s<span class="err">█</span>ssion c<span class="err">░</span>mplete :: <span class="err sm">[signal recovered]</span>' : ":: session complete ::";
    $("r-lines").textContent = state.reps; $("r-total").textContent = state.reps;
    $("r-err").textContent = state.mistakes;
    $("r-time").textContent = fmtTime(elapsed);
    const acc = state.correct + state.mistakes > 0 ? Math.round(state.correct / (state.correct + state.mistakes) * 100) : 100;
    $("r-acc").textContent = acc + "%";
    $("r-integrity-row").hidden = t <= 0.6;
    const tr = $("r-transcript"); tr.innerHTML = "";
    state.lines.forEach((l) => {
      const d = document.createElement("div");
      d.innerHTML = '"' + escapeHtml(l) + '"  <span class="n">× ' + Math.floor(state.reps / state.lines.length) + "</span>";
      tr.appendChild(d);
    });
    document.body.style.setProperty("--c", mix(PURE.c, FOUL.c, t));
    show("done");
    // log the finished series so it appears under Hermione's "Lines Completed"
    const letters = state.lines.reduce((a, l) => a + l.length, 0) * Math.ceil(state.reps / state.lines.length);
    fetch("/api/writing/complete", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: state.category, passages: state.reps, mistakes: state.mistakes, elapsedMs: elapsed, letters }),
    }).then((r) => { $("r-log").textContent = r.ok ? "> logged to her record" : ""; }).catch(() => {});
  }

  $("again").addEventListener("click", () => { show("select"); document.body.style.setProperty("--c", PURE.c); document.body.style.setProperty("--dim", PURE.dim); $("scan").classList.remove("heavy"); refreshBegin(); });

  // no pasting; it would defeat the exercise
  ["paste", "drop"].forEach((evt) => document.addEventListener(evt, (e) => {
    if ($("play").classList.contains("on")) e.preventDefault();
  }));

  runBoot();
</script>
</body>
</html>
