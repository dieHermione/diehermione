<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deathroll - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cause:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/me.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    /* Deathroll — Blood Ritual skin (dark-red terminal). Self-contained; the
       shared shell (nav back button, notifications) still layers on top. */
    :root { --c:#cf3730; --br:#ff3b2f; --dim:#7a2b27; --dim2:#4a1a17; --bg:#060102; --glow:rgba(255,50,40,0.42); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100vh; }
    body { margin: 0; padding: 6vh 4vw; min-height: 100vh; background:
        repeating-linear-gradient(0deg, rgba(207,55,48,0.05) 0 1px, transparent 1px 4px),
        #000 fixed;
      color: var(--c); font-family: "IBM Plex Mono", monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.34) 0 1px, transparent 1px 3px); }
    .site-header { display: none; }

    .dr-grid { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 3vw; width: min(1500px, 96vw); z-index: 2; }

    .dr-grid > .card:not(.player-card) { grid-column: 2; z-index: 2; background: transparent; box-shadow: none; text-align: center; padding: 0; }
    .player-card { grid-column: auto; width: 26vw; max-width: 340px; border: 1.5px solid var(--dim); background: rgba(30,6,5,0.5);
      padding: 2rem 1.6rem; text-align: center; position: relative; z-index: 2; }
    .player-card.me { grid-column: 1; justify-self: end; border-color: var(--br); box-shadow: 0 0 30px rgba(255,50,40,0.28); }
    .player-card.them { grid-column: 3; justify-self: start; }
    .player-card .role { font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }
    .player-card .avatar, .player-card .avatar-fallback { width: 7vw; height: 7vw; max-width: 96px; max-height: 96px; margin: 0 auto 1rem; border-radius: 50%;
      border: 2px solid var(--dim); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: var(--c); background: rgba(0,0,0,0.3); }
    .player-card .avatar { object-fit: cover; }
    .player-card .name { font-size: clamp(1.2rem, 2.2vw, 1.8rem); color: var(--br); text-shadow: 0 0 18px var(--glow); letter-spacing: 0.04em; }
    .player-card .badge { display: inline-block; margin-top: 0.6rem; font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--dim); padding: 0.2rem 0.7rem; color: var(--c); }
    .player-card .badge.princess { border-color: var(--br); color: var(--br); }
    .player-card .stat { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.9rem; font-size: 0.9rem; }
    .player-card .stat .k { color: var(--dim); text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.1em; align-self: center; }
    .player-card .stat .v { color: var(--c); }

    .picker { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-bottom: 1.4rem; }
    .picker select, .picker input { background: rgba(0,0,0,0.35); border: 1px solid var(--dim); color: var(--c); font-family: inherit; padding: 0.5rem 0.7rem; }
    .picker select:focus, .picker input:focus { outline: none; border-color: var(--br); }

    .status { color: var(--c); letter-spacing: 0.08em; min-height: 1.4em; margin: 0 0 0.6rem; }

    .die { position: relative; }
    .die .cap { display: block; font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); }
    .die .value { display: block; font-weight: 800; line-height: 0.9; font-size: clamp(4rem, 13vw, 11rem); color: var(--br);
      text-shadow: 0 0 30px var(--glow); font-variant-numeric: tabular-nums; margin: 0.3rem 0; }
    .die.rolling .value { animation: drShake 0.14s steps(2) infinite; }
    @keyframes drShake { 0%{transform:translate(0,0)} 50%{transform:translate(-3px,2px)} 100%{transform:translate(2px,-2px)} }
    .die.dead .value { color: #6e2420; text-shadow: none; }

    .actions { margin-top: 1.6rem; }
    .pill { font-family: inherit; cursor: pointer; font-size: 1rem; letter-spacing: 0.22em; text-transform: uppercase;
      padding: 0.8rem 2.4rem; border: 1.5px solid var(--br); background: transparent; color: var(--br); box-shadow: 0 0 20px rgba(255,50,40,0.25); }
    .pill:hover { background: var(--br); color: var(--bg); }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .picker .pill { padding: 0.5rem 1.2rem; font-size: 0.85rem; letter-spacing: 0.1em; }

    .log { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; margin-top: 1.8rem; }
    .log-empty { color: var(--dim); }
    .log-row { font-size: 0.82rem; padding: 0.25rem 0.7rem; border: 1px solid var(--dim); color: var(--c); letter-spacing: 0.04em; }
    .log-row .who { color: var(--br); }
    .log-row.status, .log-row .status { color: var(--br); }

    @media (max-width: 820px) {
      .dr-grid { grid-template-columns: 1fr; }
      .player-card { width: 100%; max-width: 420px; }
      .player-card.me { grid-column: 1; justify-self: center; }
      .player-card.them { grid-column: 1; justify-self: center; }
      .dr-grid > .card:not(.player-card) { grid-column: 1; }
    }
  </style>
  <script src="/audio.js"></script>
</head>
<body class="has-top-nav">
  <div class="dr-grid">
    <aside class="card player-card me" id="card-me" hidden></aside>
    <main class="card">
    <div class="picker" id="admin-picker" hidden>
      <select id="opponent"></select>
      <input type="number" id="sides" min="2" max="1000000" placeholder="e.g. 500" />
      <button class="pill" id="start" type="button">New roll</button>
    </div>

    <p class="status" id="status">Loading…</p>

    <div class="die" id="die">
      <span class="cap" id="die-cap">rolling</span>
      <span class="value" id="die-value">-</span>
    </div>

    <div class="log" id="log"></div>

    <div class="actions">
      <button class="pill" id="roll" type="button" disabled>Roll</button>
    </div>
    </main>
    <aside class="card player-card them" id="card-them" hidden></aside>
  </div>

  <script>


    let isAdmin = false;
    let opponent = null;   // admin only: whose game is on screen
    let game = null;
    let rolling = false;

    const statusEl = document.getElementById("status");
    const dieEl = document.getElementById("die");
    const dieCap = document.getElementById("die-cap");
    const dieValue = document.getElementById("die-value");
    const rollBtn = document.getElementById("roll");
    const logEl = document.getElementById("log");

    function renderLog() {
      logEl.replaceChildren();
      if (!game || !game.history.length) {
        const empty = document.createElement("p");
        empty.className = "log-empty";
        empty.textContent = "No rolls yet.";
        logEl.append(empty);
        return;
      }
      // newest at the top
      [...game.history].reverse().forEach((h) => {
        const row = document.createElement("div");
        row.className = "log-row " + h.by + (h.result === 1 ? " fatal" : "");
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = h.by === "hermione" ? "Hermione" : (game.opponent || "You");
        const roll = document.createElement("span");
        roll.className = "roll";
        roll.textContent = "d" + h.sides + " → " + h.result ;
        row.append(who, roll);
        logEl.append(row);
      });
      logEl.scrollTop = 0;
    }

    function render() {
      if (!game) {
        statusEl.textContent = isAdmin
          ? "Pick someone and a number to start."
          : "Hermione hasn't started a roll with you yet.";
        statusEl.className = "status";
        dieCap.textContent = "waiting";
        dieValue.textContent = "-";
        dieEl.classList.remove("dead");
        rollBtn.disabled = true;
        renderLog();
        return;
      }

      dieCap.textContent = game.over ? "final roll" : "roll 1d";
      dieValue.textContent = game.over
        ? (game.history.length ? game.history[game.history.length - 1].result : game.sides)
        : game.sides;
      dieEl.classList.toggle("dead", game.over);

      if (game.over) {
        const iLost = (isAdmin && game.loser === "hermione") || (!isAdmin && game.loser === "player");
        const loserName = game.loser === "hermione" ? "Hermione" : game.opponent;
        statusEl.textContent = iLost
          ? "You rolled a 1. You lose."
          : loserName + " rolled a 1, you win!";
        statusEl.className = "status " + (iLost ? "lost" : "won");
        rollBtn.disabled = true;
      } else if (game.yourTurn) {
        statusEl.textContent = "Your roll: 1d" + game.sides + ".";
        statusEl.className = "status";
        rollBtn.disabled = rolling;
      } else {
        statusEl.textContent = game.turn === "hermione"
          ? "Waiting on Hermione…"
          : "Waiting on " + game.opponent + "…";
        statusEl.className = "status";
        rollBtn.disabled = true;
      }
      renderLog();
    }

    async function loadGame() {
      if (isAdmin && !opponent) { game = null; render(); return; }
      const url = "/api/deathroll/game" + (isAdmin ? "?opponent=" + encodeURIComponent(opponent) : "");
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      game = data.game;
      render();
    }

    async function roll() {
      if (rolling || !game || !game.yourTurn) return;
      rolling = true;
      rollBtn.disabled = true;
      dieEl.classList.add("rolling");

      const res = await fetch("/api/deathroll/roll", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(isAdmin ? { opponent } : {}),
      });
      const data = await res.json().catch(() => ({}));

      // let the flicker run briefly so the result lands rather than blinks
      await new Promise((r) => setTimeout(r, 550));
      dieEl.classList.remove("rolling");
      rolling = false;

      if (!res.ok) {
        statusEl.textContent = data.error || "That didn't work.";
        await loadGame();
        return;
      }
      game = data.game;
      render();
    }

    // --- the two player cards flanking the board ---
    let myName = null;

    async function renderPlayerCard(el, username, role) {
      if (!username) { el.hidden = true; return; }
      const res = await fetch("/api/profile/" + encodeURIComponent(username));
      if (!res.ok) { el.hidden = true; return; }
      const p = (await res.json()).profile;

      const parts = [];
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role;
      parts.push(roleEl);

      if (p.icon) {
        const img = document.createElement("img");
        img.className = "avatar";
        img.src = p.icon;
        img.alt = p.username;
        parts.push(img);
      } else {
        const fb = document.createElement("div");
        fb.className = "avatar-fallback";
        fb.textContent = (p.username[0] || "?").toUpperCase();
        parts.push(fb);
      }

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.username;
      parts.push(name);

      if (p.rank) {
        const badge = document.createElement("span");
        badge.className = "badge" + (p.rank === "Angel" ? " princess" : "");
        badge.textContent = p.rank;
        parts.push(badge);
      }

      const stats = [["Pronouns", p.pronouns || "-"]];
      if (p.points !== null) stats.push(["Points", p.points]);   // hermione has none
      stats.forEach(([k, v]) => {
          const row = document.createElement("div");
          row.className = "stat";
          const ke = document.createElement("span"); ke.className = "k"; ke.textContent = k;
          const ve = document.createElement("span"); ve.className = "v"; ve.textContent = v;
          row.append(ke, ve);
          parts.push(row);
        });

      el.replaceChildren(...parts);
      el.hidden = false;
    }

    function refreshCards() {
      renderPlayerCard(document.getElementById("card-me"), myName, "You");
      const them = isAdmin ? opponent : "hermione";
      renderPlayerCard(document.getElementById("card-them"), them, "Opponent");
    }

    rollBtn.addEventListener("click", roll);

    document.getElementById("start").addEventListener("click", async () => {
      const sides = parseInt(document.getElementById("sides").value, 10);
      const res = await fetch("/api/deathroll/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ opponent, sides }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        statusEl.textContent = data.error || "Couldn't start that.";
        return;
      }
      game = data.game;
      render();
    });

    document.getElementById("opponent").addEventListener("change", (e) => {
      opponent = e.target.value;
      loadGame();
      refreshCards();
    });

    async function initAdminPicker() {
      const res = await fetch("/api/deathroll/games");
      if (!res.ok) return;
      const data = await res.json();
      const select = document.getElementById("opponent");
      select.replaceChildren(...data.players.map((p) => {
        const opt = document.createElement("option");
        opt.value = p.username;
        opt.textContent = p.username + (p.yourTurn ? " (your roll)" : "");
        return opt;
      }));
      if (data.players.length) {
        opponent = data.players[0].username;
        select.value = opponent;
      }
      document.getElementById("admin-picker").hidden = false;
    }

    window.siteMe()
      .then(async (d) => {
        isAdmin = Boolean(d.isAdmin);
        myName = d.username;
        if (isAdmin) await initAdminPicker();
        await loadGame();
        refreshCards();
        // the other player's roll arrives while you're sitting here
        setInterval(() => { if (!rolling) loadGame(); }, 4000);
      })
      .catch(() => (window.location.href = "/"));
  </script>
  <script src="/nav.js" defer></script>
  <script src="/notifications.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/ambience.js" defer></script>
</body>
</html>
