<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>angeldomme</title>

  <!--
    The front door. There is no form and no button: arriving IS the action.
    It claims a guest name (POST /api/guest) and goes to the dashboard; anyone
    who already has a session never sees this, because GET / redirects them.

    Reskinned 2026-10-24. This used to be a terminal boot cascade that landed
    on a vellum letter — the one seam everybody met first. It is now the same
    frame, paper and faces as the shell, and the only thing that happens is a
    line of type while the session is claimed. The boot, the scan line and the
    ambient glitch are gone with it.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell.css" />
  <style>
    .door { text-align: center; max-width: 26rem; margin: 0 auto; }
    .door .solo-brand { font-size: clamp(2.4rem, 6vw, 3.6rem); }
    .door .solo-tag { margin-bottom: 2.6rem; }
    .door .line {
      font-size: .64rem; letter-spacing: .3em; text-transform: uppercase; color: var(--faint);
      min-height: 1.4em;
    }
    /* a quiet pulse while the session is claimed — not a glitch, just a sign
       that something is happening */
    .door .line.working { animation: door-pulse 1.6s ease-in-out infinite; }
    @keyframes door-pulse { 50% { opacity: .35; } }
    .door .warn { margin-top: 1rem; }
    .door .go { margin-top: 1.4rem; }
  </style>
</head>
<body>
  <div class="page solo middle">
    <main class="panel">
      <div class="inner">
        <div class="door">
          <div class="solo-brand">angel<i>domme</i></div>
          <div class="solo-tag">angelOS</div>
          <div class="line working" id="line">opening the door</div>
          <div class="warn" id="error"></div>
          <button class="go" id="retry" type="button" hidden>Try again</button>
        </div>
      </div>
    </main>
  </div>

  <div class="veil"></div>
  <div class="frame"></div>

  <script>
    // Become a guest and go through. No button: arriving is enough.
    function enter() {
      var line = document.getElementById("line");
      var err = document.getElementById("error");
      var retry = document.getElementById("retry");
      line.textContent = "opening the door";
      line.classList.add("working");
      err.textContent = "";
      retry.hidden = true;
      fetch("/api/guest", { method: "POST" }).then(function (r) {
        if (!r.ok) throw new Error("no session");
        line.classList.remove("working");
        line.textContent = "come in";
        window.location.href = "/dashboard";
      }).catch(function () {
        line.classList.remove("working");
        line.textContent = "";
        err.textContent = "The door would not open.";
        retry.hidden = false;
      });
    }
    document.getElementById("retry").addEventListener("click", enter);
    enter();
  </script>
  <script src="/ambience.js" defer></script>
</body>
</html>
