<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>angeldomme</title>

  <!--
    The single-page shell. This is mockup 55 (mockups/singlepage.html?d=6&f=55)
    shipped: the leopard border, a side nav, and ONE panel that every section
    loads into. Nothing here is terminal-styled any more — no scan lines, no
    glitch, no monospace, no accent-colour tinting.

    This page is only the frame and the furniture. The sections live in
    /panels/*.js and register themselves with Shell; see shell.js for the
    contract. Order of registration is the order of the nav.

    Scripts, and why each one is still here:
      me.js         single-flight /api/me; must exist before shell.js boots
      audio.js      AudioBus — settings drives it, devotion's key clicks use it
      shell.js      nav, hash routing, the panel registry
      panels/*      the sections
      console.js    `pray login` is the ONLY way to the login page now
      updatecheck.js  offers a reload when a new build goes live
      ambience.js   room tone, on the ambience channel

    Gone, deliberately: dashglitch.js (effects are hidden site-wide, and this
    design has nothing to glitch), theme.js (the accent would re-tint nothing
    here; it still runs on the pages that are still terminal-styled), and
    notifications.js (the bell was terminal chrome — the admin section reports
    the count instead).
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shell.css" />
  <link rel="stylesheet" href="/panels.css" />

  <script src="/me.js"></script>
</head>
<body>
  <div class="page">
    <nav class="nav" aria-label="Sections">
      <div class="brand">angel<i>domme</i></div>
      <div class="tagline">angelOS</div>
      <ul id="nav"></ul>
      <div class="who" id="who"></div>
    </nav>
    <main class="panel"><div class="inner" id="panel"></div></main>
  </div>

  <!-- veil under the content, frame over it: the only reason the leopard is
       visible against the silver is that they sit on opposite sides of it -->
  <div class="veil"></div>
  <div class="frame"></div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;
                justify-content:center;padding:3rem;background:rgba(255,253,250,.95);
                font-family:Georgia,serif;font-size:1.1rem;line-height:1.8;text-align:center">
      This page needs JavaScript. Without it there is nothing here to read.
    </div>
  </noscript>

  <script src="/audio.js" defer></script>
  <script src="/shell.js" defer></script>
  <script src="/panels/home.js" defer></script>
  <script src="/panels/devotion.js" defer></script>
  <script src="/panels/multitap.js" defer></script>
  <script src="/panels/summary.js" defer></script>
  <script src="/panels/skillcheck.js" defer></script>
  <script src="/panels/ot12.js" defer></script>
  <script src="/panels/deathroll.js" defer></script>
  <script src="/panels/elysium.js" defer></script>
  <script src="/panels/settings.js" defer></script>
  <script src="/panels/admin.js" defer></script>
  <script src="/console.js" defer></script>
  <script src="/updatecheck.js" defer></script>
  <script src="/ambience.js" defer></script>
</body>
</html>
