<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/me.js"></script>
  <style>
    /* Cirrus: soft sky, drifting clouds, glassy cards, Quicksand. No top nav. */
    body {
      font-family: "Quicksand", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #8fd8f2 0%, #e8f6fd 72%);
      color: #22506a;
      justify-content: flex-start;
      padding: 2.5rem 1rem 3rem;
      gap: 0;
    }
    .sky-clouds { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .sky-clouds .c { position: absolute; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255,255,255,0.9), rgba(255,255,255,0) 72%); filter: blur(4px); }
    @keyframes driftL { from { transform: translateX(22vw); } to { transform: translateX(-140vw); } }
    @keyframes driftR { from { transform: translateX(-22vw); } to { transform: translateX(140vw); } }
    @media (prefers-reduced-motion: reduce) { .sky-clouds .c { animation: none !important; } }

    .dash {
      margin: 0 auto; position: relative; z-index: 2;
      display: grid; gap: 1.3rem; grid-template-columns: repeat(3, 1fr);
      grid-template-areas: "hero hero hero" "bal act act" "day day lead";
      width: min(2400px, 94vw);
    }
    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; grid-template-areas: "hero" "bal" "act" "day" "lead"; }
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 22px;
      box-shadow: 0 18px 46px rgba(80, 150, 190, 0.22);
      padding: 1.9rem 2rem;
      color: #22506a;
      text-align: left;
      min-width: 0;
    }
    .hero { grid-area: hero; padding: 2.4rem 2.5rem; position: relative; }
    .balance-card { grid-area: bal; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; }
    .dailies-card { grid-area: day; }
    .leaderboard-card { grid-area: lead; }
    .control-card { grid-area: act; }

    h2 { font-family: "Quicksand", sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--button-bg); margin-bottom: 1rem; }

    .hero .eyebrow { font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: #6aa0b8; margin-bottom: 0.5rem; }
    .hero h1 { font-family: "Quicksand", sans-serif; font-size: 2.5rem; font-weight: 700; color: #12405c; line-height: 1.06; margin-bottom: 0.5rem; }
    .hero p { color: #5e8ba3; font-size: 1rem; margin: 0; }
    .checkin-notice { margin-top: 1.1rem; background: transparent; border: 1px solid var(--button-bg); border-radius: 12px; padding: 0.6rem 0.9rem; color: #22506a; font-size: 0.9rem; font-weight: 600; }
    .checkin-notice[hidden] { display: none; }
    .editable { position: relative; display: inline-block; }
    .editable::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: 2.1rem; }
    .editable .pencil {
      position: absolute; top: 50%; right: -1.9rem; transform: translateY(-50%);
      width: 1.45rem; height: 1.45rem; padding: 0; border: none; border-radius: 50%;
      background: var(--button-bg); color: #fff; font-size: 0.72rem; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; z-index: 1;
      opacity: 0; pointer-events: none; transition: opacity 0.12s ease; box-shadow: none;
    }
    .editable:hover .pencil, .editable:focus-within .pencil { opacity: 1; pointer-events: auto; }
    .copy-editor { display: none; margin-top: 1rem; text-align: left; }
    .copy-editor.open { display: block; }
    .copy-editor label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--table-header-color); margin-bottom: 0.25rem; }
    .copy-editor input { width: 100%; padding: 0.5rem 0.65rem; margin-bottom: 0.7rem; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--input-text); font-family: inherit; font-size: 0.9rem; }
    .copy-editor input:focus { outline: none; border-color: var(--button-hover-bg); }
    .copy-editor .row { display: flex; gap: 0.5rem; }
    .copy-editor .hint { color: var(--muted-color); font-size: 0.72rem; margin: -0.4rem 0 0.7rem; }

    .bal-eyebrow { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #6aa0b8; }
    .bal-num { font-family: "Quicksand", sans-serif; font-size: 3.4rem; font-weight: 700; color: #12405c; line-height: 1; }
    .bal-num[hidden], .bal-eyebrow[hidden] { display: none; }
    .bal-sub { font-size: 0.9rem; color: #5e8ba3; letter-spacing: 0.03em; }

    /* dailies */
    .daily-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .daily { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.7rem 0.85rem; border: 1px solid rgba(30,120,160,0.14); border-radius: 12px; }
    .daily.done { border-color: var(--button-bg); background: rgba(36, 197, 237, 0.08); }
    .daily .tick { flex-shrink: 0; width: 1.25rem; height: 1.25rem; margin-top: 0.1rem; border-radius: 50%; border: 2px solid var(--button-bg); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; }
    .daily.done .tick { background: var(--button-bg); }
    .daily .body { flex: 1; min-width: 0; }
    .daily .label { font-weight: 700; font-size: 0.92rem; color: #22506a; }
    .daily .detail { color: #6aa0b8; font-size: 0.8rem; margin-top: 0.1rem; }
    .daily .reward { flex-shrink: 0; align-self: center; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--button-bg); color: #fff; }
    .daily .mini-bar { height: 5px; border-radius: 999px; background: rgba(30,120,160,0.14); overflow: hidden; margin-top: 0.45rem; }
    .daily .mini-bar span { display: block; height: 100%; background: var(--button-bg); }
    .daily-reset { color: #6aa0b8; font-size: 0.78rem; margin: 0.9rem 0 0; }

    /* leaderboard */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.5rem 0.6rem; font-size: 0.95rem; }
    th { color: var(--table-header-color); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr + tr td { border-top: 1px solid rgba(30,120,160,0.14); }
    td { color: #22506a; }
    td.rank { color: #6aa0b8; width: 2rem; }
    td a { color: inherit; text-decoration: underline; text-decoration-color: var(--button-hover-bg); text-underline-offset: 3px; }
    td a:hover { color: var(--button-hover-bg); }

    /* --- control bar: nav + actions + notifications, restyled buttons --- */
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .ctl-btn {
      font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 0.92rem;
      padding: 0.62rem 1.3rem; border-radius: 999px; border: none; cursor: pointer;
      background: linear-gradient(180deg, #9ce3f7 0%, #5ccfee 100%); color: #fff; text-decoration: none;
      text-shadow: 0 1px 2px rgba(20, 90, 120, 0.28);
      box-shadow: 0 6px 16px rgba(90, 200, 235, 0.3); display: inline-flex; align-items: center; gap: 0.3rem;
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .ctl-btn:hover { filter: brightness(1.06); }
    .ctl-btn:active { transform: translateY(1px); }
    .ctl-btn.ghost { background: rgba(255,255,255,0.85); color: #1aa9d1; box-shadow: inset 0 0 0 1.6px #7fd6ee; text-shadow: none; }
    .ctl-btn.ghost:hover { background: #fff; filter: none; }
    #tithe:disabled { opacity: 0.5; cursor: default; filter: none; box-shadow: none; }
    /* once tithed, the button stays live and reveals "Tithe again" on hover */
    #tithe .th-hover { display: none; }
    #tithe.tithed:hover .th-default { display: none; }
    #tithe.tithed:hover .th-hover { display: inline; }
    .ctl-dropdown { position: relative; }
    .ctl-dropdown::before { content: ""; position: absolute; top: 100%; left: 0; right: 0; height: 0.5rem; }
    .ctl-menu { position: absolute; top: calc(100% + 0.45rem); left: 0; display: none; flex-direction: column; gap: 0.25rem; padding: 0.45rem; background: var(--panel-solid, #fff); border-radius: 14px; box-shadow: 0 12px 34px rgba(80,150,190,0.34); min-width: 9rem; z-index: 10; }
    .ctl-dropdown:hover .ctl-menu, .ctl-dropdown:focus-within .ctl-menu { display: flex; }
    .ctl-menu a { padding: 0.5rem 0.85rem; border-radius: 9px; color: #1aa9d1; text-decoration: none; font-weight: 700; font-size: 0.88rem; }
    .ctl-menu a:hover { background: rgba(36,197,237,0.12); }
    /* notifications bell (injected here); make it match and open its panel upward */
    /* the bell lives in the top-right corner of the welcome hero */
    #notif-slot { position: absolute; top: 1.6rem; right: 1.8rem; z-index: 5; }
    #notif-slot .notif-btn { background: linear-gradient(180deg, #9ce3f7, #5ccfee); color: #fff; border: none; outline: none; border-radius: 999px !important; box-shadow: 0 6px 16px rgba(90, 200, 235, 0.3); }
    #notif-slot .notif-btn:hover { filter: brightness(1.06); }
    #notif-slot .notif-wrap { margin: 0; }
  </style>
</head>
<body>
  <div class="sky-clouds" aria-hidden="true">
    <div class="c" style="top:8%;  left:-6%; width:320px; height:100px; animation: driftR 80s linear infinite;"></div>
    <div class="c" style="top:22%; left:64%; width:230px; height:76px;  animation: driftL 64s linear infinite; animation-delay:-24s;"></div>
    <div class="c" style="top:40%; left:10%; width:190px; height:64px;  animation: driftR 96s linear infinite; animation-delay:-44s;"></div>
    <div class="c" style="top:58%; left:72%; width:270px; height:88px;  animation: driftL 84s linear infinite; animation-delay:-12s;"></div>
    <div class="c" style="top:74%; left:24%; width:210px; height:70px;  animation: driftR 72s linear infinite; animation-delay:-34s;"></div>
    <div class="c" style="top:86%; left:60%; width:250px; height:80px;  animation: driftL 100s linear infinite;"></div>
  </div>

  <div class="dash">
    <section class="card hero">
      <div id="notif-slot"></div>
      <div class="eyebrow" id="greeting">Welcome</div>
      <h1><span class="editable" id="welcome-wrap"><span id="welcome">Welcome!</span></span></h1>
      <p><span class="editable" id="message-wrap"><span id="dashboard-message">There is no text here yet.</span></span></p>
      <div class="copy-editor" id="copy-editor"></div>
      <p class="checkin-notice" id="checkin-notice" hidden></p>
    </section>

    <aside class="card balance-card" id="balance-card">
      <div class="bal-num" id="bal-num">—</div>
      <div class="bal-sub" id="bal-sub">—</div>
    </aside>

    <aside class="card dailies-card" id="dailies-card">
      <h2>Dailies</h2>
      <div class="daily-list" id="daily-list"></div>
      <p class="daily-reset" id="daily-reset"></p>
    </aside>

    <section class="card leaderboard-card">
      <h2>Leaderboard</h2>
      <table>
        <thead><tr><th></th><th>Username</th><th>Points</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
    </section>

    <section class="card control-card">
      <div class="controls">
        <a class="ctl-btn" href="/profile">Profile</a>
        <a class="ctl-btn" href="/tasks">Tasks</a>
        <div class="ctl-dropdown">
          <button class="ctl-btn" type="button">Games ▾</button>
          <div class="ctl-menu">
            <a href="/snake">Snake</a>
            <a href="/writing">Writing</a>
            <a href="/wheel">Wheel</a>
            <a href="/deathroll">Deathroll</a>
          </div>
        </div>
        <button id="tithe" class="ctl-btn" type="button" hidden><span class="th-default">Tithe 5 points</span><span class="th-hover">Tithe again</span></button>
        <a id="hermione-link" class="ctl-btn" href="/profile?user=hermione" hidden>Hermione's profile</a>
      </div>
    </section>
  </div>

  <script>
    let myRank = "—";
    let fakeTithe = false;

    const h = new Date().getHours();
    document.getElementById("greeting").textContent =
      h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

    function setBalance(points) {
      const num = document.getElementById("bal-num");
      const sub = document.getElementById("bal-sub");
      if (points === null || points === undefined) {
        num.hidden = true;
        sub.textContent = myRank;
      } else {
        num.hidden = false;
        num.textContent = Number(points).toLocaleString();
        sub.textContent = "points · " + myRank;
      }
    }

    // Hermione has no real points or daily obligation; show placeholders so her
    // dashboard doesn't look half-empty (to be replaced later).
    function setFakeBalance() {
      const num = document.getElementById("bal-num");
      num.hidden = false;
      num.textContent = "∞";
      document.getElementById("bal-sub").textContent = "points · Princess";
    }
    function setupFakeTithe() {
      fakeTithe = true;
      const tithe = document.getElementById("tithe");
      tithe.hidden = false;
      tithe.disabled = false;
      tithe.classList.add("tithed");
      tithe.querySelector(".th-default").textContent = "Tithed today";
    }

    window.siteMe()
      .then((d) => {
        if (d.checkIn) {
          const notice = document.getElementById("checkin-notice");
          notice.textContent = "Daily check-in: +" + d.checkIn.amount + " points. You now have " + d.checkIn.points + ".";
          notice.hidden = false;
        }
        const isHermione = Boolean(d.isAdmin ?? (d.username && d.username.toLowerCase() === "hermione"));
        const noEcon = Boolean(d.noEconomy) || isHermione;
        myRank = d.rank || "—";
        document.getElementById("hermione-link").hidden = isHermione;
        if (isHermione) {
          setFakeBalance();
          setupFakeTithe();
          document.getElementById("dailies-card").hidden = false;
        } else {
          setBalance(d.points);
          document.getElementById("tithe").hidden = noEcon;
          document.getElementById("dailies-card").hidden = noEcon;
          if (!noEcon) applyTitheState(d.points, d.tithedToday);
        }
        loadCopy(isHermione);
      })
      .catch(() => (window.location.href = "/"));

    fetch("/api/leaderboard")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => {
        const board = document.getElementById("board");
        d.users.forEach((u, i) => {
          const tr = document.createElement("tr");
          const rank = document.createElement("td");
          rank.className = "rank";
          rank.textContent = i + 1;
          const name = document.createElement("td");
          const link = document.createElement("a");
          link.href = "/profile?user=" + encodeURIComponent(u.username);
          link.textContent = u.username;
          name.append(link);
          const points = document.createElement("td");
          points.textContent = u.points;
          tr.append(rank, name, points);
          board.append(tr);
        });
      })
      .catch(() => {});

    // --- the two lines of dashboard copy, editable in place by hermione ---
    let siteRaw = null;

    async function loadCopy(isHermione) {
      const res = await fetch("/api/site");
      if (!res.ok) return;
      const site = await res.json();
      document.getElementById("welcome").textContent = site.welcome;
      document.getElementById("dashboard-message").textContent = site.message;
      siteRaw = site.raw || null;
      if (isHermione && siteRaw) addPencils();
    }

    function addPencils() {
      [["welcome-wrap", "welcome"], ["message-wrap", "message"]].forEach(([wrapId, which]) => {
        const wrap = document.getElementById(wrapId);
        if (!wrap || wrap.querySelector(".pencil")) return;
        const pencil = document.createElement("button");
        pencil.type = "button";
        pencil.className = "pencil";
        pencil.textContent = "✎";
        pencil.title = "Edit this text";
        pencil.addEventListener("click", () => openCopyEditor(which));
        wrap.append(pencil);
      });
    }

    function openCopyEditor(which) {
      const editor = document.getElementById("copy-editor");
      const adminKey = which === "welcome" ? "welcomeAdmin" : "messageAdmin";
      const userKey = which === "welcome" ? "welcomeUser" : "messageUser";
      editor.replaceChildren();

      const mineLabel = document.createElement("label");
      mineLabel.textContent = "What you see";
      const mine = document.createElement("input");
      mine.type = "text";
      mine.maxLength = 200;
      mine.value = siteRaw[adminKey];

      const theirsLabel = document.createElement("label");
      theirsLabel.textContent = "What everyone else sees";
      const theirs = document.createElement("input");
      theirs.type = "text";
      theirs.maxLength = 200;
      theirs.value = siteRaw[userKey];

      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "{name} becomes their username.";

      const row = document.createElement("div");
      row.className = "row";
      const save = document.createElement("button");
      save.type = "button";
      save.className = "ctl-btn";
      save.textContent = "Save";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "ctl-btn ghost";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => editor.classList.remove("open"));
      save.addEventListener("click", async () => {
        const res = await fetch("/api/site", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [adminKey]: mine.value, [userKey]: theirs.value }),
        });
        if (res.ok) {
          siteRaw = (await res.json()).raw;
          editor.classList.remove("open");
          loadCopy(true);
        }
      });
      row.append(save, cancel);

      editor.append(mineLabel, mine, theirsLabel, theirs, hint, row);
      editor.classList.add("open");
    }

    async function loadDailies() {
      const res = await fetch("/api/dailies");
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById("daily-list");
      list.replaceChildren(...data.dailies.map((d) => {
        const row = document.createElement("div");
        row.className = "daily" + (d.done ? " done" : "");

        const tick = document.createElement("div");
        tick.className = "tick";
        tick.textContent = d.done ? "✓" : "";
        row.append(tick);

        const bodyEl = document.createElement("div");
        bodyEl.className = "body";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = d.label;
        bodyEl.append(label);
        const detailText = d.progress && !d.done
          ? (d.detail ? d.detail + " " : "") + d.progress.current + "/" + d.progress.max + " until complete"
          : d.detail;
        if (detailText) {
          const detail = document.createElement("div");
          detail.className = "detail";
          detail.textContent = detailText;
          bodyEl.append(detail);
        }
        if (d.progress) {
          const bar = document.createElement("div");
          bar.className = "mini-bar";
          const fill = document.createElement("span");
          fill.style.width = Math.min(100, (d.progress.current / d.progress.max) * 100) + "%";
          bar.append(fill);
          bodyEl.append(bar);
        }
        row.append(bodyEl);

        const reward = document.createElement("span");
        reward.className = "reward";
        reward.textContent = d.reward;
        row.append(reward);
        return row;
      }));
      document.getElementById("daily-reset").textContent = "Resets at " + data.resets + ".";
    }
    loadDailies();

    function applyTitheState(points, tithedToday) {
      const tithe = document.getElementById("tithe");
      const negative = (points || 0) < 0;
      // only truly disabled when in the red; once tithed it stays clickable
      tithe.disabled = negative;
      tithe.classList.toggle("tithed", tithedToday && !negative);
      tithe.querySelector(".th-default").textContent = tithedToday && !negative
        ? "Tithed today"
        : negative ? "Tithe (in the red)" : "Tithe 5 points";
    }

    let noticeTimer = null;
    function flashNotice(text) {
      const notice = document.getElementById("checkin-notice");
      notice.textContent = text;
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 4000);
    }

    async function doTithe() {
      if (fakeTithe) return;   // the Princess's tithe is decorative for now
      const res = await fetch("/api/tithe", { method: "POST" });
      const data = await res.json().catch(() => ({}));
      flashNotice(res.ok
        ? "Tithed " + data.amount + " points. You have " + data.points + " left."
        : data.error || "That didn't work.");
      if (res.ok) {
        applyTitheState(data.points, true);
        setBalance(data.points);
      }
    }
    document.getElementById("tithe").addEventListener("click", doTithe);
  </script>
  <script src="/notifications.js" defer></script>
</body>
</html>
