<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - angeldom.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <script src="/me.js"></script>
  <script src="/glitch.js"></script>
  <style>
    /* Cirrus: soft sky, drifting clouds, glassy cards, Quicksand. No top nav. */
    body {
      font-family: "Quicksand", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #8fd8f2 0%, #63bde3 62%, #52aed8 100%);
      color: #24c5ed;
      justify-content: flex-start;
      padding: 2.5rem 1rem 3rem;
      gap: 0;
      /* the lighter sky blue, shared by the buttons and the daily accents */
      --button-bg: #6fd5f0;
    }
    .sky-clouds { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .sky-clouds .c { position: absolute; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255,255,255,0.9), rgba(255,255,255,0) 72%); filter: blur(4px); }
    @keyframes driftL { from { transform: translateX(22vw); } to { transform: translateX(-140vw); } }
    @keyframes driftR { from { transform: translateX(-22vw); } to { transform: translateX(140vw); } }
    @media (prefers-reduced-motion: reduce) { .sky-clouds .c { animation: none !important; } }

    .dash {
      margin: 0 auto; position: relative; z-index: 2;
      display: grid; gap: 1.3rem; grid-template-columns: repeat(3, 1fr);
      grid-template-areas: "hero hero hero" "bal act clk" "day day lead";
      /* last row grows so the dashboard reaches the bottom margin on tall
         monitors instead of ending high up the page */
      grid-template-rows: auto auto 1fr;
      width: min(2400px, 94vw);
      min-height: calc(100vh - 5.5rem);
    }
    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; grid-template-areas: "hero" "bal" "act" "clk" "day" "lead"; }
    }

    .card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 22px;
      box-shadow: 0 18px 46px rgba(80, 150, 190, 0.22);
      padding: 1.9rem 2rem;
      color: #24c5ed;
      text-align: left;
      min-width: 0;
    }
    .hero { grid-area: hero; padding: 2.4rem 2.5rem; position: relative; z-index: 30; }
    .balance-card { grid-area: bal; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; }
    .dailies-card { grid-area: day; }
    .leaderboard-card { grid-area: lead; }
    .control-card { grid-area: act; position: relative; z-index: 20; }
    .acct-age { margin-top: 0.4rem; font-size: 0.82rem; color: #5e8ba3; }
    /* clock card sits in the half freed up by trimming the buttons card */
    .clock-card { grid-area: clk; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem; }
    .clock-card .clk-eyebrow { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: #6aa0b8; }
    .clock-card .clk-time { font-family: "Quicksand", sans-serif; font-size: 2.9rem; font-weight: 700; color: #24c5ed; line-height: 1; font-variant-numeric: tabular-nums; }
    .clock-card .clk-ampm { font-size: 1.1rem; font-weight: 600; color: #4f88a3; }
    .clock-card .clk-date { font-size: 0.9rem; color: #5e8ba3; }
    .clock-card .clk-reset { margin-top: 0.5rem; font-size: 0.78rem; color: #6aa0b8; }

    /* subliminal test control (temporary scaffolding, no random trigger yet) */
    .sub-test { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid rgba(30,120,160,0.16); }
    .sub-test .lbl { width: 100%; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: #6aa0b8; }
    .sub-test select { flex: 1; min-width: 8rem; padding: 0.45rem 0.6rem; border: 1px solid var(--input-border); border-radius: 999px; background: rgba(255,255,255,0.85); color: #24c5ed; font-family: inherit; font-size: 0.85rem; cursor: pointer; }

    h2 { font-family: "Quicksand", sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--button-bg); margin-bottom: 1rem; }

    .hero .eyebrow { font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: #6aa0b8; margin-bottom: 0.5rem; }
    .hero h1 { font-family: "Quicksand", sans-serif; font-size: 2.5rem; font-weight: 700; color: #24c5ed; line-height: 1.06; margin-bottom: 0.5rem; }
    .hero p { color: #5e8ba3; font-size: 1rem; margin: 0; }
    .checkin-notice { margin-top: 1.1rem; background: transparent; border: 1px solid var(--button-bg); border-radius: 12px; padding: 0.6rem 0.9rem; color: #24c5ed; font-size: 0.9rem; font-weight: 600; }
    .checkin-notice[hidden] { display: none; }
    .editable { position: relative; display: inline-block; }
    .editable::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: 2.1rem; }
    .editable .pencil {
      position: absolute; top: 50%; right: -1.9rem; transform: translateY(-50%);
      width: 1.45rem; height: 1.45rem; padding: 0; border: none; border-radius: 50%;
      background: var(--button-bg); color: #fff; font-size: 0.72rem; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; z-index: 1;
      opacity: 0; pointer-events: none; transition: opacity 0.12s ease; box-shadow: none;
    }
    .editable:hover .pencil, .editable:focus-within .pencil { opacity: 1; pointer-events: auto; }
    .copy-editor { display: none; margin-top: 1rem; text-align: left; }
    .copy-editor.open { display: block; }
    .copy-editor label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--table-header-color); margin-bottom: 0.25rem; }
    .copy-editor input { width: 100%; padding: 0.5rem 0.65rem; margin-bottom: 0.7rem; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--input-text); font-family: inherit; font-size: 0.9rem; }
    .copy-editor input:focus { outline: none; border-color: var(--button-hover-bg); }
    .copy-editor .row { display: flex; gap: 0.5rem; }
    .copy-editor .hint { color: var(--muted-color); font-size: 0.72rem; margin: -0.4rem 0 0.7rem; }

    .bal-eyebrow { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #6aa0b8; }
    .bal-num { font-family: "Quicksand", sans-serif; font-size: 3.4rem; font-weight: 700; color: #24c5ed; line-height: 1; }
    .bal-num[hidden], .bal-eyebrow[hidden] { display: none; }
    .bal-sub { font-size: 0.9rem; color: #5e8ba3; letter-spacing: 0.03em; }
    /* angelcoins share the points' blue theme */
    .bal-coins { display: flex; align-items: baseline; gap: 0.35rem; margin-top: 0.6rem; font-family: "Quicksand", sans-serif; }
    .bal-coins .coin-ico { color: #6fd5f0; font-size: 1.1rem; }
    .bal-coins #coin-num { font-size: 1.6rem; font-weight: 700; color: #24c5ed; font-variant-numeric: tabular-nums; }
    .bal-coins .coin-lbl { font-size: 0.85rem; font-weight: 600; color: #5e8ba3; letter-spacing: 0.03em; }
    #coin-num[hidden], .bal-coins[hidden] { display: none; }

    /* the dailies card is now a generic content panel: its body scrolls when
       the contents (e.g. the admin controls on Hermione's account) overflow */
    .panel-card { display: flex; flex-direction: column; min-height: 0; }
    .panel-body { flex: 1; min-height: 0; max-height: min(60vh, 32rem); overflow-y: auto; padding-right: 0.2rem; }
    .panel-body::-webkit-scrollbar { width: 8px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(110,210,240,0.5); border-radius: 999px; }

    /* admin controls rendered into the panel for Hermione */
    .adm h3 { font-family: "Quicksand", sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6aa0b8; margin: 0.3rem 0 0.6rem; }
    .adm-sec { margin-bottom: 1.1rem; }
    .adm-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.65rem; border: 1px solid rgba(30,120,160,0.14); border-radius: 11px; margin-bottom: 0.5rem; }
    .adm-row.pending { background: rgba(36,197,237,0.08); border-color: var(--button-bg); flex-wrap: wrap; }
    .adm-row .nm { font-weight: 700; font-size: 0.9rem; color: #24c5ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adm-row .grow { flex: 1; min-width: 0; }
    .adm-row .pts { font-variant-numeric: tabular-nums; color: #4f88a3; font-size: 0.85rem; font-weight: 700; }
    .adm-row .intro { flex-basis: 100%; font-size: 0.8rem; color: #6aa0b8; line-height: 1.4; }
    .adm-mini { border: none; cursor: pointer; width: 1.55rem; height: 1.55rem; border-radius: 50%; background: linear-gradient(180deg,#b6eefb,#6fd5f0); color: #fff; font-weight: 700; font-size: 0.95rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(110,210,240,0.3); }
    .adm-mini:hover { filter: brightness(1.06); }
    .adm-chip { border: none; cursor: pointer; padding: 0.32rem 0.7rem; border-radius: 999px; font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 0.78rem; background: linear-gradient(180deg,#b6eefb,#6fd5f0); color: #fff; box-shadow: 0 3px 8px rgba(110,210,240,0.3); }
    .adm-chip.ghost { background: rgba(255,255,255,0.85); color: #1aa9d1; box-shadow: inset 0 0 0 1.4px #7fd6ee; }
    .adm-chip:hover { filter: brightness(1.05); }
    .adm-toggle { border: 1px solid #7fd6ee; background: transparent; color: #1aa9d1; cursor: pointer; padding: 0.28rem 0.6rem; border-radius: 999px; font-family: "Quicksand"; font-weight: 700; font-size: 0.72rem; }
    .adm-toggle.on { background: var(--button-bg); color: #fff; border-color: var(--button-bg); }
    .adm-empty { color: #6aa0b8; font-size: 0.85rem; }
    .adm-doc { display: block; color: #1aa9d1; text-decoration: none; padding: 0.3rem 0; font-weight: 600; font-size: 0.9rem; }
    .adm-doc:hover { text-decoration: underline; }
    .adm-log { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; padding: 0.5rem 0.65rem; border: 1px solid rgba(30,120,160,0.14); border-radius: 10px; margin-bottom: 0.45rem; cursor: pointer; }
    .adm-log:hover { border-color: var(--button-bg); }
    .adm-log .who2 { font-weight: 700; color: #22506a; }
    .adm-log .meta2 { color: #5e8ba3; font-size: 0.8rem; text-align: right; }
    /* Penance-style result modal */
    #pmodal { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
    #pmodal.open { display: flex; }
    #pmodal .term { width: min(520px, 90vw); background: #04060a; border: 1px solid #16324a; box-shadow: 0 30px 80px rgba(0,0,0,0.7); padding: 1.8rem 2rem; position: relative; font-family: "IBM Plex Mono", monospace; color: #8fd0ff; }
    #pmodal .term::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
    #pmodal .pt-title { letter-spacing: 0.16em; text-transform: uppercase; font-size: 1rem; }
    #pmodal hr { border: none; border-top: 1px solid #274a63; margin: 0.9rem 0; }
    #pmodal .prow { display: flex; }
    #pmodal .prow .pk { color: #3f6a94; width: 9rem; }
    #pmodal .pdim { color: #3f6a94; }
    #pmodal .pclose { margin-top: 1.3rem; background: none; border: none; color: #3f6a94; cursor: pointer; font-family: inherit; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; font-size: 0.85rem; }
    #pmodal .pclose:hover { color: #8fd0ff; }

    /* dailies */
    .daily-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .daily { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.7rem 0.85rem; border: 1px solid rgba(30,120,160,0.14); border-radius: 12px; }
    .daily.done { border-color: var(--button-bg); background: rgba(36, 197, 237, 0.08); }
    .daily .tick { flex-shrink: 0; width: 1.25rem; height: 1.25rem; margin-top: 0.1rem; border-radius: 50%; border: 2px solid var(--button-bg); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; }
    .daily.done .tick { background: var(--button-bg); }
    .daily .body { flex: 1; min-width: 0; }
    .daily .label { font-weight: 700; font-size: 0.92rem; color: #24c5ed; }
    .daily .detail { color: #6aa0b8; font-size: 0.8rem; margin-top: 0.1rem; }
    .daily .reward { flex-shrink: 0; align-self: center; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: var(--button-bg); color: #fff; text-shadow: 0 1px 2px rgba(20, 90, 120, 0.3); }
    .daily .mini-bar { height: 5px; border-radius: 999px; background: rgba(30,120,160,0.14); overflow: hidden; margin-top: 0.45rem; }
    .daily .mini-bar span { display: block; height: 100%; background: var(--button-bg); }
    .daily-reset { color: #6aa0b8; font-size: 0.78rem; margin: 0.9rem 0 0; }

    /* leaderboard */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.5rem 0.6rem; font-size: 0.95rem; }
    th { color: var(--table-header-color); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr + tr td { border-top: 1px solid rgba(30,120,160,0.14); }
    td { color: #24c5ed; }
    td.rank { color: #6aa0b8; width: 2rem; }
    td a { color: inherit; text-decoration: none; }
    td a:hover { color: var(--button-hover-bg); }

    /* --- control bar: nav + actions + notifications, restyled buttons --- */
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .ctl-btn {
      font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 0.92rem;
      padding: 0.62rem 1.3rem; border-radius: 999px; border: none; cursor: pointer;
      background: #35b6e6; color: #fff; text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.3rem;
      transition: background 0.12s ease;
    }
    .ctl-btn:hover { background: #2aa9dc; }
    .ctl-btn.ghost { background: rgba(255,255,255,0.7); color: #1aa9d1; box-shadow: inset 0 0 0 1.4px #7fd6ee; }
    .ctl-btn.ghost:hover { background: rgba(255,255,255,0.9); }
    #tithe:disabled { opacity: 0.5; cursor: default; filter: none; box-shadow: none; }
    /* once tithed, the button stays live and reveals "Tithe again" on hover */
    #tithe .th-hover { display: none; }
    #tithe.tithed:hover .th-default { display: none; }
    #tithe.tithed:hover .th-hover { display: inline; }
    .ctl-dropdown { position: relative; }
    .ctl-dropdown::before { content: ""; position: absolute; top: 100%; left: 0; right: 0; height: 0.5rem; }
    .ctl-menu { position: absolute; top: calc(100% + 0.45rem); left: 0; display: none; flex-direction: column; gap: 0.25rem; padding: 0.45rem; background: var(--panel-solid, #fff); border-radius: 14px; box-shadow: 0 12px 34px rgba(80,150,190,0.34); min-width: 9rem; z-index: 10; }
    .ctl-dropdown:hover .ctl-menu, .ctl-dropdown:focus-within .ctl-menu { display: flex; }
    .ctl-menu a { padding: 0.5rem 0.85rem; border-radius: 9px; color: #1aa9d1; text-decoration: none; font-weight: 700; font-size: 0.88rem; }
    .ctl-menu a:hover { background: rgba(36,197,237,0.12); }
    /* notifications bell (injected here); make it match and open its panel upward */
    /* the bell lives in the top-right corner of the welcome hero */
    #notif-slot { position: absolute; top: 1.6rem; right: 1.8rem; z-index: 5; }
    #notif-slot .notif-btn { background: linear-gradient(180deg, #b6eefb, #6fd5f0); color: #fff; border: none; outline: none; border-radius: 999px !important; box-shadow: 0 6px 16px rgba(110, 210, 240, 0.3); }
    #notif-slot .notif-btn:hover { filter: brightness(1.06); }
    #notif-slot .notif-wrap { margin: 0; }
  </style>
</head>
<body>
  <div class="sky-clouds" aria-hidden="true">
    <div class="c" style="top:8%;  left:-6%; width:320px; height:100px; animation: driftR 80s linear infinite;"></div>
    <div class="c" style="top:22%; left:64%; width:230px; height:76px;  animation: driftL 64s linear infinite; animation-delay:-24s;"></div>
    <div class="c" style="top:40%; left:10%; width:190px; height:64px;  animation: driftR 96s linear infinite; animation-delay:-44s;"></div>
    <div class="c" style="top:58%; left:72%; width:270px; height:88px;  animation: driftL 84s linear infinite; animation-delay:-12s;"></div>
    <div class="c" style="top:74%; left:24%; width:210px; height:70px;  animation: driftR 72s linear infinite; animation-delay:-34s;"></div>
    <div class="c" style="top:86%; left:60%; width:250px; height:80px;  animation: driftL 100s linear infinite;"></div>
  </div>

  <div class="dash">
    <section class="card hero">
      <div id="notif-slot"></div>
      <div class="eyebrow" id="greeting">Welcome</div>
      <h1><span class="editable" id="welcome-wrap"><span id="welcome">Welcome!</span></span></h1>
      <p><span class="editable" id="message-wrap"><span id="dashboard-message">There is no text here yet.</span></span></p>
      <div class="copy-editor" id="copy-editor"></div>
      <p class="acct-age" id="acct-age"></p>
      <p class="checkin-notice" id="checkin-notice" hidden></p>
    </section>

    <aside class="card balance-card" id="balance-card">
      <div class="bal-num" id="bal-num">—</div>
      <div class="bal-sub" id="bal-sub">—</div>
      <div class="bal-coins" id="bal-coins"><span class="coin-ico">✦</span><span id="coin-num">0</span><span class="coin-lbl">angelcoins</span></div>
    </aside>

    <aside class="card dailies-card panel-card" id="dailies-card">
      <h2 id="panel-title">Dailies</h2>
      <div class="panel-body" id="panel-body">
        <div class="daily-list" id="daily-list"></div>
        <p class="daily-reset" id="daily-reset"></p>
      </div>
    </aside>

    <section class="card leaderboard-card">
      <h2>Leaderboard</h2>
      <table>
        <thead><tr><th></th><th>Username</th><th>Points</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
    </section>

    <section class="card control-card">
      <div class="controls">
        <a class="ctl-btn" href="/profile">Profile</a>
        <div class="ctl-dropdown">
          <button class="ctl-btn" type="button">Games ▾</button>
          <div class="ctl-menu">
            <a href="/snake">Snake</a>
            <a href="/writing">Penance</a>
            <a href="/writing?mode=devotion">Devotion</a>
            <a href="/wheel">Wheel</a>
            <a href="/deathroll">Deathroll</a>
            <a href="/elysium">Elysium</a>
          </div>
        </div>
        <button id="tithe" class="ctl-btn" type="button" hidden><span class="th-default">Tithe</span><span class="th-hover">Tithe again</span></button>
        <a id="hermione-link" class="ctl-btn" href="/profile?user=hermione" hidden>Hermione's profile</a>
      </div>
      <div class="sub-test">
        <span class="lbl">Subliminal test</span>
        <select id="sub-select" aria-label="Subliminal message"></select>
        <button class="ctl-btn" id="sub-flash" type="button">Flash</button>
      </div>
    </section>

    <aside class="card clock-card" id="clock-card">
      <div class="clk-eyebrow" id="clk-eyebrow">Eastern Time</div>
      <div class="clk-time"><span id="clk-time">--:--:--</span> <span class="clk-ampm" id="clk-ampm"></span></div>
      <div class="clk-date" id="clk-date"></div>
      <div class="clk-reset" id="clk-reset"></div>
    </aside>
  </div>

  <div id="pmodal"><div class="term">
    <div class="pt-title" id="pt-title">:: session complete ::</div>
    <hr />
    <div class="prow"><span class="pk">servant</span><span id="pt-who"></span></div>
    <div class="prow"><span class="pk">mode</span><span id="pt-mode"></span></div>
    <div class="prow"><span class="pk">lines</span><span id="pt-lines"></span></div>
    <div class="prow"><span class="pk">errors</span><span id="pt-err"></span></div>
    <div class="prow"><span class="pk">time</span><span id="pt-time"></span></div>
    <div class="prow"><span class="pk">when</span><span class="pdim" id="pt-when"></span></div>
    <button class="pclose" id="pt-close">close</button>
  </div></div>

  <script>
    let myRank = "—";
    let fakeTithe = false;

    const h = new Date().getHours();
    document.getElementById("greeting").textContent =
      h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

    function setBalance(points, coins) {
      const num = document.getElementById("bal-num");
      const sub = document.getElementById("bal-sub");
      if (points === null || points === undefined) {
        num.hidden = true;
        sub.textContent = myRank;
      } else {
        num.hidden = false;
        num.textContent = Number(points).toLocaleString();
        sub.textContent = "points · " + myRank;
      }
      document.getElementById("coin-num").textContent = Number(coins || 0).toLocaleString();
    }

    // Hermione has no real points or daily obligation; show placeholders so her
    // dashboard doesn't look half-empty (to be replaced later).
    function setFakeBalance() {
      const num = document.getElementById("bal-num");
      num.hidden = false;
      num.textContent = "∞";
      document.getElementById("bal-sub").textContent = "points · Princess";
      document.getElementById("coin-num").textContent = "∞";
    }
    function setupFakeTithe() {
      fakeTithe = true;
      const tithe = document.getElementById("tithe");
      tithe.hidden = false;
      tithe.disabled = false;
      tithe.classList.add("tithed");
      tithe.querySelector(".th-default").textContent = "Tithed today";
    }

    window.siteMe()
      .then((d) => {
        if (d.checkIn) {
          const notice = document.getElementById("checkin-notice");
          notice.textContent = "Daily check-in: +" + d.checkIn.amount + " points. You now have " + d.checkIn.points + ".";
          notice.hidden = false;
        }
        const isHermione = Boolean(d.isAdmin ?? (d.username && d.username.toLowerCase() === "hermione"));
        const noEcon = Boolean(d.noEconomy) || isHermione;
        myRank = d.rank || "—";
        const age = d.createdAt ? Math.floor((Date.now() - new Date(d.createdAt)) / 86400000) : null;
        document.getElementById("acct-age").textContent = age != null ? "Member for " + age + (age === 1 ? " day" : " days") : "";
        document.getElementById("hermione-link").hidden = isHermione;
        if (isHermione) {
          setFakeBalance();
          // no tithe for Hermione
          document.getElementById("tithe").hidden = true;
          // her panel holds the admin controls instead of dailies
          document.getElementById("dailies-card").hidden = false;
          document.getElementById("panel-title").textContent = "Admin controls";
          buildAdminPanel();
        } else {
          setBalance(d.points, d.angelcoins);
          document.getElementById("tithe").hidden = noEcon;
          document.getElementById("dailies-card").hidden = noEcon;
          if (!noEcon) { applyTitheState(d.points, d.tithedToday); loadDailies(); }
        }
        loadCopy(isHermione);
      })
      .catch(() => (window.location.href = "/"));

    fetch("/api/leaderboard")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => {
        const board = document.getElementById("board");
        d.users.forEach((u, i) => {
          const tr = document.createElement("tr");
          const rank = document.createElement("td");
          rank.className = "rank";
          rank.textContent = i + 1;
          const name = document.createElement("td");
          const link = document.createElement("a");
          link.href = "/profile?user=" + encodeURIComponent(u.username);
          link.textContent = u.username;
          name.append(link);
          const points = document.createElement("td");
          points.textContent = u.points;
          tr.append(rank, name, points);
          board.append(tr);
        });
      })
      .catch(() => {});

    // --- the two lines of dashboard copy, editable in place by hermione ---
    let siteRaw = null;

    async function loadCopy(isHermione) {
      const res = await fetch("/api/site");
      if (!res.ok) return;
      const site = await res.json();
      document.getElementById("welcome").textContent = site.welcome;
      document.getElementById("dashboard-message").textContent = site.message;
      siteRaw = site.raw || null;
      if (isHermione && siteRaw) addPencils();
    }

    function addPencils() {
      [["welcome-wrap", "welcome"], ["message-wrap", "message"]].forEach(([wrapId, which]) => {
        const wrap = document.getElementById(wrapId);
        if (!wrap || wrap.querySelector(".pencil")) return;
        const pencil = document.createElement("button");
        pencil.type = "button";
        pencil.className = "pencil";
        pencil.textContent = "✎";
        pencil.title = "Edit this text";
        pencil.addEventListener("click", () => openCopyEditor(which));
        wrap.append(pencil);
      });
    }

    function openCopyEditor(which) {
      const editor = document.getElementById("copy-editor");
      const adminKey = which === "welcome" ? "welcomeAdmin" : "messageAdmin";
      const userKey = which === "welcome" ? "welcomeUser" : "messageUser";
      editor.replaceChildren();

      const mineLabel = document.createElement("label");
      mineLabel.textContent = "What you see";
      const mine = document.createElement("input");
      mine.type = "text";
      mine.maxLength = 200;
      mine.value = siteRaw[adminKey];

      const theirsLabel = document.createElement("label");
      theirsLabel.textContent = "What everyone else sees";
      const theirs = document.createElement("input");
      theirs.type = "text";
      theirs.maxLength = 200;
      theirs.value = siteRaw[userKey];

      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "{name} becomes their username.";

      const row = document.createElement("div");
      row.className = "row";
      const save = document.createElement("button");
      save.type = "button";
      save.className = "ctl-btn";
      save.textContent = "Save";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "ctl-btn ghost";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => editor.classList.remove("open"));
      save.addEventListener("click", async () => {
        const res = await fetch("/api/site", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [adminKey]: mine.value, [userKey]: theirs.value }),
        });
        if (res.ok) {
          siteRaw = (await res.json()).raw;
          editor.classList.remove("open");
          loadCopy(true);
        }
      });
      row.append(save, cancel);

      editor.append(mineLabel, mine, theirsLabel, theirs, hint, row);
      editor.classList.add("open");
    }

    async function loadDailies() {
      const res = await fetch("/api/dailies");
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById("daily-list");
      list.replaceChildren(...data.dailies.map((d) => {
        const row = document.createElement("div");
        row.className = "daily" + (d.done ? " done" : "");

        const tick = document.createElement("div");
        tick.className = "tick";
        tick.textContent = d.done ? "✓" : "";
        row.append(tick);

        const bodyEl = document.createElement("div");
        bodyEl.className = "body";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = d.label;
        bodyEl.append(label);
        const detailText = d.progress && !d.done
          ? (d.detail ? d.detail + " " : "") + d.progress.current + "/" + d.progress.max + " until complete"
          : d.detail;
        if (detailText) {
          const detail = document.createElement("div");
          detail.className = "detail";
          detail.textContent = detailText;
          bodyEl.append(detail);
        }
        if (d.progress) {
          const bar = document.createElement("div");
          bar.className = "mini-bar";
          const fill = document.createElement("span");
          fill.style.width = Math.min(100, (d.progress.current / d.progress.max) * 100) + "%";
          bar.append(fill);
          bodyEl.append(bar);
        }
        row.append(bodyEl);

        const reward = document.createElement("span");
        reward.className = "reward";
        reward.textContent = d.reward;
        row.append(reward);
        return row;
      }));
      document.getElementById("daily-reset").textContent = "Resets at " + data.resets + ".";
    }

    // --- admin controls, rendered into the panel on Hermione's account ---
    async function buildAdminPanel() {
      const body = document.getElementById("panel-body");
      body.replaceChildren();
      const res = await fetch("/api/users");
      if (!res.ok) { body.innerHTML = '<p class="adm-empty">Could not load accounts.</p>'; return; }
      const { users } = await res.json();
      const wrap = document.createElement("div");
      wrap.className = "adm";

      const pending = users.filter((u) => u.pending);
      const approved = users.filter((u) => !u.pending && u.username.toLowerCase() !== "hermione");

      const mkChip = (label, cls, fn) => {
        const b = document.createElement("button");
        b.className = "adm-chip" + (cls ? " " + cls : "");
        b.textContent = label; b.addEventListener("click", fn); return b;
      };
      const mkMini = (label, fn) => {
        const b = document.createElement("button");
        b.className = "adm-mini"; b.textContent = label; b.addEventListener("click", fn); return b;
      };

      // approvals
      const appSec = document.createElement("div");
      appSec.className = "adm-sec";
      const appH = document.createElement("h3");
      appH.textContent = "Approvals" + (pending.length ? " · " + pending.length : "");
      appSec.append(appH);
      if (!pending.length) {
        const e = document.createElement("p"); e.className = "adm-empty"; e.textContent = "No one waiting.";
        appSec.append(e);
      } else {
        for (const u of pending) {
          const row = document.createElement("div");
          row.className = "adm-row pending";
          const nm = document.createElement("span"); nm.className = "nm grow"; nm.textContent = u.username;
          row.append(nm);
          row.append(mkChip("Approve", "", async () => {
            const r = await fetch("/api/users/" + encodeURIComponent(u.username) + "/approve", { method: "POST" });
            if (r.ok) buildAdminPanel();
          }));
          row.append(mkChip("Refuse", "ghost", async () => {
            if (!confirm("Refuse and delete " + u.username + "?")) return;
            const r = await fetch("/api/users/" + encodeURIComponent(u.username), { method: "DELETE" });
            if (r.ok) buildAdminPanel();
          }));
          if (u.intro) { const i = document.createElement("div"); i.className = "intro"; i.textContent = u.intro; row.append(i); }
          appSec.append(row);
        }
      }
      wrap.append(appSec);

      // accounts: points + leaderboard listing
      const accSec = document.createElement("div");
      accSec.className = "adm-sec";
      const accH = document.createElement("h3"); accH.textContent = "Accounts · " + approved.length;
      accSec.append(accH);
      for (const u of approved) {
        const row = document.createElement("div");
        row.className = "adm-row";
        const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = u.username;
        const grow = document.createElement("span"); grow.className = "grow";
        const pts = document.createElement("span"); pts.className = "pts"; pts.textContent = (u.points || 0) + " pts";
        grow.append(pts);
        const adjust = async (amount) => {
          const r = await fetch("/api/users/" + encodeURIComponent(u.username) + "/points", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ amount }),
          });
          const data = await r.json().catch(() => ({}));
          if (r.ok) { u.points = data.points; pts.textContent = data.points + " pts"; }
        };
        const listed = document.createElement("button");
        listed.className = "adm-toggle" + (u.flagged ? " on" : "");
        listed.textContent = u.flagged ? "Listed" : "Unlisted";
        listed.addEventListener("click", async () => {
          const r = await fetch("/api/users/" + encodeURIComponent(u.username) + "/flag", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ flagged: !u.flagged }),
          });
          if (r.ok) { u.flagged = !u.flagged; listed.classList.toggle("on", u.flagged); listed.textContent = u.flagged ? "Listed" : "Unlisted"; }
        });
        row.append(nm, grow,
          mkMini("−", () => adjust(-1)),
          mkMini("+", () => adjust(1)),
          mkChip("±", "ghost", () => { const n = parseInt(prompt("Adjust " + u.username + "'s points by:", "10")); if (Number.isInteger(n)) adjust(n); }),
          listed);
        accSec.append(row);
      }
      wrap.append(accSec);

      // lines completed (Penance / Devotion series), clickable to view
      const logSec = document.createElement("div"); logSec.className = "adm-sec";
      logSec.append(mk("h3", "Lines completed"));
      const logList = document.createElement("div");
      const logEmpty = document.createElement("p"); logEmpty.className = "adm-empty"; logEmpty.textContent = "No series finished yet.";
      logSec.append(logList, logEmpty); wrap.append(logSec);

      // documentation
      const docSec = document.createElement("div"); docSec.className = "adm-sec";
      docSec.append(mk("h3", "Documentation"));
      [["Guide", "/guide"], ["Technical notes", "/tech"], ["Card nav demo", "/cardnav"]].forEach(([t, h]) => {
        const a = document.createElement("a"); a.className = "adm-doc"; a.href = h; a.textContent = t; docSec.append(a);
      });
      wrap.append(docSec);
      body.append(wrap);

      // gather every account's finished series
      const rows = [];
      for (const u of users) {
        const r = await fetch("/api/users/" + encodeURIComponent(u.username) + "/writing").catch(() => null);
        if (!r || !r.ok) continue;
        const data = await r.json();
        (data.log || []).forEach((e) => rows.push({ name: u.username, e }));
      }
      rows.sort((a, b) => String(b.e.at || "").localeCompare(String(a.e.at || "")));
      logEmpty.hidden = rows.length > 0;
      const fmt = (ms) => { const s = Math.round((ms || 0) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
      rows.slice(0, 40).forEach(({ name, e }) => {
        const row = document.createElement("div"); row.className = "adm-log";
        const who = document.createElement("span"); who.className = "who2"; who.textContent = name;
        const meta = document.createElement("span"); meta.className = "meta2";
        meta.textContent = (e.category || "series") + " · " + e.passages + " lines · " + e.mistakes + " err";
        row.append(who, meta);
        row.addEventListener("click", () => showResult(name, e, fmt));
        logList.append(row);
      });
    }

    // Penance-style modal showing a finished series
    function showResult(name, e, fmt) {
      const mode = (e.category || "penance");
      document.getElementById("pt-title").textContent = ":: " + mode + " complete ::";
      document.getElementById("pt-who").textContent = name;
      document.getElementById("pt-mode").textContent = mode;
      document.getElementById("pt-lines").textContent = e.passages + " / " + e.passages;
      document.getElementById("pt-err").textContent = e.mistakes;
      document.getElementById("pt-time").textContent = fmt(e.elapsedMs);
      document.getElementById("pt-when").textContent = e.at ? new Date(e.at).toLocaleString() : "";
      document.getElementById("pmodal").classList.add("open");
    }
    document.getElementById("pt-close").addEventListener("click", () => document.getElementById("pmodal").classList.remove("open"));
    document.getElementById("pmodal").addEventListener("click", (ev) => { if (ev.target.id === "pmodal") document.getElementById("pmodal").classList.remove("open"); });

    function applyTitheState(points, tithedToday) {
      const tithe = document.getElementById("tithe");
      const negative = (points || 0) < 0;
      // only truly disabled when in the red; once tithed it stays clickable
      tithe.disabled = negative;
      tithe.classList.toggle("tithed", tithedToday && !negative);
      tithe.querySelector(".th-default").textContent = tithedToday && !negative
        ? "Tithed today"
        : negative ? "Tithe (in the red)" : "Tithe";
    }

    let noticeTimer = null;
    function flashNotice(text) {
      const notice = document.getElementById("checkin-notice");
      notice.textContent = text;
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 4000);
    }

    async function doTithe() {
      if (fakeTithe) return;   // the Princess's tithe is decorative for now
      const res = await fetch("/api/tithe", { method: "POST" });
      const data = await res.json().catch(() => ({}));
      flashNotice(res.ok
        ? "Tithed " + data.amount + " points. You have " + data.points + " left."
        : data.error || "That didn't work.");
      if (res.ok) {
        applyTitheState(data.points, true);
        setBalance(data.points);
      }
    }
    document.getElementById("tithe").addEventListener("click", doTithe);

    // --- Eastern-time clock (EST/EDT via Intl; daily reset is 6am Eastern) ---
    const RESET_HOUR = 6;
    function easternParts(now) {
      const p = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", hourCycle: "h23",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
      }).formatToParts(now);
      const get = (t) => Number(p.find((x) => x.type === t).value);
      return { h: get("hour"), m: get("minute"), s: get("second") };
    }
    function tickClock() {
      const now = new Date();
      const time = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit",
      }).formatToParts(now);
      const val = (t) => (time.find((x) => x.type === t) || {}).value || "";
      document.getElementById("clk-time").textContent = val("hour") + ":" + val("minute") + ":" + val("second");
      document.getElementById("clk-ampm").textContent = "";
      const tz = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", timeZoneName: "short" })
        .formatToParts(now).find((x) => x.type === "timeZoneName").value;
      document.getElementById("clk-eyebrow").textContent = "Eastern Time · " + tz;
      document.getElementById("clk-date").textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric",
      }).format(now);
      // countdown to the next 6am Eastern reset
      const { h, m, s } = easternParts(now);
      let rem = (RESET_HOUR * 3600 - (h * 3600 + m * 60 + s) + 86400) % 86400;
      if (rem === 0) rem = 86400;
      const rh = Math.floor(rem / 3600), rm = Math.floor((rem % 3600) / 60);
      document.getElementById("clk-reset").textContent = "Daily reset in " + rh + "h " + rm + "m";
    }
    tickClock();
    setInterval(tickClock, 1000);

    // --- subliminal test control (temporary; no random trigger yet) ---
    (function () {
      const sel = document.getElementById("sub-select");
      (window.Subliminal ? window.Subliminal.effects : []).forEach((name, i) => {
        const o = document.createElement("option");
        o.value = i; o.textContent = (i + 1) + ". " + name;
        sel.append(o);
      });
      document.getElementById("sub-flash").addEventListener("click", () => {
        if (window.Subliminal) window.Subliminal.flash(Number(sel.value));
      });
    })();
    // Shrink the whole dashboard to fit the viewport height instead of scrolling.
    // Content height varies (admin panel, dailies), so re-fit whenever it changes.
    const _dash = document.querySelector(".dash");
    function fitDash() {
      if (!_dash) return;
      _dash.style.transform = "";
      const avail = window.innerHeight - 88;  // leave top+bottom margin
      const h = _dash.getBoundingClientRect().height;
      if (h > avail + 2) {
        _dash.style.transformOrigin = "top center";
        _dash.style.transform = "scale(" + Math.max(0.6, avail / h) + ")";
        document.body.style.overflow = "hidden";
      } else {
        document.body.style.overflow = "";
      }
    }
    try { new ResizeObserver(fitDash).observe(_dash); } catch (e) {}
    window.addEventListener("resize", fitDash);
    fitDash();
  </script>
  <script src="/notifications.js" defer></script>
</body>
</html>
